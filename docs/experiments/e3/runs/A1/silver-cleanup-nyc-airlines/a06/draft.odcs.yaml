apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a cleaned reference lookup of the sixteen air carriers that flew
    out of New York City in 2013, mapping each two-letter carrier code to its full legal name,
    sourced from the nycflights13 Bureau of Transportation Statistics carrier list.
  usage: Join on carrier to enrich flight-level fact tables with the carrier's full name;
    carrier is the stable grain key and every row is guaranteed non-null and unique.
  limitations: This is a small, static 16-row lookup with no temporal dimension and no duplicate
    or null issues to resolve; all three Airbyte capture-metadata columns were dropped as
    they carried no business content, so downstream consumers needing ingestion lineage must
    look elsewhere.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a cleaned reference lookup of the sixteen air carriers that flew
    out of New York City in 2013, mapping each two-letter carrier code to its full legal name,
    sourced from the nycflights13 Bureau of Transportation Statistics carrier list.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with 16 distinct two-letter codes (e.g. AA, DL, UA) matching
      row_count of 16, so carrier is complete and uniquely identifies each row.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full carrier names (e.g. 'Delta Air Lines
      Inc.', 'JetBlue Airways') per operator context defining this as the carrier's full name.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
