apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a clean, deduplication-free lookup of the sixteen airline carriers
    that flew out of New York City airports in 2013, mapping each two-letter BTS carrier code
    to its full legal carrier name, intended to feed joins against flight-level fact tables
    keyed on carrier code.
  usage: Join downstream flight records to this table on carrier to resolve a human-readable
    airline name; both carrier and name are fully populated (null_rate 0.0) and unique across
    all 16 rows, so no null-handling or deduplication logic is required by consumers.
  limitations: The table covers only the 16 carriers observed in the 2013 NYC-origin flights
    dataset and will not resolve codes for carriers outside that set; all Airbyte capture
    metadata (raw id, extraction timestamp, meta blob) was dropped as non-business data and
    is unavailable for lineage debugging downstream.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a clean, deduplication-free lookup of the sixteen airline carriers
    that flew out of New York City airports in 2013, mapping each two-letter BTS carrier code
    to its full legal carrier name, intended to feed joins against flight-level fact tables
    keyed on carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 16 rows and distinct_count is 16, matching row_count
      16, so carrier (the two-letter BTS carrier code per operator context) uniquely identifies
      each row with samples like 9E, AA, DL, UA.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 16 matching carrier's cardinality; distinct_values
      include full legal names such as 'Delta Air Lines Inc.' and 'Southwest Airlines Co.',
      confirming a one-to-one mapping with carrier.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
