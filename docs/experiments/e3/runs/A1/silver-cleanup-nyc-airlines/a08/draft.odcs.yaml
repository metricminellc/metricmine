apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier lookup for the nycflights13-derived bronze dataset,
    mapping each two-letter carrier code to its full airline name for the sixteen carriers
    that flew from New York City in 2013; it is intended to be joined against flight-level
    fact tables on the carrier code.
  usage: Consumers should join on carrier to resolve full airline names for flight records;
    both carrier and name are fully populated (null_rate 0.0) and carrier is unique across
    all 16 rows, so no null-handling or duplicate-filtering logic is required for this table.
  limitations: The table is a small static reference (16 rows, duplicate_row_rate 0.0) with
    no observed data quality issues; however, it only covers carriers that flew from NYC in
    2013 and will not include carriers introduced or retired since, so joins against newer
    flight data may produce unmatched carrier codes.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier lookup for the nycflights13-derived bronze
    dataset, mapping each two-letter carrier code to its full airline name for the sixteen
    carriers that flew from New York City in 2013; it is intended to be joined against flight-level
    fact tables on the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'null_rate is 0.0 with null_count 0 and distinct_count 16 equal to row_count
      16; operator context confirms this is the two-letter carrier abbreviation (samples:
      9E, AA, AS, DL, UA, WN), so it is retained as-is and required.'
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with null_count 0 and distinct_count 16; distinct_values
      show full carrier names (e.g. 'Delta Air Lines Inc.', 'Southwest Airlines Co.') matching
      the operator context's description of the carrier's full name, so it is retained as
      required text.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
