# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the clean carrier reference lookup from the nycflights13 Bureau of
    Transportation Statistics source, mapping two-letter carrier codes to full carrier names
    for the sixteen airlines that flew out of New York City in 2013; it is intended to be
    joined to flight-level fact tables on the carrier code.
  usage: Join on carrier to enrich flight or other fact records with the full carrier name;
    both carrier and name are fully populated (null_rate 0.0) and carrier is unique across
    all 16 rows, so no null-handling or deduplication logic is required by consumers.
  limitations: The source is a small, static reference table (row_count 16) with no duplicate
    rows and no nulls in either column, so no cleanup beyond dropping the three Airbyte capture-tool
    columns was needed; consumers should be aware this table only covers carriers active in
    the 2013 NYC flights dataset and will not include carriers added or retired since.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is the clean carrier reference lookup from the nycflights13 Bureau
    of Transportation Statistics source, mapping two-letter carrier codes to full carrier
    names for the sixteen airlines that flew out of New York City in 2013; it is intended
    to be joined to flight-level fact tables on the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'null_rate 0.0 and distinct_count 16 equal row_count 16, so carrier is a
      fully populated two-letter code that uniquely identifies each of the sixteen carriers
      (samples: 9E, AA, AS, DL, UA, WN).'
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 'null_rate 0.0 and distinct_count 16 show the full carrier name is always
      present and distinct per row (samples: ''Delta Air Lines Inc.'', ''United Air Lines
      Inc.'', ''Southwest Airlines Co.''), matching the operator context''s description of
      name as the carrier''s full name.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
