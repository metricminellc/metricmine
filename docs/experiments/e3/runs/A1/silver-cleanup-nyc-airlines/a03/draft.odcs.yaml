apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier lookup for the nycflights13 dataset, mapping
    the two-letter carrier code used across NYC 2013 flight records to the carrier's full
    legal name; it feeds joins against any silver flights table keyed on carrier.
  usage: Join on carrier to resolve a flight record's airline to its full name; carrier is
    the declared grain so consumers can expect at most one name per carrier code with no deduplication
    needed given the zero observed duplicate rate.
  limitations: The profile shows a small, fully populated table (16 rows, zero nulls, zero
    duplicate rows) so no null-handling or dedupe decisions were required; the only exclusions
    are the three Airbyte capture-metadata columns, which carry no business content.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier lookup for the nycflights13 dataset, mapping
    the two-letter carrier code used across NYC 2013 flight records to the carrier's full
    legal name; it feeds joins against any silver flights table keyed on carrier.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 and distinct_count 16 equal to the row_count
      of 16, and the operator context confirms carrier is the two-letter carrier abbreviation,
      so each value plausibly identifies one row.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with null_count 0 and distinct_count 16 matching carrier's
      distinct_count, and the operator context confirms name is the carrier's full name such
      as 'Delta Air Lines Inc.' and 'United Air Lines Inc.'.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
