apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a cleaned, deduplicated-by-construction lookup of the sixteen airline
    carriers that flew out of New York City airports in 2013, mapping each carrier's two-letter
    code to its full legal name for joining against flight-level fact tables.
  usage: Join downstream flight tables on carrier to resolve the full carrier name; both carrier
    and name are required, non-null columns with a 1:1 mapping (16 distinct carriers across
    16 rows), so no null-handling or deduplication logic is needed by consumers.
  limitations: The source profile shows zero nulls and zero duplicate rows across all 16 records,
    so no data-quality exclusions were necessary; the three Airbyte capture-metadata columns
    were dropped and are not available downstream.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a cleaned, deduplicated-by-construction lookup of the sixteen
    airline carriers that flew out of New York City airports in 2013, mapping each carrier's
    two-letter code to its full legal name for joining against flight-level fact tables.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 across 16 rows, and distinct_count 16
      equals row_count 16, matching the two-letter carrier codes (e.g. AA, DL, UA) the operator
      context describes as the BTS carrier abbreviation.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with null_count 0, and the 16 distinct values (e.g. 'American
      Airlines Inc.', 'Delta Air Lines Inc.') are the carrier's full name per the operator
      context.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
