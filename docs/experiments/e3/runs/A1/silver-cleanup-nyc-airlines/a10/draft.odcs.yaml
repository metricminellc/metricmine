apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier lookup from the nycflights13 airlines source,
    listing the sixteen Bureau of Transportation Statistics carriers that flew out of New
    York City in 2013, and it feeds joins to flight-level fact tables keyed on the carrier
    abbreviation.
  usage: Consumers should join on carrier, the declared grain, to enrich flight records with
    the full carrier name; the table is small (16 rows), fully populated, and requires no
    filtering for nulls or duplicates.
  limitations: The cleanup excluded all three Airbyte capture-tool metadata columns (_airbyte_raw_id,
    _airbyte_extracted_at, _airbyte_meta) as non-business artifacts; no duplicate rows or
    null values were present (duplicate_row_rate 0.0, null_rate 0.0 on both retained columns)
    so no further remediation was needed.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier lookup from the nycflights13 airlines source,
    listing the sixteen Bureau of Transportation Statistics carriers that flew out of New
    York City in 2013, and it feeds joins to flight-level fact tables keyed on the carrier
    abbreviation.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with 16 distinct values matching row_count 16 (e.g. '9E','AA','DL'),
      consistent with the operator context's two-letter carrier abbreviation used as the BTS
      carrier lookup key.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with 16 distinct values (e.g. 'Delta Air Lines Inc.', 'JetBlue
      Airways'), matching the operator context's description of the carrier's full name.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
