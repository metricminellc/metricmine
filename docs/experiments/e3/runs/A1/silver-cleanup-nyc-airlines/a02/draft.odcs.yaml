apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a clean, deduplicated carrier reference for the sixteen airlines
    that flew from New York City in 2013, mapping each two-letter carrier code to its full
    legal name, intended to feed joins against flight-level fact tables keyed on carrier.
  usage: Join downstream flight or segment tables to this table on the carrier column to resolve
    the full airline name; carrier is the declared grain and every value is non-null and unique
    per the profile, so no additional null-filtering is required by consumers.
  limitations: The profile shows a small, fully populated sixteen-row lookup with zero nulls
    and zero duplicate rows, so no cleanup ambiguities remain; consumers should note this
    table reflects only carriers present in the 2013 NYC-origin flight data and is not a complete
    industry-wide carrier list.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is a clean, deduplicated carrier reference for the sixteen airlines
    that flew from New York City in 2013, mapping each two-letter carrier code to its full
    legal name, intended to feed joins against flight-level fact tables keyed on carrier.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0, and distinct_count is 16 matching the
      dataset row_count of 16, with distinct_values showing two-letter codes like 9E, AA,
      DL confirming the carrier abbreviation per operator context.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with null_count 0, and distinct_count is 16, with distinct_values
      such as 'Delta Air Lines Inc.' and 'United Air Lines Inc.' confirming the full carrier
      name per operator context.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
