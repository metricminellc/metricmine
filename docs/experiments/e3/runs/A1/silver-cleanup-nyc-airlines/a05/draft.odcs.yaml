# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned lookup of airline carriers that flew from New York City
    in 2013, mapping each two-letter carrier code to its full legal name, sourced from the
    Bureau of Transportation Statistics via the nycflights13 package, feeding downstream joins
    from flight records to human-readable carrier names.
  usage: Join on carrier to enrich flight-level records with the carrier's full name; carrier
    is the declared grain and unique business key, with 16 distinct codes covering all rows
    and no nulls in either column.
  limitations: The dataset is static and tiny (16 rows, duplicate_row_rate 0.0), covering
    only carriers active in the 2013 NYC flights snapshot; three Airbyte capture-metadata
    columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta) were dropped as they carried
    no business content.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned lookup of airline carriers that flew from New York
    City in 2013, mapping each two-letter carrier code to its full legal name, sourced from
    the Bureau of Transportation Statistics via the nycflights13 package, feeding downstream
    joins from flight records to human-readable carrier names.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0, and distinct_count 16 equals the row_count
      of 16, matching the two-letter codes in distinct_values such as 9E, AA, DL, UA.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with null_count 0, and distinct_count 16 matches the 16
      full carrier names listed, e.g. 'Delta Air Lines Inc.' and 'United Air Lines Inc.'.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
