# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:35:30.786011+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds cleaned hourly weather observations from the three NYC airport
    stations (EWR, JFK, LGA) for January through June 2013, sourced from ASOS via the Iowa
    Environmental Mesonet as packaged in nycflights13, feeding downstream joins against flight-level
    data on origin and time.
  usage: Join on origin and time_hour to attach weather conditions to flights or other hourly
    events; wind_dir, wind_speed, wind_gust, and pressure may be null and must be filtered
    or coalesced deliberately before aggregation, since nulls represent missing source readings
    (NA) rather than zero values.
  limitations: wind_gust is null in about 74.6% of rows and pressure is null in about 11.5%
    of rows, so any analysis relying on those fields loses substantial coverage; wind_dir
    and wind_speed carry small null rates (1.68% and 0.015% respectively) that are retained
    rather than imputed; the extreme DECIMAL(38,9) landed precision for all measurement columns
    was simplified to DOUBLE without rounding rules being validated against the original instrument
    precision.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table holds cleaned hourly weather observations from the three NYC airport
    stations (EWR, JFK, LGA) for January through June 2013, sourced from ASOS via the Iowa
    Environmental Mesonet as packaged in nycflights13, feeding downstream joins against flight-level
    data on origin and time.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with only 3 distinct_values (EWR, JFK, LGA) matching the three
      NYC airport stations documented by the operator; keep as the station identifier.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, single distinct_value 2013.0 which is integral; cast the DECIMAL(38,9)
      landed type down to INTEGER since no fractional values exist.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_values 1.0 through 6.0 are all integral; cast DECIMAL(38,9)
      to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min 1.0 max 31.0 with sample_values 1.0-10.0 all integral;
      cast DECIMAL(38,9) to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min 0.0 max 23.0 with sample_values 0.0-9.0 all integral;
      cast DECIMAL(38,9) to INTEGER to represent local hour.
  - name: temp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: null_rate 0.0, min 10.94 max 93.92 with two-decimal sample_values; cast the
      overly precise DECIMAL(38,9) to DOUBLE for degrees Fahrenheit as documented by the operator.
  - name: dewp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: null_rate 0.0, min -9.94 max 73.94 with sample_values showing two-decimal
      dewpoint readings; cast DECIMAL(38,9) to DOUBLE.
  - name: humid
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: null_rate 0.0, min 12.74 max 100.0 with 2178 distinct values; cast DECIMAL(38,9)
      to DOUBLE for relative humidity percent.
  - name: wind_dir
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: null_rate 0.016828 (219 nulls) with min 0.0 max 360.0 degree samples in 10-degree
      steps; cast DECIMAL(38,9) to DOUBLE and retain nulls since the publisher writes NA where
      a measurement is missing.
  - name: wind_speed
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: null_rate 0.000154 (2 nulls) with min 0.0 max 1048.36058 mph samples; cast
      DECIMAL(38,9) to DOUBLE and retain the rare nulls rather than impute.
  - name: wind_gust
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: null_rate 0.745505 (9702 of 13014 rows null) is sparsely populated so the
      column is retained nullable; cast DECIMAL(38,9) to DOUBLE for mph gust speed per operator
      context.
  - name: precip
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: null_rate 0.0, min 0.0 max 1.06 with 50 distinct two-decimal sample_values
      in inches; cast DECIMAL(38,9) to DOUBLE.
  - name: pressure
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: null_rate 0.114953 (1496 nulls) with min 983.8 max 1038.4 millibars; cast
      DECIMAL(38,9) to DOUBLE and retain nulls since roughly 11% of readings are missing in
      the source.
  - name: visib
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: null_rate 0.0 with 20 distinct_values ranging 0.0 to 10.0 miles; cast DECIMAL(38,9)
      to DOUBLE for visibility.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP WITH TIME ZONE
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate 0.0 with 4341 distinct ISO-8601 sample_values all shaped like 2013-01-01T06:00:00Z;
      cast VARCHAR to TIMESTAMP WITH TIME ZONE since the operator confirms this is a UTC instant.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
