# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:37:23.169634+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds hourly ASOS weather observations at the three NYC airport weather
    stations (EWR, JFK, LGA) for January through June 2013, cleaned for use alongside the
    flights dataset's origin column.
  usage: Join on origin and time_hour (or on origin, year, month, day, hour) to attach weather
    conditions to flight records; consumers aggregating wind or pressure metrics must explicitly
    handle nulls in wind_dir, wind_speed, wind_gust, and pressure rather than assuming complete
    coverage.
  limitations: wind_gust is missing in 74.6% of rows and pressure in 11.5% of rows; wind_dir
    and wind_speed have small but nonzero null rates (1.68% and 0.015% respectively); none
    of these were imputed, and no duplicate rows were found (duplicate_row_rate 0.0) so no
    row-level deduplication was applied.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table holds hourly ASOS weather observations at the three NYC airport
    weather stations (EWR, JFK, LGA) for January through June 2013, cleaned for use alongside
    the flights dataset's origin column.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 13014 rows and distinct_count is 3 with distinct_values
      EWR, JFK, LGA, matching the three NYC airport weather stations the operator context
      describes.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but distinct_count is 1 with the single value 2013.0,
      an integral value, and null_rate is 0.0, so it is safely cast to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are 1.0 through 6.0, all integral, min 1.0 and max 6.0, with
      null_rate 0.0, so it is cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 and min/max of 1.0/31.0 are all integral calendar-day
      values with null_rate 0.0, so it is cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 and min/max of 0.0/23.0 are all integral hour-of-day
      values with null_rate 0.0, so it is cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0 with min 10.94 and max 93.92 degrees Fahrenheit per the
      operator context, so it is retained as a two-decimal numeric.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0 with min -9.94 and max 73.94 degrees Fahrenheit dewpoint,
      so it is retained as a two-decimal numeric.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: null_rate is 0.0, distinct_count 2178, min 12.74 and max 100.0 percent relative
      humidity, consistent with a two-decimal percentage.
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: null_rate is 0.016828 (219 of 13014 rows) with min 0.0 and max 360.0 degrees,
      so nulls are retained rather than imputed.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.000154 (2 of 13014 rows) with min 0.0 and max 1048.36058 mph,
      so the rare nulls are retained.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 rows), making this column sparsely populated;
      it is retained nullable rather than dropped or imputed, with min 16.11092 and max 62.14212
      mph.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, min 0.0 and max 1.06 inches, consistent with a two-decimal
      precipitation reading.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: null_rate is 0.114953 (1496 of 13014 rows) with min 983.8 and max 1038.4
      millibars, so nulls are retained rather than imputed.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: null_rate is 0.0, distinct_count 20 at or under the distinct-values cap,
      with min 0.0 and max 10.0 miles.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are consistently ISO-8601 Z-suffixed strings like 2013-01-01T06:00:00Z
      with null_rate 0.0, so VARCHAR is cast to TIMESTAMP representing the UTC instant per
      the operator context.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
