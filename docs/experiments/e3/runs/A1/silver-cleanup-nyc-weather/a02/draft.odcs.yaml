# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:34:35.720870+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned hourly ASOS weather observations at the three NYC airports
    (EWR, JFK, LGA) for January through June 2013, intended to join against flight data on
    origin and time to support weather-aware flight analyses.
  usage: Join on origin and time_hour to align with flight records; wind_dir, wind_speed,
    pressure, and especially wind_gust (74.6% null) may be null and must be handled explicitly
    rather than assumed zero, and the unusually high wind_speed max (1048.36058 mph) should
    be treated with caution pending investigation.
  limitations: Pipeline metadata columns were dropped entirely; wind_gust is missing in nearly
    three-quarters of rows and pressure in about 11.5%, limiting their reliability for aggregate
    analysis; the wind_speed column contains at least one implausible maximum value that was
    not resolved in this cleanup.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned hourly ASOS weather observations at the three NYC
    airports (EWR, JFK, LGA) for January through June 2013, intended to join against flight
    data on origin and time to support weather-aware flight analyses.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 3 and distinct_values EWR, JFK, LGA
      matching the three NYC origin airports.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but distinct_count is 1 with the single value 2013.0,
      an integral value with null_rate 0.0.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count 6, min 1.0 and max 6.0, all integral calendar-month values
      with null_rate 0.0.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count 31, min 1.0 and max 31.0, sample_values 1.0 through 10.0 are
      all integral day-of-month values with null_rate 0.0.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count 24, min 0.0 and max 23.0, sample_values 0.0 through 9.0 are
      integral hour-of-day values with null_rate 0.0.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: Fahrenheit temperature with min 10.94 and max 93.92 and sample_values showing
      two decimal places, null_rate 0.0.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: Fahrenheit dewpoint with min -9.94 and max 73.94, requiring a sign digit,
      two-decimal sample_values, null_rate 0.0.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: Relative humidity percent with min 12.74 and max 100.0, two-decimal sample_values,
      null_rate 0.0.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: distinct_count 37 spanning min 0.0 to max 360.0 in steps of 10 matches 37
      integral compass-degree values exactly, but null_rate is 0.016828 (219 nulls) so retained
      nullable.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(9,5)
    required: false
    description: mph values with min 0.0 and max 1048.36058 and five-decimal sample_values
      (3.45234, 4.60312); null_rate is 0.000154 (2 nulls) so retained nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(7,5)
    required: false
    description: mph values with min 16.11092 and max 62.14212, but null_rate is 0.745505
      (9702 of 13014 rows), so the column is sparsely populated and retained nullable rather
      than imputed.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: Inches of precipitation with min 0.0 and max 1.06, two-decimal sample_values
      in 0.01 increments, null_rate 0.0.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: Sea-level pressure in millibars with min 983.8 and max 1038.4, but null_rate
      is 0.114953 (1496 nulls) so retained nullable.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_count 20 with the full distinct_values list from 0.0 to 10.0 including
      fractional miles like 0.06 and 0.12, null_rate 0.0.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are uniformly ISO-8601 UTC instants such as 2013-01-01T06:00:00Z,
      distinct_count 4341, null_rate 0.0, supporting a timestamp cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
