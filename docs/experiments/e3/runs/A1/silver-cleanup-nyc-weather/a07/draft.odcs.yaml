# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:39:19.521871+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds cleaned hourly weather observations from the three NYC airports
    (EWR, JFK, LGA) for January through June 2013, sourced from ASOS via the Iowa Environmental
    Mesonet as packaged in nycflights13, intended to join against flight records on origin
    and time for weather-impact analysis.
  usage: Join on origin and time_hour (UTC) to flight-level tables; consumers should expect
    wind_gust to be null for the large majority of rows (null_rate 0.745505) and should explicitly
    handle nulls in wind_dir, wind_speed, and pressure rather than assuming zero or filling
    them.
  limitations: The cleanup only drops Airbyte capture metadata and casts types; it does not
    impute or filter any null values, so wind_gust remains sparsely populated (74.6% null),
    pressure is 11.5% null, and wind_dir is 1.7% null, and consumers must handle these nulls
    themselves. No duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic was
    applied.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table holds cleaned hourly weather observations from the three NYC airports
    (EWR, JFK, LGA) for January through June 2013, sourced from ASOS via the Iowa Environmental
    Mesonet as packaged in nycflights13, intended to join against flight records on origin
    and time for weather-impact analysis.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 across 13014 rows, and distinct_values
      show exactly the three expected station codes EWR, JFK, LGA.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count is 1 and the sole distinct_value 2013.0 is integral, and null_rate
      is 0.0, so the DECIMAL(38,9) landed type safely casts to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0 through 6.0 are all integral with null_rate 0.0, supporting
      a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 are integral, min is 1.0 and max is 31.0,
      and null_rate is 0.0, supporting a cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 are integral, min 0.0 and max 23.0 fit a local
      hour-of-day, and null_rate is 0.0, supporting a cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values like 10.94 and 93.92 (max) carry two decimal places consistently,
      and null_rate is 0.0, so DECIMAL(5,2) preserves fidelity.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values range from -9.94 (min) to 73.94 (max) at two decimal places,
      with null_rate 0.0.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values such as 12.74 (min) up to 100.0 (max) use two decimal places,
      distinct_count is 2178, and null_rate is 0.0.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values 0.0 through 90.0 in 10-degree steps are integral and min 0.0/max
      360.0 fit compass degrees, but null_rate is 0.016828 with null_count 219 so nulls are
      retained.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values like 3.45234 and max 1048.36058 carry up to five decimal places,
      and null_rate is 0.000154 with null_count 2, so the column stays nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 with null_count 9702, so the column is sparsely populated
      but retained nullable; sample_values like 16.11092 and max 62.14212 justify DECIMAL(10,5).
  - name: precip
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: sample_values 0.0 through 0.09 and max 1.06 are at two decimal places with
      null_rate 0.0.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: sample_values like 983.8 and max 1038.4 carry one decimal place, but null_rate
      is 0.114953 with null_count 1496 so nulls are retained.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_values from 0.0 to 10.0 (max) include two-decimal entries like 0.06
      and 0.12, and null_rate is 0.0.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: all ten sample_values are ISO-8601 shaped with a trailing Z, e.g. 2013-01-01T06:00:00Z
      through 2013-01-01T15:00:00Z, and the operator context confirms this is a UTC instant;
      null_rate is 0.0.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
