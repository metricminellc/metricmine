# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table cleans the bronze nycflights13 flights capture (January-June 2013, JFK/LGA/EWR
    departures) into a typed silver record of one row per scheduled flight departure, feeding
    downstream delay, on-time-performance, and route analyses.
  usage: Consumers should treat dep_time, dep_delay, arr_time, arr_delay, air_time, and tailnum
    as nullable and check the derived flight_departed flag (or null dep_time) before computing
    delay metrics, since roughly 3% of rows represent flights that never departed or arrived;
    all other fields are fully populated and required.
  limitations: The profile covers only a six-month 2013 window with no duplicate rows detected
    (duplicate_row_rate 0.0), so dedupe logic is not exercised here; dep_time, dep_delay,
    arr_time, arr_delay, and air_time remain nullable (2.9%-3.3% null) with no imputation,
    and tailnum is nullable at 0.9%, so joins to a planes table on tailnum will silently drop
    those rows.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table cleans the bronze nycflights13 flights capture (January-June 2013,
    JFK/LGA/EWR departures) into a typed silver record of one row per scheduled flight departure,
    feeding downstream delay, on-time-performance, and route analyses.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Profile shows a single distinct value 2013.0 with null_rate 0.0 and min=max=2013.0,
      so this DECIMAL(38,9) landed column is safely cast to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_values [1.0..6.0] are all integral with null_rate 0.0, consistent
      with the six-month window; cast DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: sample_values 1.0-10.0 and max 31.0/min 1.0 are integral with null_rate 0.0,
      so the calendar day casts cleanly to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) matches the operator context that a flight
      which never departed has no departure time; integral samples 1.0-10.0 and max 2400.0
      support casting the HHMM value to INTEGER while nulls are retained.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 and integral sample_values (500.0-530.0) within min 500.0/max
      2359.0 justify casting this scheduled HHMM field to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 mirrors dep_time's non-departure nulls; integral sample_values
      from -33.0 to -19.0 (min -33.0, max 1301.0) support INTEGER cast with null retained
      for flights that never departed.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.0307 (5101 nulls) reflects flights that never arrived; integral
      samples 1.0-10.0 with max 2400.0 support casting the HHMM value to INTEGER, nulls retained.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 and integral samples 1.0-10.0 (min 1.0, max 2359.0) justify
      casting the scheduled arrival HHMM field to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls) aligns with flights lacking an arrival time;
      integral samples -86.0 to -67.0 (min -86.0, max 1272.0) support INTEGER cast with nulls
      retained.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: 16 distinct two-letter codes (9E, AA, AS, ... YV) with null_rate 0.0 confirm
      a complete categorical VARCHAR column.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate 0.0 and integral samples 1.0-10.0 (min 1.0, max 8500.0) justify
      casting the flight number to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.009154 (1521 nulls) with alphanumeric samples like D942DN, N0EGMQ
      shows this is a sparsely-missing identifier kept as VARCHAR with nulls retained.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: distinct_values [EWR, JFK, LGA] with null_rate 0.0 confirm the three NYC
      origin airports, kept as required VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 100 distinct airport codes (ABQ, ACK, ALB, ...) with null_rate 0.0 confirm
      a complete destination code column.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 matches flights with no arrival; integral samples 20.0-29.0
      (min 20.0, max 695.0) support casting minutes-in-air to INTEGER with nulls retained.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 and integral samples 80.0-185.0 (min 80.0, max 4983.0) justify
      casting the mileage field to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 5.0-23.0 with null_rate 0.0 are all integral hour-of-day
      values, cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 and integral samples 0.0-9.0 (max 59.0) support casting the
      minute-of-hour field to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0 and every sample (e.g. 2013-01-01T10:00:00Z) is a consistent
      ISO-8601 UTC instant, so this VARCHAR casts cleanly to TIMESTAMP per operator context
      describing it as the scheduled UTC date-hour.
  - name: flight_departed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: dep_time's null_rate 0.029388 (4883 nulls) marks flights that never departed
      per operator context, so a derived boolean flag makes this condition explicit for consumers.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
