# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:30:15.520422+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds cleaned NYC flight departure records for January-June 2013 from
    JFK, LGA, and EWR, feeding downstream analytics on carrier punctuality, route volume,
    and delay patterns.
  usage: Join on the declared grain of year, month, day, carrier, flight, and origin; treat
    dep_time, arr_time, dep_delay, arr_delay, and air_time as nullable and filter or branch
    logic deliberately when they are null, since those nulls mark flights that never departed
    rather than missing measurements.
  limitations: Roughly 3% of rows lack actual departure and arrival times, delays, and air
    time because the flight never departed, and about 0.9% of rows lack a tail number; these
    nulls were retained rather than resolved, and no duplicate rows were found to exclude
    since duplicate_row_rate is 0.0.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table holds cleaned NYC flight departure records for January-June 2013
    from JFK, LGA, and EWR, feeding downstream analytics on carrier punctuality, route volume,
    and delay patterns.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has null_rate 0.0 and a single distinct value 2013.0, an integral sample,
      so it is cast from DECIMAL(38,9) to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has null_rate 0.0 with distinct_values 1.0 through 6.0, all integral,
      so it is cast to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day has null_rate 0.0, distinct_count 31, min 1.0 max 31.0, with integral
      samples 1.0-10.0, so it is cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has null_rate 0.029388 (4883 nulls) which per operator context marks
      flights that never departed; samples 1.0-10.0 are integral so it is cast to INTEGER
      with nulls retained.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has null_rate 0.0, min 500.0 max 2359.0, integral samples
      like 500.0-530.0, so it is cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has null_rate 0.029388 matching dep_time's null pattern for flights
      that never departed; integral samples from -33.0 to -19.0 support casting to INTEGER
      with nulls retained.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has null_rate 0.0307 (5101 nulls); integral samples 1.0-10.0 support
      casting DECIMAL to INTEGER with nulls retained for undeparted or unresolved flights.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has null_rate 0.0, min 1.0 max 2359.0, integral samples 1.0-10.0,
      so it is cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has null_rate 0.032981 (5480 nulls), matching arr_time's null pattern;
      integral samples -86.0 to -67.0 support casting to INTEGER with nulls retained.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has null_rate 0.0 with 16 distinct two-letter codes (9E, AA, ...
      YV), so it is kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight has null_rate 0.0, min 1.0 max 8500.0, integral samples 1.0-10.0,
      so it is cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has null_rate 0.009154 (1521 nulls) with 3825 distinct values such
      as D942DN and N0EGMQ, so it is kept as nullable VARCHAR.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin has null_rate 0.0 with exactly 3 distinct values EWR, JFK, LGA, so
      it is kept as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has null_rate 0.0 with 100 distinct airport codes (samples ABQ, ACK,
      ALB, ...), so it is kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has null_rate 0.032981 matching arr_delay's null pattern for unresolved
      flights; integral samples 20.0-29.0 support casting to INTEGER with nulls retained.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has null_rate 0.0, min 80.0 max 4983.0, integral samples 80.0-185.0,
      so it is cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has null_rate 0.0 with 19 distinct values 5.0 through 23.0, all integral,
      so it is cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute has null_rate 0.0, min 0.0 max 59.0, integral samples 0.0-9.0, so
      it is cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour has null_rate 0.0 and all 10 samples share the ISO-8601 shape with
      Z suffix (e.g. 2013-01-01T10:00:00Z), so it is cast from VARCHAR to TIMESTAMP representing
      the UTC scheduled hour per operator context.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
