# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:27:36.278817+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table cleans the bronze nyc_flights capture of the nycflights13 flights
    data (January-June 2013, JFK/LGA/EWR departures) so downstream flight-delay and on-time-performance
    analyses can consume typed departure, arrival, and delay fields without re-deriving them
    from raw decimals and capture metadata.
  usage: Consumers should treat dep_time, dep_delay, arr_time, arr_delay, air_time, and tailnum
    as nullable and filter or branch on nulls explicitly (for example excluding null dep_time
    rows to compute realized delay statistics) rather than assuming every scheduled flight
    has a recorded outcome; grain is one row per year-month-day-carrier-flight-origin combination.
  limitations: Cleanup did not resolve the roughly 3% null rates on dep_time, dep_delay, arr_time,
    arr_delay, and air_time (4883-5480 of 166158 rows), which reflect flights that never departed
    or arrived rather than data-quality defects, and the 0.009154 null rate on tailnum remains
    unresolved; no duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic was
    applied.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This silver table cleans the bronze nyc_flights capture of the nycflights13
    flights data (January-June 2013, JFK/LGA/EWR departures) so downstream flight-delay and
    on-time-performance analyses can consume typed departure, arrival, and delay fields without
    re-deriving them from raw decimals and capture metadata.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and the single distinct_value 2013.0 is integral, so DECIMAL(38,9)
      safely casts to INTEGER; the operator context confirms year is part of the departure
      date.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with 6 integral distinct_values (1.0-6.0) matching a January-June
      window, so DECIMAL(38,9) casts cleanly to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate is 0.0, distinct_count is 31, and samples 1.0-10.0 are integral,
      so DECIMAL(38,9) casts safely to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) reflects flights that never departed per
      the operator context; samples 1.0-10.0 are integral HHMM-encoded values, so cast to
      INTEGER and retain null.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, min 500.0 and max 2359.0 with integral samples confirm
      an HHMM encoding safely cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 matches dep_time's missingness for flights that never
      departed; samples -33.0 to -19.0 are integral minutes, so cast to INTEGER and retain
      null.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.0307 (5101 nulls) is consistent with flights that never arrived;
      samples 1.0-10.0 are integral HHMM values, so cast to INTEGER and retain null.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and samples 1.0-10.0 (within min 1.0, max 2359.0) are integral
      HHMM values, so cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls) aligns with flights lacking an arrival time;
      samples -86.0 to -67.0 are integral minutes, so cast to INTEGER and retain null.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate is 0.0 and distinct_count 16 lists two-letter codes like 9E, AA,
      DL matching the operator context's carrier abbreviation.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate is 0.0, distinct_count 2994, and samples 1.0-10.0 (max 8500.0)
      are integral flight numbers, so cast DECIMAL(38,9) to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.009154 (1521 nulls) with alphanumeric samples like D942DN, N0EGMQ
      shows a sparsely missing identifier that must be retained nullable, not imputed.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate is 0.0 and distinct_values list exactly EWR, JFK, LGA matching
      the three NYC origin airports from the operator context.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count 100 with samples like ABQ, ACK, ALB matches
      airport-code destinations.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls) matches flights with no recorded arrival;
      samples 20.0-29.0 are integral minutes, so cast to INTEGER and retain null.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and samples (80.0, 94.0, ... 185.0) within min 80.0 and
      max 4983.0 are integral miles, so cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with distinct_values 5.0-23.0 all integral, matching the
      scheduled departure hour per the operator context, so cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 60, samples 0.0-9.0 within min 0.0 max 59.0
      are integral, so cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 and all samples (2013-01-01T10:00:00Z through T19:00:00Z)
      share a consistent ISO-8601 UTC shape, so cast VARCHAR to TIMESTAMP per the operator
      context's note that it is a UTC instant.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
