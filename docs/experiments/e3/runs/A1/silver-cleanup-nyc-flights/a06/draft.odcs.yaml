# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:28:22.924262+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned NYC flights departures record for January through June
    2013 from the three NYC airports (JFK, LGA, EWR), sourced from the nycflights13 bronze
    landing, and feeds downstream flight delay and on-time performance analysis.
  usage: Consumers should treat dep_time, dep_delay, arr_time, arr_delay, air_time, and tailnum
    as nullable fields where null indicates a flight that never departed or arrived (or an
    unrecorded tail number) rather than a data quality defect, and should not impute or drop
    these rows; join on carrier, flight, origin, and date fields for the declared grain.
  limitations: Pipeline metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped and carry no business meaning; roughly 3% of rows have no departure or arrival
    time (null_rate 0.029388 to 0.032981) and these were retained as nulls rather than resolved;
    the dataset covers only January through June 2013, not the full year.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table is the cleaned NYC flights departures record for January through
    June 2013 from the three NYC airports (JFK, LGA, EWR), sourced from the nycflights13 bronze
    landing, and feeds downstream flight delay and on-time performance analysis.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Single distinct value 2013.0 with null_rate 0.0 and all sample/landed values
      integral despite the DECIMAL(38,9) physical type, so an INTEGER cast is safe.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_count 6 with values 1.0 through 6.0, min 1.0 max 6.0, null_rate
      0.0; all integral so INTEGER cast is safe.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: distinct_count 31, min 1.0 max 31.0, null_rate 0.0, samples 1.0-10.0 all
      integral; INTEGER cast is safe.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: HHMM-encoded actual departure time, min 1.0 max 2400.0, all samples integral;
      null_rate 0.029388 (4883 nulls) because a flight that never departed has no departure
      time per operator context, so nulls are retained rather than imputed.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: HHMM-encoded scheduled departure time, min 500.0 max 2359.0, null_rate 0.0,
      samples 500.0-530.0 all integral; INTEGER cast is safe.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes delayed, negative when early, min -33.0 max 1301.0, all integral
      samples; null_rate 0.029388 matches dep_time's null rate, consistent with no delay computed
      when a flight never departed.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: HHMM-encoded actual arrival time, min 1.0 max 2400.0, all integral samples;
      null_rate 0.0307 (5101 nulls) reflects flights that never arrived, retained rather than
      imputed.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: HHMM-encoded scheduled arrival time, min 1.0 max 2359.0, null_rate 0.0, samples
      1.0-10.0 integral; INTEGER cast is safe.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Arrival delay minutes, min -86.0 max 1272.0, all integral samples; null_rate
      0.032981 (5480 nulls) aligns with air_time's null rate for flights that never arrived.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: 16 distinct two-letter carrier codes (9E, AA, AS, ... YV), null_rate 0.0;
      kept as VARCHAR per operator context describing it as the carrier abbreviation.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: Flight number, min 1.0 max 8500.0, null_rate 0.0, samples 1.0-10.0 all integral;
      INTEGER cast is safe.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 3825 distinct tail numbers like N0EGMQ, N10156; null_rate 0.009154 (1521
      nulls), likely for flights with no assigned or recorded aircraft, so nulls are retained.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: 3 distinct NYC airport codes (EWR, JFK, LGA), null_rate 0.0; kept as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 100 distinct destination airport codes, null_rate 0.0, samples ABQ, ACK,
      ALB...; kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes in the air, min 20.0 max 695.0, all integral samples; null_rate 0.032981
      matches arr_delay's null rate for flights that never arrived, so nulls are retained.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Miles between airports, min 80.0 max 4983.0, null_rate 0.0, all integral
      samples; INTEGER cast is safe.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count 19, min 5.0 max 23.0, null_rate 0.0, all distinct values integral;
      INTEGER cast is safe.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count 60, min 0.0 max 59.0, null_rate 0.0, samples 0.0-9.0 all integral;
      INTEGER cast is safe.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: 3439 distinct values, null_rate 0.0, all samples are ISO-8601 UTC instants
      like 2013-01-01T10:00:00Z, so a TIMESTAMP cast is safe.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
