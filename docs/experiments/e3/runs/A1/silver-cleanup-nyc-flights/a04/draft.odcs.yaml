# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:26:36.785210+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds one row per scheduled flight departure from the three New York
    City airports (EWR, JFK, LGA) for January through June 2013, as reported by the Bureau
    of Transportation Statistics via the nycflights13 source, feeding downstream analysis
    of flight volume, delays, and carrier performance.
  usage: Join on carrier and tailnum for aircraft-level analysis, or on time_hour for hourly
    weather joins as in the broader nycflights13 ecosystem; dep_time, dep_delay, arr_time,
    arr_delay, and air_time are null for flights that never departed or arrived, so consumers
    computing delay statistics must explicitly filter or account for these nulls rather than
    treating them as zero.
  limitations: Cleanup could not resolve the 2.9%-3.3% null rates on dep_time, dep_delay,
    arr_time, arr_delay, and air_time, which represent cancelled or otherwise incomplete flights
    rather than data quality defects; tailnum is missing for 0.9% of rows; the dataset itself
    is scoped to only the first six months of 2013 and only the three NYC origin airports,
    so it is not a complete annual or national flight record.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table holds one row per scheduled flight departure from the three New
    York City airports (EWR, JFK, LGA) for January through June 2013, as reported by the Bureau
    of Transportation Statistics via the nycflights13 source, feeding downstream analysis
    of flight volume, delays, and carrier performance.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and the only distinct_value observed is 2013.0, an integral
      value, so the DECIMAL(38,9) lands cleanly as INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with distinct_values 1.0 through 6.0, all integral, supporting
      a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate is 0.0, distinct_count is 31 matching calendar days, and sample_values
      1.0-10.0 are all integral, supporting INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Values range 1.0-2400.0 in HHMM form and are all integral per sample_values,
      but null_rate 0.029388 (4883 nulls) reflects flights that never departed, so the column
      stays nullable.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: null_rate is 0.0 and sample_values (500.0-530.0) are integral HHMM values,
      supporting a required INTEGER cast.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral minute values from -33.0 to 1301.0 per samples, with null_rate 0.029388
      matching dep_time's cancelled-flight nulls, so nullability is retained.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral HHMM samples (1.0-2400.0) support INTEGER, but null_rate 0.0307
      (5101 nulls) reflects flights with no arrival, so it stays nullable.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and sample_values are integral HHMM figures, supporting
      a required INTEGER cast.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral minute values from -86.0 to 1272.0, with null_rate 0.032981 (5480
      nulls) aligned to missing arrivals, so the column remains nullable.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate is 0.0 with 16 distinct two-letter codes (9E, AA, ..., YV) matching
      the operator-documented carrier abbreviation.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate is 0.0 and sample_values 1.0-10.0 are integral flight numbers up
      to max 8500.0, supporting INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 3825 distinct alphanumeric codes like 'N0EGMQ' with null_rate 0.009154 (1521
      nulls), so tail number stays nullable rather than imputed.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate is 0.0 with exactly 3 distinct values (EWR, JFK, LGA), matching
      the three NYC origin airports.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 across 100 distinct destination airport codes such as ABQ
      and ACK.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral minute samples (20.0-29.0, max 695.0) support INTEGER, but null_rate
      0.032981 matches the arrival-delay nulls for flights that never arrived.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and sample_values (80.0-185.0, max 4983.0) are integral
      miles, supporting a required INTEGER cast.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with 19 distinct integral values from 5.0 to 23.0, matching
      the scheduled departure hour component.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with 60 distinct integral values 0.0-59.0, matching the
      scheduled departure minute component.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 and sample_values are uniformly ISO-8601 UTC instants like
      '2013-01-01T10:00:00Z', supporting a cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin,
      sched_dep_time) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
