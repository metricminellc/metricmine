# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:32:35.045048+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed flight-level records for NYC-origin departures
    (JFK, LGA, EWR) covering January through June 2013, sourced from the nycflights13 flights
    dataset, to feed downstream analytics on flight punctuality, carrier performance, and
    route operations.
  usage: Consumers should join or group by carrier, flight, time_hour, and origin to address
    a single flight instance, and must explicitly handle nulls in dep_time, arr_time, dep_delay,
    arr_delay, and air_time (roughly 3% null each) as flights that did not depart or complete
    normally rather than treating them as zero or erroneous; time_hour is hour-granular UTC
    and should not be assumed to carry minute precision, for which hour and minute columns
    are provided separately.
  limitations: Cleanup retained but did not resolve the roughly 2.9% to 3.3% missingness in
    dep_time, arr_time, dep_delay, arr_delay, and air_time, nor the 0.9% missingness in tailnum;
    these reflect flights that never departed or lack registration data per the source documentation,
    not a cleanup gap, and no duplicate rows were found (duplicate_row_rate 0.0) so no dedupe
    logic was applied.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed flight-level records for NYC-origin departures
    (JFK, LGA, EWR) covering January through June 2013, sourced from the nycflights13 flights
    dataset, to feed downstream analytics on flight punctuality, carrier performance, and
    route operations.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: year has null_rate 0.0 and a single distinct_value 2013.0, an integral value
      landed as DECIMAL(38,9), so casting to INTEGER is safe.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: month has null_rate 0.0 and distinct_values 1.0 through 6.0, all integral,
      so casting DECIMAL(38,9) to INTEGER is supported by the data.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: day has null_rate 0.0, distinct_count 31, min 1.0 and max 31.0, consistent
      with calendar day-of-month integers, so casting to INTEGER is justified.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has null_rate 0.029388 (4883 nulls) with integral sample_values
      like 1.0 through 10.0 in HHMM form; per operator context a null means the flight never
      departed, so nulls are retained rather than imputed.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has null_rate 0.0, min 500.0 and max 2359.0 with integral
      HHMM-style samples, so casting to INTEGER is safe and the field is always populated.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has null_rate 0.029388 matching dep_time's null rate (flights that
      never departed have no delay), with integral minute samples from -33.0 to -19.0, so
      it is cast to INTEGER and nulls are retained.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has null_rate 0.0307 (5101 nulls) with integral HHMM samples 1.0
      through 10.0; nulls correspond to flights lacking an arrival record and are retained
      rather than imputed.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has null_rate 0.0, min 1.0 and max 2359.0 with integral samples,
      so casting DECIMAL(38,9) to INTEGER is supported and required is appropriate.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has null_rate 0.032981 (5480 nulls) with integral minute samples
      from -86.0 to -67.0; nulls align with flights missing arrival data and are retained.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: carrier has null_rate 0.0 and distinct_count 16 with two-letter codes like
      9E, AA, DL per distinct_values, so it is kept as a required VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: flight has null_rate 0.0, min 1.0 and max 8500.0 with integral samples, so
      casting DECIMAL(38,9) to INTEGER is justified and the field is required.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has null_rate 0.009154 (1521 nulls) with distinct_count 3825 and
      tail-number-shaped samples like D942DN and N0EGMQ; it is kept as nullable VARCHAR since
      some flights lack a recorded tail number.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: origin has null_rate 0.0 and exactly 3 distinct_values (EWR, JFK, LGA), confirming
      the three NYC airports, so it is kept required.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has null_rate 0.0 and distinct_count 100 with airport-code samples like
      ABQ, ACK, ALB, so it is kept as a required VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has null_rate 0.032981 matching arr_delay's null rate, with integral
      minute samples 20.0 through 29.0, so it is cast to INTEGER and nulls (flights without
      arrival data) are retained.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has null_rate 0.0, min 80.0 and max 4983.0 with integral mile samples,
      so casting to INTEGER is safe and the field is required.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has null_rate 0.0 and distinct_values 5.0 through 23.0, all integral,
      so casting to INTEGER is justified.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute has null_rate 0.0, min 0.0 and max 59.0 with integral samples 0.0
      through 9.0, so casting to INTEGER is safe.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: time_hour has null_rate 0.0 and ISO-8601 shaped samples like 2013-01-01T10:00:00Z
      consistently across all 10 samples, so casting VARCHAR to TIMESTAMP is supported.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier, flight, time_hour, origin) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier, flight, time_hour, origin
        FROM silver.silver_nyc_flights
        GROUP BY carrier, flight, time_hour, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
