# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:59:45.672434+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_runways cleans the OurAirports runways bronze extract into one row per runway,
    keyed by runway_id, linking to airports via airport_id and airport_identifier, for consumers
    building runway-level analytics (length, width, surface, lighting, orientation) that feed
    downstream airport infrastructure and flight-planning marts.
  usage: Join on airport_id or airport_identifier to the airports silver table; treat the
    low_end_* and high_end_* columns as a pair describing each runway's two ends, and expect
    many of those columns (latitude, longitude, elevation, heading, displaced_threshold) to
    be null for roughly 22% to 90% of rows depending on the field, since OurAirports does
    not always capture end-level detail, so filter or coalesce nulls deliberately rather than
    assuming zero or false.
  limitations: Cleanup could not resolve the sparsity of end-level geodata (le/he latitude,
    longitude, elevation, heading null_rate roughly 0.22-0.28) or displaced thresholds (null_rate
    0.88-0.90); surface_code remains free text because OurAirports documents it as an open,
    non-fixed vocabulary with 239 distinct values observed; and dataset.duplicate_row_rate
    of 0.0 across 10760 rows means no exact-duplicate removal was necessary in this load.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: silver_runways cleans the OurAirports runways bronze extract into one row per
    runway, keyed by runway_id, linking to airports via airport_id and airport_identifier,
    for consumers building runway-level analytics (length, width, surface, lighting, orientation)
    that feed downstream airport infrastructure and flight-planning marts.
  properties:
  - name: runway_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: id is the publisher's internal integer identifier for the runway; null_rate
      0.0 and distinct_count 10760 equals row_count 10760, with numeric samples like 232758,
      232759, 232762, so cast VARCHAR to INTEGER and rename to runway_id.
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: airport_ref is the internal integer key of the airport per operator context,
      null_rate 0.0, and samples (10309, 10366, 1058, 111) are all integral, so rename to
      airport_id and cast to INTEGER.
  - name: airport_identifier
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: airport_ident is the externally visible string key matching the airports
      table's ident, null_rate 0.0, distinct_count 7591, with alphanumeric samples like 03N,
      07FA, 0CO2, so kept as VARCHAR and renamed to spell out identifier.
  - name: length_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: length_ft is the full runway surface length in feet; null_rate 0.007993 (86
      nulls) and sample values (0.0, 2.0, 20.0, 24.0) are all integral, so cast DECIMAL(38,9)
      to INTEGER, rename with the feet unit suffix, and retain nulls.
  - name: width_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: width_ft is the runway width in feet; null_rate 0.082528 (888 nulls) and
      sample values (1.0, 10.0, 15.0) are all integral, so cast to INTEGER, rename with the
      feet suffix, and retain nulls.
  - name: surface_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: surface is a code for surface type with 239 distinct values (ASP, ASP-G,
      ASP/CON, ASPH, ASPH-CONC) that per operator context is not a fixed list, and null_rate
      0.022955 (247 nulls), so rename with the _code suffix, keep as text, and retain nulls.
  - name: is_lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: lighted is 1 when the surface is lighted at night and 0 otherwise, distinct_values
      are exactly [0.0, 1.0] with null_rate 0.0, so cast DECIMAL to BOOLEAN and rename with
      the is_ prefix.
  - name: is_closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: closed is 1 when the runway is currently closed and 0 otherwise, distinct_values
      are exactly [0.0, 1.0] with null_rate 0.0, so cast to BOOLEAN and rename with the is_
      prefix.
  - name: low_end_designator
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: le_ident is the low-numbered end's designator; null_rate 0.001022 (11 nulls)
      and samples include irregular values like '-12', '.', '00', '009', so keep as text,
      spell out le to low_end, and retain nulls.
  - name: low_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: le_latitude_deg is the low end's centre latitude ranging -62.187801 to 82.512802
      with null_rate 0.220911 (2377 nulls), so keep as DECIMAL, spell out le and deg, and
      retain nulls as sparsely populated.
  - name: low_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: le_longitude_deg ranges -179.881256 to 179.338837 with null_rate 0.221283
      (2381 nulls), so keep as DECIMAL, spell out le and deg, and retain nulls as sparsely
      populated.
  - name: low_end_elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_elevation_ft ranges -1246.0 to 13202.0 with integral sample values and
      null_rate 0.276301 (2973 nulls), so cast to INTEGER, spell out le to low_end and ft
      to feet, and retain nulls.
  - name: low_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: le_heading_degt is the low end's true heading with fractional sample values
      (0.2, 0.4, 0.7, 1.12, 1.9) and null_rate 0.228346 (2457 nulls), so keep as DECIMAL,
      spell out le and degt to degrees, and retain nulls.
  - name: low_end_displaced_threshold_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_displaced_threshold_ft has a very high null_rate of 0.884201 (9514 of
      10760 nulls) since most runways have no displaced threshold, and sample values (1.0,
      2.0, 10.0) are integral, so cast to INTEGER, rename with the feet suffix, and retain
      nulls as sparsely populated.
  - name: high_end_designator
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: he_ident is the high-numbered end's designator; null_rate 0.004926 (53 nulls)
      and samples include irregular values like '-', '.', '00', '01', so keep as text, spell
      out he to high_end, and retain nulls.
  - name: high_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: he_latitude_deg ranges -62.193901 to 82.522797 with null_rate 0.222212 (2391
      nulls), so keep as DECIMAL, spell out he and deg, and retain nulls as sparsely populated.
  - name: high_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: he_longitude_deg ranges -179.873184 to 179.343002 with null_rate 0.222212
      (2391 nulls), so keep as DECIMAL, spell out he and deg, and retain nulls as sparsely
      populated.
  - name: high_end_elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_elevation_ft ranges -1210.0 to 13314.0 with integral sample values and
      null_rate 0.276208 (2972 nulls), so cast to INTEGER, spell out he and ft to feet, and
      retain nulls.
  - name: high_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: he_heading_degt is the high end's true heading with fractional sample values
      (0.1 through 0.9) and null_rate 0.227138 (2444 nulls), so keep as DECIMAL, spell out
      he and degt, and retain nulls.
  - name: high_end_displaced_threshold_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_displaced_threshold_ft has a very high null_rate of 0.899907 (9683 of
      10760 nulls) and integral sample values (10.0, 30.0, 33.0), so cast to INTEGER, rename
      with the feet suffix, and retain nulls as sparsely populated.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (runway_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT runway_id
        FROM silver.silver_runways
        GROUP BY runway_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
