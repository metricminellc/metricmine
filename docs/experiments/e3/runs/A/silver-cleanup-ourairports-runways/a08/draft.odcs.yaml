# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:01:41.405809+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table holds one row per OurAirports runway, cleaned from the bronze
    ourairports_runways capture, feeding downstream analyses that join airports to their runways
    by airport_id or airport_ident.
  usage: Join on airport_id (or the externally visible airport_ident) to the airports table,
    and treat runway_id as the unique row key; low_end_* and high_end_* columns describe the
    two physical ends of each runway and are independently nullable, so consumers must null-check
    them before use, and is_closed should be filtered when only active runways are wanted.
  limitations: Geographic and physical attributes for the runway ends are missing for a substantial
    share of rows (roughly 22% for latitude/longitude, 23-28% for elevation and heading, and
    88-90% for displaced threshold), and surface_code remains an open, non-enumerated set
    of publisher codes rather than a normalized vocabulary; none of these gaps were imputed
    or inferred.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: This silver table holds one row per OurAirports runway, cleaned from the bronze
    ourairports_runways capture, feeding downstream analyses that join airports to their runways
    by airport_id or airport_ident.
  properties:
  - name: runway_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Operator context states id is the publisher's internal integer identifier
      for the runway; null_rate is 0.0 and distinct_count 10760 equals row_count 10760, and
      all sampled values ('232758','232759',...) are plain integer strings, so it is cast
      to INTEGER and used as the grain.
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Operator context describes airport_ref as the internal integer key of the
      airport; null_rate is 0.0 and samples ('10309','10366','10532',...) are all integer-shaped,
      so it is cast to INTEGER and renamed to match the spelled-out convention for a foreign
      key reference.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Operator context states airport_ident is the externally visible string key
      matching the airports table's ident; null_rate is 0.0 with samples like '03N','07FA','0CO2'
      that are alphanumeric codes, not integers, so it stays VARCHAR.
  - name: length_feet
    logicalType: number
    physicalType: DECIMAL(10,1)
    required: false
    description: Sample values (0.0, 2.0, 20.0 ... up to max 16798.0) show a bounded decimal
      measure with null_rate 0.007993 (86 nulls); renamed to spell out the feet unit per naming
      convention and tightened from DECIMAL(38,9) to DECIMAL(10,1) to match the observed magnitude.
  - name: width_feet
    logicalType: number
    physicalType: DECIMAL(10,1)
    required: false
    description: Samples (1.0 to max 7000.0) show a bounded decimal measure with null_rate
      0.082528 (888 nulls); renamed to the full 'feet' unit suffix and precision tightened
      to DECIMAL(10,1).
  - name: surface_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Operator context confirms surface is a code without a fixed value list; distinct_count
      is 239 with varied codes like 'ASP','ASP-G','ASP/CONC' and null_rate 0.022955 (247 nulls),
      so it is renamed with the `_code` suffix convention and kept as VARCHAR.
  - name: is_lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, and operator context
      confirms it is 1 when the surface is lighted at night, so it is cast to BOOLEAN and
      renamed with the `is_` convention.
  - name: is_closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, and operator context
      confirms it is 1 when the runway is currently closed, so it is cast to BOOLEAN and renamed
      with the `is_` convention.
  - name: low_end_identifier
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Operator context says le_ident is the low-numbered end's designator; samples
      include odd values like '-12' and '.' alongside typical codes '00','01C', null_rate
      is low at 0.001022 (11 nulls), so it is renamed to spell out 'low_end' and kept as text
      given the irregular samples.
  - name: low_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Range -62.187801 to 82.512802 with null_rate 0.220911 (2377 nulls) matches
      a geographic latitude; renamed to spell out 'low_end' and the full 'degrees' unit, precision
      narrowed to DECIMAL(9,6) to fit the observed 6-decimal samples.
  - name: low_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Range -179.881256 to 179.338837 with null_rate 0.221283 (2381 nulls) matches
      a geographic longitude; renamed to spell out 'low_end' and 'degrees', precision narrowed
      to DECIMAL(9,6).
  - name: low_end_elevation_feet
    logicalType: number
    physicalType: DECIMAL(10,1)
    required: false
    description: Samples range from -1246.0 to max 13202.0 with null_rate 0.276301 (2973 nulls);
      renamed to spell out 'low_end' and the full 'feet' unit, with precision tightened from
      DECIMAL(38,9).
  - name: low_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: Samples span 0.0 to max 360.0, consistent with a compass heading, with null_rate
      0.228346 (2457 nulls); renamed to spell out 'low_end' and 'degrees', precision tightened
      to DECIMAL(5,1).
  - name: low_end_displaced_threshold_feet
    logicalType: number
    physicalType: DECIMAL(10,1)
    required: false
    description: null_rate is 0.884201 (9514 of 10760 rows null), reflecting that most runway
      ends have no displaced threshold per operator context; retained as sparsely populated
      nullable DECIMAL(10,1) renamed to spell out units, not dropped or imputed.
  - name: high_end_identifier
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Operator context says he_ident is the high-numbered end's designator; samples
      include '-','.' plus codes like '01L','04R', null_rate is 0.004926 (53 nulls), so it
      is renamed to spell out 'high_end' and kept as text.
  - name: high_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Range -62.193901 to 82.522797 with null_rate 0.222212 (2391 nulls) matches
      a geographic latitude; renamed to spell out 'high_end' and 'degrees', precision narrowed
      to DECIMAL(9,6).
  - name: high_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Range -179.873184 to 179.343002 with null_rate 0.222212 (2391 nulls) matches
      a geographic longitude; renamed to spell out 'high_end' and 'degrees', precision narrowed
      to DECIMAL(9,6).
  - name: high_end_elevation_feet
    logicalType: number
    physicalType: DECIMAL(10,1)
    required: false
    description: Samples range from -1210.0 to max 13314.0 with null_rate 0.276208 (2972 nulls);
      renamed to spell out 'high_end' and the full 'feet' unit, precision tightened from DECIMAL(38,9).
  - name: high_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: Samples span 0.0 to max 362.0, consistent with a compass heading, with null_rate
      0.227138 (2444 nulls); renamed to spell out 'high_end' and 'degrees', precision tightened
      to DECIMAL(5,1).
  - name: high_end_displaced_threshold_feet
    logicalType: number
    physicalType: DECIMAL(10,1)
    required: false
    description: null_rate is 0.899907 (9683 of 10760 rows null), the sparsest column in the
      table, reflecting that most runway ends have no displaced threshold per operator context;
      retained nullable rather than dropped or imputed.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (runway_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT runway_id
        FROM silver.silver_ourairports_runways
        GROUP BY runway_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
