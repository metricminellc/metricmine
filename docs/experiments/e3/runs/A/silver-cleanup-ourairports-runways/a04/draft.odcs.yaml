# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:55:04.375057+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_runways cleans the OurAirports runways extract into one row per runway,
    carrying per-end runway geometry and surface attributes to feed airport infrastructure,
    routing, and capacity analyses alongside the airports table.
  usage: Join on airport_id (internal integer key) or airport_ident (external key matching
    airports.ident) to attach airport context; treat all low_end_* and high_end_* columns
    as optional per-end detail that may be null when the publisher has not recorded that end's
    geometry or displaced threshold; filter is_closed = true to exclude runways not currently
    in service.
  limitations: Latitude, longitude, elevation, and heading columns for both runway ends carry
    null rates of roughly 22%-28%, and displaced threshold columns are null for about 88%-90%
    of rows, reflecting incomplete source records rather than cleanup loss; surface_code remains
    an open, non-enumerated set of 239 distinct codes and was not normalized into a fixed
    vocabulary.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: silver_runways cleans the OurAirports runways extract into one row per runway,
    carrying per-end runway geometry and surface attributes to feed airport infrastructure,
    routing, and capacity analyses alongside the airports table.
  properties:
  - name: runway_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count 10760 equals dataset.row_count 10760,
      so every sampled value ('232758','232759',...) is a unique integral identifier for the
      runway.
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and samples ('10309','1058','111',...) are all integral
      strings; distinct_count 7591 shows many runways share one airport, consistent with the
      operator's description of this as the airport's internal integer key.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and samples ('03N','07FA','0NM0',...) are alphanumeric airport
      codes, matching the operator's note that this is the externally visible key joining
      the airports table's ident.
  - name: length_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.7993% (86 of 10760) and every sample (0.0,2.0,20.0,...,44.0)
      is integral with max 16798.0, so DECIMAL(38,9) can be cast to INTEGER; unit suffix renamed
      to feet per naming convention.
  - name: width_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 8.2528% (888 nulls) and samples (1.0,10.0,...,26.0) are all
      integral with max 7000.0, supporting an INTEGER cast and the feet unit suffix.
  - name: surface_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 2.2955% (247 nulls) with 239 distinct codes such as 'ASP','ASP-G','ASPH-CONC-F';
      the operator confirms this is not a fixed list, so it is kept as free text and renamed
      with the _code suffix convention.
  - name: is_lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: null_rate is 0.0 and distinct_values are exactly [0.0,1.0], a binary flag
      per the operator's description; renamed with the is_ prefix convention.
  - name: is_closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: null_rate is 0.0 and distinct_values are exactly [0.0,1.0], a binary flag
      per the operator's description; renamed with the is_ prefix convention.
  - name: low_end_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.1022% (11 nulls) with 199 distinct values including irregular
      entries like '-12' and '.', so kept as text; renamed to spell out 'le' as low_end per
      operator convention.
  - name: low_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 22.0911% (2377 nulls); samples range from -62.187801 to higher
      values with six decimal places, consistent with decimal-degree coordinates that are
      sparsely populated for some runway ends.
  - name: low_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 22.1283% (2381 nulls); samples range from -179.881256 to -174.345993,
      consistent with decimal-degree coordinates not always recorded.
  - name: low_end_elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 27.6301% (2973 nulls) and samples (-1246.0,-184.0,...,-69.0)
      are all integral, so DECIMAL(38,9) can be cast to INTEGER; renamed with feet suffix
      and low_end prefix.
  - name: low_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate is 22.8346% (2457 nulls) and samples include non-integral values
      (0.2,0.4,1.12), so kept as a decimal number; renamed to spell out 'degt' as degrees
      and 'le' as low_end.
  - name: low_end_displaced_threshold_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 88.4201% (9514 nulls), reflecting that most runway ends have
      no displaced threshold; all samples (1.0,2.0,...,57.0) are integral so cast to INTEGER,
      retained nullable since absence is meaningful.
  - name: high_end_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.4926% (53 nulls) with 177 distinct values including irregular
      entries like '-' and '.', so kept as text; renamed to spell out 'he' as high_end.
  - name: high_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 22.2212% (2391 nulls); samples range from -62.193901 to -51.823898
      with six decimal places, consistent with decimal-degree coordinates sparsely populated.
  - name: high_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 22.2212% (2391 nulls); samples range from -179.873184 to -174.203995,
      consistent with decimal-degree coordinates not always recorded.
  - name: high_end_elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 27.6208% (2972 nulls) and samples (-1210.0,-181.0,...,-69.0)
      are all integral, so DECIMAL(38,9) can be cast to INTEGER; renamed with feet suffix
      and high_end prefix.
  - name: high_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate is 22.7138% (2444 nulls) and samples include non-integral values
      (0.1,0.3,0.5), so kept as a decimal number; renamed to spell out 'degt' as degrees and
      'he' as high_end.
  - name: high_end_displaced_threshold_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 89.9907% (9683 nulls), the sparsest column in the table, reflecting
      that most high ends have no displaced threshold; all samples (10.0,30.0,...,76.0) are
      integral so cast to INTEGER, retained nullable since absence is meaningful.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (runway_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT runway_id
        FROM silver.silver_runways
        GROUP BY runway_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
