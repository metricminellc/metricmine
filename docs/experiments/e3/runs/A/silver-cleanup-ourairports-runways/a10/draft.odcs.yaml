# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:04:20.568413+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned runway-level dataset from OurAirports, one row per runway,
    feeding downstream joins to the airports table on airport_id and airport_identifier and
    any analysis of runway geometry, surface, and status.
  usage: Join on airport_id (internal) or airport_identifier (external) to the airports silver
    table; filter is_closed = true out of operational analyses as needed; treat low_end_/high_end_
    latitude, longitude, elevation, heading, and displaced_threshold columns as optional since
    they are frequently null and must not be imputed; surface_code is a free-text code, not
    a fixed enumeration, so match it defensively.
  limitations: Geospatial and heading columns (low_end_/high_end_ latitude, longitude, elevation,
    heading) carry null_rates between 0.22 and 0.28, and the displaced_threshold columns carry
    null_rates of 0.88 and 0.90, reflecting genuine historical gaps in the source rather than
    errors; these were retained nullable, not imputed or dropped. surface_code was left as
    unvalidated free text because the publisher does not maintain a fixed code list. No duplicate
    rows were found (duplicate_row_rate 0.0) so no row-level dedupe was applied.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: This table is the cleaned runway-level dataset from OurAirports, one row per
    runway, feeding downstream joins to the airports table on airport_id and airport_identifier
    and any analysis of runway geometry, surface, and status.
  properties:
  - name: runway_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Samples are all digit strings (232758, 232759, ...) with distinct_count 10760
      equal to row_count 10760 and null_count 0, so the publisher's internal identifier casts
      cleanly to INTEGER and anchors the grain.
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Samples (10309, 10366, 1058, ...) are all numeric strings with null_rate
      0.0, matching the operator's description of an internal integer key; renamed from the
      abbreviated ref per naming convention.
  - name: airport_identifier
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Samples (03N, 07FA, 0CO2, ...) are alphanumeric external codes, not numeric,
      so the column stays text; renamed to spell out the abbreviated ident per operator convention,
      null_rate is 0.0.
  - name: length_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample values (0.0, 2.0, 20.0, ... 44.0) are integral despite the DECIMAL(38,9)
      landed type, justifying a cast to INTEGER; null_rate is 0.007993 (86 nulls) so the column
      stays nullable, retaining the unit suffix per convention.
  - name: width_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (1.0, 10.0, 15.0, ... 26.0) are all whole numbers, supporting an
      INTEGER cast; null_rate 0.082528 (888 nulls) keeps the column nullable.
  - name: surface_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: distinct_count 239 with samples like ASP, ASP-G, ASP/CON, ASPH-CONC-F shows
      an open, non-enumerated vocabulary per the operator's note that the code list is not
      fixed; null_rate 0.022955 (247 nulls) keeps it nullable and it is renamed with the _code
      suffix convention.
  - name: is_lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, a clean binary
      flag cast to BOOLEAN and renamed with the is_ prefix per convention.
  - name: is_closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, a clean binary
      flag cast to BOOLEAN and renamed with the is_ prefix per convention.
  - name: low_end_identifier
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Samples include non-numeric forms like -12, ., 009, 01C so the column stays
      text; null_rate 0.001022 (11 nulls) keeps it nullable; renamed to spell out le_ and
      ident per operator convention.
  - name: low_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Samples carry six decimal places (-62.187801, -54.931, ...) so the column
      stays a decimal; null_rate 0.220911 (2377 nulls) is sizable but retained nullable rather
      than imputed.
  - name: low_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Samples carry decimal precision (-179.881256, -178.071487, ...) so the column
      stays numeric; null_rate 0.221283 (2381 nulls) keeps it nullable.
  - name: low_end_elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (-1246.0, -184.0, -127.0, ...) are all whole numbers, justifying
      an INTEGER cast; null_rate 0.276301 (2973 nulls) is notable but retained nullable, column
      renamed to spell out le_ and unit suffix.
  - name: low_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Samples include a fractional value (1.12) alongside whole numbers, so the
      column is kept as a decimal rather than cast to INTEGER; null_rate 0.228346 (2457 nulls)
      keeps it nullable.
  - name: low_end_displaced_threshold_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (1.0, 2.0, 10.0, ... 57.0) are all integral, supporting an INTEGER
      cast; null_rate is 0.884201 (9514 nulls), so the column is sparsely populated but retained
      nullable rather than dropped.
  - name: high_end_identifier
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Samples include non-numeric forms like -, ., 1, 01L so the column stays text;
      null_rate 0.004926 (53 nulls) keeps it nullable; renamed to spell out he_ and ident.
  - name: high_end_latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Samples carry six decimal places (-62.193901, -54.931198, ...) so the column
      stays numeric; null_rate 0.222212 (2391 nulls) keeps it nullable.
  - name: high_end_longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Samples carry decimal precision (-179.873184, -178.061371, ...) so the column
      stays numeric; null_rate 0.222212 (2391 nulls) keeps it nullable.
  - name: high_end_elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (-1210.0, -181.0, -135.0, ...) are all whole numbers, justifying
      an INTEGER cast; null_rate 0.276208 (2972 nulls) is notable but retained nullable.
  - name: high_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Samples show fractional increments (0.1, 0.2, 0.3, ...) so the column is
      kept as a decimal rather than cast to INTEGER; null_rate 0.227138 (2444 nulls) keeps
      it nullable.
  - name: high_end_displaced_threshold_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (10.0, 30.0, 33.0, ... 76.0) are all integral, supporting an INTEGER
      cast; null_rate is 0.899907 (9683 nulls), the highest sparsity in the table, but retained
      nullable rather than dropped.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (runway_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT runway_id
        FROM silver.silver_ourairports_runways
        GROUP BY runway_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
