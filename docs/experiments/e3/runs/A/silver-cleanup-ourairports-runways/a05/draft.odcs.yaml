# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:56:29.166810+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_runways cleans the OurAirports runways bronze extract into one row per
    runway (grain: runway_id), carrying physical runway attributes and the low-end/high-end
    geometry columns for the airports in the airports extract, for use in airport-infrastructure
    and runway-capability analysis.'
  usage: 'Join on airport_ref or airport_ident to the airports silver table to bring in airport-level
    context. Consumers must handle nulls explicitly: coordinate, elevation, and heading columns
    are null for roughly 22-28% of rows, and displaced_threshold columns are null for the
    great majority of rows since most runway ends have no displaced threshold. surface_code
    is not drawn from a fixed enumeration and should be normalized by the consumer if grouping
    by surface type is needed.'
  limitations: Deduplication was unnecessary (duplicate_row_rate 0.0 across 10760 rows), so
    no dedupe_keys are set. Geodata (latitude, longitude, elevation, heading) and displaced-threshold
    columns remain sparsely populated (null rates from 0.001 up to 0.900) and were not imputed.
    surface_code retains its original 239 distinct unnormalized values since the publisher
    states the code list is not fixed.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: 'silver_runways cleans the OurAirports runways bronze extract into one row
    per runway (grain: runway_id), carrying physical runway attributes and the low-end/high-end
    geometry columns for the airports in the airports extract, for use in airport-infrastructure
    and runway-capability analysis.'
  properties:
  - name: runway_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: id has null_rate 0.0 and distinct_count 10760 equal to row_count, with purely
      numeric samples like 232758-232770, so it is cast from VARCHAR to INTEGER and renamed
      runway_id to reflect it as the publisher's internal runway identifier.
  - name: airport_ref
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: airport_ref has null_rate 0.0 and purely numeric samples (10309, 10366, 1058...),
      matching the operator's description of an internal integer key, so it is cast from VARCHAR
      to INTEGER.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: airport_ident has null_rate 0.0 with alphanumeric samples like 03N, 07FA,
      19AK and is the externally visible key matching the airports table's ident, so it is
      kept as VARCHAR.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: length_ft has null_rate 0.008 and all samples are whole numbers (0.0, 2.0,
      20.0...24, 26, 30), so it is cast from DECIMAL(38,9) to INTEGER and retained nullable
      for the 86 missing rows.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: width_ft has null_rate 0.083 (888 nulls) and samples are all whole numbers
      (1.0, 10.0, 15.0...), so it is cast to INTEGER and retained nullable.
  - name: surface_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: surface has null_rate 0.023 and 239 distinct non-exhaustive codes such as
      ASP, ASP-G, ASPH-CONC-F, so it is renamed surface_code per the operator's _code convention
      and kept as VARCHAR.
  - name: is_lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: lighted has null_rate 0.0 and distinct_values [0.0, 1.0] only, matching a
      flag for night lighting, so it is cast to BOOLEAN and renamed is_lighted per the is_
      convention.
  - name: is_closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: closed has null_rate 0.0 and distinct_values [0.0, 1.0] only, matching a
      flag for current closure, so it is cast to BOOLEAN and renamed is_closed.
  - name: low_end_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: le_ident has null_rate 0.001 (11 nulls) with designator samples like 00,
      01C, 01R, and is renamed low_end_ident to spell out the le_ (low end) abbreviation per
      operator convention.
  - name: low_end_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_latitude_deg has null_rate 0.221 (2377 nulls) with fractional decimal-degree
      samples (-62.187801 to 82.5128), so it stays DECIMAL/number and is renamed to spell
      out le_ as low_end_.
  - name: low_end_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_longitude_deg has null_rate 0.221 with fractional decimal-degree samples
      (-179.881256 to 179.338837), so it stays DECIMAL/number and is renamed low_end_longitude_deg.
  - name: low_end_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_elevation_ft has null_rate 0.276 (2973 nulls) and all samples are whole
      numbers (-1246.0, -184.0, -127.0...), so it is cast to INTEGER and renamed low_end_elevation_ft.
  - name: low_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_heading_degt has null_rate 0.228 (2457 nulls) and samples include fractional
      values (0.2, 0.4, 0.7, 1.12), so it stays DECIMAL/number and is renamed to spell out
      degt as degrees.
  - name: low_end_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_displaced_threshold_ft has a very high null_rate of 0.884 (9514 nulls)
      and all samples are whole numbers (1.0, 2.0, 10.0...), so it is cast to INTEGER, renamed
      low_end_displaced_threshold_ft, and retained sparsely populated since most runway ends
      have no displaced threshold.
  - name: high_end_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: he_ident has null_rate 0.005 (53 nulls) with designator samples like 00,
      01L, 04R, and is renamed high_end_ident to spell out the he_ (high end) abbreviation.
  - name: high_end_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_latitude_deg has null_rate 0.222 (2391 nulls) with fractional decimal-degree
      samples, so it stays DECIMAL/number and is renamed high_end_latitude_deg.
  - name: high_end_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_longitude_deg has null_rate 0.222 with fractional decimal-degree samples,
      so it stays DECIMAL/number and is renamed high_end_longitude_deg.
  - name: high_end_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_elevation_ft has null_rate 0.276 (2972 nulls) and all samples are whole
      numbers (-1210.0, -181.0, -135.0...), so it is cast to INTEGER and renamed high_end_elevation_ft.
  - name: high_end_heading_degrees
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_heading_degt has null_rate 0.227 (2444 nulls) with fractional samples
      (0.1, 0.2, 0.3...), so it stays DECIMAL/number and is renamed to spell out degt as degrees.
  - name: high_end_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_displaced_threshold_ft has a very high null_rate of 0.900 (9683 nulls)
      and all samples are whole numbers (10.0, 30.0, 33.0...), so it is cast to INTEGER, renamed
      high_end_displaced_threshold_ft, and retained sparsely populated.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (runway_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT runway_id
        FROM silver.silver_runways
        GROUP BY runway_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
