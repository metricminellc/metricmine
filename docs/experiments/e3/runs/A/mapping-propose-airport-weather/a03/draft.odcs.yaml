# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_observations fact category, naming its grain, time column,
    and field roles for the deterministic modeling engine that generates the gold models from
    this contract.
  usage: The rendered mapping contract is validated against the frozen mapping-contract schema,
    gated by a validator and datacontract lint, reviewed and edited by a human, and only then
    consumed by the modeling engine to emit the gold fact and its dimensions; it is never
    executed directly.
  limitations: The mapping does not filter, transform, or derive any column beyond the (airport_code,
    observed_hour_utc) identity used for the grain; it leaves to downstream consumers any
    decision about handling the high null rate on wind_gust_mph (0.745505), the moderate null
    rate on pressure_mb (0.114953), or how to treat missing wind_dir_degrees and wind_speed_mph
    readings, and it does not assess the completeness of the underlying airports/runways join
    beyond what the table's own contract declares.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row represents a single hourly weather observation recorded at one of the
    three New York City airports (EWR, JFK, LGA), carrying the weather measurements for that
    airport-hour alongside static airport attributes from the OurAirports join.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: weather_observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter airport code (distinct_values EWR, JFK, LGA; null_rate 0.0)
      identifying which of the three NYC airports the observation was recorded at.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The UTC timestamp of the hourly observation (min 2013-01-01T06:00:00, max
      2013-07-01T03:00:00, null_rate 0.0); samples land exactly on the hour, so this is the
      event-time column at hour grain.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The local calendar date of the observation (distinct_count 181, range 2013-01-01
      to 2013-06-30, null_rate 0.0), a date dimension derived alongside the UTC timestamp.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The local hour-of-day of the observation (range 0 to 23, distinct_count 24,
      null_rate 0.0); this labels the time of day rather than measuring a quantity, so it
      is a dimension.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit per operator context (range 10.94 to
      93.92, distinct_count 130, null_rate 0.0), a numeric measurement compared and averaged
      across observations.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in degrees Fahrenheit (range -9.94 to 73.94, distinct_count
      119, null_rate 0.0), a numeric weather measurement.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage (range 12.74 to 100.0, distinct_count 2178,
      null_rate 0.0), a continuous numeric measure of atmospheric moisture.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (range 0 to 360, distinct_count 37, null_rate
      0.016828); nullable because the profile shows 219 missing readings, likely calm-wind
      periods, and the value labels a bearing rather than something summed or averaged.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour per operator context (range 0.0 to 1048.36058,
      distinct_count 36, null_rate 0.000154); nullable per the two missing readings in the
      profile, a numeric measure of wind intensity.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour (range 16.11092 to 62.14212, distinct_count
      35, null_rate 0.745505); heavily nullable because gusts are only recorded when they
      occur, a numeric measure when present.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches (range 0.0 to 1.06, distinct_count 50, null_rate
      0.0), a numeric accumulation measure for the observation hour.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars (range 983.8 to 1038.4, distinct_count 430,
      null_rate 0.114953); nullable because the profile shows roughly 11.5% of readings missing,
      a numeric measure of atmospheric pressure.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles (distinct_values span 0.0 to 10.0, distinct_count
      20, null_rate 0.0), a numeric measure of observed visual range.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The full airport name joined from OurAirports per operator context (distinct_values
      John F. Kennedy International Airport, LaGuardia Airport, Newark Liberty International
      Airport; null_rate 0.0), a descriptive dimension of the airport.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The municipality of the airport (distinct_values New York, Newark; null_rate
      0.0), a geographic dimension from the airports join.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's elevation in feet (distinct_values 13, 18, 21; null_rate 0.0);
      a fixed attribute of the airport rather than an observation measurement, so it is a
      dimension.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's longest runway length in feet (distinct_values 7002, 11000,
      14511; null_rate 0.0); a static airport attribute from the OurAirports join, treated
      as a labeling dimension rather than a per-observation measure.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: A pipeline capture timestamp with only three distinct values clustered within
      seconds (2026-09-02T23:26:11 to :13, null_rate 0.0), indicating a batch load time rather
      than the business event time, so it is mapped as a dimension and not as the time field.
