# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:26:33.006340+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_observations fact category, naming its time column,
    grain, and field roles for the deterministic modeling engine that consumes mapping contracts
    to emit gold models.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema and datacontract lint, and reviewed and edited by a human
    before approval; only the approved contract drives the modeling engine.
  limitations: 'The mapping does not filter or correct any rows: nullable fields such as wind_gust_mph
    (null_rate 0.745505), pressure_mb (null_rate 0.114953), and wind_dir_degrees (null_rate
    0.016828) are passed through as nullable measures, and any decision to exclude or impute
    missing weather readings is left to downstream consumers; the airport join''s completeness
    is asserted by the operator context, not independently verified here.'
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row represents a single hourly weather observation recorded at one of the
    three NYC airports (EWR, JFK, LGA), joined to that airport's static OurAirports attributes,
    as named and typed by the silver contract.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: airport_hour_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter NYC airport code (EWR, JFK, LGA per distinct_values) that
      identifies which station recorded the observation; null_rate is 0.0.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The UTC timestamp of the hourly observation, sampled on exact hour boundaries
      (e.g. 2013-01-01T06:00:00) from 2013-01-01 to 2013-07-01, with null_rate 0.0; this is
      the event clock for the category.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The local calendar date of the observation (min 2013-01-01, max 2013-06-30,
      distinct_count 181), carried as-is alongside the UTC timestamp; null_rate is 0.0.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The local hour of day (0-23, distinct_count 24) labeling when the observation
      occurred in local time; a label, not a quantity to sum, with null_rate 0.0.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit (operator context), ranging 10.94 to
      93.92 across 130 distinct values, a continuous measurement with null_rate 0.0.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in degrees Fahrenheit, ranging -9.94 to 73.94 across
      119 distinct values, a continuous measurement with null_rate 0.0.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage, ranging 12.74 to 100.0 across 2178 distinct
      values, a continuous measurement with null_rate 0.0.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Wind direction in compass degrees (0 to 360, 37 distinct values); nullable
      with null_rate 0.016828, likely reflecting calm-wind observations where direction is
      undefined.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour, ranging 0.0 to 1048.36058 across 36 distinct
      values; nullable with a very low null_rate of 0.000154.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour (16.11092 to 62.14212, 35 distinct values);
      mostly absent with null_rate 0.745505, consistent with gusts only being recorded when
      conditions are gusty.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches, ranging 0.0 to 1.06 across 50 distinct values, a
      continuous measurement with null_rate 0.0.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars, ranging 983.8 to 1038.4 across 430 distinct
      values; nullable with null_rate 0.114953, likely from sensor gaps at some stations/hours.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles, a capped set of 20 distinct values from 0.0 to 10.0,
      a continuous measurement with null_rate 0.0.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The full airport name from the OurAirports join (John F. Kennedy International
      Airport, LaGuardia Airport, Newark Liberty International Airport), a stable per-airport
      label with null_rate 0.0.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The municipality of the airport (New York or Newark per distinct_values),
      a stable per-airport label with null_rate 0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's elevation in feet (13, 18, or 21 across 3 distinct values),
      a fixed attribute of the airport rather than a measured quantity, with null_rate 0.0.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's longest runway length in feet (7002, 11000, or 14511 across
      3 distinct values), a fixed attribute of the airport, with null_rate 0.0.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: A capture/ingestion timestamp clustered within seconds on 2026-09-02 (3 distinct
      values), distinct from the observation's own event time and so carried as a dimension,
      with null_rate 0.0.
servers:
