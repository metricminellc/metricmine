# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:29:38.973725+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_observations fact category, for consumption by the deterministic
    modeling engine that generates the gold models.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema and datacontract lint, and reviewed by a human before approval;
    only after approval does the modeling engine consume it to emit gold models.
  limitations: The mapping does not filter, deduplicate, or otherwise alter rows beyond declaring
    the (airport_code, observed_hour_utc) identity; columns with substantial nullability such
    as wind_gust_mph (null_rate 0.745505) and pressure_mb (null_rate 0.114953) are passed
    through as nullable measures, and any decision to exclude or impute missing weather readings
    is left to downstream consumers.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row represents one hourly weather observation recorded at one of the three
    NYC airports (EWR, JFK, LGA), joined with static OurAirports attributes for that airport,
    as declared complete per the operator context.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The 3-letter NYC airport code (EWR, JFK, LGA per distinct_values) identifying
      which airport the observation belongs to, with null_rate 0.0.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The UTC timestamp of the hourly weather observation, sampled at exact hour
      boundaries (e.g. 2013-01-01T06:00:00) with null_rate 0.0, chosen as the event time column.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The local calendar date of the observation (samples 2013-01-01 through 2013-01-10,
      distinct_count 181), a dimension derived separately from the UTC time field, with null_rate
      0.0.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The local hour-of-day (0-23, distinct_count 24) of the observation, a labeling
      dimension rather than a summed quantity, with null_rate 0.0.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit (samples range 10.94 to 93.92 per operator
      context units), a continuous measured quantity with null_rate 0.0.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in degrees Fahrenheit (samples from -9.94 to 73.94),
      a measured quantity with null_rate 0.0.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage (samples 12.74 to 100.0, distinct_count 2178),
      a continuous measured quantity with null_rate 0.0.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Wind direction in degrees (samples 0 to 360), a measured physical quantity;
      nullable with null_rate 0.016828, likely for calm-wind readings.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour (samples 0.0 to 1048.36058 per operator context
      units), a measured quantity; nullable with null_rate 0.000154.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour (samples 16.11092 to 62.14212), a measured
      quantity; nullable with high null_rate 0.745505 since gusts are not always recorded.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches (samples 0.0 to 1.06), a measured quantity with null_rate
      0.0.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars (samples 983.8 to 1038.4), a measured quantity;
      nullable with null_rate 0.114953.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles (distinct_values 0.0 through 10.0, distinct_count 20),
      a measured quantity with null_rate 0.0.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport per distinct_values), a labeling dimension with
      null_rate 0.0.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality of the airport (New York, Newark per distinct_values), a labeling
      dimension with null_rate 0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (distinct_values 13, 18, 21), a static attribute
      of the airport rather than a summed measure, with null_rate 0.0.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet at the airport (distinct_values 7002, 11000,
      14511), a static attribute dimension with null_rate 0.0.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Timestamp recording when the row was captured into the pipeline (samples
      2026-09-02T23:26:11 to :13), a load-time attribute distinct from the observed event
      time, with null_rate 0.0.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
