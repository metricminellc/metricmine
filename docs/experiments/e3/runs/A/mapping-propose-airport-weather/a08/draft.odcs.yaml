# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:27:50.208456+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_airport_weather table enters the gold
    unified event star as the airport_weather_observations fact category, naming the time
    column, grain, and field roles for the deterministic modeling engine that renders the
    gold models.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema and gated by datacontract lint, then reviewed and edited
    by a human before approval; only the approved contract drives the modeling engine.
  limitations: The mapping does not filter, deduplicate, or reconcile rows (duplicate_row_rate
    is 0.0 across 13014 rows so none exist to resolve), does not explain why wind_gust_mph
    is null 74.55% of the time or why wind_dir_degrees, wind_speed_mph, and pressure_mb carry
    smaller null rates beyond what the profile shows, and leaves any downstream null-handling
    or quality rules for those columns to consumers.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row represents a single hourly weather observation at one of the three
    NYC airports (EWR, JFK, LGA), combining the nycflights13 hourly readings with the airport's
    static OurAirports name, municipality, elevation, and runway attributes.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: airport_hour_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter code identifying the NYC airport (EWR, JFK, LGA) where the observation
      was taken; distinct_count 3, null_rate 0.0.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the hourly weather observation (e.g. 2013-01-01T06:00:00),
      distinct_count 4341, null_rate 0.0; samples resolve to the top of each hour so the finest
      grain is hour.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (e.g. 2013-01-01), distinct_count
      181 spanning the six-month window, null_rate 0.0.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day (0-23) of the observation, distinct_count 24, null_rate
      0.0; labels the hour rather than measuring a quantity.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit ranging 10.94 to 93.92 per operator
      context units, null_rate 0.0, an additive/aggregable quantity.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dew point temperature in degrees Fahrenheit ranging -9.94 to 73.94, null_rate
      0.0.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percent ranging 12.74 to 100.0, null_rate 0.0, distinct_count
      2178 indicating fine-grained measurement.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (0-360), null_rate 0.016828 (219 nulls)
      presumably when wind was calm or unmeasured; a directional label rather than an additive
      measure.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in mph ranging 0.0 to 1048.36058, null_rate 0.000154 (2 nulls).
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in mph ranging 16.11092 to 62.14212, null_rate 0.745505 (9702
      nulls) since gusts appear only to be recorded when they occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches ranging 0.0 to 1.06, null_rate 0.0, aggregable across
      observations.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars ranging 983.8 to 1038.4, null_rate 0.114953
      (1496 nulls) when the station did not report pressure.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles ranging 0.0 to 10.0 with distinct_count 20 (listed under
      the profiler's distinct-value cap), null_rate 0.0.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (e.g. John F. Kennedy International Airport), distinct_count
      3, null_rate 0.0, joined from OurAirports per operator context with declared-complete
      join coverage.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality of the airport (New York or Newark), distinct_count 2, null_rate
      0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (13, 18, or 21), distinct_count 3, null_rate 0.0;
      a static per-airport attribute, not a per-observation measure.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet for the airport (7002, 11000, or 14511), distinct_count
      3, null_rate 0.0; a static per-airport attribute.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Pipeline capture timestamp (e.g. 2026-09-02T23:26:11) with only 3 distinct
      values across 13014 rows and null_rate 0.0; reflects ingestion batching rather than
      the weather event time.
servers:
