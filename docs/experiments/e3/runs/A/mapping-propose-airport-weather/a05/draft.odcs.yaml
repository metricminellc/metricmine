# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:25:52.474839+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_observations fact category, naming its time column,
    grain, and field roles for the deterministic modeling engine that renders the gold models;
    it is consumed by that engine and reviewed by a human before approval.
  usage: The rendered mapping contract is validated against the frozen mapping-contract schema,
    linted by datacontract lint, and reviewed by a human editor before being accepted as input
    to the modeling engine; it is never executed directly and never represents a physical
    table.
  limitations: The mapping does not address the high null_rate (0.745505) on wind_gust_mph,
    the null_rate (0.114953) on pressure_mb, or the null_rate (0.016828) on wind_dir_degrees;
    filtering, imputing, or otherwise treating these nulls is left to downstream consumers.
    The near-but-not-exact match between airport_code x observed_hour_utc cardinality and
    row_count suggests a small number of missing airport-hour combinations, which this mapping
    does not backfill or interpolate, since duplicate_row_rate is 0.0 and no exact duplicates
    require resolution.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row represents one hourly weather observation recorded at one of the three
    NYC airports (JFK, LGA, EWR), combining the nycflights13 hourly weather reading with its
    OurAirports reference attributes, as described in the operator context.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: airport_hour_observation_id
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter NYC airport code (distinct_values EWR, JFK, LGA; null_rate
      0.0) that identifies which airport the hourly observation belongs to.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The UTC timestamp of the hourly observation (samples such as 2013-01-01T06:00:00,
      always on the hour; null_rate 0.0), the event time for this fact.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The local calendar date of the observation (samples 2013-01-01 through 2013-01-10;
      null_rate 0.0), kept as a labeling attribute alongside the UTC timestamp.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The local hour-of-day of the observation (min 0, max 23, distinct_count 24;
      null_rate 0.0), a categorical label rather than a quantity to aggregate.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit per the operator context, ranging from
      10.94 to 93.92 with null_rate 0.0, a numeric quantity compared and averaged across observations.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in degrees Fahrenheit, ranging from -9.94 to 73.94 with
      null_rate 0.0, a measured atmospheric quantity.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage, ranging from 12.74 to 100.0 with null_rate
      0.0 and high cardinality (distinct_count 2178), a measured quantity.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (0 to 360, samples 0,10,20...90) per the
      operator context; nullable at null_rate 0.016828, likely calm-wind readings, and treated
      as a directional label rather than an additive measure.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour (min 0.0, max 1048.36058) per the operator context;
      nullable at a low null_rate of 0.000154.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour (min 16.11092, max 62.14212); nullable
      with a high null_rate of 0.745505, reflecting that gusts are only recorded when they
      occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches per the operator context, ranging 0.0 to 1.06 with
      null_rate 0.0, a summable measured quantity.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars per the operator context, ranging 983.8
      to 1038.4; nullable at null_rate 0.114953.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles per the operator context, with distinct_values
      ranging from 0.0 to 10.0 and null_rate 0.0, a measured quantity.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport) joined from OurAirports per the operator context;
      null_rate 0.0.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The municipality of the airport (New York or Newark), a reference attribute
      with null_rate 0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's elevation in feet (distinct_values 13, 18, 21), a static reference
      attribute rather than an event measure; null_rate 0.0.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's longest runway length in feet (distinct_values 7002, 11000,
      14511), a static reference attribute; null_rate 0.0.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: The pipeline's capture timestamp for the row (samples around 2026-09-02T23:26:11-13),
      distinct from the observation's own event time and so not the time field; null_rate
      0.0.
