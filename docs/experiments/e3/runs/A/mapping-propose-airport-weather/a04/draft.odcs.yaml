# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:24:57.952315+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_observations fact category, naming its time column,
    grain, and field roles for the deterministic modeling engine that renders the gold models
    from this contract.
  usage: The modeling engine consumes this contract to generate the gold fact and its dimensions;
    the proposal is rendered to an ODCS mapping contract, validated against the frozen mapping-contract
    schema and datacontract lint, and reviewed by a human before approval.
  limitations: This mapping does not filter or exclude any rows, including the 74.55% of rows
    with null wind_gust_mph or the 11.50% with null pressure_mb; it leaves any decision to
    exclude or impute those nulls, or to treat wind_dir_degrees circularly in downstream analytics,
    to consumers of the gold fact.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row represents a single hourly weather observation at one of the three
    NYC airports (EWR, JFK, LGA), combining the nycflights13 hourly weather reading with the
    joined OurAirports airport attributes, identified by the derived airport_hour_identity
    over airport_code and observed_hour_utc.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: airport_hour_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter code identifying the observing airport (EWR, JFK, LGA per distinct_values),
      non-null across all 13014 rows.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the hourly weather observation, sampled always at :00 minutes
      (e.g. 2013-01-01T06:00:00) across 4341 distinct hours, serving as the event time for
      this fact.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (min 2013-01-01, max 2013-06-30, 181
      distinct dates), always non-null and derived from the same observation as observed_hour_utc.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day of the observation, ranging 0-23 across 24 distinct values,
      always non-null.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit per operator context, ranging 10.94
      to 93.92 across 130 distinct values, aggregatable across observations.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in degrees Fahrenheit, ranging -9.94 to 73.94 across
      119 distinct values, always populated.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage, ranging 12.74 to 100.0 across 2178 distinct
      values, always populated.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (0-360), 1.68% null (219 of 13014 rows),
      nullable likely during calm or missing-sensor readings; treated as a labeling attribute
      of wind bearing rather than a summable measure.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour per operator context, ranging 0.0 to 1048.36
      across 36 distinct values, nullable at a 0.0154% rate (2 rows).
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour, ranging 16.11 to 62.14 across 35 distinct
      values, heavily nullable at 74.55% (9702 of 13014 rows), reported only when gusts are
      observed.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches per operator context, ranging 0.0 to 1.06 across
      50 distinct values, always populated.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Atmospheric pressure in millibars, ranging 983.8 to 1038.4 across 430 distinct
      values, nullable at 11.50% (1496 of 13014 rows).
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles, with 20 distinct enumerated values from 0.0
      to 10.0, always populated.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport), always non-null, one of 3 distinct values joined
      from OurAirports per operator context.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality hosting the airport (New York or Newark per distinct_values),
      always non-null.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet, one of 3 distinct values (13, 18, 21) constant
      per airport, a descriptive attribute rather than an observation-level measure.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet for the airport, one of 3 distinct values (7002,
      11000, 14511) constant per airport, a descriptive attribute rather than an observation-level
      measure.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Timestamp recording when this row was captured into the pipeline (3 distinct
      values clustered within seconds on 2026-09-02), always non-null and distinct from the
      observation's own event time.
servers:
