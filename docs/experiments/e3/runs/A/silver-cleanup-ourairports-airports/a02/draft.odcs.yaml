# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:37:05.320955+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airports
name: Silver airports
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_airports cleans the bronze OurAirports extract (airports carrying an IATA
    code) into a typed, deduplicated reference table of global airports for geospatial, routing,
    and lookup consumers.
  usage: Join or filter on airport_id, the declared grain; treat continent_code 'NA' and iso_country_code
    'NA' as the literal codes for North America and Namibia, never as missing data; coalesce
    or filter the nullable code columns (icao_code, gps_code, local_code) and the sparsely
    populated homepage_url, wikipedia_url, municipality, elevation_feet, and keywords columns
    as your use case requires.
  limitations: local_code (63.7% null) and homepage_url (74.9% null) are too sparse to rely
    on for most rows; keywords (68.0% null) is unstructured free text; elevation_feet (3.7%
    null) and municipality (4.0% null) are retained nullable rather than imputed; airport_type
    observed only 5 of the publisher's 7 documented values because this bronze extract is
    pre-filtered to airports carrying an IATA code, so balloonport and closed_airport records
    are absent; duplicate_row_rate was 0.0 so no row-level deduplication was needed.
schema:
- name: silver_airports
  physicalName: silver_airports
  logicalType: object
  physicalType: table
  description: silver_airports cleans the bronze OurAirports extract (airports carrying an
    IATA code) into a typed, deduplicated reference table of global airports for geospatial,
    routing, and lookup consumers.
  properties:
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 9057 equals row_count 9057 and null_rate is 0.0; sampled values
      ('10309','1058','111', etc.) are all numeric strings, supporting a cast from VARCHAR
      to INTEGER for the publisher's internal identifier.
  - name: ident_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 equals row_count with null_rate 0.0; samples like '03N','07FA','19AK'
      are alphanumeric codes matching the operator's description as the URL/ICAO identifier,
      renamed to carry the _code suffix convention.
  - name: airport_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 5 (heliport, large_airport, medium_airport, seaplane_base,
      small_airport) with null_rate 0.0; renamed for clarity since 'type' alone is ambiguous
      outside the table context.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9006 against row_count 9057 with null_rate 0.0; renamed from
      'name' for clarity as the official airport name per operator context.
  - name: latitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: min -79.777778 and max 82.517263 with null_rate 0.0; renamed to spell out
      the degrees unit suffix per naming convention and cast to a fixed-precision decimal.
  - name: longitude_degrees
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: min -179.876999 and max 179.9757 with null_rate 0.0; renamed to spell out
      the degrees unit suffix and cast to a fixed-precision decimal matching latitude.
  - name: elevation_feet
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.036988 (335 of 9057 nulls); sampled values (-1266.0,-210.0,...,-70.0)
      are all integral, supporting a cast to INTEGER and a spelled-out unit suffix; nulls
      retained since missing elevation is a legitimate unknown, not an error.
  - name: continent_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 7 (AF,AN,AS,EU,NA,OC,SA) with null_rate 0.0; renamed with
      the _code suffix. The value NA denotes North America, a valid code per operator context,
      not a missing marker.
  - name: iso_country_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 239 with null_rate 0.0; samples (AD, AE, AF, ...) are ISO
      3166-1 alpha-2 codes, renamed with the _code suffix; NA is Namibia's valid code, not
      missing.
  - name: iso_region_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 2169 with null_rate 0.0; samples (AD-08, AE-AZ, ...) are ISO
      3166-2 subdivision codes, renamed with the _code suffix.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.039748 (360 nulls) out of distinct_count 8049; samples are city
      names, retained nullable since some airports lack an associated municipality.
  - name: is_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly ['no','yes'] with null_rate 0.0, fully supporting
      a cast to BOOLEAN; renamed with the is_ prefix convention.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.136579 (1237 nulls) with distinct_count 7820; already follows
      the _code naming convention, retained nullable since not every airport has an ICAO code.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 equals row_count with null_rate 0.0, confirming every
      row in this IATA-filtered extract carries a code; kept as-is.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.053881 (488 nulls) with distinct_count 8569; retained nullable
      as not every airport has a GPS code.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.636635 (5766 nulls), the highest among code columns, with distinct_count
      3193; retained nullable and flagged as sparsely populated.
  - name: homepage_url
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.749034 (6784 nulls) with distinct_count 2272; samples are full
      URLs (e.g. http://GillespieField.com/), renamed with the _url suffix; extremely sparse
      so retained nullable.
  - name: wikipedia_url
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.130838 (1185 nulls) with distinct_count 7870; samples are Wikipedia
      URLs, renamed with the _url suffix.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.679585 (6155 nulls) with distinct_count 2883; samples show comma-separated
      free-text search phrases, retained nullable since the column is sparse and unstructured.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (airport_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT airport_id
        FROM silver.silver_airports
        GROUP BY airport_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
