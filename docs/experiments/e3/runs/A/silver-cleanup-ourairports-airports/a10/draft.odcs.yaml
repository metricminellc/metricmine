# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:47:55.810855+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airports
name: Silver airports
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_airports provides one cleaned row per OurAirports airport record (this extract
    limited to airports carrying an IATA code), feeding downstream airport-reference joins
    for routes, weather, and geospatial analytics.
  usage: Join on id (the unique grain key), or on iata_code/icao_code/gps_code/local_code
    as alternate lookup keys; treat continent_code and iso_country_code value "NA" as the
    valid North America / Namibia codes rather than a missing marker; filter or coalesce nullable
    columns (elevation_ft, municipality, icao_code, gps_code, local_code, home_link, wikipedia_link,
    keywords) deliberately since nulls are retained rather than imputed.
  limitations: local_code (63.66% null), home_link (74.90% null), and keywords (67.96% null)
    remain sparsely populated and were not backfilled; icao_code (13.66% null) and gps_code
    (5.39% null) are not available for every airport; duplicate_row_rate is 0.0 so no dedupe
    logic was applied, and lat/long precision was reduced from the landed DECIMAL(38,9) based
    on observed sample precision rather than a documented spec.
schema:
- name: silver_airports
  physicalName: silver_airports
  logicalType: object
  physicalType: table
  description: silver_airports provides one cleaned row per OurAirports airport record (this
    extract limited to airports carrying an IATA code), feeding downstream airport-reference
    joins for routes, weather, and geospatial analytics.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Every sampled value is a purely numeric string (e.g. "10309", "111") and
      distinct_count 9057 equals row_count 9057 with null_rate 0.0, confirming id is the publisher's
      internal integer identifier and supports a safe INTEGER cast and use as the table's
      grain key.
  - name: ident_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: ident is the publisher's URL identifier (the ICAO code where one exists);
      distinct_count 9057 equals row_count with null_rate 0.0, so it is renamed to ident_code
      to follow the `_code` naming convention while remaining VARCHAR text (samples include
      "03N", "07FA").
  - name: airport_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: type carries exactly 5 distinct values (heliport, large_airport, medium_airport,
      seaplane_base, small_airport) with null_rate 0.0; renamed to airport_type for business
      clarity, kept as VARCHAR categorical text.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: name has 9006 distinct values out of 9057 rows and null_rate 0.0 (e.g. "28
      de Noviembre Airport"), so it is kept as the required official airport name.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: latitude_deg samples show six decimal places (e.g. -79.777778) within range
      -79.777778 to 82.517263 and null_rate 0.0, so it is cast from the oversized DECIMAL(38,9)
      to DECIMAL(9,6) to match the observed precision.
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(10,6)
    required: true
    description: longitude_deg samples show six decimal places within range -179.876999 to
      179.9757 and null_rate 0.0, so it is cast from the oversized DECIMAL(38,9) to DECIMAL(10,6)
      to fit the wider integer-degree range.
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: elevation_ft samples are all whole-number values (e.g. -1266.0, -210.0) ranging
      -1266 to 14472 with null_rate 0.036988 (335 nulls), so it is cast to INTEGER and retained
      nullable rather than imputed.
  - name: continent_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: continent has exactly 7 distinct two-letter values (AF, AN, AS, EU, NA, OC,
      SA) with null_rate 0.0; renamed to continent_code for the `_code` convention, noting
      per operator context that NA is the valid North America code, not a missing marker.
  - name: iso_country_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: iso_country has 239 distinct ISO 3166-1 alpha-2 values (e.g. AD, AE, AF)
      with null_rate 0.0; renamed to iso_country_code to add the `_code` suffix, noting NA
      is Namibia's valid code, not a missing marker.
  - name: iso_region_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: iso_region has 2169 distinct ISO 3166-2 values (e.g. AD-08, AE-AZ) with null_rate
      0.0; renamed to iso_region_code to add the `_code` suffix per convention.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: municipality has 8049 distinct values with null_rate 0.039748 (360 nulls,
      e.g. "108 Mile", "Aachen"), so it is kept nullable rather than imputed.
  - name: is_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: scheduled_service carries exactly the two distinct values "no" and "yes"
      with null_rate 0.0, so it is renamed to is_scheduled_service and cast from VARCHAR to
      BOOLEAN per the `is_` boolean convention.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: icao_code has 7820 distinct values with null_rate 0.136579 (1237 nulls, e.g.
      AGAF, AGAR), so it is kept nullable since not every airport has an ICAO code.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: iata_code has distinct_count 9057 equal to row_count with null_rate 0.0,
      consistent with this dataset being filtered to airports carrying an IATA code; kept
      as required VARCHAR.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: gps_code has 8569 distinct values with null_rate 0.053881 (488 nulls, e.g.
      03N, 05AA), so it is kept nullable.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: local_code has 3193 distinct values but null_rate 0.636635 (5766 nulls),
      so it is kept but noted as sparsely populated rather than dropped or imputed.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: home_link has 2272 distinct URL values but null_rate 0.749034 (6784 nulls,
      e.g. "http://GillespieField.com/"), so it is kept but noted as sparsely populated.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: wikipedia_link has 7870 distinct URL values with null_rate 0.130838 (1185
      nulls), so it is kept nullable.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: keywords has 2883 distinct comma-separated phrase values but null_rate 0.679585
      (6155 nulls), so it is kept but noted as sparsely populated; no truncation markers were
      observed in the sampled values.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
