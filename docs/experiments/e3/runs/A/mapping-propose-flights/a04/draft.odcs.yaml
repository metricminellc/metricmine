# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:11:08.050569+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flights_mapping
name: Gold mapping, flights category
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how silver.silver_flights enters the gold unified event star
    as the flights transaction-grain fact category, naming the event time column, the derived
    degenerate identity, and every field's role so the deterministic modeling engine can emit
    the gold fact and its dimensions.
  usage: The mapping is rendered into an ODCS mapping contract, validated against the frozen
    mapping-contract schema and datacontract lint, and reviewed by a human before the modeling
    engine emits any gold model from it; no transformation beyond the declared flight_identity
    tuple runs ahead of that gate.
  limitations: The mapping does not resolve the 2.9%-3.3% null rates on actual departure/arrival
    times and delay/airtime measures, which the source's own contract attributes to flights
    that never departed; it does not resolve the 16.0%-17.7% null rates on aircraft registry
    fields or the 2.089% null rate on destination-airport attributes, both reflecting join
    coverage below completeness per the operator context. Consumers decide how to treat cancelled
    flights (is_cancelled) or rows with incomplete joins; this mapping proposes no filtering,
    derivation, or quality rule beyond the single transaction identity.
schema:
- name: flights
  logicalType: object
  physicalType: mapping
  description: One row represents a single scheduled commercial flight departing from a New
    York-area airport (EWR, JFK, or LGA) between January and June 2013, carrying its scheduled
    and, when available, actual departure and arrival times, delay and airborne-duration measures,
    aircraft registry attributes, and origin/destination airport characteristics as joined
    in the silver layer.
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - sched_dep_hhmm
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Calendar date the flight operated, ranging 2013-01-01 to 2013-06-30 across
      181 distinct dates with no nulls; a coarser calendar label than the hour-grain time
      column.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter operating-carrier code (16 distinct values such as AA, DL, UA)
      with no nulls, identifying the airline that operated the flight.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Numeric flight number ranging 1-8500 across 2994 distinct values with no
      nulls; it labels a specific flight rather than measuring anything.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter NYC-area origin airport code (EWR, JFK, or LGA) with no nulls,
      naming the departure airport.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure clock time encoded as HHMM, ranging 500-2359 across 969
      distinct values with no nulls; a time-of-day label.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter destination airport code across 100 distinct values (e.g. ABQ,
      ACK, ALB) with no nulls.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft tail-number registration (3825 distinct values, e.g. N0EGMQ) with
      a 0.9154% null rate; nullable when the operating aircraft could not be matched to a
      registration.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag with no nulls indicating whether the scheduled flight was cancelled.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure time encoded as HHMM (1-2400) with a 2.9388% null rate;
      per the operator context a flight that never departed keeps no actual time, so it is
      null for those flights.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes, -33 to 1301 with negative meaning early, carrying
      the same 2.9388% null rate as dep_hhmm for flights that never departed; a measure compared
      and aggregated across flights.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival time encoded as HHMM (1-2400) with a 3.07% null rate for flights
      lacking a recorded actual arrival.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival clock time encoded as HHMM, 1-2359 across 1134 distinct
      values, with no nulls.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes, -86 to 1272, with a 3.2981% null rate for flights
      without an actual arrival; a measure summed/averaged across flights.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Elapsed airborne time in minutes, 20-695, with a 3.2981% null rate matching
      arr_delay_minutes; a measure of flight duration.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance flown in miles, 80-4983, with no nulls; a measure aggregated
      across flights.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure hour in local time, 5-23 across 19 distinct values, with
      no nulls; a label component of the scheduled departure time.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure minute in local time, 0-59, with no nulls; a label component
      of the scheduled departure time.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Scheduled departure instant in UTC, truncated to the hour as samples land
      exactly on :00:00 from 2013-01-01T10:00:00 to 2013-07-01T03:00:00 across 3439 distinct
      values, with no nulls; the event timestamp for this fact at hour grain.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full operating-carrier legal name (16 distinct values, e.g. Delta Air Lines
      Inc.) with no nulls, from the complete carrier lookup per the operator context.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft manufacturer name (34 distinct values, e.g. BOEING, AIRBUS) with
      a 16.0426% null rate reflecting the aircraft registry join's coverage floor noted in
      the operator context.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model designation (121 distinct values, e.g. 172E) with a 16.0426%
      null rate matching aircraft_manufacturer's registry-join gaps.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the aircraft was manufactured, 1956-2013, with a 17.6531% null rate
      from incomplete registry matches; a numeric label, not a measure.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Aircraft seat capacity, 2-450, with a 16.0426% null rate from incomplete
      registry matches; a measure of capacity that can be summed or averaged across flights.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft engine type (6 distinct values, e.g. Turbo-fan, Turbo-jet) with
      a 16.0426% null rate from incomplete registry matches.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: 'Full origin airport name (3 distinct values: JFK, LaGuardia, Newark Liberty)
      with no nulls, complete per the operator context.'
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport's municipality (New York or Newark, 2 distinct values) with
      no nulls.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport elevation in feet (13, 18, or 21; 3 distinct values) with
      no nulls; a label of the origin airport, not a per-flight measure.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport's longest runway length in feet (7002, 11000, or 14511) with
      no nulls; a label of the origin airport.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full destination airport name (99 distinct values) with a 2.089% null rate
      matching the destination-airport join gaps noted in the operator context.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination airport's municipality (95 distinct values, e.g. Aguadilla, Akron)
      with a 2.089% null rate matching dest_airport_name's join gaps.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: ISO region code of the destination airport (45 distinct values, e.g. US-AL,
      PR-U-A) with a 2.089% null rate matching the destination-airport join gaps.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport elevation in feet, 3-6606, with a 2.089% null rate matching
      the destination-airport join gaps; a label of the destination airport.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport's longest runway length in feet, 5076-16000, with a 2.089%
      null rate matching the destination-airport join gaps.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Pipeline ingestion timestamp clustered at 2026-09-02T23:25:51 through 23:26:06
      across 16 distinct values with no nulls; a technical capture time, not the business
      event time.
