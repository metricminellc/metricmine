# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:21:03.080383+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flight_segments_mapping
name: Gold mapping, flight_segments category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_flights table enters the gold unified
    event star as the flight_segments fact category, including its grain, time column, and
    field roles, for the deterministic modeling engine that renders the gold models.
  usage: The modeling engine consumes this contract to materialize the flight_segments fact
    at transaction grain; the proposal is gated by the mapping-contract schema, datacontract
    lint, and human review before any gold object is generated.
  limitations: This mapping does not filter or exclude cancelled flights (is_cancelled) or
    flights lacking actual departure/arrival data (dep_hhmm, arr_hhmm, dep_delay_minutes,
    arr_delay_minutes, air_time_minutes each null at roughly 3%); it also does not resolve
    the aircraft and destination join gaps (null_rate 0.160426 and 0.02089 respectively) noted
    in the operator context as above their declared completeness floors, leaving any exclusion
    or imputation to downstream consumers.
schema:
- name: flight_segments
  logicalType: object
  physicalType: mapping
  description: One row represents a single scheduled flight departing from a NYC airport (EWR,
    JFK, or LGA) on a given date, enriched with carrier, aircraft, and origin/destination
    airport attributes.
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The calendar date of the scheduled flight, ranging 2013-01-01 to 2013-06-30
      in the samples, with null_rate 0.0 making it always populated as the flight's reference
      day.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The two-letter carrier code (e.g. AA, DL, UA) joined from the carrier lookup;
      null_rate 0.0 matches the operator context's claim of carrier completeness.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airline-assigned flight number (1 to 8500, 2994 distinct values), an
      identifier that labels rather than measures a flight so it is treated as a dimension.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter NYC origin airport code (EWR, JFK, LGA per distinct_values),
      always populated (null_rate 0.0) consistent with the operator context's origin completeness
      claim.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The scheduled departure time encoded as an integer in HHMM form (500 to 2359
      in samples), a dimension labeling the planned clock time rather than a summable measure.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter destination airport code (100 distinct values, e.g. ABQ,
      ACK, ALB), always populated (null_rate 0.0).
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The aircraft registration tail number (3825 distinct values, e.g. N0EGMQ);
      null_rate 0.009154 means roughly 0.9% of flights lack a recorded tail number.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: A boolean flag (true/false) indicating the flight was cancelled; null_rate
      0.0 so every row declares this status.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: The actual departure time in HHMM form (1 to 2400 in samples); null_rate
      0.029388 reflects, per operator context, that a flight which never departed keeps no
      actual departure time.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Minutes of departure delay, negative when early (-33 to 1301 in samples);
      null_rate 0.029388 mirrors the missing actual-departure cases, and the value is summed
      or averaged across flights as a measure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: The actual arrival time in HHMM form (1 to 2400 in samples); null_rate 0.0307,
      consistent with flights that never completed having no actual arrival time.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The scheduled arrival time in HHMM form (1 to 2359 in samples); null_rate
      0.0 so every flight carries a planned arrival time.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Minutes of arrival delay, negative when early (-86 to 1272 in samples); null_rate
      0.032981 for flights lacking an actual arrival, and it is aggregated across flights
      as a measure.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Minutes the aircraft was airborne (20 to 695 in samples); null_rate 0.032981
      for flights without actual arrival/departure data, used as a summable or averageable
      measure.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance flown in miles (80 to 4983 in samples); null_rate 0.0,
      a measure summed or averaged across flights.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The scheduled departure hour in local time (5 to 23, 19 distinct values),
      a dimension labeling the hour bucket rather than a measure.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The scheduled departure minute in local time (0 to 59), a dimension labeling
      the minute-of-hour.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The scheduled departure instant normalized to UTC and truncated to the hour
      (samples step hourly from 2013-01-01T10:00:00), the timestamp by which flight events
      are grained; null_rate 0.0 so every row has this event time.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The carrier's full legal name joined from the carrier lookup (e.g. Delta
      Air Lines Inc., 16 distinct values); null_rate 0.0 matches the operator context's carrier
      completeness.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The aircraft manufacturer joined from the aircraft registry (e.g. BOEING,
      AIRBUS); null_rate 0.160426 reflects the registry's documented completeness floor per
      operator context.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The aircraft model joined from the aircraft registry (e.g. 172M, 421C); null_rate
      0.160426 matches the registry join's coverage.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: The aircraft's year of manufacture (1956 to 2013 in samples); null_rate 0.176531
      for aircraft not matched in the registry, a dimension labeling vintage rather than a
      summable quantity.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: The aircraft's seating capacity (2 to 450 in samples); null_rate 0.160426
      mirrors the registry join gap, and as a quantity it is treated as a measure that can
      be summed or averaged across flights.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The aircraft engine type (e.g. Turbo-fan, Turbo-jet, 6 distinct values) joined
      from the registry; null_rate 0.160426 matches the registry coverage.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: 'The full name of the NYC origin airport (3 distinct values: JFK, LaGuardia,
      Newark); null_rate 0.0 consistent with origin completeness.'
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The municipality of the origin airport (New York or Newark); null_rate 0.0.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The origin airport's elevation in feet (13, 18, or 21 across the 3 origin
      airports); null_rate 0.0, a fixed airport attribute rather than a measure to aggregate
      per flight.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The origin airport's longest runway length in feet (7002 to 14511 across
      the 3 origins); null_rate 0.0, a fixed airport attribute.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The full name of the destination airport (99 distinct values); null_rate
      0.02089 reflects the destination join's documented coverage floor per operator context.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The destination airport's municipality (95 distinct values, e.g. Albuquerque,
      Atlanta); null_rate 0.02089 matches the destination join gap.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: The ISO region code of the destination (45 distinct values, e.g. US-CA, US-FL);
      null_rate 0.02089 matches the destination join gap.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: The destination airport's elevation in feet (3 to 6606 in samples); null_rate
      0.02089, a fixed airport attribute from the destination join.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: The destination airport's longest runway length in feet (5076 to 16000 in
      samples); null_rate 0.02089, a fixed airport attribute from the destination join.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: The pipeline's capture timestamp for the row (samples fall within seconds
      on 2026-09-02); null_rate 0.0, a dimension recording ingestion time rather than the
      flight's own event time.
