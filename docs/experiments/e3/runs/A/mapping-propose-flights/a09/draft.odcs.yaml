# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:19:23.944035+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flights_mapping
name: Gold mapping, flights category
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_flights table enters the gold unified event
    star as the flights fact category, for the deterministic modeling engine that renders
    the gold models from this contract.
  usage: The mapping contract is rendered to an ODCS mapping contract draft, validated by
    the frozen mapping-contract schema and datacontract lint, and reviewed by a human before
    approval; once approved, the modeling engine consumes it to emit gold fact and dimension
    models at hour grain keyed on departure_hour_utc.
  limitations: The mapping does not resolve the aircraft registry gaps (aircraft_manufacturer,
    aircraft_model, aircraft_manufacture_year, aircraft_seat_count, aircraft_engine_type all
    null at 16.0426%-17.6531%) or the destination join gaps (dest_airport_name, dest_municipality,
    dest_iso_region, dest_elevation_ft, dest_longest_runway_ft all null at 2.089%) into defaults,
    does not exclude cancelled flights (is_cancelled) or flights that never departed (dep_hhmm,
    dep_delay_minutes, arr_hhmm, arr_delay_minutes, air_time_minutes null at 2.9388%-3.2981%),
    and performs no transformation beyond the flight_identity derived from flight_date, carrier_code,
    flight_number, and origin_airport; consumers decide how to treat these nulls and cancellations.
schema:
- name: flights
  logicalType: object
  physicalType: mapping
  description: One row represents a single scheduled commercial flight departing from a New
    York area airport (EWR, JFK, or LGA) in 2013, carrying its carrier, aircraft, schedule,
    actual times, delays, and origin/destination airport attributes as joined in the silver
    contract.
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Calendar date of the scheduled flight, ranging 2013-01-01 to 2013-06-30 across
      181 distinct dates with no nulls, used as a dimension since departure_hour_utc is the
      designated time field.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter IATA carrier code (16 distinct values such as 9E, AA, DL, UA)
      identifying the operating airline, complete with no nulls.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airline-assigned flight number (1 to 8500, 2994 distinct values) that labels
      the flight instance rather than measuring a quantity, with no nulls.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter origin airport code, one of EWR, JFK, or LGA, complete with
      no nulls.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure time encoded as HHMM (500 to 2359, 969 distinct values),
      a time label rather than a measure, with no nulls.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter destination airport code (100 distinct values such as ABQ, ATL,
      BNA), complete with no nulls.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft tail number (3825 distinct values such as N0EGMQ) identifying the
      specific airframe; nullable at a 0.9154% rate where the registry could not be matched.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag indicating whether the flight was cancelled (true/false), complete with
      no nulls.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure time encoded as HHMM (1 to 2400, 1291 distinct values);
      nullable at 2.9388% where the flight never departed and kept no actual time, per operator
      context.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes (-33 to 1301, negative when early), summable and
      comparable across flights; nullable at 2.9388% matching dep_hhmm's nulls for flights
      that never departed.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival time encoded as HHMM (1 to 2400, 1392 distinct values); nullable
      at 3.07% for flights lacking an actual arrival.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival time encoded as HHMM (1 to 2359, 1134 distinct values),
      a time label, complete with no nulls.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes (-86 to 1272, negative when early), a measure compared
      and summed across flights; nullable at 3.2981% for flights lacking an actual arrival.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Airborne duration in minutes (20 to 695), a measure averaged and summed across
      flights; nullable at 3.2981% matching arrival-time nulls.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance flown in miles (80 to 4983, 203 distinct values), a
      measure summed and averaged across flights, complete with no nulls.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure hour in local time (5 to 23, 19 distinct values), a time-bucket
      label rather than a measure, complete with no nulls.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure minute in local time (0 to 59, 60 distinct values), a
      time label, complete with no nulls.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Actual departure timestamp in UTC, resolved to the hour (samples step by
      exactly one hour, e.g. 2013-01-01T10:00:00 to 11:00:00), the designated event time for
      this fact, complete with no nulls.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full legal carrier name (16 distinct values such as Delta Air Lines Inc.,
      United Air Lines Inc.) joined from the carrier lookup, complete with no nulls per the
      operator context.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft manufacturer name (34 distinct values such as AIRBUS, BOEING) joined
      from the aircraft registry; nullable at 16.0426% where the registry join did not resolve,
      per operator context.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model (121 distinct values such as 172E, 550) joined from the aircraft
      registry; nullable at 16.0426% matching the manufacturer join gap.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the aircraft was manufactured (1956 to 2013, 46 distinct values), a
      label rather than a summed quantity; nullable at 17.6531% where the registry join did
      not resolve.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Seat capacity of the aircraft (2 to 450, 47 distinct values), a count that
      can be summed or averaged across flights; nullable at 16.0426% matching the aircraft
      registry join gap.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft engine type (6 distinct values such as Turbo-fan, Turbo-jet) joined
      from the aircraft registry; nullable at 16.0426% matching the registry join gap.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full origin airport name (one of John F. Kennedy International Airport, LaGuardia
      Airport, Newark Liberty International Airport), complete with no nulls per the operator
      context noting origin is complete.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin municipality, either New York or Newark, complete with no nulls.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport elevation in feet (13, 18, or 21), a static airport attribute
      label rather than a flight measure, complete with no nulls.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport's longest runway length in feet (7002, 11000, or 14511), a
      static airport attribute label, complete with no nulls.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full destination airport name (99 distinct values such as Albany International
      Airport) joined from OurAirports; nullable at 2.089% where the destination join did
      not resolve, per operator context.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination municipality (95 distinct values such as Albuquerque, Atlanta)
      joined from OurAirports; nullable at 2.089% matching the destination join gap.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination ISO region code (45 distinct values such as US-CA, US-FL, PR-U-A)
      joined from OurAirports; nullable at 2.089% matching the destination join gap.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport elevation in feet (3 to 6606), a static airport attribute
      label; nullable at 2.089% matching the destination join gap.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport's longest runway length in feet (5076 to 16000), a static
      airport attribute label; nullable at 2.089% matching the destination join gap.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Profiling capture timestamp (16 distinct values clustered within one minute
      on 2026-09-02), an ingestion-time marker rather than the flight's business time, complete
      with no nulls.
