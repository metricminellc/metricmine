# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T16:07:37.117116+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flights_mapping
name: Gold mapping, flights category
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how silver.silver_flights enters the gold unified event star
    as the flights fact category, specifying its transaction grain, degenerate identity, time
    column, and field roles for the deterministic modeling engine that generates the gold
    models from this contract.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema and datacontract lint, and reviewed and edited by a human
    before approval; only after approval does the modeling engine consume the contract to
    emit gold models, never this proposal directly.
  limitations: The mapping does not filter or flag cancelled flights (is_cancelled) or flights
    lacking actual departure/arrival data (dep_hhmm, arr_hhmm, dep_delay_minutes, arr_delay_minutes,
    air_time_minutes nulling at roughly 2.9%-3.3%) — handling of those nulls is left to consumers.
    Aircraft registry fields are incomplete (null_rate 0.160426-0.176531) and destination
    airport fields are incomplete (null_rate 0.02089) per the operator-declared join completeness
    floors; the mapping does not impute or resolve these gaps, and does not derive any transformed
    or filtered columns beyond the declared flight_identity tuple.
schema:
- name: flights
  logicalType: object
  physicalType: mapping
  description: One row represents a single scheduled flight operated by a carrier from a NYC-area
    origin airport on a given date, carrying its scheduled and actual departure and arrival
    times, delay and duration measures, aircraft registry attributes, and origin/destination
    airport reference attributes, as profiled from silver.silver_flights (row_count 166158,
    duplicate_row_rate 0.0).
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - sched_dep_hhmm
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Calendar date of the flight, ranging 2013-01-01 to 2013-06-30 per profile
      min/max, with null_rate 0.0.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter operating carrier code with 16 distinct values sampled (e.g. AA,
      DL, UA) and null_rate 0.0.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Operating carrier's flight number, an identifier stored as an integer (1-8500,
      2994 distinct values), not summed, null_rate 0.0.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter origin airport code with only 3 distinct values (EWR, JFK, LGA)
      per profile, null_rate 0.0, confirming origin join completeness noted by the operator.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled local departure time encoded as HHMM (500-2359), a time label rather
      than a measure, null_rate 0.0.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter destination airport code, 100 distinct values sampled, null_rate
      0.0.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft registration tail number, nullable (null_rate 0.009154, 1521 nulls)
      for flights whose tail number was not captured.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag indicating whether the flight was cancelled, with distinct_values
      [false, true] and null_rate 0.0.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual local departure time as HHMM, nullable (null_rate 0.029388, 4883 nulls)
      because a flight that never departed keeps no actual time per operator context.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes, negative when early (range -33 to 1301 per profile),
      nullable (null_rate 0.029388) for flights that never departed.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual local arrival time as HHMM, nullable (null_rate 0.0307, 5101 nulls)
      for flights that never departed.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled local arrival time as HHMM (1-2359), a time label, null_rate 0.0.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes, negative when early (range -86 to 1272), nullable
      (null_rate 0.032981, 5480 nulls) for flights lacking actual arrival data.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Airborne flight duration in minutes (range 20-695), nullable (null_rate 0.032981)
      matching the arrival-delay nulls for flights without actual arrival data.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance between origin and destination in miles (range 80-4983),
      null_rate 0.0, additive across flights.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure hour in local time (5-23, 19 distinct values), a time-part
      label, null_rate 0.0.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure minute in local time (0-59), a time-part label, null_rate
      0.0.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the scheduled departure hour, always resolving to the hour
      in samples (e.g. 2013-01-01T10:00:00), spanning 2013-01-01T10:00:00 to 2013-07-01T03:00:00,
      null_rate 0.0; chosen as the event's canonical business time.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full carrier name from the carrier lookup join (16 distinct values, e.g.
      Delta Air Lines Inc.), null_rate 0.0 confirming carrier join completeness noted by the
      operator.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft manufacturer from the registry join (e.g. BOEING, AIRBUS), nullable
      (null_rate 0.160426, 26656 nulls) reflecting the registry join's completeness floor
      noted by the operator.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model from the registry join, nullable at the same rate (null_rate
      0.160426) as aircraft_manufacturer since both come from the same join.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the aircraft was manufactured (1956-2013), a label rather than a measure,
      nullable (null_rate 0.176531, 29332 nulls) from incomplete registry matches.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Aircraft seating capacity (range 2-450) from the registry join, nullable
      (null_rate 0.160426) matching the aircraft_manufacturer join gaps.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft engine type category (6 distinct values, e.g. Turbo-fan, Turbo-jet),
      nullable (null_rate 0.160426) from the same registry join gaps.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full origin airport name (3 distinct values, e.g. John F. Kennedy International
      Airport), null_rate 0.0.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: 'Origin city (2 distinct values: New York, Newark), null_rate 0.0.'
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: 'Origin airport elevation in feet (3 distinct values: 13, 18, 21), a descriptive
      airport attribute, null_rate 0.0.'
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: 'Origin airport''s longest runway length in feet (3 distinct values: 7002,
      11000, 14511), a descriptive airport attribute, null_rate 0.0.'
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full destination airport name from the OurAirports join, nullable (null_rate
      0.02089, 3471 nulls) reflecting the destination join's completeness floor noted by the
      operator.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination city, nullable at the same rate (null_rate 0.02089) as dest_airport_name
      since both come from the destination airport join.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: ISO region code of the destination (e.g. US-CA, PR-U-A), nullable (null_rate
      0.02089) from the same destination join gaps.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport elevation in feet, a descriptive attribute, nullable
      (null_rate 0.02089) from the destination join gaps.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport's longest runway length in feet, a descriptive attribute,
      nullable (null_rate 0.02089) from the destination join gaps.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Pipeline ingestion capture timestamp, narrowly clustered around 2026-09-02T23:25-23:26
      per samples, null_rate 0.0; distinct from the flight's own business time.
