# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_planes cleans the bronze FAA aircraft registry snapshot (the nycflights13
    planes table, a 2014 release reduced to tail numbers seen among 2013 NYC flights) into
    a typed, deduplicated reference table keyed on tail number for joining to flight fact
    tables.
  usage: Join to flight-level data on tail_number; treat manufacture_year and speed_mph as
    optional attributes and check for null before aggregating or filtering on them, since
    both carry non-zero null rates; plane_type, manufacturer, model, and engine_type are fully
    populated categorical attributes safe to group by directly.
  limitations: speed_mph is null for 99.3076% of rows (3299 of 3322) and manufacture_year
    is null for 2.1072% of rows (70 of 3322); these were retained rather than imputed or dropped.
    Per operator context, American Airlines and Envoy Air aircraft are absent from this registry
    extract because those carriers reported fleet numbers rather than tail numbers. dataset.duplicate_row_rate
    is 0.0, so no row-level deduplication was required.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: silver_nyc_planes cleans the bronze FAA aircraft registry snapshot (the nycflights13
    planes table, a 2014 release reduced to tail numbers seen among 2013 NYC flights) into
    a typed, deduplicated reference table keyed on tail number for joining to flight fact
    tables.
  properties:
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals dataset.row_count 3322 with null_count 0 and null_rate
      0.0, and samples like N10156, N102UW show the FAA tail-number format; spelled out per
      operator naming convention for abbreviated columns.
  - name: manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (1956.0, 1959.0, 1963.0 ...) are all whole numbers with min 1956.0
      and max 2013.0, justifying DECIMAL(38,9) to INTEGER; null_rate 0.021072 (70 of 3322)
      means the column stays nullable, and it is renamed per operator context clarifying year
      is the manufacture year.
  - name: plane_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 3 with enumerated distinct_values Fixed wing multi engine,
      Fixed wing single engine, Rotorcraft and null_rate 0.0; renamed from the ambiguous 'type'
      to spell out that this is the plane type per operator context.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 35, null_rate 0.0, samples like AGUSTA SPA, AIRBUS, BOEING
      show registry manufacturer names kept as recorded per operator context.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 127, null_rate 0.0, samples like 150, 172E, 310Q show heterogeneous
      model codes kept as the registry records them.
  - name: engine_count
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0, 2.0, 3.0, 4.0 are all whole numbers with min 1.0 and
      max 4.0, justifying DECIMAL(38,9) to INTEGER; null_rate 0.0 so required true; renamed
      to spell out that this is a count per operator convention.
  - name: seat_count
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Samples 2.0, 4.0, 5.0 ... 12.0 with min 2.0 and max 450.0 are all whole numbers,
      justifying DECIMAL(38,9) to INTEGER; null_rate 0.0 so required true; renamed to spell
      out that this is a count per operator convention.
  - name: speed_mph
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: distinct_values (90.0, 95.0, 105.0 ... 432.0) are all whole numbers, justifying
      DECIMAL(38,9) to INTEGER; null_rate 0.993076 (3299 of 3322 nulls) means this column
      is sparsely populated and must remain nullable; renamed with the mph unit suffix per
      operator naming convention since speed is average cruising speed in mph.
  - name: engine_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 6 with distinct_values 4 Cycle, Reciprocating, Turbo-fan,
      Turbo-jet, Turbo-prop, Turbo-shaft and null_rate 0.0; renamed to engine_type to disambiguate
      from the plane_type column.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tail_number) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tail_number
        FROM silver.silver_nyc_planes
        GROUP BY tail_number
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
