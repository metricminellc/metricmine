# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:32:12.976122+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table provides a cleaned registry of aircraft tail numbers appearing
    among the 2013 NYC flights, sourced from the FAA's 2014 aircraft registry release, so
    downstream consumers can enrich flight records with aircraft characteristics.
  usage: Join on tailnum to attach type, manufacturer, model, engines, seats, engine_type,
    year, and speed_mph to flight records; consumers must treat year (2.1% null) and especially
    speed_mph (99.3% null) as optionally populated and should not filter rows solely on their
    nullness.
  limitations: speed_mph is populated for only about 0.7% of rows (null_rate 0.993076) and
    should not be relied upon as a general attribute; year is missing for 2.1% of rows (70
    of 3322); per operator context, American Airlines and Envoy Air aircraft are absent from
    this registry extract because those carriers reported fleet numbers rather than tail numbers;
    no duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic was applied.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: This silver table provides a cleaned registry of aircraft tail numbers appearing
    among the 2013 NYC flights, sourced from the FAA's 2014 aircraft registry release, so
    downstream consumers can enrich flight records with aircraft characteristics.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with distinct_count 3322 equal to the table's row_count of
      3322, showing tailnum uniquely identifies each aircraft record.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.021072 (70 of 3322 nulls) with min 1956.0 and max 2013.0; sampled
      values (1956.0, 1959.0, 1963.0, ...) are all integral, supporting a cast from DECIMAL(38,9)
      to INTEGER.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 'null_rate 0.0 across a closed set of 3 distinct values: Fixed wing multi
      engine, Fixed wing single engine, Rotorcraft.'
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 35; samples such as AIRBUS, BOEING, BEECH,
      BELL show registry-reported manufacturer names.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 127; samples such as 172M, 310Q, 421C show
      free-text model codes carried as-is from the registry.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with distinct_values limited to 1.0, 2.0, 3.0, 4.0, all integral,
      supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with min 2.0 and max 450.0; sampled values (2.0, 4.0, 5.0,
      6.0, ...) are all integral, supporting a cast to INTEGER.
  - name: speed_mph
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.993076 (3299 of 3322 rows null) makes this sparsely populated;
      the 13 distinct values present (90.0 to 432.0) are integral, supporting a cast to INTEGER,
      and the operator's unit-suffix convention names the measure speed_mph.
  - name: engine_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 6 (4 Cycle, Reciprocating, Turbo-fan, Turbo-jet,
      Turbo-prop, Turbo-shaft); renamed to engine_type to disambiguate from the engines count
      column per operator naming conventions.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
