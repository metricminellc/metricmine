# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned FAA aircraft registry reference feeding downstream flight
    analyses that need per-tailnum attributes such as manufacture year, type, manufacturer,
    model, seating and engine configuration, and cruising speed for the aircraft observed
    in the 2013 NYC flights dataset.
  usage: Join on tailnum to enrich flight records with aircraft attributes; consumers must
    handle nulls in year_manufactured and especially speed_mph, since speed_mph is populated
    for fewer than 1% of rows (null_rate 0.993076) and should not be assumed present without
    an explicit null check.
  limitations: Pipeline metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped entirely; speed_mph remains almost entirely null (99.3% null) and year_manufactured
    has a small null gap (2.1% null), neither of which could be resolved from the source data;
    per operator context, American Airlines and Envoy Air aircraft are absent from this registry
    because those carriers reported fleet numbers rather than tail numbers.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: This table is the cleaned FAA aircraft registry reference feeding downstream
    flight analyses that need per-tailnum attributes such as manufacture year, type, manufacturer,
    model, seating and engine configuration, and cruising speed for the aircraft observed
    in the 2013 NYC flights dataset.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals the table's row_count 3322 with null_count 0,
      so tailnum uniquely identifies every row and serves as the aircraft registry key.
  - name: year_manufactured
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Operator context defines year as the year manufactured; all 10 samples (1956.0-1975.0)
      are integral so DECIMAL(38,9) casts cleanly to INTEGER, and null_rate 0.021072 (70 nulls)
      means the column must stay nullable.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_values are exactly three categories (Fixed
      wing multi engine, Fixed wing single engine, Rotorcraft), so the column is complete
      and low-cardinality as-is.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with 35 distinct manufacturer names (e.g. AIRBUS, BEECH, BOEING)
      recorded as free text from the registry; no cast is supported by the samples.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with 127 distinct alphanumeric model codes (e.g. 172E, 210-5(205),
      550) that mix letters and digits, so the column must remain text.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with null_rate 0.0, confirming
      an integral engine count that casts cleanly from DECIMAL(38,9) to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Samples (2.0, 4.0, 5.0 ... 12.0) and the min 2.0/max 450.0 range are all
      integral seat counts with null_rate 0.0, supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: speed_mph
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Operator context states speed is the average cruising speed in mph, so the
      unit suffix convention applies; distinct_values (90.0-432.0) are all integral supporting
      a cast to INTEGER, but null_rate 0.993076 (3299 of 3322 rows) means the column is sparsely
      populated and must stay nullable.
  - name: engine_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Renamed to avoid confusion with the numeric engines count column; distinct_values
      list exactly 6 engine categories (4 Cycle, Reciprocating, Turbo-fan, Turbo-jet, Turbo-prop,
      Turbo-shaft) with null_rate 0.0.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
