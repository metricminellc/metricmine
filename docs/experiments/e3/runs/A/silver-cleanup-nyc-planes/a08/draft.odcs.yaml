# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:33:56.345489+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_planes
name: Silver planes
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned FAA aircraft registry reduced to the tail numbers observed
    in the 2013 NYC flights dataset, feeding downstream joins from flight records to aircraft
    characteristics such as manufacturer, model, engine configuration, and capacity.
  usage: Join on tailnum to enrich flight records with aircraft attributes; consumers should
    expect year_manufactured and speed_mph to contain nulls (21.1% and 99.3% respectively)
    and should decide how to handle missing values rather than assume full coverage, especially
    for speed_mph where only 23 of 3322 aircraft carry a value.
  limitations: Cleanup did not resolve the near-total sparsity of speed_mph (null_rate 0.993076)
    nor the partial sparsity of year_manufactured (null_rate 0.021072); per the operator context,
    American Airlines and Envoy Air aircraft are absent entirely because those carriers reported
    fleet numbers instead of tail numbers in the source flights data, so this registry excludes
    their aircraft by construction.
schema:
- name: silver_planes
  physicalName: silver_planes
  logicalType: object
  physicalType: table
  description: This table is the cleaned FAA aircraft registry reduced to the tail numbers
    observed in the 2013 NYC flights dataset, feeding downstream joins from flight records
    to aircraft characteristics such as manufacturer, model, engine configuration, and capacity.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count is 3322 and row_count is 3322 with null_rate 0.0, so tailnum
      uniquely identifies every record and is the natural grain key.
  - name: year_manufactured
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Operator context states year is the manufacture year; samples (1956.0, 1959.0,
      1963.0...) are all whole numbers within min 1956.0/max 2013.0 so DECIMAL(38,9) safely
      casts to INTEGER, and null_rate 0.021072 (70 nulls) means the column must stay nullable.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_values are exactly {Fixed wing multi engine, Fixed wing single engine,
      Rotorcraft} with null_rate 0.0, a clean low-cardinality category column.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 35 with samples like AIRBUS, BOEING, BELL and null_rate 0.0
      shows a fully populated registry text field.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 127 with alphanumeric samples (150, 172E, 210-5(205)) and
      null_rate 0.0 confirms a free-text model identifier that should not be cast.
  - name: engine_count
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly {1.0, 2.0, 3.0, 4.0} with min 1.0/max 4.0 and
      null_rate 0.0, an integral count safely cast from DECIMAL(38,9); renamed to avoid ambiguity
      with the engine type column.
  - name: seat_count
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Samples (2.0, 4.0, 5.0 ... 12.0) with min 2.0/max 450.0 and null_rate 0.0
      are all whole numbers, so the DECIMAL(38,9) casts cleanly to INTEGER.
  - name: speed_mph
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Operator context defines speed as average cruising speed in mph, so the unit
      suffix is applied; distinct_values (90.0, 95.0 ... 432.0) are integral and cast cleanly,
      but null_rate 0.993076 (3299 of 3322 rows null) means the column is sparsely populated
      and must remain nullable.
  - name: engine_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_values are exactly {4 Cycle, Reciprocating, Turbo-fan, Turbo-jet,
      Turbo-prop, Turbo-shaft} with null_rate 0.0; renamed from engine to engine_type to avoid
      collision with the engine_count measure.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
