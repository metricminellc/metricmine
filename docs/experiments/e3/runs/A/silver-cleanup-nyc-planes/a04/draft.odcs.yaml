# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:30:51.826539+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_planes
name: Silver planes
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_planes is a cleaned, per-aircraft reference table derived from the bronze
    FAA aircraft registry snapshot (nyc_planes), reduced to the tail numbers observed among
    2013 NYC flights, intended to be joined with flight-level silver tables for aircraft attribute
    enrichment.
  usage: Join downstream flight tables to this table on tailnum to attach manufacturer, model,
    type, engine, seat, and performance attributes; consumers should expect manufacture_year
    to be null for a small share of rows and speed_mph to be null for nearly all rows, and
    must handle these nulls explicitly rather than assume completeness.
  limitations: speed_mph is null for 99.3% of rows (3299 of 3322), making it unsuitable for
    aggregate speed analysis without heavy caveats; manufacture_year is null for 2.1% of rows
    (70 of 3322); per operator context, aircraft operated by American Airlines and Envoy Air
    are entirely absent from this registry extract because those carriers reported fleet numbers
    rather than tail numbers.
schema:
- name: silver_planes
  physicalName: silver_planes
  logicalType: object
  physicalType: table
  description: silver_planes is a cleaned, per-aircraft reference table derived from the bronze
    FAA aircraft registry snapshot (nyc_planes), reduced to the tail numbers observed among
    2013 NYC flights, intended to be joined with flight-level silver tables for aircraft attribute
    enrichment.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals the dataset row_count of 3322 and null_rate is
      0.0, so tailnum uniquely identifies each aircraft record.
  - name: manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sample values (1956.0, 1959.0, ... 2013.0) are all whole numbers despite
      the landed DECIMAL(38,9) type, so casting to INTEGER is safe; null_rate 0.021072 (70
      of 3322 nulls) means the manufacture year is sometimes missing and is retained as nullable,
      renamed per operator guidance to spell out the abbreviated name.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with only 3 distinct_values (Fixed wing multi engine, Fixed
      wing single engine, Rotorcraft) covering plane type as documented by the operator.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 across 35 distinct manufacturers as recorded verbatim by the
      FAA registry, e.g. samples AGUSTA SPA, AIRBUS, BEECH, BOEING.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 across 127 distinct models as recorded by the registry, e.g.
      samples 150, 172E, 310Q, 550.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values [1.0, 2.0, 3.0, 4.0] are all whole numbers with null_rate
      0.0, so the engine count casts safely from DECIMAL(38,9) to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: samples 2.0 through 12.0 and max 450.0 are all whole numbers with null_rate
      0.0, so the seat count casts safely from DECIMAL(38,9) to INTEGER.
  - name: speed_mph
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: distinct_values (90.0 to 432.0) are whole numbers and the operator confirms
      this is average cruising speed in mph, but null_rate 0.993076 (3299 of 3322 rows) means
      the column is sparsely populated and is retained as nullable; renamed with the mph unit
      suffix per operator convention.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 across 6 distinct engine types (4 Cycle, Reciprocating, Turbo-fan,
      Turbo-jet, Turbo-prop, Turbo-shaft).
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
