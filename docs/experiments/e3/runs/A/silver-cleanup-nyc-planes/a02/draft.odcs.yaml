# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:29:22.009250+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned FAA aircraft registry reference for tail numbers observed
    among 2013 New York City departures, feeding joins against flight-level fact tables to
    describe the aircraft operating each flight.
  usage: Join on tailnum to attach aircraft attributes (manufacturer, model, year manufactured,
    engine type and count, seats, cruising speed) to flight records; consumers should expect
    and handle nulls in year_manufactured and especially speed_mph, which is populated for
    under 1% of rows.
  limitations: speed_mph is null for 99.3% of rows (3299 of 3322) and year_manufactured is
    null for 2.1% of rows (70 of 3322); per the operator context, American Airlines and Envoy
    Air aircraft are entirely absent because those carriers reported fleet numbers rather
    than tail numbers in the source data, so this registry cannot describe their aircraft
    at all.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: This table is the cleaned FAA aircraft registry reference for tail numbers
    observed among 2013 New York City departures, feeding joins against flight-level fact
    tables to describe the aircraft operating each flight.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals the table's row_count 3322 and null_count is 0,
      so tailnum is a fully populated unique identifier, as the operator context confirms
      it is the aircraft tail number.
  - name: year_manufactured
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample values (1956.0, 1959.0, 1963.0 ...) are integral despite the landed
      DECIMAL(38,9) type, so cast to INTEGER; null_rate is 0.021072 (70 nulls) so the column
      stays nullable, and the operator context says year means year manufactured, which motivates
      the rename.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_values are exactly {Fixed wing multi engine,
      Fixed wing single engine, Rotorcraft}, a small closed categorical set fully populated.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 35 and samples like AIRBUS, BOEING,
      BEECH showing free-text registry names as the operator context describes.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 127 and alphanumeric samples (150, 172E,
      210-5(205)) confirming free-text model codes from the registry.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly {1.0, 2.0, 3.0, 4.0} with null_rate 0.0, an integral
      engine count landed as DECIMAL(38,9), so cast to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and samples (2.0, 4.0, 5.0 ... up to max 450.0) are all
      integral seat counts landed as DECIMAL(38,9), so cast to INTEGER.
  - name: speed_mph
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.993076 (3299 of 3322 nulls), so the column is sparsely populated
      and retained nullable; the 13 distinct_values (90.0 to 432.0) are all integral, so cast
      to INTEGER, and the operator context names this measure speed in mph, motivating the
      unit-suffixed rename.
  - name: engine_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with a closed set of 6 distinct_values (4 Cycle, Reciprocating,
      Turbo-fan, Turbo-jet, Turbo-prop, Turbo-shaft); renamed to engine_type to disambiguate
      from the engines count column.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
