# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:16:54.220605+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned hourly ASOS weather observations for the three NYC-area
    airports (EWR, JFK, LGA) covering January through June 2013, intended to be joined to
    flight records on the shared origin code and observation hour.
  usage: Join on origin_code and observation_timestamp_utc (or truncate to hour) to attach
    weather to flight events; all measures carry their unit as a name suffix (fahrenheit,
    percent, degrees, mph, inches, millibars, miles), and consumers must handle nulls in wind_direction_degrees,
    wind_speed_mph, wind_gust_mph, and pressure_millibars rather than assume a reading exists
    every hour.
  limitations: wind_gust_mph is missing 74.55% of the time and pressure_millibars is missing
    11.50% of the time, so aggregates over these columns should account for substantial sparsity;
    the original year, month, and day integer columns were dropped in favor of the existing
    complete observation_timestamp_utc because this proposal format has no action to merge
    multiple source columns into one, which may not fully satisfy a need for a separate local
    calendar date distinct from the UTC instant.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned hourly ASOS weather observations for the three
    NYC-area airports (EWR, JFK, LGA) covering January through June 2013, intended to be joined
    to flight records on the shared origin code and observation hour.
  properties:
  - name: origin_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_values are exactly the three station codes
      EWR, JFK, LGA, so this is a code column renamed per the _code naming convention.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 24 with min 0.0 and max 23.0, representing
      the local observation hour used to match the flights table; retained as an integer since
      it is a time-of-day component, not a date part.
  - name: temperature_fahrenheit
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, samples (10.94, 12.02, ... 19.04) are all two-decimal Fahrenheit
      readings between 10.94 and 93.92, so this is cast to a two-decimal DECIMAL and renamed
      with its unit suffix per the operator's convention.
  - name: dewpoint_fahrenheit
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, samples range from -9.94 to 73.94 in two-decimal Fahrenheit,
      matching the dewpoint per the operator's column documentation, so it is renamed with
      a unit suffix and cast to DECIMAL(5,2).
  - name: humidity_percent
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, values range 12.74 to 100.0 which is consistent with a
      relative-humidity percentage as the operator describes, cast to DECIMAL(5,2) and renamed
      with its unit suffix.
  - name: wind_direction_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.016828 (219 nulls) and the 37 distinct values are all whole
      multiples of 10 between 0.0 and 360.0, so it is cast to INTEGER, renamed with a degrees
      suffix, and retained nullable rather than imputed.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.000154 (2 nulls) and samples show five-decimal mph values
      from 0.0 to 1048.36058, so it is cast to a wider DECIMAL and renamed with its unit suffix,
      retained nullable for the rare missing readings.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 nulls), making this column sparsely
      populated; samples (16.11092-62.14212 mph) justify the numeric cast and unit suffix,
      but nulls are retained rather than imputed since gusts are frequently absent.
  - name: precipitation_inches
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, values are two-decimal inches from 0.0 to 1.06 across 50
      distinct values, so it is cast to DECIMAL(5,2) and renamed with its unit suffix.
  - name: pressure_millibars
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: null_rate is 0.114953 (1496 nulls), one-decimal millibar values from 983.8
      to 1038.4 justify DECIMAL(6,1) and the unit-suffix rename, with nulls retained given
      the meaningful missing rate.
  - name: visibility_miles
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: null_rate is 0.0 and the 20 distinct_values (0.0 through 10.0 in fractional
      steps) are consistent with visibility in miles, so it is cast to DECIMAL(4,2) and renamed
      with its unit suffix.
  - name: observation_timestamp_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 and samples (2013-01-01T06:00:00Z through 2013-01-01T15:00:00Z)
      are ISO-8601 UTC instants per the operator's description, so it is cast to TIMESTAMP
      and renamed to reflect it is the UTC recording instant; this is also the single complete
      date-time column replacing the three dropped integer date parts.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin_code, observation_timestamp_utc)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin_code, observation_timestamp_utc
        FROM silver.silver_nyc_weather
        GROUP BY origin_code, observation_timestamp_utc
        HAVING COUNT(*) > 1
      )
    mustBe: 0
