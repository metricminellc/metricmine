# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:21:23.273752+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table provides cleaned hourly weather observations from the three NYC-area
    airports (EWR, JFK, LGA) for the January-June 2013 window, sourced from ASOS/IEM observations
    via the nycflights13 weather dataset, feeding downstream joins with flight records on
    origin and time.
  usage: Consumers should join on origin_code and observation_timestamp, the declared grain
    keys; before aggregating, handle nulls explicitly in wind_direction_degrees, wind_speed_mph,
    wind_gust_mph, and sea_level_pressure_millibars since these are retained nullable rather
    than imputed, and be aware wind_gust_mph is sparsely populated (about 74.6% null).
  limitations: year, month, and day were dropped as redundant with observation_timestamp per
    the single-DATE-column convention; no exact-duplicate rows were found (duplicate_row_rate
    0.0) so no dedupe logic was applied; wind_gust_mph remains heavily null (74.6%) and pressure,
    wind_dir, and wind_speed retain smaller null rates (11.5%, 1.7%, and 0.015% respectively)
    that were not imputed or resolved.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This silver table provides cleaned hourly weather observations from the three
    NYC-area airports (EWR, JFK, LGA) for the January-June 2013 window, sourced from ASOS/IEM
    observations via the nycflights13 weather dataset, feeding downstream joins with flight
    records on origin and time.
  properties:
  - name: origin_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with only 3 distinct_values (EWR, JFK, LGA) matching the
      flights table's origin code, so it is renamed with the _code suffix per operator convention
      and kept required.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour ranges 0.0-23.0 across 24 distinct integral values with null_rate 0.0,
      so DECIMAL(38,9) is safely cast to INTEGER and kept required.
  - name: temperature_fahrenheit
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: temp samples (e.g. 10.94 to 93.92) all carry two decimal places with null_rate
      0.0, so it is cast to DECIMAL(5,2) and renamed with its unit suffix per operator convention.
  - name: dewpoint_fahrenheit
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: dewp ranges from -9.94 to 73.94 with consistent two-decimal samples and null_rate
      0.0, so it is cast to DECIMAL(5,2) and renamed with its unit suffix.
  - name: humidity_percent
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: humid ranges 12.74 to 100.0 across 2178 distinct two-decimal values with
      null_rate 0.0, so it is cast to DECIMAL(5,2) and renamed with its percent unit suffix.
  - name: wind_direction_degrees
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: wind_dir ranges 0.0-360.0 but has null_rate 0.016828 (219 of 13014 nulls),
      so it is cast to DECIMAL(5,2), renamed with its degrees unit suffix, and retained nullable
      rather than imputed.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: wind_speed ranges 0.0 to 1048.36058 with five-decimal precision samples and
      a low null_rate of 0.000154 (2 nulls), so it is cast to DECIMAL(10,5), renamed with
      its mph unit suffix, and retained nullable.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: wind_gust ranges 16.11092 to 62.14212 but null_rate is 0.745505 (9702 of
      13014 nulls), so it is cast to DECIMAL(10,5), renamed with its mph unit suffix, and
      retained as a sparsely populated nullable column.
  - name: precipitation_inches
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: precip ranges 0.0 to 1.06 with two-decimal samples and null_rate 0.0, so
      it is cast to DECIMAL(5,2) and renamed with its inches unit suffix.
  - name: sea_level_pressure_millibars
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: false
    description: pressure ranges 983.8 to 1038.4 with null_rate 0.114953 (1496 of 13014 nulls),
      so it is cast to DECIMAL(6,2), renamed with its millibars unit suffix, and retained
      nullable.
  - name: visibility_miles
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: visib has 20 enumerated distinct_values from 0.0 to 10.0 and null_rate 0.0,
      so it is cast to DECIMAL(4,2) and renamed with its miles unit suffix.
  - name: observation_timestamp
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: time_hour samples are consistently ISO-8601 UTC instants (e.g. 2013-01-01T06:00:00Z)
      across 4341 distinct values with null_rate 0.0, so it is cast to TIMESTAMP and renamed
      to reflect it carries the full observation date and hour as a single column.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin_code, observation_timestamp) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin_code, observation_timestamp
        FROM silver.silver_nyc_weather
        GROUP BY origin_code, observation_timestamp
        HAVING COUNT(*) > 1
      )
    mustBe: 0
