# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:06:42.837453+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds cleaned scheduled and actual flight-event records for every departure
    from the three NYC airports (EWR, JFK, LGA) in the January-June 2013 window of nycflights13,
    feeding downstream on-time-performance and delay analyses.
  usage: Consumers should treat the declared grain (year, month, day, carrier_code, flight_number,
    sched_dep_time) as the unit of analysis, filter or branch on the is_cancelled flag before
    computing delay statistics since dep_time, arr_time, dep_delay_minutes, arr_delay_minutes,
    and air_time_minutes are null for flights that never departed or completed, and should
    not assume dep_time/arr_time are standard clock times since they retain the source's HHMM
    encoding including the 2400 midnight marker.
  limitations: Pipeline metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped entirely; year, month, and day remain three separate integer columns rather
    than a single DATE column because this cleanup's column-level actions cannot merge multiple
    bronze columns into one target; dep_time, arr_time, dep_delay_minutes, arr_delay_minutes,
    and air_time_minutes retain null rates between 0.9% and 3.3% that were not imputed; and
    tail_number (0.9% null) was excluded from the grain despite being a plausible natural
    key component.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table holds cleaned scheduled and actual flight-event records for every
    departure from the three NYC airports (EWR, JFK, LGA) in the January-June 2013 window
    of nycflights13, feeding downstream on-time-performance and delay analyses.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count is 1 with the single value 2013.0, consistent
      with this being a single-year extract; cast from DECIMAL(38,9) to INTEGER since the
      only value is integral.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with distinct_count 6 and values 1.0 through 6.0, matching
      the stated January-June window; all samples are integral so DECIMAL(38,9) casts cleanly
      to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate is 0.0, distinct_count is 31, min 1.0 and max 31.0, all sample
      values integral, so DECIMAL(38,9) casts cleanly to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) with max 2400.0 indicating an HHMM/HMM encoding
      rather than a standard clock time, so it is retained as an integer rather than cast
      to TIME; per operator context a flight that never departed has no departure time, so
      nulls are retained, not imputed.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived as true when dep_time is null; the profile shows 4883 nulls (null_rate
      0.029388) in dep_time, and operator context states a flight that never departed has
      no departure time, so this flag surfaces cancelled-flight rows for consumers.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate is 0.0, distinct_count 969, range 500.0-2359.0, an HHMM encoding
      retained as INTEGER since no sample shows a standard time format.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Renamed with the minutes unit suffix per operator naming convention; null_rate
      0.029388 (4883 nulls) mirrors dep_time nulls for flights that never departed, range
      -33.0 to 1301.0, all samples integral.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.0307 (5101 nulls) with max 2400.0, an HHMM encoding retained
      as INTEGER; nulls retained for flights lacking a recorded arrival.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 1134, range 1.0-2359.0, an HHMM encoding
      retained as INTEGER.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Renamed with the minutes unit suffix per operator naming convention; null_rate
      0.032981 (5480 nulls) consistent with flights that never completed, range -86.0 to 1272.0,
      all samples integral.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: Renamed with the _code suffix per operator naming convention for codes; null_rate
      0.0 and distinct_count 16 with two-letter values like '9E', 'AA', 'DL'.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: Renamed to spell out the abbreviated name per operator convention; null_rate
      0.0, distinct_count 2994, range 1.0-8500.0, all samples integral.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Renamed to spell out the abbreviated name; null_rate 0.009154 (1521 nulls)
      with distinct_count 3825 and samples like 'D942DN', 'N0EGMQ', so nulls are retained
      rather than imputed.
  - name: origin_airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Renamed with the _code suffix; null_rate 0.0, distinct_count 3, values EWR,
      JFK, LGA matching the three NYC airports.
  - name: destination_airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Renamed to spell out the abbreviation and apply the _code suffix; null_rate
      0.0, distinct_count 100 with samples like 'ABQ', 'ACK', 'ALB'.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Renamed with the minutes unit suffix; null_rate 0.032981 (5480 nulls) mirrors
      arr_delay nulls for incomplete flights, range 20.0-695.0, all samples integral.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Renamed with the miles unit suffix per operator convention; null_rate 0.0,
      range 80.0-4983.0, all samples integral.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 19, range 5.0-23.0; the scheduled-departure
      hour component, all values integral.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 60, range 0.0-59.0; the scheduled-departure
      minute component, all values integral.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0 with distinct_count 3439 and ISO-8601 samples like '2013-01-01T10:00:00Z'
      through '2013-01-01T19:00:00Z', all consistently shaped, so VARCHAR casts cleanly to
      TIMESTAMP representing the UTC scheduled hour per operator context.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier_code, flight_number,
      sched_dep_time) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier_code, flight_number, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier_code, flight_number, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
