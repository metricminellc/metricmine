# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T15:08:11.479999+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table cleans the bronze nyc_flights capture of the nycflights13 flights
    table, covering January-June 2013 departures from JFK, LGA, and EWR, by typing timestamp
    and measure columns, applying the operator's naming conventions, and dropping Airbyte
    capture metadata, to feed downstream flight-delay and on-time-performance analysis.
  usage: Consumers should join or group on the declared grain (year, month, day, carrier_code,
    flight, sched_dep_time) to identify one scheduled departure, and must treat nulls in dep_time,
    arr_time, dep_delay_minutes, arr_delay_minutes, air_time_minutes, and tail_number as flights
    that never departed or lack a recorded tail number rather than as missing data to impute.
  limitations: year, month, and day remain three separate INTEGER columns rather than a single
    DATE column because this proposal's schema can only map one source column to one target
    and cannot combine three source columns into a derived date; dep_time, arr_time, dep_delay_minutes,
    arr_delay_minutes, and air_time_minutes retain nulls at rates between 2.9% and 3.3% for
    flights that never departed, and tail_number is null for 0.9% of rows; the grain has not
    been measured for uniqueness against the full warehouse table and must be validated before
    approval.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This silver table cleans the bronze nyc_flights capture of the nycflights13
    flights table, covering January-June 2013 departures from JFK, LGA, and EWR, by typing
    timestamp and measure columns, applying the operator's naming conventions, and dropping
    Airbyte capture metadata, to feed downstream flight-delay and on-time-performance analysis.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count is 1 with the single value 2013.0 and null_rate is 0.0; cast
      DECIMAL(38,9) to INTEGER since the sole value is integral.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_count is 6 with values 1.0 through 6.0 and null_rate is 0.0; all
      values are integral so cast DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: distinct_count is 31 spanning min 1.0 to max 31.0 with null_rate 0.0; sample
      values 1.0-10.0 are integral so cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.029388 (4883 nulls) because, per operator context, a flight
      that never departed has no departure time; sample values up to max 2400.0 represent
      HHMM local time and are integral, so cast to INTEGER and retain nulls.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate is 0.0 with 969 distinct integral HHMM values from 500.0 to 2359.0
      in the samples; cast to INTEGER.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.029388 matching dep_time's nulls for flights that never departed;
      sample values from -33.0 to 1301.0 are integral minutes, so renamed with the minutes
      unit suffix per operator convention and cast to INTEGER.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.0307 (5101 nulls), consistent with flights that never departed
      having no arrival time; sample values up to max 2400.0 are integral HHMM, cast to INTEGER.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with 1134 distinct integral values between 1.0 and 2359.0;
      cast to INTEGER.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.032981 (5480 nulls), aligning with air_time's nulls for flights
      that never completed; sample values from -86.0 to 1272.0 are integral minutes, renamed
      with unit suffix and cast to INTEGER.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate is 0.0 with 16 enumerated two-letter values (9E, AA, AS, ... YV);
      renamed with the _code suffix per operator convention for code columns.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate is 0.0 with 2994 distinct integral values from 1.0 to 8500.0; cast
      DECIMAL(38,9) to INTEGER.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.009154 (1521 nulls) and samples like D942DN, N0EGMQ show alphanumeric
      tail identifiers; renamed to spell out the abbreviated column name per operator convention,
      nulls retained rather than imputed.
  - name: origin_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with exactly 3 distinct values (EWR, JFK, LGA); renamed
      with the _code suffix per operator convention for airport code columns.
  - name: destination_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 100 distinct airport codes (ABQ, ACK, ALB, ...); renamed
      to spell out the abbreviated name and carry the _code suffix per operator convention.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.032981 (5480 nulls) matching arr_delay's nulls for flights
      without a recorded arrival; sample values 20.0 to 695.0 are integral minutes, renamed
      with the minutes unit suffix and cast to INTEGER.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with 203 distinct integral values from 80.0 to 4983.0 miles;
      renamed with the miles unit suffix per operator convention and cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with 19 distinct integral values from 5.0 to 23.0 representing
      the scheduled departure hour part; cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with 60 distinct integral values from 0.0 to 59.0 representing
      the scheduled departure minute part; cast to INTEGER.
  - name: time_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 with 3439 distinct ISO-8601 UTC sample values like 2013-01-01T10:00:00Z;
      all samples agree on format so cast VARCHAR to TIMESTAMP and renamed to clarify it is
      the scheduled hour in UTC.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier_code, flight,
      sched_dep_time) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier_code, flight, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier_code, flight, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
