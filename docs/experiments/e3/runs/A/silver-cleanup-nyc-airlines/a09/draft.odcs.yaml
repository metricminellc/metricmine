apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier reference lookup for the nycflights13-derived
    pipeline, mapping each two-letter carrier code to its full legal airline name for the
    16 carriers that flew from New York City in 2013; it feeds joins from flight-level fact
    tables that only carry the carrier code.
  usage: Join downstream flight tables to this table on carrier_code to resolve a human-readable
    carrier_name; both columns are fully populated (null_rate 0.0) and carrier_code is unique
    across all 16 rows, so no null-handling or dedupe logic is needed when consuming this
    table.
  limitations: All three Airbyte capture-metadata columns (_airbyte_raw_id, _airbyte_extracted_at,
    _airbyte_meta) were dropped as pipeline artifacts with no business meaning; the dataset
    covers only the 16 carriers observed in the 2013 NYC-origin flights and is not a general-purpose
    carrier registry.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier reference lookup for the nycflights13-derived
    pipeline, mapping each two-letter carrier code to its full legal airline name for the
    16 carriers that flew from New York City in 2013; it feeds joins from flight-level fact
    tables that only carry the carrier code.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 16 rows with distinct_count 16 (e.g. '9E','AA','DL','WN'),
      so every row carries a unique two-letter carrier abbreviation; renamed to carrier_code
      per the operator's code-column naming convention.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 16 matching row_count 16 (e.g. 'Delta
      Air Lines Inc.','Southwest Airlines Co.'); renamed from the ambiguous bronze column
      'name' to carrier_name per the operator's instruction to spell out abbreviated column
      names.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_nyc_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
