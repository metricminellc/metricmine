# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a cleaned, small reference lookup of the sixteen airline carriers
    that flew from New York City airports in 2013, feeding joins against flight-level fact
    tables keyed by carrier code.
  usage: Join downstream flight tables to this table on carrier_code to resolve the full carrier_name
    for reporting; the table has exactly 16 rows, one per carrier, with no nulls in either
    column.
  limitations: No duplicate rows or null values were found in bronze (duplicate_row_rate 0.0,
    null_rate 0.0 for both business columns), so no cleanup beyond renaming and dropping Airbyte
    capture metadata was required; the single-row-per-carrier grain has not been validated
    against future loads where new carriers could appear.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is a cleaned, small reference lookup of the sixteen airline carriers
    that flew from New York City airports in 2013, feeding joins against flight-level fact
    tables keyed by carrier code.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across all 16 rows and distinct_count equals 16 (samples
      AA, DL, UA, WN, etc.), matching the two-letter carrier abbreviation the operator context
      describes; renamed with the _code suffix convention.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full carrier names (e.g. 'Delta Air Lines
      Inc.', 'United Air Lines Inc.'); renamed from the generic 'name' to spell out what it
      holds, per operator naming guidance.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
