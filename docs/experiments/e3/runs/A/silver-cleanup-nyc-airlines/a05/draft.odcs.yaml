apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier lookup for the sixteen airlines that flew out
    of New York City in 2013, mapping each two-letter carrier code to its full legal name,
    and feeds any flight-fact table that needs to resolve or display a readable carrier name.
  usage: Join downstream flight tables to this table on carrier_code to attach the full carrier_name;
    both columns are fully populated and unique per the declared grain, so no null-filtering
    or deduplication is needed before joining.
  limitations: The table excludes three Airbyte capture-metadata columns that carried no business
    content; because duplicate_row_rate was 0.0 and every value was fully populated across
    all 16 rows, no additional cleanup, imputation, or dedupe logic was required or applied.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier lookup for the sixteen airlines that flew
    out of New York City in 2013, mapping each two-letter carrier code to its full legal name,
    and feeds any flight-fact table that needs to resolve or display a readable carrier name.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 and distinct_count 16 equal to the 16-row
      table, matching the two-letter IATA codes sampled (9E, AA, AS, ... YV); renamed to carrier_code
      per the operator's code-column convention.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full carrier names sampled (e.g. 'Delta
      Air Lines Inc.', 'Southwest Airlines Co.'); renamed from the ambiguous 'name' to carrier_name
      to spell out what the column holds per operator guidance.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
