# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the carrier reference lookup from the nycflights13 Bureau of Transportation
    Statistics source, mapping the sixteen two-letter carrier codes that flew out of New York
    City in 2013 to their full airline names, intended to feed joins against flight fact tables
    that record only a carrier code.
  usage: Join downstream flight records to this table on carrier_code to attach the human-readable
    carrier_name; treat carrier_code as the unique grain key with no nulls expected.
  limitations: Coverage is limited to the sixteen carriers that operated NYC departures in
    2013 per the nycflights13 source and will not include carriers outside that scope; all
    three Airbyte capture-metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped as non-business data, and no null or duplicate-row issues were observed (null_rate
    0.0 and duplicate_row_rate 0.0 across all 16 rows).
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is the carrier reference lookup from the nycflights13 Bureau of
    Transportation Statistics source, mapping the sixteen two-letter carrier codes that flew
    out of New York City in 2013 to their full airline names, intended to feed joins against
    flight fact tables that record only a carrier code.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across all 16 rows and distinct_count is 16, matching row_count,
      so every row carries a unique two-letter code; renamed to carrier_code per the operator's
      convention that code columns carry a _code suffix.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full airline names (e.g. 'Delta Air Lines
      Inc.', 'JetBlue Airways'); renamed from the generic 'name' to carrier_name to spell
      out what the column holds, as the operator's naming convention asks.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
