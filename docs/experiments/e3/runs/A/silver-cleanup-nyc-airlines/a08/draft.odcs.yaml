apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier reference lookup for the nycflights13-derived
    NYC airlines dataset, mapping each two-letter carrier code to its full legal airline name,
    for use as a dimension table joined against flight fact tables on carrier_code.
  usage: Join downstream flight or fare tables to this table on carrier_code to resolve the
    full carrier_name for reporting; the table is small (16 rows), fully populated, and requires
    no null handling or deduplication by consumers.
  limitations: The source profile shows zero nulls and zero duplicate rows across all five
    bronze columns, so no cleanup ambiguities remain; the three Airbyte capture-metadata columns
    were dropped entirely and carry no business value, and the table captures only the 2013
    NYC-origin carrier roster documented by the nycflights13 package, not a live or comprehensive
    BTS carrier list.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier reference lookup for the nycflights13-derived
    NYC airlines dataset, mapping each two-letter carrier code to its full legal airline name,
    for use as a dimension table joined against flight fact tables on carrier_code.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 and distinct_count 16 matching row_count
      16 (e.g. 9E, AA, DL, UA, WN), so this two-letter carrier abbreviation is renamed with
      the _code suffix per the team's naming convention and used as the unique identifier.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 16 holding fully spelled carrier names
      (e.g. 'Delta Air Lines Inc.', 'JetBlue Airways'); renamed from the ambiguous 'name'
      to carrier_name per the operator's instruction to spell out abbreviated column names
      and disambiguate.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_nyc_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
