# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is the cleaned carrier reference lookup for the nycflights13-derived
    warehouse, mapping each two-letter carrier code to its full legal airline name for the
    16 carriers that flew from NYC in 2013, feeding joins from flight fact tables.
  usage: Join on carrier_code to enrich flight-level records with the full carrier_name; both
    columns are fully populated (null_rate 0.0) and carrier_code is unique per row, so it
    can be used directly as a join and grain key without additional filtering.
  limitations: The bronze source carried only a single snapshot (_airbyte_extracted_at constant
    at 2026-09-02T23:26:17) with no historical versioning, so this table reflects one point-in-time
    capture of the carrier list and cannot be used to track carrier name changes over time;
    all three Airbyte metadata columns were dropped as non-business artifacts.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is the cleaned carrier reference lookup for the nycflights13-derived
    warehouse, mapping each two-letter carrier code to its full legal airline name for the
    16 carriers that flew from NYC in 2013, feeding joins from flight fact tables.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 and null_count 0 across 16 rows, with distinct_count 16 matching
      the two-letter IATA-style codes sampled (e.g. 9E, AA, DL, UA); renamed to carrier_code
      per the operator's convention that code columns carry a `_code` suffix.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and null_count 0, with distinct_count 16 matching full carrier
      names such as 'Delta Air Lines Inc.' and 'Southwest Airlines Co.'; renamed from the
      ambiguous 'name' to 'carrier_name' per the operator's instruction to spell out abbreviated
      or generic column names.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_nyc_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
