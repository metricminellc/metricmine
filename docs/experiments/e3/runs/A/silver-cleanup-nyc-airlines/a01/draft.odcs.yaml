# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference lookup mapping each two-letter carrier code to
    its full airline name, derived from the nycflights13 airlines source restricted to the
    sixteen carriers that flew out of New York City in 2013; it is intended to be joined to
    flight fact tables on carrier_code.
  usage: Join on carrier_code to enrich flight-level records with the carrier's full name;
    both columns are required and non-null so no null-handling logic is needed by consumers,
    and the grain is one row per carrier_code.
  limitations: The three Airbyte capture-metadata columns (_airbyte_raw_id, _airbyte_extracted_at,
    _airbyte_meta) were dropped as non-business artifacts; the table has zero measured duplicate
    rows and zero nulls in the profiled sample, but as a static sixteen-row reference extracted
    at a single point in time (2026-09-02T23:26:17), it should be refreshed if new carriers
    begin service to NYC airports.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference lookup mapping each two-letter carrier code
    to its full airline name, derived from the nycflights13 airlines source restricted to
    the sixteen carriers that flew out of New York City in 2013; it is intended to be joined
    to flight fact tables on carrier_code.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 and distinct_count 16 equal to row_count 16, matching the sixteen
      two-letter IATA carrier abbreviations (e.g. 9E, AA, DL); renamed to carrier_code per
      the operator's convention of suffixing code columns with _code.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 16 with full airline names (e.g. 'Delta Air
      Lines Inc.', 'JetBlue Airways'); renamed from the ambiguous 'name' to carrier_name to
      spell out what it identifies, per operator guidance.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
