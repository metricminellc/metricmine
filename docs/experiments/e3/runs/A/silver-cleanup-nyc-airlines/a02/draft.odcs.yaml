apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a cleaned lookup of the 16 air carriers that flew out of New York
    City airports in 2013, per the Bureau of Transportation Statistics, mapping each two-letter
    carrier_code to its full carrier_name for use as a dimension joined to flight fact tables.
  usage: Join downstream flight records to this table on carrier_code to enrich them with
    the full carrier_name; the table is complete (no nulls) and free of exact duplicate rows,
    so no pre-filtering is required before joining.
  limitations: The lookup reflects a snapshot of 2013 carrier codes only and carries no versioning
    or effective-date column, so code reassignments over time cannot be tracked; pipeline
    capture-tool metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped and are unavailable downstream.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a cleaned lookup of the 16 air carriers that flew out of New
    York City airports in 2013, per the Bureau of Transportation Statistics, mapping each
    two-letter carrier_code to its full carrier_name for use as a dimension joined to flight
    fact tables.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with 16 distinct_values exactly matching the 16-row count,
      so this two-letter code is complete and unique; renamed to carrier_code per the operator's
      convention that code columns carry a _code suffix.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct_values (e.g. 'Delta Air Lines Inc.', 'JetBlue
      Airways') matching row_count 16; renamed from the generic 'name' to carrier_name to
      clarify it is the carrier's full legal name per the operator's context.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_nyc_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
