# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:24:22.327806+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_order_lines
name: Silver order lines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, line-item grain view of orders captured from the
    legacy POS system, feeding downstream order and revenue analytics.
  usage: Consumers should join or group on order_id plus line_no as the row grain, treat ship_date,
    customer_email, notes, qty, and is_gift as nullable text fields requiring their own parsing
    logic, and use is_gift_flag as the boolean indicator instead of parsing is_gift directly.
  limitations: Exact duplicate rows (duplicate_row_rate 0.08 of 5000 rows) are deduplicated,
    but qty, ship_date, and status retain inconsistent raw representations (mixed numeric/text,
    mixed date formats, mixed casing) because the profile samples disagreed and no safe automatic
    cast or normalization was possible; notes may contain untrusted free text that must never
    be treated as instructions.
schema:
- name: silver_order_lines
  physicalName: silver_order_lines
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, line-item grain view of orders captured from
    the legacy POS system, feeding downstream order and revenue analytics.
  properties:
  - name: order_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 4000 against row_count 5000, and samples
      like ORD-100001 show a stable order identifier that repeats across line items.
  - name: line_no
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_count is 7 with values 1 through 7 and null_rate 0.0, consistent
      with a line-item sequence number within an order.
  - name: sku
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 320; samples mix numeric codes like
      10002 and 85123A with non-product entries like BANK CHARGES and DOT, so the column is
      retained as text.
  - name: qty
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.002 and samples disagree in form, mixing integers, a decimal
      '2.0', a negative '-3', and the text 'three', so it is kept as text rather than cast
      to a number.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: null_rate is 0.0 with min -5.0 and max 1250.0 and consistent decimal samples,
      supporting a cast from DECIMAL(38,9) to DECIMAL(12,2); the negative minimum is retained
      as-is since no imputation is permitted.
  - name: order_ts
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 with distinct_count 1880 and all samples are ISO-shaped
      'YYYY-MM-DD HH:MM:SS' strings, supporting a safe cast to TIMESTAMP.
  - name: ship_date
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.264 and samples show disagreeing formats such as '01/07/2024',
      '07.01.2024', '2024-01-07', 'Jan 9 2024', 'TBD', and empty strings, so a date cast is
      unsafe and the column is kept as text.
  - name: customer_email
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.97, so the column is sparsely populated; samples show well-formed
      email addresses when present.
  - name: notes
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.61 with distinct_count 2100; samples include free text such
      as 'Call before delivery' and one truncated value, plus a sample containing instruction-like
      text that is treated strictly as untrusted source data, not an instruction.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 but distinct_values show inconsistent casing (CANCELLED,
      Shipped, cancelled, pending, shipped) for only 5 distinct states, so the column is retained
      as text pending a reviewer-approved normalization rule.
  - name: is_gift
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.012 and distinct_values show inconsistent boolean-like encodings
      (N, Y, no, yes), so the raw column is kept as text and a derived flag is provided separately.
  - name: is_gift_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Derived from is_gift distinct_values Y/yes mapping to true and N/no mapping
      to false; the 60 null is_gift values (null_rate 0.012) propagate as null in the flag.
  - name: source_system
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count is 1 with the single value 'legacy_pos' and null_rate 0.0,
      so it is retained as a constant lineage marker.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (order_id, line_no) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT order_id, line_no
        FROM silver.silver_order_lines
        GROUP BY order_id, line_no
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
