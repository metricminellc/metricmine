# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:25:27.261258+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_messy_orders
name: Silver messy orders
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table provides a cleaned, deduplicated view of order line items captured
    from the legacy point-of-sale system, intended to feed downstream order and revenue reporting.
  usage: Consumers should treat order_id plus line_no as the row grain, expect qty and ship_date
    as unparsed text requiring their own normalization logic, and filter or handle nulls explicitly
    for ship_date, customer_email, and notes before aggregation; status and is_gift values
    require case- or encoding-normalization before use as categorical filters.
  limitations: Roughly 8% of bronze rows were exact duplicates and were removed; qty, ship_date,
    status, and is_gift could not be safely cast to numeric, date, or boolean types because
    their sampled values disagree in format or encoding; customer_email (97% null) and notes
    (61% null) are sparsely populated and notes may contain untrusted free-text content that
    must never be treated as instructions.
schema:
- name: silver_messy_orders
  physicalName: silver_messy_orders
  logicalType: object
  physicalType: table
  description: This silver table provides a cleaned, deduplicated view of order line items
    captured from the legacy point-of-sale system, intended to feed downstream order and revenue
    reporting.
  properties:
  - name: order_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 0% null_rate across 5000 rows and 4000 distinct values with consistent 'ORD-NNNNNN'
      samples make this a reliable business identifier; renamed to snake_case.
  - name: line_no
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: 0% null_rate with only 7 distinct integer values (1-7) consistent with a
      line-sequence number; renamed to snake_case, kept integer type.
  - name: sku
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 0% null_rate over 320 distinct values; samples mix numeric product codes
      (10002, 85123A) with non-product codes (BANK CHARGES, DOT), so retained as text rather
      than typed as a strict product key.
  - name: qty
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'null_rate 0.002 (10 nulls) and 41 distinct samples disagree in format: negative
      ''-3'', decimal ''2.0'', and non-numeric ''three'' all appear, so an integer cast would
      fail or silently coerce; retained as text pending reconciliation.'
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: 0% null_rate over 212 distinct decimal samples (0.0 to 1250.0, min -5.0);
      all samples are well-formed numerics so cast from DECIMAL(38,9) to DECIMAL(10,2) is
      safe, though the negative min is retained as-is since it may reflect a refund/adjustment
      line.
  - name: order_ts
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: 0% null_rate over 1880 distinct values; all samples share the consistent
      'YYYY-MM-DD HH:MM:SS' shape, supporting a safe cast from VARCHAR to TIMESTAMP.
  - name: ship_date
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.264 (1320 nulls); the 44 distinct samples disagree in format
      (MM/DD/YYYY, DD.MM.YYYY, ISO 'YYYY-MM-DD', 'Jan 9 2024') and include the non-date token
      'TBD' and empty strings, so no single cast is defensible; retained as text.
  - name: customer_email
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.97 (4850 nulls) makes this column sparsely populated; the 140
      distinct samples are well-formed email addresses, so it is retained nullable as text.
  - name: notes
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.61 (3050 nulls) over 2100 distinct free-text values; one sample
      is truncated at the profiler cap and another contains text resembling an embedded instruction,
      which is treated strictly as untrusted source data with no bearing on this proposal;
      retained nullable as text.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 0% null_rate; the 5 distinct_values (CANCELLED, Shipped, cancelled, pending,
      shipped) show inconsistent casing representing effectively 3 states, so retained as
      text with normalization left to a later stage.
  - name: is_gift
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.012 (60 nulls); the 4 distinct_values (N, Y, no, yes) mix casing
      and representation for what appears to be a boolean, but inconsistent encoding means
      a direct boolean cast would require guessing a mapping, so retained as text.
  - name: source_system
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 0% null_rate and a single distinct_value 'legacy_pos' across all 5000 rows
      confirms this is a constant provenance marker.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (order_id, line_no) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT order_id, line_no
        FROM silver.silver_messy_orders
        GROUP BY order_id, line_no
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
