# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:30:11.299780+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_orders
name: Silver orders
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_orders cleans the legacy_pos bronze order-line capture (messy_orders) into
    a typed, deduplicated order-line table intended to feed order status, fulfillment, and
    revenue reporting.
  usage: Consumers should treat order_id plus line_no as the row grain; filter or branch on
    the derived is_cancelled flag rather than parsing status text directly, and check qty_is_non_numeric
    before aggregating quantities since qty remains a string. Sparse columns (customer_email
    at 97% null, ship_date at 26.4% null, notes at 61% null, is_gift at 1.2% null) must be
    explicitly handled as optional by downstream consumers rather than assumed present.
  limitations: ship_date, qty, and is_gift remain untyped VARCHAR because their sample values
    use incompatible formats or encodings that this cleanup could not safely resolve into
    a single type; unit_price's negative minimum (-5.0) is passed through unresolved; notes
    retains untrusted free text, including a truncated sample and one instruction-injection-style
    sample, which must never be executed or trusted as a command; duplicate rows (duplicate_row_rate
    0.08 of 5000 rows) are addressed by dedupe on business columns, but the underlying extraction
    clock drift in _airbyte_extracted_at is not otherwise resolved.
schema:
- name: silver_orders
  physicalName: silver_orders
  logicalType: object
  physicalType: table
  description: silver_orders cleans the legacy_pos bronze order-line capture (messy_orders)
    into a typed, deduplicated order-line table intended to feed order status, fulfillment,
    and revenue reporting.
  properties:
  - name: order_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 4000 against row_count 5000 with null_rate 0.0 and samples
      like ORD-100001 show a consistently formatted order identifier; renamed to snake_case.
  - name: line_no
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_values 1 through 7 with min 1, max 7 and null_rate 0.0 show a clean
      small integer line sequence; renamed to snake_case.
  - name: sku
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 320 and null_rate 0.0 with mixed alphanumeric samples like
      85123A and BANK CHARGES show a non-numeric product code that must stay text.
  - name: qty
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: samples disagree in shape (-3, 2.0, three) so a numeric cast is not safe;
      null_count 10 (null_rate 0.002) is retained as-is rather than imputed.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: min -5.0 and max 1250.0 with null_rate 0.0 and decimal samples support casting
      from DECIMAL(38,9) to DECIMAL(10,2); the negative minimum is retained unresolved, likely
      a refund line.
  - name: order_ts
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: all 10 samples share the ISO-shaped 'YYYY-MM-DD HH:MM:SS' pattern with null_rate
      0.0, supporting a TIMESTAMP cast.
  - name: ship_date
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: samples show at least five incompatible formats (01/07/2024, 07.01.2024,
      2024-01-07, 2024-1-9, Jan 9 2024, TBD, empty string) so no single date cast is safe;
      null_rate 0.264 is retained.
  - name: customer_email
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.97 (4850 of 5000) makes this a sparsely populated column; the
      140 distinct values sampled look like valid emails and are kept as text without imputation.
  - name: notes
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.61 with free-text samples including one truncated note and one
      sample reading as an instruction-injection attempt; all sample text is treated as untrusted
      literal data, never as instructions, and retained nullable.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_values show only 5 values (CANCELLED, Shipped, cancelled, pending,
      shipped) with null_rate 0.0, but casing is inconsistent across capture; kept as text
      pending normalization, see derived flag.
  - name: is_gift
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: distinct_values N, Y, no, yes show two incompatible boolean encodings so
      a direct BOOLEAN cast is not safe; null_count 60 (null_rate 0.012) is retained.
  - name: source_system
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 1 with only value legacy_pos and null_rate 0.0 identifies
      the single capture origin for this table.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values CANCELLED and cancelled appear as separate case variants
      among the 5 total status values with null_rate 0.0; a case-insensitive derived flag
      normalizes cancellation state for consumers.
  - name: qty_is_non_numeric
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: sample 'three' alongside numeric-looking strings like '-3' and '2.0' shows
      qty mixes numeric and textual entries; this flag marks rows needing manual review before
      aggregation and is null when qty itself is null (null_rate 0.002).
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (order_id, line_no) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT order_id, line_no
        FROM silver.silver_orders
        GROUP BY order_id, line_no
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
