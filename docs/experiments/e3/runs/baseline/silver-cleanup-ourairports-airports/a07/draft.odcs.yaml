# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:08:30.552100+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airports
name: Silver airports
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides one row per airport with cleaned identity, location, and classification
    attributes, feeding downstream analytics and joins to flight or route data keyed on airport_id.
  usage: Join on airport_id (the declared grain); treat local_code, home_link, keywords, icao_code,
    gps_code, municipality, and elevation_ft as optionally null and filter or coalesce as
    needed, and use has_scheduled_service to distinguish airports with scheduled commercial
    service.
  limitations: Pipeline metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped entirely; local_code (63.7% null), home_link (74.9% null), and keywords (68.0%
    null) remain sparsely populated and were not backfilled or imputed; no duplicate rows
    were found (duplicate_row_rate 0.0) so no dedupe logic was applied.
schema:
- name: silver_airports
  physicalName: silver_airports
  logicalType: object
  physicalType: table
  description: This table provides one row per airport with cleaned identity, location, and
    classification attributes, feeding downstream analytics and joins to flight or route data
    keyed on airport_id.
  properties:
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 9057 equals row_count 9057 with null_rate 0.0, and all samples
      ('10309','1058','111',...) are integral strings, so this is the unique numeric identifier
      for the row.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 matches row_count with null_rate 0.0; samples like '03N','07FA'
      are alphanumeric airport idents, not safely castable to a numeric type.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Enumerated to 5 distinct_values (heliport, large_airport, medium_airport,
      seaplane_base, small_airport) with null_rate 0.0.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9006 of 9057 rows with null_rate 0.0; free-text airport names
      such as '28 de Noviembre Airport'.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0, min -79.777778 and max 82.517263, and all samples carry at
      most 6 decimal places, supporting a tighter DECIMAL(9,6) than the landed DECIMAL(38,9).
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0, min -179.876999 and max 179.9757, with samples showing at
      most 6 decimal places, supporting DECIMAL(9,6).
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.036988 (335 nulls) is retained as nullable; samples (-1266.0,-210.0,-182.0,...)
      are all integral despite the decimal physical type, supporting a cast to INTEGER for
      a feet measurement.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 7 distinct_values (AF,AN,AS,EU,NA,OC,SA) with null_rate 0.0.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 239 with null_rate 0.0; samples are ISO country codes such
      as AD, AE, AF.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 2169 with null_rate 0.0; samples such as AD-08, AE-AZ are
      region codes.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.039748 (360 nulls of 9057) retained as nullable; distinct_count
      8049 with samples like 'Aalborg','Aarhus'.
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Only 2 distinct_values ('no','yes') with null_rate 0.0, so the column maps
      cleanly to a boolean flag.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.136579 (1237 nulls) retained as nullable; distinct_count 7820
      with samples like AGAF, AGAR.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 matches row_count with null_rate 0.0; samples such as
      AAA, AAB show short alpha codes.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.053881 (488 nulls) retained as nullable; distinct_count 8569
      with samples like 03N, 05AA.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.636635 (5766 nulls) is the highest among non-metadata columns;
      sparsely populated but retained as nullable per policy, with samples like 00C, 00F.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.749034 (6784 nulls) makes this a sparse column, retained as nullable;
      samples are URLs like http://GillespieField.com/.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.130838 (1185 nulls) retained as nullable; distinct_count 7870
      with URL samples like http://de.wikipedia.org/wiki/Albertus_Airport.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.679585 (6155 nulls) is sparse free text, retained as nullable;
      samples mix codes and names such as '06AZ' and quoted military-base names.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (airport_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT airport_id
        FROM silver.silver_airports
        GROUP BY airport_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: silver-cleanup-proposer
- property: proposerVersion
  value: 0.1.0
- property: promptVersion
  value: 1.0.0
- property: modelId
  value: claude-sonnet-5
- property: profileHash
  value: sha256:113a01272f19c485ada9b62583be7449fbfd55b60fb304b18139a17614cf0ec2
- property: proposedAt
  value: '2026-10-23'
- property: proposerStance
  value: cleanup
- property: decisionExactDuplicates
  value: no-duplicates-found
- property: decisionGrain
  value: airport-id-is-grain
- property: decisionDropMetadata
