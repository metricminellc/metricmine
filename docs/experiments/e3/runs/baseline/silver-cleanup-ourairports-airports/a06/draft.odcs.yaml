# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:07:40.999828+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airports
name: Silver airports
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, deduplicated registry of global airports sourced
    from OurAirports, giving downstream consumers a reliable per-airport record keyed by a
    unique numeric id for joining against flight, route, and location datasets.
  usage: Join on the id grain key for a one-row-per-airport relationship; consumers should
    expect nullable fields such as elevation_ft, icao_code, gps_code, local_code, home_link,
    wikipedia_link, and keywords and must handle nulls explicitly rather than assuming full
    coverage, especially for local_code and home_link which are missing in over 60% and 70%
    of rows respectively.
  limitations: No duplicate rows were found in bronze (duplicate_row_rate 0.0) so no row-level
    dedupe logic was applied beyond declaring the grain; several descriptive columns remain
    sparsely populated (local_code 63.7% null, home_link 74.9% null, keywords 68.0% null)
    and were retained as-is rather than backfilled, and truncation markers in long text samples
    were not used to infer type or completeness.
schema:
- name: silver_airports
  physicalName: silver_airports
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, deduplicated registry of global airports sourced
    from OurAirports, giving downstream consumers a reliable per-airport record keyed by a
    unique numeric id for joining against flight, route, and location datasets.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: All 10 sampled values (e.g. '10309','1058','111') are integral digit strings
      with distinct_count 9057 equal to row_count 9057 and null_rate 0.0, supporting a safe
      cast from VARCHAR to INTEGER as the unique row identifier.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Alphanumeric airport identifier (samples '03N','07FA','0CO2') with distinct_count
      9057 equal to row_count and null_rate 0.0; kept as text since values are not purely
      numeric.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Enumerated with only 5 distinct_values (heliport, large_airport, medium_airport,
      seaplane_base, small_airport) and null_rate 0.0.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Free-text airport name, distinct_count 9006 out of 9057 rows, null_rate 0.0.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: true
    description: Numeric coordinate ranging from min -79.777778 to max 82.517263 with null_rate
      0.0, kept as DECIMAL per landed precision.
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: true
    description: Numeric coordinate ranging from min -179.876999 to max 179.9757 with null_rate
      0.0, kept as DECIMAL per landed precision.
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sampled values are all whole-number feet (e.g. -1266.0, -210.0, 14472.0 max)
      supporting a cast from DECIMAL(38,9) to INTEGER; null_rate 0.036988 (335 nulls) means
      elevation is sometimes unknown and must stay nullable.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Enumerated with 7 distinct_values (AF, AN, AS, EU, NA, OC, SA) and null_rate
      0.0.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: ISO country code, distinct_count 239, null_rate 0.0, samples like 'AD','AE','AF'
      confirm text code format.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: ISO region code, distinct_count 2169, null_rate 0.0, samples like 'AD-08','AE-AZ'
      confirm text code format.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text municipality name, null_rate 0.039748 (360 nulls), retained as
      nullable since absence does not invalidate the row.
  - name: scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Only 2 distinct_values ('no','yes') with null_rate 0.0, safely cast from
      VARCHAR to BOOLEAN.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ICAO code, null_rate 0.136579 (1237 nulls), samples like 'AGAF','AGAR' confirm
      text format; retained nullable since not every airport has one.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: IATA code, distinct_count 9057 equal to row_count with null_rate 0.0, samples
      like 'AAA','AAB' confirm text format.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: GPS code, null_rate 0.053881 (488 nulls), retained nullable since coverage
      is incomplete.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Local code is sparsely populated with null_rate 0.636635 (5766 nulls); retained
      as nullable text rather than imputed or dropped.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Website URL, sparsely populated with null_rate 0.749034 (6784 nulls); kept
      nullable, samples confirm URL text format.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Wikipedia URL, null_rate 0.130838 (1185 nulls); kept nullable, samples confirm
      URL text format.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text keyword list, sparsely populated with null_rate 0.679585 (6155
      nulls); retained as nullable text, samples show mixed alpha-numeric content.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
