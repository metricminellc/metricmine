# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:02:33.164648+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_airports
name: Silver ourairports airports
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned airport reference data sourced from OurAirports via
    Airbyte, giving downstream geospatial and airport-lookup analytics a typed, deduplicated
    base of airport identity, location, and code attributes.
  usage: Consumers should join on airport_id as the primary key, be prepared to handle nulls
    in elevation_ft, municipality, icao_code, gps_code, local_code, home_link, wikipedia_link,
    and keywords, and use has_scheduled_service as a boolean filter for commercial-service
    airports.
  limitations: Cleanup could not resolve the high sparsity of local_code (63.66% null) and
    home_link (74.90% null), which remain nullable rather than imputed; no duplicate rows
    were found (duplicate_row_rate 0.0) so no dedupe logic was applied; airbyte metadata columns
    were dropped entirely and are unavailable downstream.
schema:
- name: silver_ourairports_airports
  physicalName: silver_ourairports_airports
  logicalType: object
  physicalType: table
  description: This table provides cleaned airport reference data sourced from OurAirports
    via Airbyte, giving downstream geospatial and airport-lookup analytics a typed, deduplicated
    base of airport identity, location, and code attributes.
  properties:
  - name: airport_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: id has null_rate 0.0 and distinct_count 9057 equal to row_count 9057, and
      all sampled values are numeric strings like '10309' and '111', so it is cast to INTEGER
      and renamed airport_id to serve as the grain key.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: ident has null_rate 0.0 and distinct_count 9057 but samples include alphanumeric
      codes such as '03N', '07FA', '0CO2', so it is kept as text rather than cast to a numeric
      type.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: type has null_rate 0.0 and only 5 distinct_values (heliport, large_airport,
      medium_airport, seaplane_base, small_airport), so it is kept as a low-cardinality string
      category.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: name has null_rate 0.0 and distinct_count 9006 close to row_count 9057, with
      free-text samples like '28 de Noviembre Airport', so it is kept as text.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: latitude_deg has null_rate 0.0, min -79.777778 and max 82.517263, so it is
      cast from DECIMAL(38,9) to the standard DECIMAL(9,6) geographic precision.
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: longitude_deg has null_rate 0.0, min -179.876999 and max 179.9757, so it
      is cast from DECIMAL(38,9) to the standard DECIMAL(9,6) geographic precision.
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: elevation_ft has null_rate 0.036988 (335 nulls) and all sampled values are
      integral (-1266.0, -210.0, ..., max 14472.0), so it is cast to INTEGER and nulls are
      retained for unknown elevations.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: continent has null_rate 0.0 and only 7 distinct_values (AF, AN, AS, EU, NA,
      OC, SA), so it is kept as a low-cardinality string.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: iso_country has null_rate 0.0 and distinct_count 239, consistent with ISO
      country codes, so it is kept as text.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: iso_region has null_rate 0.0 and distinct_count 2169, with samples like 'AD-08'
      and 'AE-AZ', so it is kept as text.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: municipality has null_rate 0.039748 (360 nulls), so it is kept nullable text.
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: scheduled_service has null_rate 0.0 and only two distinct_values ('no','yes'),
      supporting a cast to BOOLEAN under the renamed has_scheduled_service.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: icao_code has null_rate 0.136579 (1237 nulls), so it is kept nullable text.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: iata_code has null_rate 0.0 and distinct_count 9057 equal to row_count 9057,
      so it is kept as a fully populated text column.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: gps_code has null_rate 0.053881 (488 nulls), so it is kept nullable text.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: local_code has null_rate 0.636635 (5766 nulls), making it sparsely populated,
      so it is retained nullable rather than dropped.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: home_link has null_rate 0.749034 (6784 nulls), the sparsest non-metadata
      column, so it is retained nullable text.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: wikipedia_link has null_rate 0.130838 (1185 nulls), so it is kept nullable
      text.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: keywords has null_rate 0.679585 (6155 nulls), making it sparsely populated,
      so it is retained nullable text.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (airport_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT airport_id
        FROM silver.silver_ourairports_airports
        GROUP BY airport_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
