# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:04:35.246656+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airports
name: Silver airports
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides one cleaned, deduplicated record per airport sourced from the
    OurAirports bronze feed, carrying identifiers, codes, geolocation, administrative placement,
    and reference links for downstream geospatial and reference joins.
  usage: Join on id as the declared grain key; treat icao_code, gps_code, local_code, home_link,
    wikipedia_link, and keywords as optionally present and filter or coalesce as needed since
    each carries a nonzero null rate; has_scheduled_service is a boolean derived from the
    original yes/no text flag.
  limitations: No bronze duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic
    was applied; local_code (63.7% null), home_link (74.9% null), and keywords (68.0% null)
    remain sparsely populated and were not imputed or dropped, so consumers must handle missingness
    explicitly.
schema:
- name: silver_airports
  physicalName: silver_airports
  logicalType: object
  physicalType: table
  description: This table provides one cleaned, deduplicated record per airport sourced from
    the OurAirports bronze feed, carrying identifiers, codes, geolocation, administrative
    placement, and reference links for downstream geospatial and reference joins.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 9057 equals dataset.row_count 9057 with null_rate 0.0, and
      all sample_values ('10309','10366','1058',...) are purely numeric strings, so the landed
      VARCHAR can be safely cast to INTEGER as the unique row identifier.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and samples ('03N','07FA','0CO2','0NM0') mix letters, digits,
      and leading zeros, so it must stay text; distinct_count 9057 matches row_count, confirming
      it is a well-populated code field.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count is 5 with a closed distinct_values set ('heliport','large_airport','medium_airport','seaplane_base','small_airport')
      and null_rate 0.0, so it is retained as a required categorical string.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 9006 close to row_count 9057 show this is
      the near-unique airport display name, retained as free text.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0 and min/max of -79.777778 to 82.517263 fit within a 6-decimal
      degree range, so the landed DECIMAL(38,9) is tightened to DECIMAL(9,6) without loss.
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0 and min/max of -179.876999 to 179.9757 fit within a 6-decimal
      degree range, so the landed DECIMAL(38,9) is tightened to DECIMAL(9,6).
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values are all whole-number decimals (-1266.0,-210.0,-182.0,...) so
      DECIMAL(38,9) is cast down to INTEGER; null_rate is 0.036988 (335 nulls) so the column
      stays nullable.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 7 with a closed set of continent codes ('AF','AN','AS','EU','NA','OC','SA')
      and null_rate 0.0 make this a required categorical string.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 239 matching the universe of ISO country
      codes (samples 'AD','AE','AF',...) support a required string.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with samples like 'AD-08','AE-AZ' showing a consistent country-region
      code format justify keeping this required string as-is.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.039748 (360 nulls) so the column is retained nullable rather
      than required.
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values is exactly ['no','yes'] with null_rate 0.0, a clean binary
      domain that casts safely to BOOLEAN.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.136579 (1237 nulls) so this stays a nullable string rather
      than required.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count 9057 equals row_count, so every row carries
      a value and the column is required text.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.053881 (488 nulls) so the column is retained as nullable text.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.636635 (5766 nulls), well above 0.5, so the column is sparsely
      populated but retained nullable per the no-imputation rule.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.749034 (6784 nulls), well above 0.5, so this URL column is
      sparsely populated but retained nullable rather than dropped.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.130838 (1185 nulls), so this URL column is retained nullable.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.679585 (6155 nulls), above 0.5, and samples show free-form,
      variable-length text, so it is retained nullable and sparsely populated.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
