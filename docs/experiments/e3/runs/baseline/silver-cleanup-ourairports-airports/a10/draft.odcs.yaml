# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:11:10.519814+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_airports
name: Silver ourairports airports
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed airport reference data (identifiers, location,
    administrative codes, and descriptive metadata) sourced from the OurAirports bronze feed,
    intended to feed downstream geospatial lookups and airport-based analytics.
  usage: Consumers should join on id as the unique airport key; treat nullable columns (elevation_ft,
    municipality, icao_code, gps_code, local_code, home_link, wikipedia_link, keywords) as
    optionally populated and handle nulls explicitly rather than assuming completeness, and
    use has_scheduled_service to filter airports with scheduled commercial service.
  limitations: local_code (63.7% null), home_link (74.9% null), and keywords (68.0% null)
    are sparsely populated and cannot be backfilled from this source; the elevation_ft cast
    to INTEGER assumes all values are whole feet based on observed samples and may need revisiting
    if fractional values surface in unsampled rows; dataset.duplicate_row_rate is 0.0 so no
    dedupe logic was applied.
schema:
- name: silver_ourairports_airports
  physicalName: silver_ourairports_airports
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed airport reference data (identifiers, location,
    administrative codes, and descriptive metadata) sourced from the OurAirports bronze feed,
    intended to feed downstream geospatial lookups and airport-based analytics.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with distinct_count 9057 equal to row_count 9057, and sample
      values (10309, 10366, 10532, 1058...) are all integral strings supporting a VARCHAR
      to INTEGER cast.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 9057 equal to row_count; alphanumeric samples
      (03N, 07FA, 0CO2, 0NM0) are not uniformly integral so the column stays text.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 5 with enumerated distinct_values (heliport, large_airport,
      medium_airport, seaplane_base, small_airport) and null_rate 0.0.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 9006 close to row_count 9057, free-text airport
      names such as 'Aalborg Airport' and 'A Coruña Airport'.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: true
    description: null_rate 0.0, range -79.777778 to 82.517263 matches expected latitude values,
      retained as DECIMAL(38,9).
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: true
    description: null_rate 0.0, range -179.876999 to 179.9757 matches expected longitude values,
      retained as DECIMAL(38,9).
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.036988 (335 of 9057 nulls); samples (-1266.0, -210.0, -182.0,
      ..., -70.0) are all whole numbers supporting a DECIMAL to INTEGER cast, with existing
      nulls retained.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 7 with distinct_values (AF, AN, AS, EU, NA, OC, SA) and null_rate
      0.0.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 239, null_rate 0.0, samples are ISO country codes (AD, AE,
      AF, AG...).
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 2169, null_rate 0.0, samples like AD-08, AE-AZ, AE-DU show
      region subdivision codes.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.039748 (360 nulls), distinct_count 8049; retained nullable for
      occasionally missing municipality names.
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly {no, yes} with null_rate 0.0, supporting a boolean
      cast and a rename that reflects the field's meaning.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.136579 (1237 nulls), distinct_count 7820; retained nullable.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 9057 equal to row_count; alphabetic samples
      (AAA, AAB, AAC) are not integral so the column stays text.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.053881 (488 nulls), distinct_count 8569; retained nullable.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.636635 (5766 nulls) is high; column is sparsely populated but
      retained nullable, with samples like 00C, 00F, 03N.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.749034 (6784 nulls) is very sparse; retained nullable, samples
      are URLs such as http://GillespieField.com/.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.130838 (1185 nulls); retained nullable, samples are wikipedia
      article URLs.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.679585 (6155 nulls) is high; sparsely populated free-text column
      retained nullable, with varied samples like 06AZ and 119th Wing, Happy Hooligans.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
