# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:10:24.848146+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airports
name: Silver airports
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, deduplicated catalog of global airports sourced
    from the OurAirports bronze landing table, intended to feed downstream geospatial and
    operational analytics such as route planning, airport lookups, and regional aviation reporting.
  usage: Consumers should treat id as the unique row identifier, join on it when linking to
    other airport-scoped datasets, and expect nullable text fields (icao_code, gps_code, local_code,
    home_link, wikipedia_link, keywords, municipality) to require explicit null handling since
    they are sparsely populated in source data.
  limitations: No duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic was
    applied; local_code, home_link, and keywords remain highly sparse (63.7%, 74.9%, and 68.0%
    null respectively) and were not imputed or dropped, so downstream consumers must handle
    their absence explicitly; elevation_ft retains a 3.7% null rate reflecting missing survey
    data.
schema:
- name: silver_airports
  physicalName: silver_airports
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, deduplicated catalog of global airports sourced
    from the OurAirports bronze landing table, intended to feed downstream geospatial and
    operational analytics such as route planning, airport lookups, and regional aviation reporting.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 9057 equals row_count 9057 with null_rate 0.0, indicating
      a unique non-null identifier retained as text.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 equals row_count with null_rate 0.0; samples like '03N',
      '07FA' show alphanumeric airport idents that must stay text.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Only 5 enumerated distinct_values (heliport, large_airport, medium_airport,
      seaplane_base, small_airport) with null_rate 0.0.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9006 out of 9057 rows, null_rate 0.0; free-text airport names
      such as '28 de Noviembre Airport' confirm text type.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0; samples such as -79.777778 and max 82.517263 fit within 6
      decimal places, so the landed DECIMAL(38,9) is narrowed to DECIMAL(9,6).
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0; samples such as -179.876999 and max 179.9757 fit within 6
      decimal places, so the landed DECIMAL(38,9) is narrowed to DECIMAL(9,6).
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values (-1266.0, -210.0, ... -70.0) are integral despite the DECIMAL(38,9)
      landing type, and null_rate is 0.036988 (335 nulls), so the column is cast to INTEGER
      and kept nullable.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 7 enumerated distinct_values (AF, AN, AS, EU, NA, OC, SA) with null_rate
      0.0.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 239 with null_rate 0.0; samples like 'AD', 'AE' confirm ISO
      country codes kept as text.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 2169 with null_rate 0.0; samples like 'AD-08', 'AE-AZ' confirm
      region codes kept as text.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.039748 (360 nulls) out of 9057 rows; retained nullable as a free-text
      city name.
  - name: scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Only 2 distinct_values ('no','yes') with null_rate 0.0, so the text flag
      is cast to BOOLEAN.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.136579 (1237 nulls); samples like 'AGAF', 'AGAT' confirm text
      ICAO codes, retained nullable.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 equals row_count with null_rate 0.0; samples like 'AAA',
      'AAB' confirm unique text codes.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.053881 (488 nulls); retained nullable text column.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.636635 (5766 nulls) is well above 0.5, so the column is sparsely
      populated but retained nullable rather than dropped.
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.749034 (6784 nulls) is well above 0.5, so the column is sparsely
      populated but retained nullable as it still carries valid URLs in samples.
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.130838 (1185 nulls); retained nullable text URLs.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.679585 (6155 nulls) is well above 0.5, so the column is sparsely
      populated but retained nullable free-text keywords.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
