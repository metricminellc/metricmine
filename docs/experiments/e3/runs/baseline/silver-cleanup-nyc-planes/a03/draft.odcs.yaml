# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, deduplicated reference of aircraft tail numbers
    and their airframe/engine characteristics (manufacturer, model, year, engine configuration,
    seats) to support joins against flight event tables in downstream analytics.
  usage: Join on tailnum to enrich flight records with aircraft attributes; treat year and
    speed as nullable and filter or coalesce them explicitly before aggregation, and be aware
    speed is populated for less than 1% of rows so it is unsuitable as a primary analytic
    field without further sourcing.
  limitations: speed is null for 99.3076% of rows (3299 of 3322) and should not be relied
    on for broad analysis; year is missing for 2.1072% of rows; no duplicate rows were found
    in bronze (duplicate_row_rate 0.0) so no dedupe logic was needed, but this was not independently
    re-verified beyond the profile's reported rate.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, deduplicated reference of aircraft tail numbers
    and their airframe/engine characteristics (manufacturer, model, year, engine configuration,
    seats) to support joins against flight event tables in downstream analytics.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: tailnum has null_rate 0.0 and distinct_count 3322, exactly matching the table's
      row_count of 3322, making it a reliable unique aircraft identifier.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: year is landed as DECIMAL(38,9) but every sample (1956.0-2013.0) is an integral
      value, so it casts cleanly to INTEGER; null_rate is 0.021072 (70 of 3322 rows null)
      so it stays nullable.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: type has null_rate 0.0 and only 3 distinct_values (Fixed wing multi engine,
      Fixed wing single engine, Rotorcraft), so it is kept as a required categorical string.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: manufacturer has null_rate 0.0 and 35 distinct values including AIRBUS and
      BOEING from the samples, so it is kept as required.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: model has null_rate 0.0 and 127 distinct values (samples include 150, 172E,
      310Q), so it is kept as required.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: engines is DECIMAL(38,9) but distinct_values are exactly [1.0, 2.0, 3.0,
      4.0], all integral, with null_rate 0.0, so it casts to INTEGER and stays required.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: seats ranges from min 2.0 to max 450.0 with all sampled values integral (2.0-12.0
      shown) and null_rate 0.0, so it casts to INTEGER and stays required.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: speed has null_rate 0.993076 (3299 of 3322 rows null) but the 13 distinct_values
      present (90.0-432.0) are all integral, so it casts to INTEGER while remaining nullable;
      the column is sparsely populated.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: engine has null_rate 0.0 with 6 distinct_values (4 Cycle, Reciprocating,
      Turbo-fan, Turbo-jet, Turbo-prop, Turbo-shaft), so it is kept as required.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
