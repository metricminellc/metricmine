# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:00:43.110250+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed reference data on individual aircraft (tail
    number, manufacturer, model, engine configuration, and capacity) to support joins with
    flight-event fact tables for analyses such as fleet composition, aircraft age, or capacity-weighted
    metrics.
  usage: Join on tailnum, the declared grain key which is unique and non-null across all 3322
    rows. Expect null values in year (about 2.1% missing) and especially in speed (over 99%
    missing), so aggregations over those columns should explicitly handle nulls rather than
    assume full coverage.
  limitations: The speed column is retained despite being populated for less than 1% of rows
    and should not be relied upon for broad analysis without accounting for this sparsity.
    Three Airbyte capture-metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped as non-business artifacts. No duplicate rows were found in bronze (duplicate_row_rate
    0.0), so no dedupe logic was applied.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed reference data on individual aircraft (tail
    number, manufacturer, model, engine configuration, and capacity) to support joins with
    flight-event fact tables for analyses such as fleet composition, aircraft age, or capacity-weighted
    metrics.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0, and distinct_count 3322 equals the table's
      row_count 3322, confirming every tail number is present and unique; samples like N10156
      and N102UW show the FAA tail-number format.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.021072 (70 nulls out of 3322), and all sample values (1956.0,
      1959.0, 1963.0 ... up to max 2013.0) are integral, so the DECIMAL(38,9) manufacture
      year is safely cast to INTEGER while nulls are retained.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with only 3 distinct_values (Fixed wing multi engine, Fixed
      wing single engine, Rotorcraft), a clean low-cardinality categorical column.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 35; samples such as AIRBUS, BOEING,
      and BEECH confirm free-text manufacturer names with no need for casting.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 127; samples like 172E, 310Q, and 421C
      show alphanumeric model codes best kept as text.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_values are exactly 1.0, 2.0, 3.0, 4.0 (min
      1.0, max 4.0), all integral, so the DECIMAL(38,9) engine count casts cleanly to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, min 2.0 and max 450.0, and all sample values (2.0, 4.0,
      5.0 ... 12.0) are integral, supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.993076 (3299 of 3322 rows null), making this column sparsely
      populated, but the 13 distinct_values present (90.0 through max 432.0) are all integral
      so the populated values cast to INTEGER while nulls are retained.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 6 distinct_values (4 Cycle, Reciprocating, Turbo-fan,
      Turbo-jet, Turbo-prop, Turbo-shaft), a clean categorical engine-type column.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
