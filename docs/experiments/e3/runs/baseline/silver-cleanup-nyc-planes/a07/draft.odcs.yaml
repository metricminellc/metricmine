# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:00:14.836853+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_planes
name: Silver planes
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides one cleaned record per aircraft tail number describing its
    registered manufacturer, model, type, engine configuration, seating capacity, manufacture
    year, and cruise speed where known, feeding downstream flight-delay and fleet-analysis
    models that join on tail number.
  usage: Join to flight fact tables on tailnum; treat year and speed as optionally null and
    handle missing values explicitly rather than assuming zero or a default, since speed is
    populated for fewer than 1% of aircraft.
  limitations: speed is populated for only 23 of 3322 aircraft (null_rate 0.993076) and should
    not be used for broad fleet-speed analysis; year is missing for 70 aircraft (null_rate
    0.021072); no duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic was
    applied.
schema:
- name: silver_planes
  physicalName: silver_planes
  logicalType: object
  physicalType: table
  description: This table provides one cleaned record per aircraft tail number describing
    its registered manufacturer, model, type, engine configuration, seating capacity, manufacture
    year, and cruise speed where known, feeding downstream flight-delay and fleet-analysis
    models that join on tail number.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count (3322) equals row_count (3322), so tailnum
      uniquely identifies each aircraft record; samples like 'N10156', 'N102UW' show a consistent
      tail-number format.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but all samples (1956.0, 1959.0, 1963.0, ...) and
      min/max (1956.0-2013.0) are whole-year values, so INTEGER is safe; null_rate 0.021072
      (70 nulls) means manufacture year is unknown for some aircraft and must stay nullable.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_values are exactly the 3 known aircraft categories
      ('Fixed wing multi engine', 'Fixed wing single engine', 'Rotorcraft'), a clean low-cardinality
      classification.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 35 distinct manufacturer names observed (e.g. 'AIRBUS',
      'BOEING', 'BEECH'), a clean categorical text field.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 127 distinct model codes (e.g. '172E', '310Q', '550');
      free-text identifier kept as VARCHAR.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with min 1.0 and max 4.0,
      a clean whole-number engine count with null_rate 0.0, so INTEGER is safe.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: samples (2.0, 4.0, 5.0, ..., 12.0) and min/max (2.0-450.0) are all whole
      numbers with null_rate 0.0, so DECIMAL(38,9) safely casts to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: distinct_values (90.0, 95.0, ..., 432.0) are all whole numbers so INTEGER
      is appropriate, but null_rate is 0.993076 (3299 of 3322 rows null), so speed is sparsely
      populated and must remain nullable.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with exactly 6 distinct engine types ('4 Cycle', 'Reciprocating',
      'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft'), a clean categorical field.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
