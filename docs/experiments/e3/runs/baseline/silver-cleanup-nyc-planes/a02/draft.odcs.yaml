# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_planes is a cleaned registry of individual aircraft (tail numbers) used
    by NYC-area flight datasets, feeding downstream joins between flights and the physical
    aircraft that flew them.
  usage: Join to flight-level fact tables on tailnum; treat year and speed as optionally null
    and filter or coalesce them before aggregation, since speed is populated for under 1%
    of rows and year is missing for about 2% of rows.
  limitations: Pipeline metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped and carry no business meaning; speed is retained despite a 99.3% null rate
    because no evidence supported dropping it, so most consumers should not rely on it without
    explicit null handling; no duplicate rows were found so no dedupe logic was needed.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: silver_nyc_planes is a cleaned registry of individual aircraft (tail numbers)
    used by NYC-area flight datasets, feeding downstream joins between flights and the physical
    aircraft that flew them.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count is 3322, exactly matching dataset.row_count of 3322, with
      null_rate 0.0, so tailnum uniquely identifies each aircraft record.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but all sample_values (1956.0, 1959.0, 1963.0, ...)
      are integral manufacture years between min 1956.0 and max 1973.0 shown, so cast to INTEGER;
      null_rate 0.021072 (70 nulls) means the value is retained as nullable.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_values are a closed set of 3 categories (Fixed
      wing multi engine, Fixed wing single engine, Rotorcraft), so kept as required text.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 across 35 distinct manufacturer names (e.g. AIRBUS, BOEING,
      BELL), kept as required text.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 127 distinct model codes such as 172E and 421C, kept
      as required text.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with null_rate 0.0, an integral
      count of engines, so cast DECIMAL(38,9) to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and all 48 distinct values from min 2.0 to max 450.0 sampled
      (2.0, 4.0, 5.0, ...) are integral seat counts, so cast to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.993076 (3299 of 3322 rows null), an extremely sparse column,
      but the 13 distinct_values present (90.0 to 432.0) are integral so it is cast to INTEGER
      and retained nullable rather than dropped.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with a closed set of 6 distinct engine types (4 Cycle, Reciprocating,
      Turbo-fan, Turbo-jet, Turbo-prop, Turbo-shaft), kept as required text.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
