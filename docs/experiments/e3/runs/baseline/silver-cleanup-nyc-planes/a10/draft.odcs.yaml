# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned registry of aircraft referenced by flight records,
    keyed by tail number, feeding downstream flight and aircraft analytics.
  usage: Join on tailnum to enrich flight records with aircraft characteristics such as manufacturer,
    model, engine type, and seat capacity; consumers should expect null values for year (2.1%
    missing) and especially speed (99.3% missing) and handle them explicitly rather than assuming
    presence.
  limitations: Cleanup could not resolve the near-total absence of speed data (null_rate 0.993076)
    or the smaller gap in year (null_rate 0.021072); both columns remain nullable rather than
    imputed. No exact duplicate rows were found (duplicate_row_rate 0.0) so no deduplication
    logic was applied.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: This table provides a cleaned registry of aircraft referenced by flight records,
    keyed by tail number, feeding downstream flight and aircraft analytics.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: tailnum has null_rate 0.0 and distinct_count 3322 equal to row_count 3322,
      uniquely identifying each aircraft record.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: year samples (1956.0, 1959.0, ... 2013.0) are all integral decimals ranging
      min 1956 to max 2013; null_rate 0.021072 (70 of 3322 nulls) means some records lack
      a manufacture year, so cast to INTEGER and retain nulls.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: type has null_rate 0.0 with only 3 distinct values (Fixed wing multi engine,
      Fixed wing single engine, Rotorcraft), a clean low-cardinality category retained as-is.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: manufacturer has null_rate 0.0 and 35 distinct values (e.g. AIRBUS, BOEING,
      BEECH), retained as-is.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: model has null_rate 0.0 and 127 distinct values (e.g. 150, 172E, 310Q), retained
      as-is.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: engines has null_rate 0.0 and only 4 distinct integral values (1.0, 2.0,
      3.0, 4.0) ranging min 1 to max 4, justifying cast to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: seats has null_rate 0.0, 48 distinct integral values ranging min 2 to max
      450 (samples 2.0, 4.0, ... 12.0), justifying cast to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: speed has null_rate 0.993076 (3299 of 3322 nulls) with only 13 distinct integral
      values ranging min 90 to max 432; sparsely populated so cast to INTEGER and retain nulls.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: engine has null_rate 0.0 with 6 distinct values (4 Cycle, Reciprocating,
      Turbo-fan, Turbo-jet, Turbo-prop, Turbo-shaft), retained as-is.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
