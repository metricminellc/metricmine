# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:12:21.906559+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_online_retail_ii cleans the bronze online_retail_ii capture into a deduplicated,
    typed table of retail transaction line items keyed on invoice and stockcode, intended
    to feed sales, returns, and customer behavior analytics.
  usage: Consumers should treat invoice plus stockcode as the unique grain, branch or filter
    on the derived is_return flag when analyzing net sales versus returns, and handle customer_id
    as optional since nearly 30% of rows lack a customer identifier.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188) are dropped but no evidence
    of clock-drift duplicates was found in the airbyte extraction timestamps, so only exact-duplicate
    handling is applied; customer_id remains null for 29.778% of rows and description is null
    for 0.504% of rows, both retained rather than imputed; description and stockcode free-text
    values were not standardized beyond type casting.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: silver_online_retail_ii cleans the bronze online_retail_ii capture into a deduplicated,
    typed table of retail transaction line items keyed on invoice and stockcode, intended
    to feed sales, returns, and customer behavior analytics.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 45228 rows with 2330 distinct values; samples like
      '489434', '489435' confirm a business invoice identifier used as part of the declared
      grain.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with 3141 distinct values including alphanumeric codes like
      '10002R' and '10123C', confirming it is a non-numeric business code kept as string and
      used in the grain.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.005041 (228 nulls of 45228); samples show free-text product
      descriptions with leading spaces, retained nullable since description is not required
      for grain or business logic.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0; all sample values (-1395.0, -1043.0, ... up to max 5184.0)
      are integral despite the landed DECIMAL(38,9) type, justifying a cast to INTEGER.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: quantity's min of -1395.0 shows negative quantities exist in the data with
      zero nulls; a derived boolean flags quantity < 0 as a likely return or cancellation
      line for downstream consumers.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0; samples such as '2009-12-01 07:45:00' through '2009-12-01
      09:50:00' are consistently ISO-shaped timestamps, justifying the cast from VARCHAR to
      TIMESTAMP and the rename to snake_case invoice_date.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0; min 0.0 and max 1998.49 with samples like 0.04, 0.06, 0.18
      show two-decimal monetary values, so precision is narrowed from DECIMAL(38,9) to DECIMAL(10,2).
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.29778 (13468 of 45228 rows), likely representing guest or
      unidentified purchases, so retained nullable; samples (12346.0, 12349.0, ...) are integral
      despite the landed DECIMAL(38,9) type, justifying a cast to INTEGER.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 24 distinct values including 'Australia', 'Austria',
      'Belgium', consistent with a bounded country list; kept as string.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
