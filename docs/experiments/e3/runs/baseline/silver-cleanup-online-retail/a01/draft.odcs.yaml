# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:07:30.509984+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_transactions
name: Silver online retail transactions
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_online_retail_transactions cleans the bronze online_retail_ii invoice line-item
    export, casting numeric and temporal fields to proper types, deriving a return indicator,
    and dropping Airbyte capture metadata, to feed downstream sales and returns analytics.
  usage: Consumers should read one row as an invoice line item keyed by invoice and stockcode,
    filter on is_return to separate return or cancellation lines from net sales when computing
    revenue, and treat customer_id as optional since guest transactions carry no customer
    identifier.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188 across 45228 rows) are removed
    during dedupe; description remains nullable (null_rate 0.005041) and free-text with some
    non-product entries like 'Bank Charges' that were not reclassified; customer_id remains
    nullable at a high null_rate of 0.29778 for guest orders and was not imputed.
schema:
- name: silver_online_retail_transactions
  physicalName: silver_online_retail_transactions
  logicalType: object
  physicalType: table
  description: silver_online_retail_transactions cleans the bronze online_retail_ii invoice
    line-item export, casting numeric and temporal fields to proper types, deriving a return
    indicator, and dropping Airbyte capture metadata, to feed downstream sales and returns
    analytics.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 across 45228 rows with 2330 distinct values and alphanumeric
      samples like 489434-489443; retained as string identifier.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate 0.0 with distinct_count 3141 and mixed alphanumeric codes such
      as 10002R and 10123C, so retained as string rather than cast to numeric.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.005041 (228 nulls) with free-text samples including non-product
      entries like ' Bank Charges'; retained nullable as string with no reclassification attempted.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min -1395.0 and max 5184.0 with all sampled values whole numbers
      (e.g. -1395.0, -1043.0) despite landing as DECIMAL(38,9), justifying cast to INTEGER.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Quantity min of -1395.0 and multiple negative samples (-1043.0, -1012.0,
      -954.0, -770.0) indicate return or cancellation lines; derived flag marks quantity <
      0.
  - name: invoicedate
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0 with consistently ISO-shaped samples like '2009-12-01 07:45:00'
      across all 10 samples, justifying cast from VARCHAR to TIMESTAMP.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate 0.0, min 0.0 and max 1998.49 with two-decimal monetary samples
      (0.04, 0.06 ... 0.18); cast from DECIMAL(38,9) to DECIMAL(10,2) for currency precision.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.29778 (13468 of 45228 rows null) reflects guest checkouts without
      a customer identifier; sampled values (12346.0-12437.0) are whole numbers so cast to
      INTEGER but kept nullable.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with only 24 distinct values such as Australia, Austria, Belgium;
      retained as string.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode
        FROM silver.silver_online_retail_transactions
        GROUP BY invoice, stockcode
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: silver-cleanup-proposer
- property: proposerVersion
  value: 0.1.0
- property: promptVersion
  value: 1.0.0
- property: modelId
  value: claude-sonnet-5
- property: profileHash
  value: sha256:79f801e1d8182ee55a32a0e3323134a27fec839c5a5478edfb8f5683cf5221f0
- property: proposedAt
  value: '2026-10-23'
- property: proposerStance
  value: cleanup
- property: decisionExactDuplicates
  value: dedupe-exact-duplicates
- property: decisionGrain
  value: invoice-stockcode-line-item
- property: decisionNullCustomerId
