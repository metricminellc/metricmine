# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:10:17.663185+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table provides cleaned, consistently typed online retail transaction
    line items (invoice, product, quantity, price, customer, and country) to support downstream
    sales, returns, and customer analytics.
  usage: Consumers should treat the (invoice, stockcode) pair as the working grain for a line
    item, join on customer_id for customer-level analysis while explicitly filtering or handling
    the roughly 29.8% of rows where customer_id is null, and rely on invoicedate as a true
    TIMESTAMP and price as a DECIMAL(10,2) currency amount; negative quantity values represent
    returns or cancellations and must be interpreted accordingly rather than discarded.
  limitations: customer_id is null for about 29.78% of rows (13468 of 45228), representing
    unidentified or guest transactions that are retained rather than imputed; description
    is null for about 0.50% of rows (228 of 45228); approximately 1.12% of bronze rows are
    exact duplicates per the profiled duplicate_row_rate and are removed during cleanup, so
    downstream counts will differ slightly from bronze; the declared (invoice, stockcode)
    grain has not been measured against the full warehouse and may need revision by a reviewer
    if repeated product lines within an invoice are found.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: This silver table provides cleaned, consistently typed online retail transaction
    line items (invoice, product, quantity, price, customer, and country) to support downstream
    sales, returns, and customer analytics.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 and null_count 0 across distinct_count 2330 values; serves
      as the transaction/order identifier for each line item.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate 0.0 with distinct_count 3141; samples like '10002R' and '10123C'
      show alphanumeric variant suffixes, so kept as text rather than numeric.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.005041 (228 of 45228 nulls) is low but nonzero; sample values
      are free-text product names and occasional service entries such as ' Bank Charges',
      so retained nullable as text.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 and all sample values (-1395.0 through 5184.0) are integral
      floats, so DECIMAL(38,9) safely casts to INTEGER; negative values reflect returns/cancellations
      and are retained.
  - name: invoicedate
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0 with distinct_count 2004; all ten samples share the ISO-shaped
      'YYYY-MM-DD HH:MM:SS' format (e.g. '2009-12-01 07:45:00'), supporting a cast from VARCHAR
      to TIMESTAMP.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate 0.0, min 0.0, max 1998.49; cent-level sample values (0.04, 0.06,
      0.08...) support a currency-typed DECIMAL(10,2) rather than the oversized DECIMAL(38,9).
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.29778 (13468 of 45228 nulls) is high, indicating guest or unidentified
      transactions; however sample values (12346.0-18287.0) are integral so the column casts
      to INTEGER while nulls are retained rather than imputed.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with a bounded distinct_count of 24; samples such as 'Australia',
      'Austria', 'Belgium' confirm a small controlled set of country names.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
