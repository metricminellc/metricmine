# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:14:39.655769+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, line-item-level online retail transaction data (invoice,
    product, quantity, price, customer, and country) intended to feed downstream sales, returns,
    and customer analytics.
  usage: Consumers should treat each row as one invoice-stockcode line item, filter on the
    is_return flag when excluding returns from revenue calculations, and expect customer_id
    to be null for roughly 30% of rows representing guest or unidentified purchases.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188) are removed but near-duplicates
    or clock-drift duplicates are not addressed; customer_id remains null for about 29.8%
    of rows and description is null for about 0.5% of rows, both retained rather than imputed;
    the invoice-stockcode grain is a plausible candidate pending verification against the
    live warehouse.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: This table provides cleaned, line-item-level online retail transaction data
    (invoice, product, quantity, price, customer, and country) intended to feed downstream
    sales, returns, and customer analytics.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 2330; all ten sampled values are numeric
      invoice numbers like "489434"-"489443", so it is kept as a string identifier.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with distinct_count 3141; samples include alphanumeric codes
      such as "10123C" and "10123G", confirming this is a text product code, not a numeric
      type.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.005041 with null_count 228 out of 45228 rows; sampled free-text
      descriptions (e.g. " 3 STRIPEY MICE FELTCRAFT") vary in format so the column is retained
      nullable rather than imputed.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and the landed DECIMAL(38,9) samples (-1395.0, -1043.0,
      5184.0 as max) are all integral, so the column is safely cast to INTEGER.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 and samples are consistently ISO-shaped ("2009-12-01 07:45:00"),
      supporting a TIMESTAMP cast; renamed from camel-free but non-snake-case "invoicedate"
      to "invoice_date".
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 with min 0.0 and max 1998.49; sampled values (0.04, 0.06,
      0.08 ...) are two-decimal monetary amounts, justifying DECIMAL(10,2).
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.29778 (null_count 13468 of 45228); landed DECIMAL(38,9) samples
      (12346.0, 12349.0, max 18287.0) are integral so it casts to INTEGER, but nearly 30%
      missing values are retained as nulls rather than imputed.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 24; samples list recognizable country
      names (Australia, Austria, Belgium ...), so the column is kept as text.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Quantity samples include negative values down to min -1395.0 alongside positive
      values up to max 5184.0, indicating returns; this flag marks quantity < 0 for consumer
      filtering.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: silver-cleanup-proposer
- property: proposerVersion
  value: 0.1.0
- property: promptVersion
  value: 1.0.0
- property: modelId
  value: claude-sonnet-5
- property: profileHash
  value: sha256:79f801e1d8182ee55a32a0e3323134a27fec839c5a5478edfb8f5683cf5221f0
- property: proposedAt
  value: '2026-10-23'
- property: proposerStance
