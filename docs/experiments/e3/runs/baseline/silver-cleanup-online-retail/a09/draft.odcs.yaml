# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:15:33.894796+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_online_retail_ii cleans the bronze online_retail_ii capture into analysis-ready
    invoice line items, suitable for revenue, returns, and customer analytics feeding downstream
    retail reporting marts.
  usage: Consumers should treat (invoice, stockcode) as the row grain after exact-duplicate
    removal, filter on is_return_flag = true when return or cancellation lines must be excluded
    from gross sales totals, and handle customer_id nulls (about 30% of rows) as unidentified-customer
    transactions rather than data errors.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188 of 45228 rows) are removed
    during cleanup but no clock-drift correction is applied since _airbyte_extracted_at shows
    only a one-second capture window; description (null_rate 0.005041) and customer_id (null_rate
    0.29778) remain nullable because cleanup does not impute missing values; invoice and stockcode
    remain VARCHAR since alphanumeric codes in the samples prevent numeric casting.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: silver_online_retail_ii cleans the bronze online_retail_ii capture into analysis-ready
    invoice line items, suitable for revenue, returns, and customer analytics feeding downstream
    retail reporting marts.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 and null_count 0 with distinct_count 2330; samples show six-digit
      invoice identifiers (489434-489443), kept as string to preserve any non-numeric invoice
      codes outside the sample.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate 0.0, distinct_count 3141; samples include alphanumeric codes such
      as 10002R, 10123C, 10123G, so the column must remain VARCHAR rather than numeric.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.005041 (228 of 45228 null) with distinct_count 3045; nulls are
      retained since description is informational text, not required for grain or joins.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0; all ten sampled values (-1395.0 through -504.0) are integral
      despite the landed DECIMAL(38,9) type, and min -1395.0 / max 5184.0 fit comfortably
      in INTEGER.
  - name: invoicedate
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0; every sampled value is an ISO-shaped datetime string (e.g.
      2009-12-01 07:45:00), supporting a clean cast from VARCHAR to TIMESTAMP.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate 0.0, min 0.0, max 1998.49; sampled values show at most two decimal
      places (0.04, 0.06, ..., 0.18), supporting DECIMAL(10,2) for monetary precision over
      the landed DECIMAL(38,9).
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.29778 (13468 of 45228 null) with distinct_count 1045; sampled
      values (12346.0-12437.0) are integral so the column casts to INTEGER, but nulls are
      retained to represent unidentified-customer transactions rather than failing the build.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 24; samples list recognizable country names
      (Australia, Austria, Belgium, Channel Islands, ...), kept as string.
  - name: is_return_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Quantity samples include negative values (-1395.0, -1043.0, -1012.0, -954.0,
      -770.0, ... -504.0) with overall min -1395.0, indicating return or cancellation lines;
      is_return_flag marks quantity < 0 so consumers can filter returns deliberately.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
