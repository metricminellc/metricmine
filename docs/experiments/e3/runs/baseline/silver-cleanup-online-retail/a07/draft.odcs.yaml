# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:13:42.060950+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, line-item grain view of online retail transactions
    (invoice plus stock code) with typed dates, quantities, prices and customer identifiers,
    intended to feed sales, returns, and customer analytics.
  usage: Consumers should treat each row as one invoice/stockcode line, use invoice_date as
    a TIMESTAMP for time-based analysis, filter or segment on is_return when excluding or
    isolating return/cancellation activity, and expect customer_id to be null for roughly
    30% of rows representing transactions without an identified customer.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188 of 45228 rows) are dropped
    but the invoice/stockcode grain is not guaranteed fully unique since repeated identical
    line entries within an invoice cannot be distinguished from the available columns; description
    is missing for 0.5% of rows and customer_id is missing for about 29.8% of rows, both retained
    as nulls rather than imputed.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, line-item grain view of online retail transactions
    (invoice plus stock code) with typed dates, quantities, prices and customer identifiers,
    intended to feed sales, returns, and customer analytics.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 45228 rows with 2330 distinct values and samples
      like '489434'-'489443' showing a dense numeric invoice identifier, so it is kept as-is
      and required.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with 3141 distinct alphanumeric codes (e.g. '10002R', '10123C'),
      so it stays VARCHAR and required; mixed alpha suffixes rule out an integer cast.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 228 of 45228 rows are null (null_rate 0.005041) while samples show free-text
      product names, so the column is retained nullable rather than imputed.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: All ten samples (-1395.0 .. -504.0) and the min/max of -1395.0/5184.0 are
      whole numbers landed as DECIMAL(38,9), so an INTEGER cast is supported; null_rate is
      0.0.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Multiple sampled quantity values are negative (e.g. -1395.0, -1043.0, -1012.0),
      a pattern consistent with return/cancellation lines, so a boolean flag is derived as
      quantity < 0 rather than inferred from the invoice text, which the profile does not
      show with a cancellation prefix.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Every sample ('2009-12-01 07:45:00' through '2009-12-01 09:50:00') is an
      unambiguous ISO-shaped timestamp string with null_rate 0.0, so the VARCHAR is renamed
      to snake_case and cast to TIMESTAMP.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: Samples range from 0.0 to 0.18 with two-decimal precision and max is 1998.49,
      min is 0.0, null_rate 0.0, so DECIMAL(10,2) fits the observed monetary values better
      than the landed DECIMAL(38,9).
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (12346.0, 12349.0, ...) are integral and min/max are 12346.0/18287.0,
      but null_rate is 0.29778 (13468 of 45228 rows), so the column is cast to INTEGER but
      kept nullable and sparsely populated rather than required.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with only 24 distinct values (e.g. 'Australia', 'Austria',
      'Belgium'), consistent with a stable low-cardinality country field.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
