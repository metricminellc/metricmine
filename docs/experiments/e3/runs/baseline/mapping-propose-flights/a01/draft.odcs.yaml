# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:24:49.559954+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flights_mapping
name: Gold mapping, flights category
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_flights table enters the gold unified
    event star as the flights fact category, naming the event timestamp, grain, and field
    roles that the deterministic modeling engine consumes to generate the gold fact and its
    dimensions.
  usage: The rendered draft is validated against the frozen mapping-contract schema, checked
    by a validator and datacontract lint, and reviewed and edited by a human before approval;
    only after approval does the modeling engine consume it to generate gold models.
  limitations: This mapping does not filter cancelled flights (is_cancelled) or rows with
    missing actual departure/arrival timing (dep_hhmm, arr_hhmm, dep_delay_minutes, arr_delay_minutes,
    air_time_minutes each roughly 3% null), and it does not resolve aircraft registry gaps
    (aircraft_* columns around 16-17.7% null) or destination reference gaps (dest_* columns
    around 2.1% null); handling of those conditions is left to downstream consumers.
schema:
- name: flights
  logicalType: object
  physicalType: mapping
  description: Each row represents one scheduled commercial flight leg departing from a New
    York-area airport (EWR, JFK, or LGA) during 2013, carrying its scheduling, operational
    timing, delay, aircraft, and origin/destination airport reference attributes.
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - dest_airport
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Calendar date of the scheduled flight, ranging from 2013-01-01 to 2013-06-30
      across 181 distinct dates with no nulls.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter carrier code (16 distinct values such as 9E, AA, DL, UA) identifying
      the operating airline, present on every row.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Operator-assigned flight number ranging 1 to 8500 across 2994 distinct values;
      it labels a flight rather than measuring anything.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport code limited to EWR, JFK, LGA (3 distinct values), present
      on every row.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure time encoded as HHMM (500-2359, 969 distinct values),
      a time label rather than a measure.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Destination airport code with 100 distinct values such as ABQ, ACK, ALB,
      present on every row.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft tail number (3825 distinct values, e.g. D942DN, N0EGMQ), nullable
      in about 0.9% of rows likely when the operating aircraft was not recorded.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag indicating whether the flight was cancelled (true/false), present on
      every row.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure time encoded as HHMM (1-2400), nullable in about 2.9% of
      rows, consistent with flights that never actually departed.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes ranging -33 to 1301 across 469 distinct values,
      nullable in about 2.9% of rows matching missing actual departure times; summed or averaged
      across flights.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival time encoded as HHMM (1-2400), nullable in about 3.07% of
      rows, a time label rather than a measure.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival time encoded as HHMM (1-2359), present on every row.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes ranging -86 to 1272 across 526 distinct values,
      nullable in about 3.3% of rows matching missing actual arrival data; summed or averaged
      across flights.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Flight duration in minutes ranging 20 to 695, nullable in about 3.3% of rows
      matching missing arrival/departure timing data; a duration measure.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance flown in miles ranging 80 to 4983 across 203 distinct
      values, present on every row; a measure summed or averaged across flights.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local scheduled departure hour (5-23, 19 distinct values), a time label rather
      than a measure.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local scheduled departure minute (0-59, 60 distinct values), a time label
      rather than a measure.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Scheduled departure instant in UTC at hour granularity (samples run 2013-01-01T10:00:00
      through 2013-07-01T03:00:00 across 3439 distinct values, each on the hour), the event
      timestamp for this fact.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full carrier name (16 distinct values such as Delta Air Lines Inc., United
      Air Lines Inc.) corresponding to carrier_code, present on every row.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft manufacturer (34 distinct values such as AIRBUS, BOEING), nullable
      in about 16% of rows likely when the tail number did not resolve to a registry entry.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model (121 distinct values such as 172E, 310Q), nullable in about
      16% of rows matching the same missing registry lookups as aircraft_manufacturer.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the aircraft was manufactured (1956-2013, 46 distinct values), nullable
      in about 17.7% of rows; a label year rather than a measure.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Number of seats on the aircraft (2-450, 47 distinct values), nullable in
      about 16% of rows matching missing aircraft registry data; a quantity that can be summed
      or averaged.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft engine type (6 distinct values such as Turbo-fan, Turbo-jet), nullable
      in about 16% of rows matching missing aircraft registry data.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: 'Full origin airport name (3 distinct values: John F. Kennedy International
      Airport, LaGuardia Airport, Newark Liberty International Airport), present on every
      row.'
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin municipality (New York or Newark, 2 distinct values), present on every
      row.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport elevation in feet (13, 18, or 21 ft; 3 distinct values), a
      reference attribute of the airport rather than a flight measure.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport's longest runway length in feet (7002-14511, 3 distinct values),
      a reference attribute of the airport.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full destination airport name (99 distinct values), nullable in about 2.1%
      of rows likely for destinations not matched to the airport reference.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination municipality (95 distinct values), nullable in about 2.1% of
      rows matching missing destination airport reference data.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination ISO region code (45 distinct values such as US-AL, US-CA), nullable
      in about 2.1% of rows matching the same missing destination reference data.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport elevation in feet (3-6606, 90 distinct values), nullable
      in about 2.1% of rows matching missing destination reference data; a reference attribute.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport's longest runway length in feet (5076-16000, 84 distinct
      values), nullable in about 2.1% of rows; a reference attribute.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Ingestion capture timestamp recorded at profiling time (16 distinct values
      spanning 2026-09-02T23:25:51 to 2026-09-02T23:26:06), not the business event time and
      retained only as a load-time reference.
