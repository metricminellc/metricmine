# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:32:19.454179+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flights_mapping
name: Gold mapping, flights category
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_flights table enters the gold unified
    event star as the flights fact category, naming the time column, grain, degenerate identifier,
    and field roles for the deterministic modeling engine that renders the gold models.
  usage: The modeling engine consumes this mapping to generate the gold flights fact model;
    the proposal is rendered into an ODCS mapping contract, validated against the frozen mapping-contract
    schema, linted, and reviewed by a human before approval.
  limitations: This mapping does not exclude cancelled flights (is_cancelled, null_rate 0.0)
    or rows with missing actual departure, arrival, or air_time data (null_rate up to 0.032981);
    consumers must decide whether to filter cancelled or incomplete flights. It also does
    not impute or reconcile the aircraft metadata gaps (null_rate 0.160426-0.176531) or destination
    airport attribute gaps (null_rate 0.02089).
schema:
- name: flights
  logicalType: object
  physicalType: mapping
  description: One row represents a single scheduled flight leg departing JFK, LGA, or EWR
    during 2013, carrying its schedule, actual timing, delay, aircraft, and airport attributes.
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - dest_airport
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Calendar date of the scheduled flight, ranging from 2013-01-01 to 2013-06-30
      with null_rate 0.0, used as a dimension to group flights by day.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter carrier code such as AA, DL, or WN across 16 distinct values with
      null_rate 0.0, a dimension identifying the operating airline.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Integer flight number ranging 1-8500 with null_rate 0.0 and distinct_count
      2994 below row_count, so it labels rather than measures and is a dimension.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport code limited to EWR, JFK, LGA (3 distinct values) with null_rate
      0.0, a dimension describing the departure airport.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure time encoded as an HHMM integer (500-2359) with null_rate
      0.0, a dimension label of planned departure clock time.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Destination airport code across 100 distinct values with null_rate 0.0, a
      dimension describing where the flight landed.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft registration tail number, nullable at null_rate 0.009154 (1521 nulls)
      for flights lacking a recorded tail number, a dimension identifying the physical aircraft.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag indicating whether the flight was cancelled, null_rate 0.0,
      a dimension flag usable to filter cancelled flights.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure time as an HHMM integer (1-2400), nullable at null_rate
      0.029388 (4883 nulls) consistent with flights lacking an actual departure, a dimension
      label.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes ranging -33 to 1301, nullable at null_rate 0.029388
      matching missing actual departure times, a measure summed or averaged for on-time performance
      analysis.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival time as an HHMM integer (1-2400), nullable at null_rate 0.0307
      (5101 nulls) for flights without recorded arrival, a dimension label.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival time as an HHMM integer (1-2359) with null_rate 0.0, a
      dimension label of planned arrival clock time.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes ranging -86 to 1272, nullable at null_rate 0.032981
      for flights missing arrival data, a measure used to compute average or total arrival
      delay.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Flight air time in minutes ranging 20-695, nullable at null_rate 0.032981
      for flights without recorded air time, a measure summed or averaged to analyze flight
      duration.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance flown in miles ranging 80-4983 with null_rate 0.0,
      a measure additive across flights for total distance analysis.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled local departure hour (5-23, 19 distinct values) with null_rate
      0.0, a dimension label of the hour component of scheduled local departure.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled local departure minute (0-59) with null_rate 0.0, a dimension label
      of the minute component of scheduled local departure.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of departure truncated to the hour, ranging 2013-01-01T10:00:00
      to 2013-07-01T03:00:00 with all sampled values at the zero-minute mark and null_rate
      0.0, the time column anchoring each flight event at hour grain.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full carrier name such as Delta Air Lines Inc. or United Air Lines Inc. across
      16 distinct values with null_rate 0.0, a dimension describing the operating airline
      in business terms.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft manufacturer name such as BOEING or AIRBUS, nullable at null_rate
      0.160426 (26656 nulls) for flights without matched aircraft metadata, a dimension describing
      the aircraft manufacturer.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model code, nullable at null_rate 0.160426 matching the manufacturer
      nulls, a dimension describing the aircraft model.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the aircraft was manufactured (1956-2013), nullable at null_rate 0.176531,
      a dimension label describing aircraft age rather than a summed measure.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Aircraft seat capacity (2-450), nullable at null_rate 0.160426 matching other
      aircraft attributes, a dimension describing aircraft characteristics rather than a transactional
      quantity.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft engine type such as Turbo-fan or Turbo-jet across 6 distinct values,
      nullable at null_rate 0.160426, a dimension describing aircraft engine classification.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full name of the origin airport among John F. Kennedy International Airport,
      LaGuardia Airport, and Newark Liberty International Airport, null_rate 0.0, a dimension.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin municipality, either New York or Newark, with null_rate 0.0, a dimension.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport elevation in feet (13, 18, or 21) with null_rate 0.0, a dimension
      characteristic of the origin airport rather than a summed measure.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport's longest runway length in feet (7002, 11000, or 14511) with
      null_rate 0.0, a dimension characteristic of the origin airport.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full name of the destination airport, nullable at null_rate 0.02089 (3471
      nulls) for destinations without matched airport metadata, a dimension.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination municipality, nullable at null_rate 0.02089 matching dest_airport_name
      nulls, a dimension.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: ISO region code of the destination such as US-AL or PR-U-A, nullable at null_rate
      0.02089, a dimension.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport elevation in feet (3-6606), nullable at null_rate 0.02089,
      a dimension characteristic of the destination airport.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport's longest runway length in feet (5076-16000), nullable
      at null_rate 0.02089, a dimension characteristic of the destination airport.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Ingestion capture timestamp ranging 2026-09-02T23:25:51 to 2026-09-02T23:26:06
      with null_rate 0.0, a dimension recording when the row was captured by the pipeline,
      distinct from the flight's own event time.
