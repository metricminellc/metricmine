# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:44:06.445605+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_readings_mapping
name: Gold mapping, airport_weather_readings category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_readings fact category, stating its grain, time column,
    and field roles for the deterministic modeling engine that generates the gold models from
    it.
  usage: The rendered mapping contract is validated against the frozen mapping-contract schema,
    linted with datacontract lint, and reviewed by a human before approval; only after approval
    does the modeling engine consume it to emit the gold fact and its dimensions.
  limitations: The mapping does not filter or reconcile the 0.745505 null_rate on wind_gust_mph,
    the 0.114953 null_rate on pressure_mb, or the 0.016828 null_rate on wind_dir_degrees;
    consumers must decide how to treat missing atmospheric readings, and no quality rule,
    severity, or ownership metadata is declared here by design.
schema:
- name: airport_weather_readings
  logicalType: object
  physicalType: mapping
  description: One row represents a single hourly weather observation recorded at one of the
    three New York area airports (EWR, JFK, LGA), carrying the station's atmospheric readings
    for that hour.
  entityGroup: airport_weather_readings
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: weather_reading_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter station code (EWR, JFK, LGA) with null_rate 0.0, identifying
      which airport the reading belongs to.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Hourly UTC timestamp (samples all end in :00:00, min 2013-01-01T06:00:00,
      max 2013-07-01T03:00:00) that times each weather observation; null_rate is 0.0.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (181 distinct values spanning 2013-01-01
      to 2013-06-30) with null_rate 0.0, provided as a coarser local-date attribute alongside
      the UTC time column.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day label (0-23, 24 distinct values) with null_rate 0.0, describing
      when locally the reading was taken rather than a quantity to aggregate.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in Fahrenheit (samples 10.94 to 93.92, 130 distinct values)
      with null_rate 0.0, a measured quantity suitable for averaging across readings.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in Fahrenheit (samples -9.94 to 73.94, 119 distinct
      values) with null_rate 0.0, a measured atmospheric quantity.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage (samples 12.74 to 100.0, 2178 distinct values)
      with null_rate 0.0, a measured quantity.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (samples 0 to 360, 37 distinct values)
      with null_rate 0.016828, nullable likely during calm conditions when direction is undefined;
      treated as a circular label rather than a summable measure.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Sustained wind speed in mph (samples 0.0 to 1048.36058, 36 distinct values)
      with null_rate 0.000154, a measured quantity with rare missing readings.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in mph (samples 16.11092 to 62.14212, 35 distinct values)
      with null_rate 0.745505, nullable because gusts are only recorded when they occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches (samples 0.0 to 1.06, 50 distinct values) with null_rate
      0.0, a measured accumulation quantity.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars (samples 983.8 to 1038.4, 430 distinct values)
      with null_rate 0.114953, a measured quantity missing for some readings.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles (distinct_values 0.0 through 10.0, 20 distinct
      values) with null_rate 0.0, a measured quantity.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport) with null_rate 0.0, a descriptive attribute of
      the airport.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality hosting the airport (New York, Newark, 2 distinct values) with
      null_rate 0.0, a descriptive location attribute.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (distinct_values 13, 18, 21) with null_rate 0.0,
      a fixed airport attribute rather than a per-reading measure.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet (distinct_values 7002, 11000, 14511) with null_rate
      0.0, a fixed airport attribute rather than a measured quantity.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Technical capture timestamp (only 3 distinct values clustered around 2026-09-02T23:26:11
      to 2026-09-02T23:26:13) with null_rate 0.0, recording when the row was captured by the
      pipeline rather than the business event time.
