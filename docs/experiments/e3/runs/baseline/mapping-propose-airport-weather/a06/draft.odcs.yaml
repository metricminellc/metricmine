# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:44:45.853270+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the contracted silver.silver_airport_weather table enters
    the gold unified event star as the airport_weather_observations fact category, including
    its grain, time column, and field roles, for consumption by the deterministic modeling
    engine that generates the gold models.
  usage: The mapping is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema and datacontract lint, and reviewed and edited by a human
    before the modeling engine builds any gold model from it; it is never executed directly.
  limitations: The mapping does not reconcile the small gap between the 13023 airport-hour
    combinations implied by 3 distinct airport_code values times 4341 distinct observed_hour_utc
    values and the actual row_count of 13014, leaving investigation of any missing hourly
    readings to consumers; it also leaves interpretation of wind_gust_mph's high null_rate
    (0.745505) and any circular treatment of wind_dir_degrees to downstream analysis, and
    it proposes no quality rules, transformations, or filters beyond the stated row identity.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row is one hourly weather observation recorded at a specific NYC-area
    airport (JFK, LGA, or EWR), capturing temperature, dewpoint, humidity, wind, precipitation,
    pressure, and visibility readings for a given UTC hour.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: weather_reading_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter airport code (distinct_values EWR, JFK, LGA; null_rate 0.0)
      identifying which NYC-area airport the weather reading belongs to.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The UTC timestamp of the weather observation (min 2013-01-01T06:00:00, max
      2013-07-01T03:00:00, distinct_count 4341, null_rate 0.0) that times each event, sampled
      at hourly resolution.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The local calendar date of the observation (distinct_count 181, range 2013-01-01
      to 2013-06-30, null_rate 0.0), a label derived from local time rather than the event
      timestamp.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The local hour of day as an integer 0-23 (distinct_count 24, null_rate 0.0),
      a categorical time-of-day label rather than a measured quantity.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: The air temperature in Fahrenheit (range 10.94 to 93.92, distinct_count 130,
      null_rate 0.0), a continuous measured quantity compared across readings.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: The dewpoint temperature in Fahrenheit (range -9.94 to 73.94, distinct_count
      119, null_rate 0.0), a measured atmospheric quantity.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: The relative humidity percentage (range 12.74 to 100.0, distinct_count 2178,
      null_rate 0.0), a measured quantity compared across hourly readings.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: The wind direction in compass degrees (range 0 to 360, distinct_count 37),
      nullable with null_rate 0.016828, likely reflecting calm-wind readings where direction
      is undefined.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: The wind speed in mph (range 0.0 to 1048.36058, distinct_count 36), nullable
      with a very low null_rate of 0.000154 indicating occasional missing sensor readings.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: The wind gust speed in mph (range 16.11092 to 62.14212, distinct_count 35),
      heavily nullable with null_rate 0.745505 since gusts are only recorded when they occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: The precipitation amount in inches (range 0.0 to 1.06, distinct_count 50,
      null_rate 0.0), a measured and summable quantity.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: The barometric pressure in millibars (range 983.8 to 1038.4, distinct_count
      430), nullable with null_rate 0.114953 reflecting missing station readings.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: The visibility distance in miles (distinct_values ranging 0.0 to 10.0, distinct_count
      20, null_rate 0.0), a measured quantity compared across readings.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The full airport name (distinct_values John F. Kennedy International Airport,
      LaGuardia Airport, Newark Liberty International Airport; null_rate 0.0), a descriptive
      label for airport_code.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The municipality where the airport is located (distinct_values New York,
      Newark; null_rate 0.0), a categorical attribute of the airport.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's elevation in feet (distinct_values 13, 18, 21; null_rate 0.0),
      a fixed numeric label of the airport rather than a measured event quantity.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's longest runway length in feet (distinct_values 7002, 11000,
      14511; null_rate 0.0), a fixed numeric label of the airport rather than a measured quantity.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: A capture timestamp with only 3 distinct values across the dataset (2026-09-02T23:26:11
      to 2026-09-02T23:26:13, null_rate 0.0), reflecting batch ingestion rather than the business
      event time, so it is not the time field.
