# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:41:15.004426+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_airport_weather table enters the gold unified
    event star as the airport_weather_observations fact category, documenting the source table,
    grain, time column, and the role and type of every column for the deterministic modeling
    engine that generates the gold models.
  usage: The modeling engine consumes this mapping contract, rendered to the ODCS mapping
    contract draft and validated against the frozen mapping-contract schema and datacontract
    lint, before a human reviews and approves it; downstream consumers then query the generated
    fact for airport-hour weather analysis.
  limitations: The mapping does not filter or flag rows with missing wind_gust_mph (null_rate
    0.745505), pressure_mb (null_rate 0.114953), wind_dir_degrees (null_rate 0.016828), or
    wind_speed_mph (null_rate 0.000154); consumers must handle these nulls themselves, and
    no quality rule, transformation, or derived column beyond the composite (airport_code,
    observed_hour_utc) identity is proposed.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row represents one hourly weather observation recorded at a specific airport,
    capturing atmospheric conditions such as temperature, humidity, wind, precipitation, pressure,
    and visibility for that airport and hour.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter airport code (EWR, JFK, LGA per distinct_values) identifying
      which airport the observation belongs to; null_rate 0.0.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the hourly weather observation, sampled at exact hour boundaries
      (e.g. 2013-01-01T06:00:00) with 4341 distinct values; null_rate 0.0.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (e.g. 2013-01-01), 181 distinct values
      spanning the six-month history; null_rate 0.0.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day (0-23) label for the observation, 24 distinct values; a
      categorical hour marker rather than a summable measure; null_rate 0.0.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in Fahrenheit ranging 10.94 to 93.92, a continuous measure
      compared and aggregated across observations; null_rate 0.0.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dew point temperature in Fahrenheit ranging -9.94 to 73.94, a continuous
      measure; null_rate 0.0.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage ranging 12.74 to 100.0 with 2178 distinct values,
      a continuous measure; null_rate 0.0.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (0-360, 37 distinct values), a directional
      label rather than a summable quantity; nullable with null_rate 0.016828, likely reflecting
      calm-wind readings with no defined direction.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour ranging 0.0 to 1048.36058, a continuous measure;
      nullable with null_rate 0.000154.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour ranging 16.11092 to 62.14212, a continuous
      measure recorded only when gusts occur; nullable with null_rate 0.745505, reflecting
      that most observed hours have no gust.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches ranging 0.0 to 1.06, a continuous measure; null_rate
      0.0.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars ranging 983.8 to 1038.4, a continuous measure;
      nullable with null_rate 0.114953.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles, a capped set of 20 distinct values from 0.0 to 10.0,
      a continuous measure; null_rate 0.0.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (e.g. John F. Kennedy International Airport), 3 distinct
      values matching airport_code; null_rate 0.0.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality hosting the airport (New York or Newark), 2 distinct values;
      null_rate 0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (13, 18, or 21), a static attribute of the airport
      rather than a measured event quantity; null_rate 0.0.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet for the airport (7002, 11000, or 14511), a
      static airport attribute; null_rate 0.0.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Pipeline capture timestamp recorded at ingestion (e.g. 2026-09-02T23:26:11),
      distinct from the observation's own event time and not used as the event timestamp;
      null_rate 0.0.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
