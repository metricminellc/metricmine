# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:43:09.609509+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the contracted silver_airport_weather table enters the
    gold unified event star as the airport_weather_observations fact category, specifying
    the event time column, the transaction grain, and every field's role for the deterministic
    modeling engine, which is the sole consumer of this contract when generating the gold
    models.
  usage: The modeling engine consumes this rendered mapping contract to generate the gold
    fact and dimension models for airport weather observations; the draft is validated against
    the frozen mapping-contract schema, linted with datacontract lint, and reviewed and edited
    by a human before approval, with no code executed directly from this proposal.
  limitations: This mapping does not filter, deduplicate, or otherwise exclude any rows, including
    those with missing wind_gust_mph (null_rate 0.745505), pressure_mb (null_rate 0.114953),
    wind_speed_mph (null_rate 0.000154), or wind_dir_degrees (null_rate 0.016828) values;
    handling of nulls and any downstream aggregation across time or airport dimensions is
    left to consumers of the generated gold models, and no quality rules, ownership, or access
    policies are declared here by design.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row represents one hourly weather observation recorded at a single airport
    (EWR, JFK, or LGA), capturing temperature, dew point, humidity, wind, precipitation, pressure,
    and visibility readings alongside static airport attributes such as name, municipality,
    elevation, and runway length.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: weather_observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter airport code (EWR, JFK, LGA per profile distinct_values) identifying
      the observing airport; required, null_rate 0.0.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the hourly weather observation, ranging from 2013-01-01T06:00:00
      to 2013-07-01T03:00:00 per profile min/max; this is the event time column, required,
      null_rate 0.0.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (181 distinct values spanning 2013-01-01
      to 2013-06-30 per profile); a descriptive date label distinct from the UTC event time;
      required, null_rate 0.0.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day (0-23, 24 distinct values per profile) labeling when the
      observation occurred in local time; a label rather than a summable measure; required,
      null_rate 0.0.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Measured air temperature in Fahrenheit (range 10.94 to 93.92 per profile
      min/max, 130 distinct values); a numeric measure of the observation; required, null_rate
      0.0.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Measured dew point temperature in Fahrenheit (range -9.94 to 73.94 per profile
      min/max, 119 distinct values); a numeric measure; required, null_rate 0.0.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage (range 12.74 to 100.0, 2178 distinct values
      per profile); a numeric measure; required, null_rate 0.0.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (0 to 360, 37 distinct values per profile);
      a directional label rather than a summable measure; nullable, null_rate 0.016828 likely
      from calm-wind readings with no defined direction.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour (range 0.0 to 1048.36058 per profile min/max,
      36 distinct values); a numeric measure; nullable, null_rate 0.000154.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour (range 16.11092 to 62.14212 per profile
      min/max, 35 distinct values); a numeric measure; nullable, null_rate 0.745505, reflecting
      that gusts are only recorded when they occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches (range 0.0 to 1.06 per profile min/max, 50 distinct
      values); a numeric measure; required, null_rate 0.0.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars (range 983.8 to 1038.4 per profile min/max,
      430 distinct values); a numeric measure; nullable, null_rate 0.114953.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles, a capped distinct list of 20 values ranging from 0.0
      to 10.0 per profile; a numeric measure; required, null_rate 0.0.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport per profile distinct_values); a descriptive dimension;
      required, null_rate 0.0.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality hosting the airport (New York, Newark per profile distinct_values);
      a descriptive dimension; required, null_rate 0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (13, 18, 21 per profile distinct_values), a static
      per-airport attribute rather than an event measure; required, null_rate 0.0.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet (7002, 11000, 14511 per profile distinct_values),
      a static per-airport attribute; required, null_rate 0.0.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Timestamp when the record was captured by the pipeline (3 distinct values
      clustered at 2026-09-02T23:26:11 through 23:26:13 per profile), a capture-time attribute
      distinct from the observed event time; required, null_rate 0.0.
