# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:46:38.358844+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_weather_observations_mapping
name: Gold mapping, weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the contracted silver.silver_airport_weather table enters
    the gold unified event star as the weather_observations fact category, assigning each
    profiled column a dimension, measure, or time role, for consumption by the deterministic
    modeling engine that renders the gold models.
  usage: The deterministic modeling engine consumes the rendered mapping contract to generate
    gold fact and dimension models; the render is validated against the frozen mapping-contract
    schema, linted with datacontract lint, and reviewed and approved by a human before any
    model generation occurs.
  limitations: The mapping does not resolve or impute the substantial nulls in wind_gust_mph
    (null_rate 0.745505), pressure_mb (null_rate 0.114953), or wind_dir_degrees (null_rate
    0.016828); handling of these nulls is left to downstream consumers. It also does not investigate
    the small discrepancy between the 13023 airport-hour combinations implied by 3 airports
    times 4341 distinct observed_hour_utc values and the actual row_count of 13014, leaving
    reconciliation of missing hours to consumers.
schema:
- name: weather_observations
  logicalType: object
  physicalType: mapping
  description: One row represents a single weather observation reported at one of three New
    York area airports (EWR, JFK, LGA) for a specific UTC hour, including temperature, dewpoint,
    humidity, wind, precipitation, pressure, and visibility readings.
  entityGroup: weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: airport_hour_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The three-letter station code (samples EWR, JFK, LGA; distinct_count 3; null_rate
      0.0) that identifies which airport the observation belongs to.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: The UTC timestamp of the observation, sampled on exact hour boundaries (e.g.
      2013-01-01T06:00:00, 07:00:00, 08:00:00) with 4341 distinct values and null_rate 0.0,
      giving the event its hourly time grain.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: The local calendar date of the observation (min 2013-01-01, max 2013-06-30,
      distinct_count 181, null_rate 0.0), a descriptive date label rather than the event timestamp.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The local hour of day as an integer 0-23 (distinct_count 24, null_rate 0.0),
      labeling time of day rather than measuring a quantity.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in Fahrenheit (samples range 10.94 to 93.92, null_rate 0.0),
      a continuous measured quantity comparable and aggregable across rows.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in Fahrenheit (samples range -9.94 to 73.94, null_rate
      0.0), a measured atmospheric quantity.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage (samples range 12.74 to 100.0, distinct_count
      2178, null_rate 0.0), a measured quantity.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (samples 0 to 360, distinct_count 37);
      nullable with null_rate 0.016828, likely reflecting calm-wind periods with no defined
      direction, and it labels direction rather than measuring a summable quantity.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour (samples 0.0 to 1048.36058, distinct_count 36),
      nullable with null_rate 0.000154, a measured quantity aggregable across rows.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour (samples 16.11092 to 62.14212), nullable
      with a high null_rate of 0.745505, consistent with gusts only being recorded when conditions
      exceed a gust threshold.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches (samples 0.0 to 1.06, distinct_count 50, null_rate
      0.0), a measured and summable quantity.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars (samples 983.8 to 1038.4, distinct_count
      430), nullable with null_rate 0.114953, likely due to sensor gaps, and is a measured
      quantity.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles (distinct_values capped at 20 including 0.0
      through 10.0, null_rate 0.0), a measured quantity.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The full airport name (distinct_values John F. Kennedy International Airport,
      LaGuardia Airport, Newark Liberty International Airport; null_rate 0.0), a descriptive
      label for the airport.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: The municipality hosting the airport (distinct_values New York, Newark; null_rate
      0.0), a descriptive location label.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's elevation in feet (distinct_values 13, 18, 21; null_rate 0.0),
      a fixed attribute of the airport rather than a measured quantity that varies per observation.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: The airport's longest runway length in feet (distinct_values 7002, 11000,
      14511; null_rate 0.0), a fixed descriptive attribute of the airport.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: The timestamp at which the record was captured by the pipeline (samples 2026-09-02T23:26:11
      through 23:26:13, null_rate 0.0), a load-time attribute distinct from the observation's
      own event time.
