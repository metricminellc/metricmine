# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:40:14.102217+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_airport_weather table enters the gold
    unified event star as the airport_weather_observations fact category, naming the time
    column, grain, identity, and field roles consumed by the deterministic modeling engine
    that generates the gold models; nothing here executes on its own.
  usage: The modeling engine reads this contract to generate the gold fact and any dimensional
    references; the rendered draft is validated against the frozen mapping-contract schema
    and gated by the validator and datacontract lint before a human reviews and approves it.
  limitations: This mapping does not filter or exclude rows, including the 74.55% of rows
    with a null wind_gust_mph, the 11.5% with a null pressure_mb, or the 1.68% with a null
    wind_dir_degrees; handling of those nulls, any quality rules, and the circular averaging
    behavior of wind_dir_degrees are left to downstream consumers and review, not declared
    here.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row is one hourly weather observation recorded at one of three New York
    area airports (EWR, JFK, LGA per the profiled distinct_values), carrying temperature,
    dewpoint, humidity, wind, precipitation, pressure, and visibility readings for that station-hour.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: weather_observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter airport code identifying the weather station (distinct_values
      EWR, JFK, LGA; 3 distinct, no nulls across 13014 rows).
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the observation sampled on the hour (samples 2013-01-01T06:00:00
      through 2013-01-01T15:00:00; 4341 distinct values, no nulls), the event time for this
      fact.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (samples 2013-01-01 through 2013-01-10;
      181 distinct values, no nulls), a date label alongside the UTC event timestamp.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day from 0 to 23 (24 distinct values, no nulls), a time-of-day
      label rather than a quantity to aggregate.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in Fahrenheit ranging 10.94 to 93.92 across 130 distinct
      values with no nulls, a measured quantity compared across observations.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dew point temperature in Fahrenheit ranging -9.94 to 73.94 across 119 distinct
      values with no nulls, a measured quantity.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage ranging 12.74 to 100.0 across 2178 distinct
      values with no nulls, a measured quantity.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Wind direction in degrees 0 to 360 across 37 distinct values, nullable with
      a 1.68% null rate (219 of 13014 rows), likely when calm or unrecorded wind direction
      occurs.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in mph ranging 0.0 to 1048.36058 across 36 distinct values, nullable
      with a very low 0.0154% null rate (2 rows), a measured quantity.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in mph ranging 16.11092 to 62.14212 across 35 distinct values,
      nullable with a high 74.55% null rate (9702 rows), likely recorded only when a gust
      event occurs.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches ranging 0.0 to 1.06 across 50 distinct values with
      no nulls, a measured quantity.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars ranging 983.8 to 1038.4 across 430 distinct
      values, nullable with an 11.5% null rate (1496 rows), likely when the pressure sensor
      reading is unavailable.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles, one of 20 distinct values ranging 0.0 to 10.0, with
      no nulls, a measured quantity.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport; 3 distinct values, no nulls), a descriptive label.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality hosting the airport (New York, Newark; 2 distinct values, no
      nulls), a descriptive location label.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (distinct_values 13, 18, 21; 3 distinct, no nulls),
      a static airport attribute rather than an event measure.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet (distinct_values 7002, 11000, 14511; 3 distinct,
      no nulls), a static airport attribute rather than an event measure.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Pipeline capture timestamp (3 distinct values clustered at 2026-09-02T23:26:11
      through 23:26:13, no nulls), recording when the row entered the pipeline rather than
      the business event time.
servers:
