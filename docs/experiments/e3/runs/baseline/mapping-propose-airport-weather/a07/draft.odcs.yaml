# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:45:33.376257+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_airport_weather table enters the gold
    unified event star as the airport_weather_observations fact category, fixing its time
    column, time grain, degenerate identity, and per-field roles so the deterministic modeling
    engine, the sole consumer of the rendered contract, can generate the gold fact model without
    further interpretation.
  usage: Deterministic code renders this proposal into an ODCS mapping contract draft identified
    as gold_airport_weather_observations_mapping; the frozen mapping-contract schema, a validator,
    and datacontract lint gate the render before a human reviewer approves or edits the draft,
    after which the modeling engine consumes the approved contract to emit the gold fact and
    its derived observation_identity key over (airport_code, observed_hour_utc).
  limitations: This mapping does not filter, impute, or otherwise transform rows, including
    the 74.5505% of rows with null wind_gust_mph, the 11.4953% with null pressure_mb, or the
    1.6828% with null wind_dir_degrees; it leaves any exclusion, imputation, or quality-rule
    enforcement on those nulls to downstream consumers and review, and it declares no ownership,
    classification, service-level, or access-policy attributes.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row represents one hourly weather observation recorded at one of three
    New York area airports (EWR, JFK, LGA), capturing temperature, dewpoint, humidity, wind,
    precipitation, pressure, and visibility readings for that airport at that hour.
  entityGroup: airport_weather
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter station code (EWR, JFK, LGA; 3 distinct values, null_rate 0.0)
      identifying the airport for the observation, combined with observed_hour_utc to form
      the event identity.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the weather observation, spanning 2013-01-01T06:00:00 to
      2013-07-01T03:00:00 across 4341 distinct hourly values with null_rate 0.0; the event-timestamp
      of the fact.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (181 distinct values, 2013-01-01 to
      2013-06-30, null_rate 0.0), a local-time view alongside the UTC time column.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour-of-day of the observation (0-23, 24 distinct values, null_rate
      0.0); a numeric label describing time-of-day rather than a quantity to aggregate.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in Fahrenheit, ranging 10.94 to 93.92 across 130 distinct
      values with null_rate 0.0; a measured quantity compared and aggregated across observations.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in Fahrenheit, ranging -9.94 to 73.94 across 119 distinct
      values with null_rate 0.0; a measured weather quantity.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage, ranging 12.74 to 100.0 across 2178 distinct
      values with null_rate 0.0; a measured weather quantity.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind direction in compass degrees (0-360, 37 distinct values), nullable in
      1.6828% of rows (219 of 13014), likely undefined during calm-wind periods; treated as
      a directional label rather than an additive measure.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour, ranging 0.0 to 1048.36058 across 36 distinct
      values, nullable in 0.0154% of rows (2 nulls); a measured quantity.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour, ranging 16.11092 to 62.14212 across 35
      distinct values, nullable in 74.5505% of rows (9702 nulls), consistent with gusts only
      being recorded when they occur; a measured quantity.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation accumulation in inches, ranging 0.0 to 1.06 across 50 distinct
      values with null_rate 0.0; a measured quantity.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars, ranging 983.8 to 1038.4 across 430 distinct
      values, nullable in 11.4953% of rows (1496 nulls); a measured quantity.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles, with 20 distinct capped values from 0.0 to
      10.0 and null_rate 0.0; a measured quantity.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name (John F. Kennedy International Airport, LaGuardia Airport,
      Newark Liberty International Airport; 3 distinct values, null_rate 0.0); a descriptive
      dimension of the airport.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality hosting the airport (New York or Newark; 2 distinct values,
      null_rate 0.0); a descriptive dimension of the airport.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet (13, 18, or 21; 3 distinct values, null_rate 0.0)
      corresponding one-to-one with the 3 airports; a static descriptive attribute rather
      than a per-observation measure.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Length of the airport's longest runway in feet (7002, 11000, or 14511; 3
      distinct values, null_rate 0.0) corresponding one-to-one with the 3 airports; a static
      descriptive attribute.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Timestamp when the source record was captured by the ingestion process (3
      distinct values clustered around 2026-09-02T23:26:11 to 2026-09-02T23:26:13, null_rate
      0.0); a pipeline capture time distinct from the business event time, so mapped as a
      dimension rather than the time column.
