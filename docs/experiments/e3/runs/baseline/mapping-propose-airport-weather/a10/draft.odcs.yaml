# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T13:48:11.696580+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_airport_weather table enters the gold
    unified event star as the airport_weather_observations fact category, naming the time
    column, grain, degenerate identifier, and field roles that the deterministic modeling
    engine uses to emit the gold fact and its dimensions.
  usage: The mapping proposal is rendered into an ODCS mapping contract, validated against
    the frozen mapping-contract schema, linted, and reviewed and edited by a human before
    approval; only then does the deterministic modeling engine consume the approved contract
    to generate gold models.
  limitations: The mapping does not filter, impute, or reconcile the substantial null rates
    observed in wind_gust_mph (null_rate 0.745505), pressure_mb (null_rate 0.114953), wind_dir_degrees
    (null_rate 0.016828), or wind_speed_mph (null_rate 0.000154); handling of missing values
    is left to downstream consumers. It also does not reconcile the near-but-not-exact coverage
    of airport-hour combinations (3 airports times 4341 hours equals 13023 versus row_count
    13014), leaving any investigation of the gap to consumers.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: Each row is one hourly weather observation recorded at a specific airport,
    capturing temperature, dewpoint, humidity, wind, precipitation, pressure, and visibility
    conditions for that airport at that hour.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: airport_hour_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Three-letter station code with distinct_values EWR, JFK, LGA and null_rate
      0.0, identifying which of the three airports the observation belongs to.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Hourly UTC timestamp ranging from 2013-01-01T06:00:00 to 2013-07-01T03:00:00
      with 4341 distinct values and null_rate 0.0, the event time each weather observation
      is timestamped by.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date ranging 2013-01-01 to 2013-06-30 with 181 distinct values
      and null_rate 0.0, labeling the local day of each observation.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour of day from 0 to 23 with 24 distinct values and null_rate 0.0,
      labeling the local hour rather than measuring a quantity.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in Fahrenheit ranging 10.94 to 93.92 across 130 distinct
      values with null_rate 0.0, a measured quantity comparable across rows.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in Fahrenheit ranging -9.94 to 73.94 across 119 distinct
      values with null_rate 0.0, a measured quantity comparable across rows.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage ranging 12.74 to 100.0 across 2178 distinct
      values with null_rate 0.0, a measured quantity comparable across rows.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Compass wind direction in degrees ranging 0 to 360 across 37 distinct values;
      null_rate 0.016828 makes it nullable, likely during calm-wind periods, and it labels
      a direction rather than a summable quantity.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour ranging 0.0 to 1048.36058 across 36 distinct
      values; null_rate 0.000154 makes it nullable, a measured quantity comparable across
      rows.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind gust speed in miles per hour ranging 16.11092 to 62.14212 across 35
      distinct values; null_rate 0.745505 makes it nullable, consistent with gusts only being
      recorded when conditions exceed a gust threshold.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Precipitation in inches ranging 0.0 to 1.06 across 50 distinct values with
      null_rate 0.0, a measured quantity comparable across rows.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars ranging 983.8 to 1038.4 across 430 distinct
      values; null_rate 0.114953 makes it nullable, likely due to sensor gaps.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility distance in miles ranging 0.0 to 10.0 across 20 distinct_values
      (0.0 through 10.0) with null_rate 0.0, a measured quantity comparable across rows.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name with distinct_values John F. Kennedy International Airport,
      LaGuardia Airport, Newark Liberty International Airport and null_rate 0.0, labeling
      the airport.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality with distinct_values New York, Newark and null_rate 0.0, labeling
      the airport's location.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet with distinct_values 13, 18, 21 and null_rate 0.0,
      a static airport attribute rather than an observation measure.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway length in feet with distinct_values 7002, 11000, 14511 and
      null_rate 0.0, a static airport attribute rather than an observation measure.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Ingestion capture timestamp with distinct_values spanning 2026-09-02T23:26:11
      to 2026-09-02T23:26:13 and null_rate 0.0, recording when the row was captured rather
      than the business event time.
