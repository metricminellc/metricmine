apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_ourairports_runways cleans the bronze ourairports_runways capture into a
    typed runway reference table with one row per runway record identified by id, feeding
    downstream airport infrastructure and routing analytics.
  usage: Consumers should treat id as the unique key, join on airport_ref or airport_ident
    to airport tables, and expect le_*/he_* geographic, elevation, heading, and displaced-threshold
    fields to be null for a meaningful share of rows (null rates ranging from about 0.1% up
    to about 90%) rather than treating nulls as errors; lighted and closed are now boolean
    flags.
  limitations: Latitude, longitude, elevation, heading, and displaced-threshold fields for
    both runway ends carry substantial null rates (roughly 0.22 to 0.90), reflecting incomplete
    source data that this cleanup did not impute; heading fields retain fractional precision
    and were not cast to integer because samples include non-integral values like 1.12 and
    0.1 through 0.9.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: silver_ourairports_runways cleans the bronze ourairports_runways capture into
    a typed runway reference table with one row per runway record identified by id, feeding
    downstream airport infrastructure and routing analytics.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: id has null_rate 0.0 and distinct_count 10760 equal to row_count 10760, making
      it a unique non-null identifier suitable as grain.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: airport_ref has null_rate 0.0 and distinct_count 7591 with numeric-string
      samples like '10309','10366', representing a foreign key to airports.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: airport_ident has null_rate 0.0 and distinct_count 7591, samples like '03N','07FA'
      show alphanumeric airport codes.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: length_ft has null_rate 0.007993 (86 nulls) and all sample_values (0.0,2.0,20.0...44.0)
      are integral, supporting a cast from DECIMAL(38,9) to INTEGER; retained nullable due
      to nonzero null rate.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: width_ft has null_rate 0.082528 (888 nulls) and integral samples (1.0,10.0,15.0...26.0)
      support casting to INTEGER; retained nullable given the null rate.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: surface has null_rate 0.022955 (247 nulls) and distinct_count 239 with varied
      free-text codes like 'ASP-G','ASPH 71/F/C/X/T', kept as text and nullable.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: lighted has distinct_values [0.0,1.0] and null_rate 0.0, a clean boolean
      flag cast from DECIMAL to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: closed has distinct_values [0.0,1.0] and null_rate 0.0, cast from DECIMAL
      to BOOLEAN as a status flag.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: le_ident has null_rate 0.001022 (11 nulls) and distinct_count 199 with samples
      like '-12','.','00' showing non-standard runway-end identifiers kept as text.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_latitude_deg has null_rate 0.220911 (2377 nulls), min -62.1878 and max
      82.5228, retained as nullable DECIMAL geographic coordinate.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_longitude_deg has null_rate 0.221283 (2381 nulls), min -179.881256 and
      max 179.338837, retained nullable as DECIMAL coordinate.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_elevation_ft has null_rate 0.276301 (2973 nulls) and integral samples
      (-1246.0,-184.0,...,-69.0) support casting to INTEGER; sparsely populated but retained
      nullable.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_heading_degt has null_rate 0.228346 (2457 nulls) and samples include non-integral
      values like 1.12 and 0.2, so it is kept as DECIMAL number rather than cast to INTEGER.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_displaced_threshold_ft has null_rate 0.884201 (9514 nulls, very sparse)
      and integral samples (1.0,2.0,10.0...57.0) support casting to INTEGER; retained nullable
      despite the high null rate.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: he_ident has null_rate 0.004926 (53 nulls) and distinct_count 177 with samples
      like '-','.','00' kept as text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_latitude_deg has null_rate 0.222212 (2391 nulls), min -62.1939 max 82.5228,
      retained nullable as DECIMAL coordinate.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_longitude_deg has null_rate 0.222212 (2391 nulls), min -179.873184 max
      179.343002, retained nullable as DECIMAL coordinate.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_elevation_ft has null_rate 0.276208 (2972 nulls) and integral samples
      (-1210.0,-181.0,...,-69.0) support casting to INTEGER; retained nullable.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_heading_degt has null_rate 0.227138 (2444 nulls) and samples 0.1 through
      0.9 show fractional values, so it is kept as DECIMAL number rather than INTEGER.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_displaced_threshold_ft has null_rate 0.899907 (9683 nulls, the sparsest
      column) and integral samples (10.0,30.0,...,76.0) support casting to INTEGER; retained
      nullable.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
