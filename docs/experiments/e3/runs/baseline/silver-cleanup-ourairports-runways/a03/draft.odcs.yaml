# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:14:35.719895+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides one row per runway end-pair record (keyed by id) describing
    a runway at an airport, including its physical dimensions, surface, lighting/closure status,
    and the geographic position, elevation, and heading of each of its two ends (low-end 'le_'
    and high-end 'he_'), feeding downstream airport infrastructure and flight-planning analytics.
  usage: Join on airport_ref or airport_ident to the airports table to resolve full airport
    context; consumers must treat le_* and he_* latitude/longitude/elevation/heading/displaced-threshold
    columns as independently nullable (null rates between 0.22 and 0.90) and filter or handle
    nulls explicitly rather than assuming both runway ends are always populated; the closed
    boolean should be checked before treating a runway as active.
  limitations: Geographic and physical attributes for runway ends are frequently missing (le_/he_
    latitude and longitude null_rate around 0.22, elevation around 0.276, displaced thresholds
    0.88-0.90), and these gaps were not imputed; le_ident and he_ident contain a handful of
    anomalous placeholder values ('.', '-', '-12') that were not corrected; airport_ref and
    airport_ident are retained as text and not validated against the airports table in this
    cleanup.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: This table provides one row per runway end-pair record (keyed by id) describing
    a runway at an airport, including its physical dimensions, surface, lighting/closure status,
    and the geographic position, elevation, and heading of each of its two ends (low-end 'le_'
    and high-end 'he_'), feeding downstream airport infrastructure and flight-planning analytics.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals dataset.row_count 10760 and null_rate is 0.0,
      so id uniquely identifies each runway row.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and samples such as '10309', '1058', '111' are numeric-looking
      foreign-key references; kept as VARCHAR to preserve the source airport.id join contract.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 7591 distinct codes such as '03N', '0CO2', consistent
      with ICAO/FAA airport identifiers.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sample values 0.0, 2.0, 20.0 ... 44.0 are all integral despite the DECIMAL(38,9)
      landed type; null_rate is 0.007993 (86 nulls) so retained as nullable.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples 1.0, 10.0, 15.0 ... 26.0 are integral; null_rate 0.082528 (888 nulls)
      means width is sometimes unknown and is retained nullable.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 239 distinct free-text codes such as 'ASP', 'ASPH-CONC-F' with null_rate
      0.022955 (247 nulls); kept as text since values are not a fixed enum.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, a clean binary
      flag suitable for BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, a clean binary
      flag suitable for BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Samples include runway-end labels like '09', '01L' but also anomalous values
      '.' and '-12'; null_rate 0.001022 (11 nulls) so kept as free text and retained nullable
      rather than coerced.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Values range from min -62.187801 to max 82.512802 consistent with latitude
      degrees; null_rate 0.220911 (2377 nulls) so retained nullable, tightened from DECIMAL(38,9)
      to DECIMAL(9,6).
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Values range from min -179.881256 to max 179.338837 consistent with longitude
      degrees; null_rate 0.221283 (2381 nulls) so retained nullable, tightened to DECIMAL(9,6).
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples -1246.0, -184.0, -127.0 ... -69.0 are all integral feet values; null_rate
      0.276301 (2973 nulls) so retained nullable.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Samples include fractional degrees such as 0.2, 1.12 alongside whole numbers,
      so this stays a decimal rather than an integer; null_rate 0.228346 (2457 nulls) retained
      nullable.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples 1.0, 2.0, 10.0 ... 57.0 are integral; null_rate is 0.884201 (9514
      nulls), a sparsely populated field retained nullable because displaced thresholds only
      apply to some runway ends.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Samples include labels like '01L', '10' but also anomalous '-' and '.'; null_rate
      0.004926 (53 nulls) so kept as text and retained nullable.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Values range from min -62.193901 to max 82.522797 consistent with latitude
      degrees; null_rate 0.222212 (2391 nulls) so retained nullable, tightened to DECIMAL(9,6).
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Values range from min -179.873184 to max 179.343002 consistent with longitude
      degrees; null_rate 0.222212 (2391 nulls) so retained nullable, tightened to DECIMAL(9,6).
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples -1210.0, -181.0, -135.0 ... -69.0 are integral feet values; null_rate
      0.276208 (2972 nulls) so retained nullable.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Samples progress 0.1, 0.2, 0.3 ... 0.9 showing fractional degrees, so this
      stays a decimal; null_rate 0.227138 (2444 nulls) retained nullable.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples 10.0, 30.0, 33.0 ... 76.0 are integral; null_rate is 0.899907 (9683
      nulls), the sparsest column in the table, retained nullable since it only applies to
      displaced thresholds on the high end.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
