# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides one cleaned row per airport runway, sourced from the OurAirports
    runways extract, intended to support analytics on runway surface, dimensions, lighting/closure
    status, and the geographic endpoints (low-end and high-end) of each runway.
  usage: Join on runway_id for a unique runway record, or on airport_ref/airport_ident to
    associate runways with airports; consumers should expect nulls in the latitude, longitude,
    elevation, heading, and displaced-threshold fields (roughly 22% to 90% null depending
    on the column) and must handle them explicitly rather than assume completeness.
  limitations: Geographic and dimensional fields for runway ends (le_* and he_*) are missing
    in 22% to 90% of rows per the profiled null rates, and were retained as nulls rather than
    imputed; airport_ident and surface remain free text because their sample values are not
    uniformly structured, so no further normalization (e.g., surface code standardization)
    was applied in this pass.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: This table provides one cleaned row per airport runway, sourced from the OurAirports
    runways extract, intended to support analytics on runway surface, dimensions, lighting/closure
    status, and the geographic endpoints (low-end and high-end) of each runway.
  properties:
  - name: runway_id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals row_count 10760 with null_count 0, and all sample_values
      are integer-shaped strings like "232758" and "232759", so this is the unique row identifier
      cast to INTEGER and renamed for clarity.
  - name: airport_ref
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_count is 0 and sample_values are integer-shaped strings such as "10309",
      "10366", "1058", consistent with a numeric foreign key to the airports table.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_count is 0 with distinct_count 7591, but sample_values like "03N", "07FA",
      "0CO2" are alphanumeric codes, so this stays text rather than being cast to a number.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.007993 (86 nulls) and sample_values are all whole numbers
      (0.0, 2.0, 20.0, 24.0...), justifying a cast from DECIMAL(38,9) to INTEGER while retaining
      nulls.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.082528 (888 nulls) and sample_values (1.0, 10.0, 15.0, 17.0...)
      are whole numbers, supporting a cast to INTEGER with nulls retained.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.022955 (247 nulls) across 239 distinct codes such as "ASP",
      "ASP-G", "ASP/CON", so it remains a free-text surface code.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_count 0, a clear binary
      flag cast from DECIMAL(38,9) to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_count 0, a clear binary
      flag cast from DECIMAL(38,9) to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.001022 (11 nulls) with 199 distinct runway-end identifiers
      like "00", "01C", "01L", kept as text.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.220911 (2377 nulls), with values ranging from -62.187801 to
      82.512802, so this is retained as a decimal with 6-decimal precision appropriate for
      coordinates.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.221283 (2381 nulls), with values ranging from -179.881256
      to 179.338837, so this is retained as a decimal with 6-decimal precision.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.276301 (2973 nulls) and sample_values are whole numbers (-1246.0,
      -184.0, -127.0...), justifying cast to INTEGER.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: false
    description: null_rate is 0.228346 (2457 nulls) and sample_values include fractional headings
      like 0.2, 0.4, 1.12, so this is kept as a decimal number rather than an integer.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.884201 (9514 nulls), a sparsely populated column, but sample_values
      are whole numbers (1.0, 2.0, 10.0, 19.0...) justifying INTEGER cast with nulls retained.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.004926 (53 nulls) with 177 distinct identifiers like "00",
      "01L", "04R", kept as text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.222212 (2391 nulls), with values ranging from -62.193901 to
      82.522797, retained as a 6-decimal-precision number.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.222212 (2391 nulls), with values ranging from -179.873184
      to 179.343002, retained as a 6-decimal-precision number.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.276208 (2972 nulls) and sample_values are whole numbers (-1210.0,
      -181.0, -135.0...), justifying cast to INTEGER.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: false
    description: null_rate is 0.227138 (2444 nulls) with sample_values stepping through fractional
      degrees (0.1 through 0.9), so this stays a decimal number.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.899907 (9683 nulls), the sparsest column in the table, but
      sample_values are whole numbers (10.0, 30.0, 33.0...) justifying INTEGER cast with nulls
      retained.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (runway_id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT runway_id
        FROM silver.silver_runways
        GROUP BY runway_id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
