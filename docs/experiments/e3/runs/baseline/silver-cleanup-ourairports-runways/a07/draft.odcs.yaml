apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table cleans the bronze ourairports_runways capture into a typed, deduplicated
    runway reference table keyed on id, feeding downstream airport and runway analytics.
  usage: Consumers should join on id for runway-level facts and on airport_ref to the airports
    dimension; latitude, longitude, elevation, heading, and displaced-threshold columns for
    both runway ends are frequently null (22%-90% null rates) and must be handled as optional
    geodata, not assumed present.
  limitations: No exact duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic
    was applied; displaced-threshold fields are over 88% null and heading/position fields
    are 22%-28% null, so analyses depending on complete runway-end geometry will be missing
    most rows and should filter or aggregate accordingly.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: This silver table cleans the bronze ourairports_runways capture into a typed,
    deduplicated runway reference table keyed on id, feeding downstream airport and runway
    analytics.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count 10760 equals row_count 10760, so id uniquely
      identifies every row; retained as VARCHAR since samples (e.g. '232758','232759') are
      plain digit strings and an identifier, not a measure.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 7591; samples ('10309','1058','111')
      are digit-only foreign-key references to an airport id, kept as VARCHAR to preserve
      identifier semantics rather than casting to a numeric measure.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 7591; samples ('03N','07FA','0CO2') are alphanumeric
      airport codes, confirming VARCHAR is correct.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.007993 (86 nulls); all sample values (0.0,2.0,20.0,...,44.0)
      are integral so the landed DECIMAL(38,9) safely casts to INTEGER, with nulls retained
      rather than imputed.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.082528 (888 nulls); samples (1.0,10.0,15.0,...,26.0) are all
      integral, justifying cast from DECIMAL(38,9) to INTEGER with nulls retained.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.022955 (247 nulls) with 239 distinct free-text surface codes
      such as 'ASP','ASPH-CONC-F'; kept as VARCHAR text, nulls retained.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0,1.0] with null_rate 0.0, a classic binary
      flag cast from DECIMAL(38,9) to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0,1.0] with null_rate 0.0, a classic binary
      flag cast from DECIMAL(38,9) to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.001022 (11 nulls); samples include non-numeric tokens like
      '-12','.', '00', confirming VARCHAR text, nulls retained.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(10,6)
    required: false
    description: null_rate is 0.220911 (2377 nulls); samples carry fractional degrees (-62.187801,
      -54.931), so the column stays a DECIMAL number with nulls retained rather than imputed,
      as this field is sparsely populated.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(11,6)
    required: false
    description: null_rate is 0.221283 (2381 nulls); samples carry fractional degrees (-179.881256,
      -178.071487), so the column stays a DECIMAL number with nulls retained, sparsely populated.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.276301 (2973 nulls); all sample values (-1246.0,-184.0,...,-69.0)
      are integral, justifying cast from DECIMAL(38,9) to INTEGER; this field is sparsely
      populated and nulls are retained.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate is 0.228346 (2457 nulls); samples include fractional values (0.2,0.4,1.12),
      so the column is kept as a DECIMAL number rather than an integer, nulls retained.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.884201 (9514 of 10760 nulls), making this the sparsest numeric
      field; samples (1.0,2.0,10.0,...,57.0) are integral so the cast to INTEGER is still
      safe, nulls retained rather than imputed.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.004926 (53 nulls); samples include non-numeric tokens like
      '-','.', confirming VARCHAR text, nulls retained.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(10,6)
    required: false
    description: null_rate is 0.222212 (2391 nulls); samples carry fractional degrees (-62.193901,
      -54.931198), kept as DECIMAL number, sparsely populated and nulls retained.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(11,6)
    required: false
    description: null_rate is 0.222212 (2391 nulls); samples carry fractional degrees (-179.873184,
      -178.061371), kept as DECIMAL number, sparsely populated and nulls retained.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.276208 (2972 nulls); all sample values (-1210.0,-181.0,...,-69.0)
      are integral, justifying cast from DECIMAL(38,9) to INTEGER; sparsely populated and
      nulls retained.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate is 0.227138 (2444 nulls); samples (0.1,0.2,...,0.9) are fractional,
      so the column is kept as a DECIMAL number, nulls retained.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.899907 (9683 of 10760 nulls), the sparsest field in the table;
      samples (10.0,30.0,33.0,...,76.0) are integral so the cast to INTEGER is still safe,
      nulls retained.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
