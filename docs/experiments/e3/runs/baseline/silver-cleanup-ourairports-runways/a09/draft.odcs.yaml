# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_runways cleans the bronze ourairports_runways capture so downstream analytics
    and airport-infrastructure lookups can access runway attributes (length, width, surface,
    lighting, heading, and displaced thresholds) joined to airports via airport_ref and airport_ident.
  usage: Join on airport_ref or airport_ident to associate runways with airports, use id as
    the primary key for row-level lookups, and explicitly handle nulls on the latitude/longitude/elevation/heading
    fields (roughly 22%-28% null) and on the displaced-threshold fields (88%-90% null) rather
    than assuming they are populated.
  limitations: Cleanup did not resolve the high null rates on le_/he_ latitude, longitude,
    elevation, heading, and displaced-threshold columns (22%-90% null) or normalize the free-form,
    inconsistent surface and ident text values (surface distinct_count 239; le_ident/he_ident
    samples like '-12', '.', '-'); no duplicate-row cleanup was required since duplicate_row_rate
    was 0.0.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: silver_runways cleans the bronze ourairports_runways capture so downstream
    analytics and airport-infrastructure lookups can access runway attributes (length, width,
    surface, lighting, heading, and displaced thresholds) joined to airports via airport_ref
    and airport_ident.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: id has null_rate 0.0 and distinct_count 10760, exactly equal to the table's
      row_count of 10760, making it a unique identifier for each runway record.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: airport_ref has null_rate 0.0 with distinct_count 7591 and samples like '10309','10366'
      that reference airport identifiers, so it is kept as a text foreign key.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: airport_ident has null_rate 0.0 with distinct_count 7591 and alphanumeric
      samples like '03N','07FA', so it is kept as a text code.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: length_ft has null_rate 0.007993 (86 nulls) and all sample values (0.0, 2.0,
      20.0, 24.0...) are whole numbers across a range of 0.0 to 16798.0, justifying a cast
      from DECIMAL(38,9) to INTEGER.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: width_ft has null_rate 0.082528 (888 nulls) and sample values (1.0, 10.0,
      15.0...) are whole numbers across a range of 1.0 to 7000.0, justifying a cast to INTEGER.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: surface has null_rate 0.022955 (247 nulls) and distinct_count 239 with free-form
      codes such as 'ASP', 'ASP-G', 'ASPH 71/F/C/X/T', so it is kept as text rather than normalized.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: lighted has distinct_count 2 with distinct_values [0.0, 1.0] and null_rate
      0.0, a clean binary flag suitable for BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: closed has distinct_count 2 with distinct_values [0.0, 1.0] and null_rate
      0.0, a clean binary flag suitable for BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: le_ident has null_rate 0.001022 (11 nulls) and distinct_count 199 with irregular
      samples like '-12', '.', '00', so it is kept as text rather than cast.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_latitude_deg has null_rate 0.220911 (2377 nulls) with range -62.187801
      to 82.512802 across 8333 distinct values; sparsely populated but retained as a numeric
      coordinate.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_longitude_deg has null_rate 0.221283 (2381 nulls) with range -179.881256
      to 179.338837 across 8290 distinct values; sparsely populated but retained as a numeric
      coordinate.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_elevation_ft has null_rate 0.276301 (2973 nulls) and sample values (-1246.0,
      -184.0, -127.0...) are whole numbers, justifying a cast to INTEGER.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: le_heading_degt has null_rate 0.228346 (2457 nulls) and samples include non-integral
      values such as 0.2, 0.4, 0.7, 1.12, so it remains a decimal rather than being cast to
      INTEGER.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: le_displaced_threshold_ft has null_rate 0.884201 (9514 nulls) and whole-number
      samples (1.0, 2.0, 10.0...); it is sparsely populated but retained nullable after casting
      to INTEGER.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: he_ident has null_rate 0.004926 (53 nulls) and distinct_count 177 with irregular
      samples like '-', '.', '00', so it is kept as text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_latitude_deg has null_rate 0.222212 (2391 nulls) with range -62.193901
      to 82.522797 across 8319 distinct values; sparsely populated but retained as a numeric
      coordinate.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_longitude_deg has null_rate 0.222212 (2391 nulls) with range -179.873184
      to 179.343002 across 8265 distinct values; sparsely populated but retained as a numeric
      coordinate.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_elevation_ft has null_rate 0.276208 (2972 nulls) and whole-number samples
      (-1210.0, -181.0, -135.0...), justifying a cast to INTEGER.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: he_heading_degt has null_rate 0.227138 (2444 nulls) and samples spanning
      0.1 through 0.9 in fine increments, so it remains a decimal rather than being cast to
      INTEGER.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: he_displaced_threshold_ft has null_rate 0.899907 (9683 nulls) and whole-number
      samples (10.0, 30.0, 33.0...); it is sparsely populated but retained nullable after
      casting to INTEGER.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
