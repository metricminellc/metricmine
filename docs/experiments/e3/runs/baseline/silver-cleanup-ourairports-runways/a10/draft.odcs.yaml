apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_runways cleans the bronze ourairports_runways capture into a typed runway
    reference table, one row per runway record identified by id, feeding downstream airport
    infrastructure and routing analyses.
  usage: Join on airport_ref to the airports dimension and use le_ident/he_ident for runway-end
    labels; treat lighted and closed as boolean flags, and expect nulls in geospatial and
    displaced-threshold columns to be retained rather than imputed.
  limitations: Latitude, longitude, elevation, and heading columns carry null rates between
    roughly 22% and 28% (e.g. le_latitude_deg 0.220911, he_elevation_ft 0.276208), and displaced-threshold
    columns are null for 88-90% of rows (le_displaced_threshold_ft 0.884201, he_displaced_threshold_ft
    0.899907); no duplicate rows were found (duplicate_row_rate 0.0) so no dedupe logic was
    applied.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: silver_runways cleans the bronze ourairports_runways capture into a typed runway
    reference table, one row per runway record identified by id, feeding downstream airport
    infrastructure and routing analyses.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count 10760 equals row_count 10760, with samples
      like 232758, 232759 all purely numeric so VARCHAR can be cast to INTEGER.
  - name: airport_ref
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with distinct_count 7591; samples (10309, 10366, 10532)
      are all numeric strings supporting a cast to INTEGER as a foreign key reference.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 but samples such as 03N, 07FA, 0CO2 are alphanumeric codes,
      not integral, so the column stays text.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.007993 (86 nulls); samples (0.0, 2.0, 20.0, 24.0) are all
      integral and min 0 / max 16798 fit INTEGER.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.082528 (888 nulls); samples (1.0, 10.0, 15.0, 17.0) are all
      integral and min 1 / max 7000 fit INTEGER.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.022955 (247 nulls) with distinct_count 239 covering mixed
      codes like ASP, ASP-G, ASPH-CONC-F, so it remains free text.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, a binary flag
      that casts cleanly to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, a binary flag
      that casts cleanly to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.001022 (11 nulls); samples include non-numeric tokens like
      -12, ., 01C, 01L so the column stays text.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.220911 (2377 nulls); samples show six-decimal precision (-62.187801
      to 82.512802) so DECIMAL(38,9) is narrowed to DECIMAL(9,6).
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.221283 (2381 nulls); samples range -179.881256 to 179.338837
      at six-decimal precision, narrowed to DECIMAL(9,6).
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.276301 (2973 nulls); samples (-1246.0, -184.0, -127.0) are
      integral with min -1246 / max 13202, supporting INTEGER.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate is 0.228346 (2457 nulls); samples include fractional values like
      0.2, 0.7, 1.12 that are not integral, so it is kept as DECIMAL(5,2) rather than INTEGER.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.884201 (9514 nulls), a sparsely populated column retained
      nullable; samples (1.0, 2.0, 10.0, 19.0) are integral supporting INTEGER.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.004926 (53 nulls); samples include non-numeric tokens like
      -, ., 01L so the column stays text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.222212 (2391 nulls); samples range -62.193901 to 82.522797
      at six-decimal precision, narrowed to DECIMAL(9,6).
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate is 0.222212 (2391 nulls); samples range -179.873184 to 179.343002
      at six-decimal precision, narrowed to DECIMAL(9,6).
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.276208 (2972 nulls); samples (-1210.0, -181.0, -135.0) are
      integral with min -1210 / max 13314, supporting INTEGER.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate is 0.227138 (2444 nulls); samples (0.1 through 0.9) are fractional
      and not integral, so it is kept as DECIMAL(5,2) rather than INTEGER.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.899907 (9683 nulls), a sparsely populated column retained
      nullable; samples (10.0, 30.0, 33.0, 49.0) are integral supporting INTEGER.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
