# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:18:08.109145+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides one row per physical runway, cleaned of Airbyte capture metadata,
    feeding downstream airport-infrastructure analytics that join to an airports dimension
    via airport_ref/airport_ident.
  usage: Join on airport_ref or airport_ident to enrich with airport details, and treat le_/he_
    (low-end/high-end) latitude, longitude, elevation, and heading columns as independently
    nullable since each end of a runway is profiled separately; consumers must handle nulls
    in displaced-threshold and geo columns rather than assume a value.
  limitations: le_displaced_threshold_ft (88.4% null) and he_displaced_threshold_ft (90.0%
    null) are very sparse and were not imputed; le_/he_ latitude, longitude, elevation, and
    heading columns each carry roughly 22-28% nulls reflecting incomplete source surveys,
    and surface remains free text with 239 distinct unnormalized codes rather than a controlled
    vocabulary.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: This table provides one row per physical runway, cleaned of Airbyte capture
    metadata, feeding downstream airport-infrastructure analytics that join to an airports
    dimension via airport_ref/airport_ident.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals the table's row_count 10760 with null_count 0,
      so id uniquely identifies each row and anchors the grain.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_count 0 and distinct_count 7591 match airport_ident's distinct_count,
      indicating this is a foreign-key reference to the airports table; kept as text since
      it is a key, not a measure.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_count 0; samples like '03N','07FA','0CO2' are alphanumeric airport codes
      and cannot be cast to a numeric type.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.007993 (86 nulls); samples 0.0,2.0,20.0,24.0...44.0 are all integral,
      supporting DECIMAL(38,9) to INTEGER with min 0.0 and max 16798.0.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.082528 (888 nulls); samples 1.0,10.0,15.0...26.0 are integral,
      min 1.0 max 7000.0, justifying a cast to INTEGER.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.022955 (247 nulls); distinct_count 239 free-text surface codes
      such as 'ASP','ASP-G','ASPH-CONC-F' do not map to a bounded enum.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0,1.0] with null_count 0, a clean binary flag
      cast from DECIMAL(38,9) to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0,1.0] with null_count 0, a clean binary flag
      cast from DECIMAL(38,9) to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.001022 (11 nulls); distinct_count 199 includes irregular samples
      like '-12' and '.', so it remains free text.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.220911 (2377 nulls); samples carry up to six decimal digits (e.g.
      -62.187801, 82.512802 as min/max), so DECIMAL(9,6) is sufficient precision down from
      DECIMAL(38,9).
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.221283 (2381 nulls); min -179.881256 and max 179.338837 show
      six decimal digits, justifying DECIMAL(9,6).
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276301 (2973 nulls); samples -1246.0,-184.0,-127.0...-69.0 are
      integral, min -1246.0 max 13202.0, supporting a cast to INTEGER.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.228346 (2457 nulls); samples include 1.12 alongside 0.0-2.1,
      so two-decimal precision DECIMAL(5,2) is needed, min 0.0 max 360.0.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.884201 (9514 nulls) makes this sparsely populated but samples
      1.0,2.0,10.0...57.0 are integral, min 1.0 max 4250.0, so it is retained nullable as
      INTEGER rather than dropped.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.004926 (53 nulls); distinct_count 177 includes irregular samples
      like '-' and '.', so it remains free text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.222212 (2391 nulls); min -62.193901 and max 82.522797 show six
      decimal digits, justifying DECIMAL(9,6).
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.222212 (2391 nulls); min -179.873184 and max 179.343002 show
      six decimal digits, justifying DECIMAL(9,6).
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276208 (2972 nulls); samples -1210.0,-181.0,-135.0...-69.0 are
      integral, min -1210.0 max 13314.0, supporting a cast to INTEGER.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.227138 (2444 nulls); samples run 0.1 through 0.9 in tenths, min
      0.0 max 362.0, so DECIMAL(5,2) matches the companion le_heading_degt precision.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.899907 (9683 nulls) is the sparsest column in the table but samples
      10.0,30.0,33.0...76.0 are integral, min 10.0 max 4790.0, so it is retained nullable
      as INTEGER.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
