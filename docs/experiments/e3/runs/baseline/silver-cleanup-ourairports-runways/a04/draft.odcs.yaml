# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This silver table cleans OurAirports runway reference data landed from bronze,
    providing one row per runway (grain: id) with typed lengths, widths, elevations, headings,
    coordinates, and boolean lighted/closed flags for downstream airport and route analytics.'
  usage: Consumers should join on airport_ref to the airports dimension and expect nullable
    fields for displaced thresholds, headings, elevations, and coordinates since these are
    sparsely populated in the source; filter or handle nulls deliberately for runway-end calculations,
    and treat le_ident/he_ident as free-text identifiers rather than enums.
  limitations: 'Displaced threshold columns remain highly sparse (le: 88.4% null, he: 90.0%
    null) and latitude/longitude/elevation/heading pairs are missing for roughly 22-28% of
    rows; no imputation or backfill was attempted, and the 239 distinct surface codes (2.3%
    null) were kept as free text without normalization.'
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: 'This silver table cleans OurAirports runway reference data landed from bronze,
    providing one row per runway (grain: id) with typed lengths, widths, elevations, headings,
    coordinates, and boolean lighted/closed flags for downstream airport and route analytics.'
  properties:
  - name: id
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals row_count 10760 with null_rate 0.0, and all sample
      values are integral digit strings (e.g. '232758'), supporting a cast from VARCHAR to
      BIGINT.
  - name: airport_ref
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: null_rate 0.0 with distinct_count 7591; samples are integral digit strings
      ('10309','10366', etc.) consistent with a foreign-key id, justifying cast to BIGINT.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0; samples mix letters and digits ('03N','07FA','0CO2'), so it
      is retained as text rather than cast to a numeric type.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.007993 (86 nulls); sample values are all whole numbers (0.0-44.0,
      max 16798.0), supporting cast from DECIMAL(38,9) to INTEGER; retained nullable given
      the nonzero null rate.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.082528 (888 nulls); samples are whole numbers (1.0-26.0, max
      7000.0), supporting cast to INTEGER; retained nullable given the 8.3% null rate.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.022955 (247 nulls); distinct_count 239 with free-text codes like
      'ASP-G' and 'ASPH-CONC-F', kept as text without normalization.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0,1.0] with null_rate 0.0, supporting a cast
      from DECIMAL(38,9) to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0,1.0] with null_rate 0.0, supporting a cast
      from DECIMAL(38,9) to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.001022 (11 nulls); samples include non-numeric tokens like '-12',
      '.', '01C', kept as text.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.220911 (2377 nulls); sample values carry up to six decimal digits
      (e.g. -62.187801), so DECIMAL(9,6) preserves precision; sparsely populated and retained
      nullable.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.221283 (2381 nulls); samples carry six decimal digits (e.g. -179.881256),
      supporting DECIMAL(9,6); sparsely populated.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276301 (2973 nulls); all sample values are whole numbers (-1246.0
      to -69.0 shown, max 13202.0), supporting cast to INTEGER; sparsely populated.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.228346 (2457 nulls); samples include fractional values (0.2,
      0.4, 0.7, 1.12), so kept as DECIMAL(5,2) rather than INTEGER; sparsely populated.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.884201 (9514 nulls) is very high; sample values are whole numbers
      (1.0-57.0, max 4250.0), supporting cast to INTEGER while retaining null since displaced
      thresholds only apply to a subset of runways.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.004926 (53 nulls); samples include non-numeric tokens like '-',
      '.', '01L', kept as text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.222212 (2391 nulls); samples carry six decimal digits (e.g. -62.193901),
      supporting DECIMAL(9,6); sparsely populated.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.222212 (2391 nulls); six-decimal precision samples (e.g. -179.873184)
      support DECIMAL(9,6); sparsely populated.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276208 (2972 nulls); whole-number samples (-1210.0 to -69.0,
      max 13314.0) support cast to INTEGER; sparsely populated.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.227138 (2444 nulls); fractional samples (0.1 through 0.9) rule
      out INTEGER, so kept as DECIMAL(5,2); sparsely populated.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.899907 (9683 nulls) is the sparsest column observed; whole-number
      samples (10.0-76.0, max 4790.0) support cast to INTEGER while retaining null.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
