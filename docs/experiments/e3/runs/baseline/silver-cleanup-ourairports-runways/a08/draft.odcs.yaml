# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T13:20:46.213621+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_runways
name: Silver runways
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, one-row-per-runway view of OurAirports runway infrastructure
    data, including dimensions, surface, lighting/closure status, and each runway end's identifier,
    coordinates, elevation, heading, and displaced threshold, to feed downstream airport infrastructure
    and geospatial analyses.
  usage: Join on id as the unique runway key or on airport_ref/airport_ident to associate
    runways with airports; consumers must handle null latitude/longitude/elevation/heading
    fields (~22-28% missing) and especially the displaced threshold fields, which are null
    for the large majority of rows (~88-90%) since most runway ends lack a displaced threshold.
    Use the lighted and closed boolean flags directly for filtering active, lit runways.
  limitations: Cleanup did not resolve the unstandardized surface vocabulary (239 distinct
    free-text values with 2.3% nulls); le_ident and he_ident retain odd placeholder values
    like '.' and '-' as seen in bronze samples; geographic and physical fields (lat/long,
    elevation, heading, displaced threshold) retain substantial null rates (22%-90%) because
    the source data itself is incomplete, and no duplicate rows were found (duplicate_row_rate
    0.0) so no dedupe logic was applied.
schema:
- name: silver_runways
  physicalName: silver_runways
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, one-row-per-runway view of OurAirports runway
    infrastructure data, including dimensions, surface, lighting/closure status, and each
    runway end's identifier, coordinates, elevation, heading, and displaced threshold, to
    feed downstream airport infrastructure and geospatial analyses.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals dataset.row_count 10760 with null_rate 0.0, so
      id is a unique, fully populated runway identifier; samples like '232758' are numeric
      text kept as VARCHAR for identifier stability.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 7591 (less than row_count) show this is
      a fully populated foreign key to airports with multiple runways per airport; kept as
      VARCHAR to preserve join compatibility.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 7591 matching airport_ref, samples like '03N','0NM0'
      confirm alphanumeric airport codes retained as VARCHAR.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (0.0,2.0,20.0,...,44.0) are all integral despite the landed DECIMAL(38,9)
      type, min 0.0 max 16798.0, so cast to INTEGER is safe; null_rate 0.007993 (86 nulls)
      retained as nullable.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (1.0,10.0,15.0,...,26.0) are all integral with min 1.0 max 7000.0,
      supporting a DECIMAL to INTEGER cast; null_rate 0.082528 (888 nulls) retained as nullable.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 239 distinct free-text surface codes (e.g. 'ASP','ASPH-CONC-F') with null_rate
      0.022955 (247 nulls) show an unstandardized vocabulary best kept as text.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values [0.0,1.0] with null_rate 0.0 indicate a binary flag landed
      as DECIMAL, cast to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values [0.0,1.0] with null_rate 0.0 indicate a binary flag landed
      as DECIMAL, cast to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 199 distinct runway-end identifiers including odd samples like '.' and '-12';
      null_rate 0.001022 (11 nulls) retained as nullable text.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: min -62.187801 max 82.512802 with 6-decimal sample precision justify standard
      geographic DECIMAL(9,6); null_rate 0.220911 (2377 nulls) retained as nullable.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: min -179.881256 max 179.338837 with 6-decimal sample precision justify DECIMAL(9,6);
      null_rate 0.221283 (2381 nulls) retained as nullable.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (-1246.0,-184.0,...,-69.0) are all integral, supporting a cast to
      INTEGER; null_rate 0.276301 (2973 nulls) retained as nullable, noting this field is
      sparsely populated.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Samples include fractional values (0.2,0.4,1.12) so this stays numeric as
      DECIMAL(5,2) rather than INTEGER; null_rate 0.228346 (2457 nulls) retained as nullable.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (1.0,2.0,10.0,...,57.0) are all integral supporting cast to INTEGER;
      null_rate 0.884201 (9514 of 10760 nulls) is very high, so this field is retained but
      is sparsely populated.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 177 distinct identifiers including samples like '-' and '.'; null_rate 0.004926
      (53 nulls) retained as nullable text.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: min -62.193901 max 82.522797 with 6-decimal precision samples justify DECIMAL(9,6);
      null_rate 0.222212 (2391 nulls) retained as nullable.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: min -179.873184 max 179.343002 with 6-decimal precision samples justify DECIMAL(9,6);
      null_rate 0.222212 (2391 nulls) retained as nullable.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (-1210.0,-181.0,...,-69.0) are all integral, supporting cast to INTEGER;
      null_rate 0.276208 (2972 nulls) retained as nullable, sparsely populated.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Samples include fractional values (0.1,0.2,...,0.9) so this stays numeric
      as DECIMAL(5,2); null_rate 0.227138 (2444 nulls) retained as nullable.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (10.0,30.0,33.0,...,76.0) are all integral supporting cast to INTEGER;
      null_rate 0.899907 (9683 of 10760 nulls) is very high, so this field is retained but
      sparsely populated.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
