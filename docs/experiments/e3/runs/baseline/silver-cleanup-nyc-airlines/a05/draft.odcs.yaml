# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference lookup mapping two-letter carrier codes to their
    full airline names, intended to be joined into flight-level fact tables that only carry
    the carrier code.
  usage: Join downstream flight tables to this table on carrier to resolve airline_name for
    reporting; treat carrier as the unique key since it is the declared grain.
  limitations: The bronze table showed no duplicate rows (duplicate_row_rate 0.0) and no nulls
    in either business column, so no deduplication or null-handling logic was needed beyond
    dropping the three Airbyte capture-metadata columns.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference lookup mapping two-letter carrier codes to
    their full airline names, intended to be joined into flight-level fact tables that only
    carry the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count is 16, equal to the row_count of 16,
      so each two-letter carrier code (e.g. AA, DL, UA) uniquely identifies a row.
  - name: airline_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full airline names (e.g. 'Delta Air Lines
      Inc.', 'United Air Lines Inc.'); renamed from the ambiguous bronze name 'name' to 'airline_name'
      for clarity.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
