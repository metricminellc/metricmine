apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference lookup mapping two-letter IATA carrier codes to
    their full airline names, intended to feed joins from flight-fact tables that only carry
    the carrier code.
  usage: Join on carrier to enrich flight or booking records with the human-readable carrier_name;
    both columns are required and non-null so no null-handling logic is needed by consumers.
  limitations: The profile covers only 16 rows (one per carrier) with zero nulls and zero
    duplicates, so no sparsity, duplicate, or clock-drift issues were found; consumers should
    be aware this is a static small dimension table, not a growing fact table.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference lookup mapping two-letter IATA carrier codes
    to their full airline names, intended to feed joins from flight-fact tables that only
    carry the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 16 rows and distinct_count is 16, matching row_count,
      so carrier is a complete two-letter IATA code (e.g. '9E','AA','DL') suitable as a required
      key.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 16 matching row_count; values like 'Delta
      Air Lines Inc.' and 'Southwest Airlines Co.' are full carrier names, renamed from the
      generic 'name' to the descriptive 'carrier_name' for clarity in a dedicated airline
      lookup table.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
