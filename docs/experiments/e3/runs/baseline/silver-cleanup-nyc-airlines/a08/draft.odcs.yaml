apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table is a cleaned airline carrier reference set, pairing each IATA
    carrier code with its full legal carrier name, intended to be joined with flight fact
    tables to enrich records with readable carrier identity.
  usage: Join downstream flight tables on the carrier column, which is the declared grain,
    to pull in carrier_name; since duplicate_row_rate is 0.0 and null_rate is 0.0 on both
    columns, no additional null-filtering or dedupe logic is required by consumers.
  limitations: The profile covers only 16 rows (one per carrier observed at capture time),
    so carriers introduced after this snapshot will be absent until the bronze source is re-profiled;
    the zero duplicate_row_rate and zero null_rate reflect this single capture and were not
    evaluated across multiple extraction cycles.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This silver table is a cleaned airline carrier reference set, pairing each
    IATA carrier code with its full legal carrier name, intended to be joined with flight
    fact tables to enrich records with readable carrier identity.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count is 16, matching the row_count of 16,
      so every row carries a unique IATA carrier code such as 9E, AA, DL.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full carrier names (e.g. Delta Air Lines
      Inc., Southwest Airlines Co.); renamed from the generic 'name' to carrier_name for clarity
      since it describes the carrier.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
