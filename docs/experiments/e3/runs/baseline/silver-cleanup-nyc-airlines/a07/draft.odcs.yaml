apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small, static reference dataset mapping two-letter airline carrier
    codes to their full legal airline names, intended to feed joins against flight-level fact
    tables that record only the carrier code.
  usage: Consumers should join on the carrier column (the declared grain) to enrich flight
    records with a human-readable airline_name; both columns are fully populated (null_rate
    0.0) so no null-handling logic is required for this table.
  limitations: The profile shows only 16 rows with no duplicates and no nulls, so no cleanup
    beyond dropping Airbyte capture metadata and renaming 'name' to 'airline_name' was needed;
    consumers should be aware this reference table may need periodic refresh if new carriers
    enter the source system.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small, static reference dataset mapping two-letter airline
    carrier codes to their full legal airline names, intended to feed joins against flight-level
    fact tables that record only the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 16 rows and distinct_count is 16, matching row_count,
      so carrier is a complete two-letter IATA code (e.g. 9E, AA, DL) suitable as the grain
      key.
  - name: airline_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 16 with values like 'Delta Air Lines
      Inc.' and 'JetBlue Airways'; renamed from the generic 'name' to 'airline_name' for clarity
      since it describes the carrier, not a person or other entity.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
