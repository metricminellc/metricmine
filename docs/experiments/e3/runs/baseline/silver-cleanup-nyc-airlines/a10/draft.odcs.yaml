# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference dataset mapping airline carrier codes to their
    full legal names, intended to be joined with flight-level fact tables to enrich records
    with human-readable airline names.
  usage: Join downstream flight data on the carrier code to resolve the full airline name;
    treat this table as static reference data with one row per carrier and no nulls to filter.
  limitations: The table has only 16 rows, one per known carrier, and duplicate_row_rate of
    0.0 means no deduplication logic was needed; all three Airbyte capture-metadata columns
    were dropped as they carried no business meaning.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference dataset mapping airline carrier codes to their
    full legal names, intended to be joined with flight-level fact tables to enrich records
    with human-readable airline names.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count is 16, exactly matching row_count of
      16, with values like AA, DL, UA, so carrier is a two-letter IATA code that uniquely
      identifies each row.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 16 and samples such as 'Delta Air Lines
      Inc.' and 'United Air Lines Inc.', giving the full legal airline name for each carrier
      code.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
