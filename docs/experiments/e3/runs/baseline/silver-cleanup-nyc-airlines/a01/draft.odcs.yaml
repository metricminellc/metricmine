apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a clean, deduplicated reference mapping of two-letter airline
    carrier codes to their full legal airline names, intended to feed joins against flight
    or ticketing fact tables keyed by carrier code.
  usage: Consumers should join on the 'carrier' grain key to enrich flight records with human-readable
    airline names; both columns are fully populated (null_rate 0.0) and require no null handling.
  limitations: The source profile covers only 16 rows representing a fixed reference set of
    carrier codes as of the extraction snapshot (2026-09-02); no duplicate rows were found
    (duplicate_row_rate 0.0), and all pipeline metadata columns were excluded as they carried
    no business value.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table provides a clean, deduplicated reference mapping of two-letter airline
    carrier codes to their full legal airline names, intended to feed joins against flight
    or ticketing fact tables keyed by carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0, and distinct_count 16 matches the 16-row
      table exactly (e.g. '9E','AA','DL','UA'), making this a clean non-null identifier code.
  - name: airline_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 16 distinct full carrier names (e.g. 'Delta Air Lines
      Inc.','Southwest Airlines Co.') one-to-one with carrier codes; renamed from the generic
      'name' to the descriptive 'airline_name' for clarity in a dedicated airlines table.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
