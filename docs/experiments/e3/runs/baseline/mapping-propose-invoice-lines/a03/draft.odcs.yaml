# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T12:19:01.100975+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the contracted silver_invoice_lines table enters the
    gold unified event star as the invoice_lines fact category, stating its grain, time column,
    and field roles for the deterministic modeling engine that renders the gold models.
  usage: The rendered draft is validated against the frozen mapping-contract schema, gated
    by the mapping validator and datacontract lint, and then reviewed and edited by a human
    before the modeling engine consumes it to emit gold models; it is not itself executable.
  limitations: The mapping does not filter is_cancellation rows, resolve the 30.0664% null_rate
    on customer_id, or interpret negative quantity values as returns; it also does not deduplicate
    beyond the invoice_id plus stock_code identity, leaving any such business logic to downstream
    consumers.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row represents a single invoice line item: a product and quantity billed
    or cancelled on a given invoice at a point in time, as profiled from silver.silver_invoice_lines.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: invoice_line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice number such as 489434 with null_rate 0.0 and distinct_count 2330,
      identifying the parent invoice that groups line items.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag with distinct_values false and true and null_rate 0.0, marking
      whether the line represents a cancellation rather than a sale.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code such as 10002 or 10123C with null_rate 0.0 and distinct_count
      3141, identifying the product on the line.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product description such as '12 PENCIL SMALL TUBE WOODLAND'; null_rate
      is 0.005098 so the field is nullable, likely from unmatched or delisted stock codes.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units transacted on the line, ranging from -1395 to 5184 per the profiled
      min and max with null_rate 0.0; negative values represent returns and the measure is
      summed across lines.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice line ranging from 2009-12-01T07:45:00 to 2009-12-23T16:58:00
      with null_rate 0.0; sample values resolve to whole minutes, so minute is the finest
      grain the data supports.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Per-unit price ranging from 0.0 to 1998.49 per the profiled min and max with
      null_rate 0.0, compared and aggregated across lines as revenue input.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier ranging from 12346 to 18287 that labels rather
      than measures; null_rate is 0.300664 so the field is nullable, consistent with unidentified
      or guest transactions.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Customer country such as Australia or Germany with null_rate 0.0 and distinct_count
      24, describing the geographic origin of the invoice line.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
