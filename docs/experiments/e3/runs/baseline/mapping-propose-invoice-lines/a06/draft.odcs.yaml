# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_invoice_lines table enters the gold unified
    event star as the invoice_lines fact category, stating the time column, grain, and field
    roles for the deterministic modeling engine that consumes this contract to emit gold models.
  usage: The rendered mapping contract is validated against the frozen mapping-contract schema
    and linted before a human reviewer approves it; only after approval does the modeling
    engine read the contract to generate the gold fact and its dimensions.
  limitations: The mapping does not filter or reinterpret cancellation lines (is_cancellation
    flag and negative quantity values remain as-is), does not resolve the ~30% missing customer_id
    values, and does not dedupe beyond the declared invoice_id plus stock_code identity; such
    decisions are left to downstream consumers and review.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'Each row represents one invoice line item: a specific product on a specific
    invoice, with its quantity, unit price, cancellation flag, timestamp, and customer/country
    context.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice document number such as 489434-489443 with null_rate 0.0, identifying
      which invoice a line belongs to and forming part of the line identity.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag with two distinct values (true/false) and null_rate 0.0 marking whether
      the line represents a cancelled transaction, a classification label rather than a measure.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock keeping code such as 10002, 10080, 10123C with 3141 distinct
      values and null_rate 0.0, identifying the product on the line and forming part of the
      line identity.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product name such as '12 PENCIL SMALL TUBE WOODLAND' with null_rate
      0.005098, nullable because some stock codes lack a recorded description in source data.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Signed unit count per line ranging from -1395 to 5184 with null_rate 0.0,
      a measure summed or compared across lines, with negative values corresponding to cancellation
      lines.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice line such as 2009-12-01T07:45:00 with null_rate
      0.0; samples always show :00 seconds, so the finest resolved grain is minute.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Per-unit price ranging from 0.0 to 1998.49 with null_rate 0.0, a measure
      aggregated or multiplied with quantity for line value.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier ranging 12346-18287 with null_rate 0.300664,
      nullable because many invoice lines (about 30%) were recorded without an associated
      customer; an identifier stored as a number so it labels rather than measures.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Customer country such as Australia, Austria, Belgium among 24 distinct values
      with null_rate 0.0, describing the geography of the invoice line.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
