# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T12:22:38.921893+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_invoice_lines table enters the gold
    unified event star as the invoice_lines fact category, specifying its time column, grain,
    degenerate identifier, and field roles for the deterministic modeling engine that generates
    the gold models from this contract.
  usage: The rendered mapping contract is validated against the frozen mapping-contract schema,
    linted, and reviewed by a human before approval; once approved, the deterministic modeling
    engine consumes it to emit the gold fact model for invoice line events, with no further
    transformation performed by this mapping.
  limitations: This mapping does not decide whether cancellation rows (is_cancellation=true,
    negative quantity) should be excluded or netted against sales; that filtering or netting
    logic is left to downstream consumers. It also does not resolve the 30.07% null rate on
    customer_id into a synthetic 'unknown customer' value, nor does it adjudicate whether
    repeated invoice_id/stock_code combinations across the 44721 rows represent amendments
    versus independent lines beyond the derived identity tuple declared here.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row represents a single product line item recorded against an invoice:
    a specific stock_code sold or returned at a given unit_price and quantity, timestamped
    by invoiced_at, attributable to a customer and country when known.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice number such as 489434 with null_rate 0.0 and distinct_count 2330,
      identifying the parent invoice a line belongs to; it is a dimension/identifier, not
      a measure.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag with null_rate 0.0 and distinct_values [false, true] marking
      whether the line represents a cancelled/returned transaction, used to segment events
      rather than to be summed.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product/stock code such as 10002 or 10123C with null_rate 0.0 and distinct_count
      3141, identifying which product the line concerns; it labels rather than measures.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product name such as '12 PENCILS SMALL TUBE POSY' with null_rate
      0.005098 (228 nulls), nullable likely because some stock codes lack a recorded description;
      it is descriptive, not numeric.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units sold or returned per line, ranging from -1395 to 5184 with null_rate
      0.0; negative values align with the is_cancellation flag, and the field is additive
      across lines so it is a measure.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice line ranging from 2009-12-01T07:45:00 to 2009-12-23T16:58:00
      with null_rate 0.0 and minute-level sample values such as '2009-12-01T07:46:00', so
      the event is timestamped to the minute.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Per-unit price ranging from 0.0 to 1998.49 with null_rate 0.0, used in revenue-type
      computations across lines, so it is a measure.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Customer identifier ranging from 12346 to 18287 with null_rate 0.300664 (13446
      nulls), nullable because many invoice lines are recorded without a known customer (e.g.
      guest or unattributed sales); it identifies rather than measures.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country of the invoice such as 'Australia' or 'Germany' with null_rate 0.0
      and distinct_count 24, labeling the geography of the transaction.
servers:
