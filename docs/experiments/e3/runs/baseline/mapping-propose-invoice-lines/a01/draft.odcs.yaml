# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T12:17:51.101141+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver_invoice_lines table enters the gold unified
    event star as the invoice_lines fact category, so the deterministic modeling engine can
    generate the corresponding gold fact and dimension models from it.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, linted with datacontract lint, and reviewed and approved
    by a human before the modeling engine consumes the contract to emit gold models; the mapping
    itself never executes.
  limitations: The mapping does not filter or reclassify cancellation lines (is_cancellation
    has 2 distinct values) nor interpret negative quantity values (ranging to -1395), leaving
    return/cancellation handling to downstream consumers; customer_id is null for roughly
    30% of rows (null_rate 0.300664), so customer-level rollups must account for unattributed
    lines, and product_description gaps (null_rate 0.005098) are left unresolved.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: One row represents a single product line on a customer invoice, capturing the
    stock item, quantity, unit price, and timestamp at which that line was billed or cancelled.
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: invoice_line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Identifies the parent invoice (e.g. 489434, 489435) with null_rate 0.0 but
      distinct_count 2330 versus 44721 rows, confirming many lines share one invoice.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flags whether the line represents a cancellation, with exactly two distinct
      values (false, true) and null_rate 0.0.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product/stock code such as 10002 or 10123C, with distinct_count 3141 and
      null_rate 0.0, labeling which item the line refers to.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text description of the product (e.g. '12 PENCILS SMALL TUBE POSY');
      nullable with null_rate 0.005098, likely missing for a small set of unlabeled or discontinued
      stock codes.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units billed on the line, ranging from -1395 to 5184 with null_rate 0.0;
      negative values correspond to return or cancellation lines and are summed/compared across
      rows.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp the line was invoiced, ranging from 2009-12-01T07:45:00 to 2009-12-23T16:58:00
      with null_rate 0.0; sample values vary by minute with seconds always at :00, so minute
      is the finest resolvable grain.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit ranging from 0.0 to 1998.49 with null_rate 0.0, a monetary
      amount compared and aggregated across lines.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier ranging from 12346 to 18287 that labels rather
      than measures; nullable with null_rate 0.300664, meaning roughly 30% of lines lack customer
      attribution.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country of the invoice (e.g. Australia, Austria, Belgium) with 24 distinct
      values and null_rate 0.0.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
