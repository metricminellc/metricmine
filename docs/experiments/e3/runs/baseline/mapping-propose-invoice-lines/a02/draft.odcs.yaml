# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T12:18:33.045692+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_invoice_lines table enters the gold
    unified event star as the invoice_lines fact category, identifying its time column, grain,
    and field roles for the deterministic modeling engine that consumes this contract to emit
    gold models.
  usage: The mapping contract rendered from this proposal is validated against the frozen
    mapping-contract schema, linted with datacontract lint, and reviewed by a human before
    approval; only after approval does the deterministic modeling engine read it to build
    the gold invoice_lines fact.
  limitations: This mapping does not decide whether cancelled lines (is_cancellation true,
    seen in the boolean samples) or negative-quantity returns (quantity min -1395) should
    be excluded or netted in downstream analysis; it also leaves the 30.07% null_rate on customer_id
    and the 0.51% null_rate on product_description unresolved, deferring any imputation or
    filtering decision to consumers of the generated gold model.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row represents a single invoice line item: a product sold (or cancelled)
    on a specific invoice at a point in time, with its quantity, unit price, and the customer
    and country associated with that invoice.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice number such as 489434-489443 in the samples, null_rate 0.0, identifies
      the parent invoice a line belongs to and is part of the line identity tuple.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag with distinct_values false and true and null_rate 0.0, marking
      whether the line represents a cancelled transaction rather than a measured quantity.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product/stock code such as 10002, 10080, 10123C in the samples, null_rate
      0.0, identifies the product on the line and is part of the line identity tuple.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product description such as '12 PENCIL SMALL TUBE WOODLAND', nullable
      with null_rate 0.005098, likely missing when a product lookup failed at source.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units transacted per line, null_rate 0.0, ranging min -1395 to max 5184 with
      negative samples such as -1395 and -1043 indicating returns or cancellations that are
      summed across lines.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice line event, null_rate 0.0, samples resolve to the
      minute (e.g. 2009-12-01T07:45:00, 2009-12-01T07:46:00) spanning min 2009-12-01T07:45:00
      to max 2009-12-23T16:58:00.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit on the line, null_rate 0.0, ranging min 0.0 to max 1998.49
      across 295 distinct values, compared and aggregated across lines.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier ranging min 12346 to max 18287, nullable with
      null_rate 0.300664, likely unidentified or guest transactions; it labels the customer
      rather than measuring anything.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country of the invoice such as Australia, Austria, Belgium in the samples,
      null_rate 0.0 with 24 distinct values, labels the customer's or shipment's country.
servers:
