# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T12:21:35.271593+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the silver.silver_invoice_lines table enters the gold
    unified event star as the invoice_lines fact category, for consumption by the deterministic
    modeling engine that builds the gold models from approved mapping contracts.
  usage: The mapping contract proposal is rendered to an ODCS mapping draft, validated against
    the frozen mapping-contract schema, checked by datacontract lint, and reviewed and edited
    by a human before approval; only then does the deterministic modeling engine use the approved
    contract to emit the gold invoice_lines fact.
  limitations: The mapping does not filter, exclude, or reclassify cancellation lines flagged
    by is_cancellation or the negative quantities observed in samples (as low as -1395), nor
    does it resolve or impute the 30.0664% null rate on customer_id; such exclusions and resolutions
    are left to downstream consumers of the gold fact.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row represents a single invoice line item: a stock-coded product entry
    recorded against an invoice, capturing the quantity and unit price transacted at a specific
    minute-resolution timestamp.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: invoice_line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Non-null VARCHAR invoice document code (samples '489434'-'489443') with distinct_count
      2330 across 44721 rows, identifying the invoice a line belongs to; it is a dimension
      because it is not unique per row.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Non-null BOOLEAN flag with distinct_values [false, true] marking whether
      the line is a cancellation record; it labels rows rather than measuring them, so it
      is a dimension.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Non-null VARCHAR product code (samples '10002', '10080', '10123G') with distinct_count
      3141, identifying the stock item on the line; a dimension.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Nullable (null_rate 0.5098%) VARCHAR free-text product description (samples
      such as '12 PENCIL SMALL TUBE WOODLAND'); a dimension that is occasionally missing in
      the source.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Non-null INTEGER quantity transacted on the line, ranging from -1395 to 5184
      in profile samples, with negative values plausibly corresponding to cancellations; it
      is added across rows and is therefore a measure.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Non-null TIMESTAMP recording when the line was invoiced, with samples resolving
      to the minute (e.g. 2009-12-01T07:45:00 then 07:46:00); this is the time column for
      the category, at minute grain.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Non-null DECIMAL(10,2) unit price ranging from 0.0 to 1998.49 in samples;
      it is compared and aggregated across lines, so it is a measure.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Nullable (null_rate 30.0664%) INTEGER identifier of the purchasing customer
      (samples 12346, 12349, 12358); it labels the line rather than being summed, so it is
      a dimension, and is missing for roughly a third of lines likely reflecting unidentified
      or guest purchases.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Non-null VARCHAR country associated with the invoice line (samples 'Australia',
      'Belgium', 'Germany') with distinct_count 24; a dimension.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
