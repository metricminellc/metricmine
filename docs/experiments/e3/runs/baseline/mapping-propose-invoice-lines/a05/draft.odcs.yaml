# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T12:19:51.916137+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how the contracted silver.silver_invoice_lines table enters
    the gold unified event star as the invoice_lines fact category, specifying the time column,
    grain, identity, and field roles; it is consumed by the deterministic modeling engine
    that generates the gold fact and dimension models.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema and datacontract lint, reviewed and edited by a human,
    and only the approved contract is fed to the modeling engine to generate gold models;
    nothing in this document executes directly.
  limitations: The mapping does not resolve the 30.0664% null rate on customer_id or the 0.5098%
    null rate on product_description, does not filter or reclassify is_cancellation or negative-quantity
    rows as returns, and does not deduplicate beyond the observed duplicate_row_rate of 0.0;
    any such business logic is left to downstream consumers of the generated gold model.
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row represents a single invoice line item: a product sold or returned
    at a specific quantity and unit price within an invoice, timestamped to the minute.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice identifier shown in samples such as '489434'-'489443', null_rate
      0.0 and distinct_count 2330 across 44721 rows, so it groups multiple line items under
      one invoice.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Boolean flag with distinct_values [false, true] and null_rate 0.0, marking
      whether this line represents a cancellation rather than a sale.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product/stock code such as '10002', '10080', with distinct_count 3141 and
      null_rate 0.0, identifying which item the line refers to.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product description, e.g. '12 ASS ZINC CHRISTMAS DECORATIONS';
      null_rate 0.005098 (228 nulls) shows a small fraction of lines lack a description, likely
      discontinued or unlisted stock codes.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units transacted on the line, ranging from -1395 to 5184 with null_rate 0.0;
      negative values in the sample correspond to returns or cancellations, and the value
      is summed/compared across lines as a measure.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice line, ranging 2009-12-01T07:45:00 to 2009-12-23T16:58:00
      with null_rate 0.0; sample values resolve to whole minutes, so the finest supported
      grain is minute.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Per-unit price ranging 0.0 to 1998.49 with null_rate 0.0, used as a measure
      for revenue calculations alongside quantity.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier ranging 12346 to 18287; null_rate 0.300664 (13446
      nulls) shows many lines have no attributed customer, likely anonymous or guest transactions,
      and as an identifier it labels rather than measures.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country of the invoice such as 'Australia', 'Germany', with distinct_count
      24 and null_rate 0.0, describing the customer's shipping/billing geography.
servers:
