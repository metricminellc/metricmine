# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:48:18.800038+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, visibility) at NYC-area airports, intended to feed flight
    delay and operations analyses that join on airport and hour.
  usage: Join on origin and time_hour to combine with flight records at the matching airport
    and hour; consumers must handle nulls explicitly in wind_dir, wind_speed, wind_gust, and
    pressure rather than assuming zero or average values.
  limitations: wind_gust is missing in 74.6% of rows (9702 of 13014) and should not be treated
    as reliably present; pressure is missing in 11.5% of rows (1496 of 13014) and wind_dir
    in 1.7% (219 of 13014); wind_speed is missing in 2 rows. No duplicate rows were found
    in bronze (duplicate_row_rate 0.0), so no dedupe logic was applied.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, visibility) at NYC-area airports, intended to feed flight
    delay and operations analyses that join on airport and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 3 (EWR, JFK, LGA), a clean low-cardinality
      airport code column.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count is 1 with min=max=2013.0, a whole-number value landed as DECIMAL(38,9)
      that casts cleanly to INTEGER; null_rate is 0.0.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are 1.0 through 6.0, all integral, so DECIMAL(38,9) casts
      safely to INTEGER; null_rate is 0.0.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 1.0, max 31.0, sample_values 1.0-10.0 all integral, consistent with a
      calendar day cast to INTEGER; null_rate is 0.0.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 0.0, max 23.0, sample_values 0.0-9.0 all integral, a clock-hour value
      that casts to INTEGER; null_rate is 0.0.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values like 10.94 and 12.02 carry two decimal places, min 10.94 and
      max 93.92, so DECIMAL(10,2) preserves precision; null_rate is 0.0.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values such as -9.94 and 73.94 (max) show two decimal places; DECIMAL(10,2)
      fits and null_rate is 0.0.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values like 12.74 and 15.47 with max 100.0 and min 12.74 fit DECIMAL(10,2);
      null_rate is 0.0 despite high distinct_count 2178.
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.016828 (219 of 13014 nulls), so retain as nullable; sample_values
      span 0.0-90.0 in 10-degree steps up to max 360.0.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.000154 (2 of 13014), a near-complete decimal measurement (max
      1048.36058) retained as nullable DECIMAL(10,2).
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 nulls), so the column is sparsely populated
      and must remain nullable, not imputed.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values step from 0.0 to 0.09 in 0.01 increments, max 1.06, null_rate
      is 0.0, fits DECIMAL(10,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.114953 (1496 of 13014 nulls), retained nullable; sample_values
      like 983.8-992.1 fit DECIMAL(10,2).
  - name: visib
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: distinct_values enumerate exactly 20 values from 0.0 to 10.0, null_rate is
      0.0, fits DECIMAL(10,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are uniformly ISO-8601 strings like 2013-01-01T06:00:00Z with
      no format disagreement, so VARCHAR casts safely to TIMESTAMP; null_rate is 0.0.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
