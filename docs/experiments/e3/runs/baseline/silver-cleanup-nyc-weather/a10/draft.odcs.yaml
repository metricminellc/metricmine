# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:52:29.487570+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_weather provides cleaned, typed hourly weather observations for the
    NYC-area airports (EWR, JFK, LGA) in 2013, intended to feed downstream analyses that join
    weather conditions to flight operations data.
  usage: Join on origin and time_hour to combine with flight records at the matching airport
    and hour; expect wind_gust to be null for the large majority of rows and pressure and
    wind_dir to be null for a meaningful minority, so consumers must handle nulls explicitly
    rather than assume full coverage; calendar fields (year, month, day, hour) are redundant
    with time_hour and can be used for partitioning or filtering.
  limitations: Cleanup did not resolve the high sparsity of wind_gust (null_rate 0.745505)
    or the moderate sparsity of pressure (null_rate 0.114953) and wind_dir (null_rate 0.016828);
    no exact duplicate rows were observed (duplicate_row_rate 0.0) but near-duplicate or clock-drift
    rows were not assessed since no row-hash or timestamp-skew evidence was available in the
    profile.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: silver_nyc_weather provides cleaned, typed hourly weather observations for
    the NYC-area airports (EWR, JFK, LGA) in 2013, intended to feed downstream analyses that
    join weather conditions to flight operations data.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 across 13014 rows, and the three distinct_values
      (EWR, JFK, LGA) are valid airport codes, so origin is kept as a required VARCHAR station
      identifier.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: year lands as DECIMAL(38,9) but the single distinct_value 2013.0 (min=max=2013.0)
      is integral with null_rate 0.0, so it is cast to INTEGER as a calendar-year field.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0 through 6.0 (min 1.0, max 6.0) are all integral with
      null_rate 0.0, so month is cast from DECIMAL(38,9) to INTEGER as a calendar-month field.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 and min 1.0/max 31.0 are integral with null_rate
      0.0, consistent with a calendar day-of-month, so it is cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 and min 0.0/max 23.0 are integral with null_rate
      0.0, consistent with a 24-hour clock field, so it is cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: temp ranges from min 10.94 to max 93.92 with fractional samples (10.94, 12.02,
      ...) and null_rate 0.0, so it is cast from DECIMAL(38,9) to DOUBLE and required.
  - name: dewp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: dewp ranges from min -9.94 to max 73.94 with fractional samples and null_rate
      0.0, so it is cast to DOUBLE and required.
  - name: humid
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: humid has 2178 distinct fractional values between min 12.74 and max 100.0
      with null_rate 0.0, so it is cast to DOUBLE and required.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values (0.0, 10.0, ..., 90.0) are all integral and distinct_count
      37 matches compass degrees 0-360 in 10-degree steps (min 0.0, max 360.0), so it is cast
      to INTEGER; null_rate 0.016828 (219 nulls) means it stays optional with nulls retained.
  - name: wind_speed
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: wind_speed samples carry fine fractional precision (3.45234, 4.60312, ...)
      between min 0.0 and max 1048.36058, so it is cast to DOUBLE; null_rate 0.000154 (2 nulls)
      means nulls are retained rather than imputed.
  - name: wind_gust
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: wind_gust has null_rate 0.745505 (9702 of 13014 rows null), so despite fractional
      samples between min 16.11092 and max 62.14212 justifying a DOUBLE cast, the column is
      sparsely populated and kept optional with nulls retained.
  - name: precip
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: precip has 50 distinct fractional values from 0.0 to 1.06 with null_rate
      0.0, so it is cast to DOUBLE and required.
  - name: pressure
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: pressure ranges from min 983.8 to max 1038.4 with fractional samples, but
      null_rate 0.114953 (1496 nulls) means it is cast to DOUBLE yet kept optional with nulls
      retained.
  - name: visib
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: visib has 20 distinct_values including fractional ones (0.06, 0.12, 0.25,
      ...10.0) with null_rate 0.0, so it is cast from DECIMAL(38,9) to DOUBLE and required.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: all sample_values (e.g. 2013-01-01T06:00:00Z through 2013-01-01T15:00:00Z)
      are consistently ISO-8601 formatted with a Z suffix and null_rate 0.0, so the VARCHAR
      is cast to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
