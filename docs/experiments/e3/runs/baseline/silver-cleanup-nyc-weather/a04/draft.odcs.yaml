# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:47:33.946500+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, hourly weather observations for the three NYC-area
    airports (EWR, JFK, LGA) in 2013, feeding downstream flight-delay and operations analyses
    that join on airport and hour.
  usage: Consumers should join on origin and time_hour as the declared grain, cast numeric
    fields are ready for aggregation, and must handle nulls explicitly in wind_dir, wind_speed,
    wind_gust, and pressure since these are retained as nullable rather than imputed.
  limitations: wind_gust is missing in 74.6% of rows and pressure in 11.5%, so any analysis
    relying on these fields will have reduced coverage; wind_dir and wind_speed have small
    null rates (1.7% and 0.02% respectively) that still require null-aware logic; no duplicate
    rows were found so no dedupe logic was applied.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned, hourly weather observations for the three NYC-area
    airports (EWR, JFK, LGA) in 2013, feeding downstream flight-delay and operations analyses
    that join on airport and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with null_count 0 across 13014 rows and distinct_count 3 limited
      to EWR, JFK, LGA, so the airport code is always present and well-formed.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but distinct_count is 1 with min=max=2013.0, an integral
      value, so it casts safely to INTEGER; null_rate is 0.0.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Distinct_values are 1.0 through 6.0, all integral, min 1.0 max 6.0, null_rate
      0.0, so DECIMAL(38,9) casts cleanly to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Sample_values 1.0 through 10.0 and distinct_count 31 with min 1.0 max 31.0
      are all integral calendar-day values, null_rate 0.0, so it casts to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Sample_values 0.0 through 9.0 and distinct_count 24 with min 0.0 max 23.0
      are integral hour-of-day values, null_rate 0.0, so it casts to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: Samples like 10.94, 12.02, 17.96 carry two decimal places with min 10.94
      and max 93.92; null_rate 0.0 so the fractional Fahrenheit reading is retained as DECIMAL.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: Samples span -9.94 to 73.94 with two decimal places and null_rate 0.0, matching
      a dewpoint measurement kept as DECIMAL.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: Distinct_count 2178 with samples from 12.74 to 15.47 and max 100.0, null_rate
      0.0, so humidity percentage is cast to DECIMAL.
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: Samples 0.0 to 90.0 in steps of 10 with max 360.0 fit a compass-degree reading,
      but null_rate 0.016828 (219 nulls) means it must stay nullable.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: Samples carry five decimal places (e.g. 3.45234, 12.65858) with max 1048.36058
      and a small null_rate of 0.000154 (2 nulls), so it is cast to DECIMAL and kept nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 rows null), so the column is sparsely
      populated and must remain nullable despite well-formed decimal samples like 16.11092
      to 26.46794.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: Samples 0.0 through 0.09 with max 1.06 and null_rate 0.0 show a complete
      two-decimal precipitation reading, cast to DECIMAL.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: null_rate 0.114953 (1496 of 13014 rows null) means pressure must stay nullable,
      though samples 983.8 to 992.1 are consistent one-decimal readings.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_values list 20 discrete values from 0.0 to 10.0 including fractional
      entries like 0.06 and 0.12, null_rate 0.0, so it casts to DECIMAL.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Samples are consistently ISO-8601 UTC strings like 2013-01-01T06:00:00Z with
      distinct_count 4341 and null_rate 0.0, so VARCHAR casts to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
