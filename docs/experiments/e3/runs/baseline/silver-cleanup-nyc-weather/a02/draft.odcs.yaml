# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:45:55.235963+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned hourly weather observations for the three NYC-area
    airports (EWR, JFK, LGA) in 2013, intended to feed flight-delay and weather-correlation
    analytics joining on station and hour.
  usage: Join on origin and time_hour to combine with flight-level data; treat wind_gust and
    pressure as frequently or occasionally null and filter or handle them deliberately rather
    than assuming completeness, since no values were imputed.
  limitations: wind_gust is missing in 74.55% of rows (9702/13014) and pressure in 11.50%
    (1496/13014); wind_dir (1.68%) and wind_speed (0.015%) have minor null rates. duplicate_row_rate
    is 0.0 so no row-level deduplication was required, and the origin/time_hour grain is a
    close but not exact match to row_count (13014 vs. ~13023 implied by distinct counts) and
    should be validated against the warehouse before approval.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned hourly weather observations for the three NYC-area
    airports (EWR, JFK, LGA) in 2013, intended to feed flight-delay and weather-correlation
    analytics joining on station and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 3 and distinct_values EWR, JFK, LGA,
      a clean low-cardinality station code suitable as a grain key.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but distinct_count is 1 with min/max both 2013.0,
      an integral value that supports casting to INTEGER; null_rate is 0.0.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0 through 6.0 are all integral with min 1.0 and max 6.0,
      so casting from DECIMAL(38,9) to INTEGER is safe; null_rate is 0.0.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 are integral, distinct_count 31 matches calendar
      days with min 1.0 and max 31.0, so INTEGER cast is justified; null_rate is 0.0.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 are integral with min 0.0 and max 23.0 matching
      a 24-hour clock, so INTEGER cast is safe; null_rate is 0.0.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, min 10.94 and max 93.92 with two-decimal sample_values
      like 12.02 and 19.04 support a DECIMAL(5,2) representation.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, min -9.94 and max 73.94 with two-decimal sample_values
      support a signed DECIMAL(5,2) representation.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: null_rate is 0.0, distinct_count 2178, min 12.74 and max 100.0 with two-decimal
      sample_values support DECIMAL(6,2).
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: null_rate is 0.016828 (219 of 13014 nulls); sample_values are multiples of
      10 from 0.0 to 360.0 degrees, so values are retained nullable rather than imputed.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.000154 (2 of 13014 nulls), min 0.0 and max 1048.36058 with
      five-decimal sample_values, retained nullable per policy.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 nulls), a sparsely populated column;
      min 16.11092 and max 62.14212 among the non-null values, retained nullable rather than
      dropped.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: null_rate is 0.0, min 0.0 and max 1.06 with two-decimal sample_values from
      0.0 to 0.09 supporting DECIMAL(5,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: null_rate is 0.114953 (1496 of 13014 nulls), min 983.8 and max 1038.4 with
      one-decimal sample_values, retained nullable rather than imputed.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: null_rate is 0.0, distinct_count 20 at the profiler cap with distinct_values
      spanning 0.0 to 10.0 including fractional entries like 0.06 and 0.12, supporting DECIMAL(4,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0, distinct_count 4341, and sample_values are consistently
      ISO-8601 Z-suffixed strings like 2013-01-01T06:00:00Z, supporting a TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
