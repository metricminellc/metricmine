# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:45:09.370881+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, visibility) for the three NYC-area airports (EWR, JFK,
    LGA) in 2013, intended to feed downstream analyses that join weather conditions to flight
    or operational events by airport and hour.
  usage: Join on origin and time_hour (now a TIMESTAMP) to align with flight or event data
    at the same airport and hour; treat wind_gust as frequently absent (about 75% null) and
    pressure, wind_dir, and wind_speed as occasionally absent, so aggregate functions should
    skip nulls rather than treat them as zero.
  limitations: wind_gust is sparsely populated (null_rate 0.745505) and should not be relied
    on for complete coverage; pressure (null_rate 0.114953), wind_dir (null_rate 0.016828),
    and wind_speed (null_rate 0.000154) also carry some nulls that are retained rather than
    imputed; capture-tool metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped and carry no business history.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed hourly weather observations (temperature,
    humidity, wind, pressure, precipitation, visibility) for the three NYC-area airports (EWR,
    JFK, LGA) in 2013, intended to feed downstream analyses that join weather conditions to
    flight or operational events by airport and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 13014 rows and distinct_values shows exactly the
      three expected airport codes EWR, JFK, LGA.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but distinct_values shows a single integral value
      2013.0 with min=max=2013.0 and null_rate 0.0, so it safely casts to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are the integral set 1.0 through 6.0 with min 1.0 and max
      6.0 and null_rate 0.0, supporting a cast to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values are integral 1.0 through 10.0, min is 1.0 and max is 31.0 matching
      a calendar day, with null_rate 0.0, so DECIMAL casts cleanly to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values are integral 0.0 through 9.0, min 0.0 and max 23.0 matching
      an hour-of-day range, with null_rate 0.0, supporting a cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values carry two decimal places (10.94 to 93.92 range per min/max)
      with null_rate 0.0, so DECIMAL(5,2) fits the observed precision and range.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values show negative and positive values to two decimal places (min
      -9.94, max 73.94) with null_rate 0.0, consistent with a dew point measure cast to DECIMAL(5,2).
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values range from 12.74 to 100.0 (min/max confirm) with null_rate
      0.0, consistent with a percent humidity cast to DECIMAL(5,2).
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: null_rate is 0.016828 (219 nulls) so nulls are retained; sample_values are
      multiples of 10 from 0.0 to 360.0 matching a compass heading cast to DECIMAL(5,1).
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.000154 (2 nulls) so nulls are retained; sample_values carry
      five decimal places up to max 1048.36058, requiring DECIMAL(10,5) to preserve precision.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 nulls), so this column is sparsely populated
      and nulls are retained rather than imputed; sample_values support DECIMAL(10,5).
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values are two-decimal increments from 0.0 to 1.06 (min/max) with
      null_rate 0.0, supporting DECIMAL(5,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: null_rate is 0.114953 (1496 nulls) so nulls are retained; sample_values range
      983.8 to 1038.4 (min/max) at one decimal place, supporting DECIMAL(6,1).
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_values list a closed set of 20 values from 0.0 to 10.0 (min/max
      confirm) with null_rate 0.0, supporting DECIMAL(4,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: All sample_values are uniform ISO-8601 timestamps with Z suffix (e.g. 2013-01-01T06:00:00Z)
      and null_rate is 0.0, so VARCHAR casts cleanly to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
