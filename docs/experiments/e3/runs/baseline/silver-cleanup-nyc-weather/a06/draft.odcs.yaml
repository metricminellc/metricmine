# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:49:02.802580+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, visibility) for the NYC-area airports (EWR, JFK, LGA) to
    support joins with flight operations data for weather-impact analysis.
  usage: Join on origin and time_hour (the declared grain) to attach weather conditions to
    flight or operational events at the matching airport and hour; consumers must handle nulls
    in wind_dir, wind_speed, wind_gust, and pressure explicitly rather than assuming zero
    or average values, and should expect wind_gust to be populated only roughly 25% of the
    time.
  limitations: The cleanup dropped all Airbyte capture metadata columns and could not resolve
    the high sparsity of wind_gust (null_rate 0.745505) or the moderate sparsity of pressure
    (null_rate 0.114953); these nulls were retained rather than imputed. No duplicate rows
    were found (duplicate_row_rate 0.0), so no deduplication logic was applied.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned, hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, visibility) for the NYC-area airports (EWR, JFK, LGA) to
    support joins with flight operations data for weather-impact analysis.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_values are exactly the three airport codes
      EWR, JFK, LGA, so the column is a clean categorical key.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count is 1 with the single value 2013.0, an integral value with
      no fractional part and null_rate 0.0, so casting DECIMAL(38,9) to INTEGER is safe.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are the integral set 1.0 through 6.0 with null_rate 0.0,
      supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 1.0 and max 31.0 with sample_values 1.0-10.0 all integral and null_rate
      0.0, so a cast to INTEGER is justified.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 0.0 and max 23.0 with integral sample_values and null_rate 0.0 support
      casting DECIMAL(38,9) to INTEGER for an hour-of-day field.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values like 10.94 and 93.92 are fractional with null_rate 0.0, so
      the column is cast to a tighter DECIMAL(10,2) rather than the wide DECIMAL(38,9) landed
      type.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values range from -9.94 to 73.94 with fractional precision and null_rate
      0.0, so DECIMAL(10,2) captures the observed precision without the oversized landed scale.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: distinct_count 2178 with fractional sample_values between 12.74 and 100.0
      and null_rate 0.0 justify a DECIMAL(10,2) cast.
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.016828 (219 nulls) so the column is retained nullable; sample_values
      0.0-90.0 at 10-degree steps support a DECIMAL(10,2) cast.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.000154 (2 nulls) so nulls are retained; fractional sample_values
      from 0.0 to 12.65858 support DECIMAL(10,2).
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 nulls), so the column is sparsely populated
      and retained nullable rather than imputed; fractional sample_values support DECIMAL(10,2).
  - name: precip
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 and distinct sample_values from 0.0 to 0.09 in 0.01 increments,
      up to max 1.06, support a DECIMAL(10,2) cast.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_rate is 0.114953 (1496 nulls) so the column is retained nullable; sample_values
      from 983.8 to 1038.4 support DECIMAL(10,2).
  - name: visib
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 and distinct_count 20 with distinct_values ranging 0.0 to
      10.0 including fractional entries like 0.06 and 0.12, so DECIMAL(10,2) is appropriate.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are consistently ISO-8601 formatted (e.g. 2013-01-01T06:00:00Z)
      with null_rate 0.0 and distinct_count 4341, supporting a cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
