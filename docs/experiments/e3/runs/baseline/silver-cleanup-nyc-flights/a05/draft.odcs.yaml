# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:39:34.216588+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table cleans the bronze nyc_flights capture into a typed, deduplicated
    record of individual flight instances (scheduled and actual departure/arrival times, delays,
    carrier, origin/destination, distance) for downstream analytics on flight delay and performance.
  usage: Consumers should join on the declared grain (year, month, day, carrier, flight, origin)
    and must handle nullable timing columns (dep_time, dep_delay, arr_time, arr_delay, air_time,
    tailnum) explicitly, for example by filtering or flagging flights with null dep_time/arr_time
    as likely cancellations before computing delay aggregates.
  limitations: Cleanup could not resolve the roughly 2.9%-3.3% null rates in dep_time, dep_delay,
    arr_time, arr_delay and air_time, nor the 0.9% null rate in tailnum; these are retained
    as nulls rather than imputed, and the declared grain has not been measured for uniqueness
    against the full warehouse table.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This silver table cleans the bronze nyc_flights capture into a typed, deduplicated
    record of individual flight instances (scheduled and actual departure/arrival times, delays,
    carrier, origin/destination, distance) for downstream analytics on flight delay and performance.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year is a single-value column (distinct_count 1, min=max=2013.0) with null_rate
      0.0; DECIMAL(38,9) samples are integral so it casts cleanly to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has distinct_values 1.0-6.0, null_rate 0.0, all integral; cast DECIMAL(38,9)
      to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day ranges 1.0-31.0 (distinct_count 31), null_rate 0.0, sample values are
      integral; cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has null_rate 0.029388 (4883 nulls of 166158 rows), range 1.0-2400.0,
      integral samples; retained nullable to represent flights with no recorded departure
      (e.g. cancellations).
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has null_rate 0.0, range 500.0-2359.0, integral samples; cast
      to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has null_rate 0.029388 matching dep_time's nullability, range -33.0
      to 1301.0, integral samples; retained nullable since delay cannot be computed without
      a departure time.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has null_rate 0.0307 (5101 nulls), range 1.0-2400.0, integral samples;
      retained nullable for flights with no recorded arrival.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has null_rate 0.0, range 1.0-2359.0, integral samples; cast
      to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has null_rate 0.032981 (5480 nulls), range -86.0 to 1272.0, integral
      samples; retained nullable since it depends on arr_time's presence.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier is a 2-letter code with distinct_count 16 (e.g. 9E, AA, DL, UA) and
      null_rate 0.0; kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight ranges 1.0-8500.0 with distinct_count 2994, null_rate 0.0, integral
      samples; cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has null_rate 0.009154 (1521 nulls) with alphanumeric samples like
      N0EGMQ, N10156; kept nullable string since some flights lack a recorded tail number.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin has only 3 distinct_values (EWR, JFK, LGA) and null_rate 0.0; kept
      as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has distinct_count 100 airport codes (samples ABQ, ACK, ALB...) and
      null_rate 0.0; kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has null_rate 0.032981 (5480 nulls, matching arr-side nulls), range
      20.0-695.0, integral samples; retained nullable.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has null_rate 0.0, range 80.0-4983.0, integral samples; cast to
      INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has distinct_values 5.0-23.0, null_rate 0.0, integral; cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute ranges 0.0-59.0 (distinct_count 60), null_rate 0.0, integral samples;
      cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour has null_rate 0.0 and all 10 sample values follow a consistent
      ISO-8601 pattern (e.g. 2013-01-01T10:00:00Z); cast VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
