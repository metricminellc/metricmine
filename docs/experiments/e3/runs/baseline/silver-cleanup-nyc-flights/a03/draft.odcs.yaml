# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:37:22.102834+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed NYC flight departure and arrival records for
    2013, covering scheduled and actual timing, carrier, flight number, origin and destination
    airports, air time, and distance, to feed downstream analytics on flight performance and
    delays.
  usage: Consumers should treat year, month, day, carrier, and flight together as the row
    grain and must explicitly handle nulls in dep_time, arr_time, dep_delay, arr_delay, and
    air_time, which are retained as nulls rather than imputed and likely indicate cancelled
    or diverted flights.
  limitations: Cleanup did not resolve the roughly 3% null rates in dep_time (0.029388), arr_time
    (0.0307), dep_delay (0.029388), arr_delay (0.032981), and air_time (0.032981), nor the
    0.9154% null rate in tailnum; no duplicate rows were found (duplicate_row_rate 0.0) so
    no deduplication logic was applied, and the grain has not been measured against the live
    warehouse.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed NYC flight departure and arrival records
    for 2013, covering scheduled and actual timing, carrier, flight number, origin and destination
    airports, air time, and distance, to feed downstream analytics on flight performance and
    delays.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has null_rate 0.0 and a single distinct_value 2013.0, an integral constant;
      cast DECIMAL(38,9) to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has null_rate 0.0 with distinct_values 1.0-6.0, all integral; cast
      to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day has null_rate 0.0, distinct_count 31, min 1.0 max 31.0, and integral
      sample values 1.0-10.0; cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has null_rate 0.029388 (4883 nulls), integral samples 1.0-10.0 and
      max 2400.0 representing HHMM; cast to INTEGER and retain nulls likely indicating cancelled
      departures.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has null_rate 0.0, min 500.0, max 2359.0, integral samples;
      cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has null_rate 0.029388 (4883 nulls), integral samples ranging -33.0
      to 1301.0; cast to INTEGER and retain nulls.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has null_rate 0.0307 (5101 nulls), integral samples 1.0-10.0, max
      2400.0; cast to INTEGER and retain nulls.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has null_rate 0.0, min 1.0, max 2359.0, integral samples;
      cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has null_rate 0.032981 (5480 nulls), integral samples -86.0 to
      1272.0; cast to INTEGER and retain nulls.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has null_rate 0.0 with 16 distinct_values (9E, AA, AS, ..., YV),
      a clean categorical code; kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight has null_rate 0.0, distinct_count 2994, integral samples 1.0-10.0
      up to max 8500.0; cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has null_rate 0.009154 (1521 nulls), distinct_count 3825, alphanumeric
      samples like D942DN, N0EGMQ; kept as VARCHAR with nulls retained.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: origin has null_rate 0.0 with exactly 3 distinct_values (EWR, JFK, LGA);
      kept as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has null_rate 0.0, distinct_count 100, sample airport codes like ABQ,
      ACK, ALB; kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has null_rate 0.032981 (5480 nulls), integral samples 20.0-29.0,
      max 695.0; cast to INTEGER and retain nulls.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has null_rate 0.0, min 80.0, max 4983.0, integral samples; cast
      to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has null_rate 0.0 with distinct_values 5.0-23.0 (19 distinct), integral;
      cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute has null_rate 0.0, distinct_count 60, min 0.0, max 59.0, integral
      samples; cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour has null_rate 0.0 and all sampled values are ISO-8601 timestamps
      with Z suffix (e.g. 2013-01-01T10:00:00Z); cast VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
