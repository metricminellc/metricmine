# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:38:34.286362+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights cleans the bronze NYC flights departure and arrival records,
    casting HHMM-encoded time fields and numeric measures to proper integer types, casting
    time_hour to a TIMESTAMP, and dropping Airbyte capture metadata, to feed downstream flight-delay
    and on-time-performance analytics.
  usage: Consumers should treat dep_time, sched_dep_time, arr_time, sched_arr_time, dep_delay,
    arr_delay, air_time, and tailnum as nullable and explicitly decide how to handle nulls
    (these largely represent cancelled or unrecorded flights); join or group on the declared
    grain (year, month, day, carrier, flight, origin) to get one row per scheduled flight,
    and remember dep_time/sched_dep_time/arr_time/sched_arr_time remain HHMM integers rather
    than true time-of-day values.
  limitations: dep_time, arr_time, dep_delay, arr_delay, and air_time retain null rates between
    2.94% and 3.30% (4883 to 5480 of 166158 rows) representing flights with no recorded departure
    or arrival, and tailnum is null for 0.92% of rows (1521); none of these were imputed.
    Time-of-day fields were not converted to a TIME or TIMESTAMP type because HHMM values
    up to 2400.0 are not valid clock representations, and duplicate_row_rate of 0.0 means
    no dedupe logic was exercised or tested against real duplicates.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights cleans the bronze NYC flights departure and arrival records,
    casting HHMM-encoded time fields and numeric measures to proper integer types, casting
    time_hour to a TIMESTAMP, and dropping Airbyte capture metadata, to feed downstream flight-delay
    and on-time-performance analytics.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has a single distinct value (2013.0) and null_rate 0.0; the DECIMAL(38,9)
      value is integral so it is cast to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has distinct_count 6 with values 1.0-6.0 and null_rate 0.0, all integral,
      so it is cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day ranges from 1.0 to 31.0 with distinct_count 31 and null_rate 0.0, all
      integral sample values, so it is cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has null_rate 0.029388 (4883 nulls) likely representing flights
      that never departed; samples (1.0-10.0) and max 2400.0 are integral HHMM encodings,
      so it is cast to INTEGER and nulls retained.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has null_rate 0.0, min 500.0 max 2359.0, and integral samples
      (500.0-530.0), so it is cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has null_rate 0.029388 (4883 nulls), can be negative (min -33.0,
      max 1301.0), and samples are integral, so it is cast to INTEGER with nulls retained.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has null_rate 0.0307 (5101 nulls) and integral samples up to max
      2400.0, so it is cast to INTEGER with nulls retained for unrecorded arrivals.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has null_rate 0.0, min 1.0 max 2359.0, and integral samples,
      so it is cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has null_rate 0.032981 (5480 nulls), ranges from -86.0 to 1272.0
      with integral samples, so it is cast to INTEGER with nulls retained.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has null_rate 0.0 and 16 distinct short codes (e.g. 9E, AA, DL, UA),
      confirming it is a required categorical code kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight has null_rate 0.0, distinct_count 2994, min 1.0 max 8500.0, all integral,
      so it is cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has null_rate 0.009154 (1521 nulls) with alphanumeric samples like
      D942DN and N10156, retained as nullable VARCHAR since the identifier is occasionally
      missing.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin has null_rate 0.0 and only 3 distinct values (EWR, JFK, LGA), confirming
      a required airport-code column.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has null_rate 0.0 with 100 distinct airport codes (e.g. ABQ, ACK, ALB),
      kept as required VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has null_rate 0.032981 (5480 nulls, matching arr_delay's null pattern
      for unrecorded arrivals) and integral samples from 20.0 to 29.0, so it is cast to INTEGER
      with nulls retained.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has null_rate 0.0, min 80.0 max 4983.0, and integral samples, so
      it is cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has null_rate 0.0, distinct_count 19 ranging 5.0-23.0, so it is cast
      to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute has null_rate 0.0, distinct_count 60, min 0.0 max 59.0, all integral,
      so it is cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour has null_rate 0.0 and uniformly ISO8601-with-Z samples (e.g. 2013-01-01T10:00:00Z),
      supporting a cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
