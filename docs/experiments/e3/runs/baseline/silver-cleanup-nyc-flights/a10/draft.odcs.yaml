# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:43:58.721109+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed flight record data, one row per scheduled flight
    departing New York airports in 2013, feeding downstream flight-delay and on-time-performance
    analytics.
  usage: Consumers should treat (year, month, day, carrier, flight, origin) as the declared
    grain and must explicitly handle nullable columns (dep_time, dep_delay, arr_time, arr_delay,
    air_time, tailnum), which indicate cancelled or unreported flight legs rather than data
    loss; time_hour is a UTC TIMESTAMP suitable for time-series joins.
  limitations: Roughly 2.9%-3.3% of rows lack actual departure/arrival times and delay figures
    (null_count 4883-5480) and 0.9% lack a tail number (null_count 1521), none of which were
    imputed; dataset.duplicate_row_rate is 0.0 across 166158 rows so no exact-duplicate removal
    was necessary, but the proposed grain has not been measured for uniqueness against the
    full warehouse and requires human validation before approval.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed flight record data, one row per scheduled
    flight departing New York airports in 2013, feeding downstream flight-delay and on-time-performance
    analytics.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has distinct_count 1 with the sole value 2013.0 and null_rate 0.0; cast
      DECIMAL(38,9) to INTEGER since the value is integral and fully populated.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has distinct_count 6 covering values 1.0 through 6.0 with null_rate
      0.0; cast to INTEGER as all distinct values are integral.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day has distinct_count 31, min 1.0 max 31.0, null_rate 0.0, and samples 1.0-10.0
      are integral; cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has distinct_count 1291, min 1.0 max 2400.0, null_rate 0.029388
      with null_count 4883, likely representing cancelled flights; cast to INTEGER and retain
      nulls.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has distinct_count 969, min 500.0 max 2359.0, null_rate 0.0,
      samples 500.0-530.0 all integral; cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has distinct_count 469, min -33.0 max 1301.0, null_rate 0.029388
      matching dep_time's missing pattern; cast to INTEGER and retain nulls for unrecorded
      departures.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has distinct_count 1392, min 1.0 max 2400.0, null_rate 0.0307 with
      null_count 5101; cast to INTEGER and retain nulls for missing arrivals.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has distinct_count 1134, min 1.0 max 2359.0, null_rate 0.0,
      samples integral; cast to INTEGER, fully populated.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has distinct_count 526, min -86.0 max 1272.0, null_rate 0.032981
      with null_count 5480; cast to INTEGER and retain nulls for unrecorded arrivals.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier is VARCHAR with distinct_count 16 (e.g. 9E, AA, AS, DL, UA, WN) and
      null_rate 0.0; keep as string, required.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight has distinct_count 2994, min 1.0 max 8500.0, null_rate 0.0, samples
      integral; cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum is VARCHAR with distinct_count 3825, null_rate 0.009154 (null_count
      1521), samples like N0EGMQ, N10156; keep as string, retain nulls for unrecorded tail
      numbers.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin is VARCHAR with distinct_count 3 (EWR, JFK, LGA) and null_rate 0.0;
      keep as string, required.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest is VARCHAR with distinct_count 100 and null_rate 0.0, samples include
      ABQ, ACK, ALB, ATL; keep as string, required.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has distinct_count 484, min 20.0 max 695.0, null_rate 0.032981 matching
      arr_delay's missing pattern; cast to INTEGER and retain nulls.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has distinct_count 203, min 80.0 max 4983.0, null_rate 0.0, samples
      integral; cast to INTEGER, fully populated.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has distinct_count 19, min 5.0 max 23.0, null_rate 0.0; cast to INTEGER,
      fully populated and integral.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute has distinct_count 60, min 0.0 max 59.0, null_rate 0.0, samples 0.0-9.0
      integral; cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour is VARCHAR with distinct_count 3439 and null_rate 0.0; samples
      like 2013-01-01T10:00:00Z are consistently ISO8601 Z-suffixed timestamps, so cast to
      TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
