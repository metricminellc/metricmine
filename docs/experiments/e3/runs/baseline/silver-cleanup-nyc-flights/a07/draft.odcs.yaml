# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:41:14.385332+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, typed record of individual flight departures from
    New York City airports in 2013, feeding downstream analytics on flight delays, cancellations,
    and route performance.
  usage: Consumers should treat each row as one scheduled flight departure identified by year,
    month, day, carrier, flight, and scheduled departure time; dep_time, dep_delay, arr_time,
    arr_delay, and air_time may be null and should be filtered or handled explicitly when
    computing delay statistics, since nulls likely indicate cancelled or unrecorded flights.
  limitations: Roughly 2.9% to 3.3% of rows have null dep_time, arr_time, dep_delay, arr_delay,
    or air_time, and 0.9% have null tailnum; these were retained as nulls rather than resolved,
    and no exact duplicate rows were found (duplicate_row_rate 0.0) so no row-level dedupe
    was applied.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, typed record of individual flight departures
    from New York City airports in 2013, feeding downstream analytics on flight delays, cancellations,
    and route performance.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Single distinct value 2013.0 with null_rate 0.0; samples are whole numbers
      so DECIMAL(38,9) safely casts to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_count 6 with values 1.0-6.0 and null_rate 0.0; all distinct values
      are integral, justifying cast to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: min 1.0, max 31.0, null_rate 0.0, samples 1.0-10.0 all integral; cast DECIMAL(38,9)
      to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) likely represents cancelled flights; samples
      1.0-10.0 are integral so cast to INTEGER while retaining nulls.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate 0.0, min 500.0 max 2359.0, samples all integral (500.0, 501.0,
      ...); cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 matching dep_time nulls (cancelled flights); samples -33.0
      to -19.0 are integral minutes, cast to INTEGER.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.0307 (5101 nulls), samples 1.0-10.0 integral; cast to INTEGER,
      retain nulls for cancelled/diverted flights.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min 1.0 max 2359.0, samples integral; cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls), samples -86.0 to -67.0 integral minutes;
      cast to INTEGER, nulls retained for flights with no arrival recorded.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate 0.0, distinct_count 16 with distinct_values listing IATA codes
      like 9E, AA, DL; keep as VARCHAR code.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate 0.0, min 1.0 max 8500.0, samples integral 1.0-10.0; cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.009154 (1521 nulls), distinct_count 3825 alphanumeric tail numbers
      like D942DN, N0EGMQ; keep as VARCHAR, retain nulls for unregistered/missing tail numbers.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 3 with values EWR, JFK, LGA; keep as VARCHAR
      origin airport code.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0, distinct_count 100 with samples ABQ, ACK, ALB, ATL; keep as
      VARCHAR destination airport code.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 matching arr_delay nulls, min 20.0 max 695.0, samples
      integral; cast to INTEGER, retain nulls for flights lacking arrival data.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min 80.0 max 4983.0, samples 80.0-185.0 integral; cast to
      INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 19 with distinct_values 5.0-23.0 all integral
      hours; cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min 0.0 max 59.0, samples 0.0-9.0 integral; cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0, samples are ISO-8601 timestamps like 2013-01-01T10:00:00Z
      consistently shaped, justifying cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, sched_dep_time)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
