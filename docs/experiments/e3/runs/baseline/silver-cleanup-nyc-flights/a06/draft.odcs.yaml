# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T12:40:17.748611+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides a cleaned, typed view of the 2013 NYC flights departure and
    arrival records landed from bronze.nyc_flights, intended as the analytics-ready base for
    on-time performance and scheduling analyses.
  usage: Consumers should expect INTEGER time and delay fields in raw HHMM or minute-delta
    form (not true time-of-day types) and should treat null dep_time, arr_time, dep_delay,
    arr_delay, air_time, or tailnum values as cancelled, diverted, or otherwise unmatched
    flights rather than missing data to be imputed.
  limitations: Delay and timing fields (dep_time, dep_delay, arr_time, arr_delay, air_time)
    retain null rates between roughly 2.9% and 3.3%, and tailnum retains a 0.9% null rate;
    none of these were imputed or dropped, so downstream aggregates must explicitly handle
    nulls. Exact duplicate rows were checked and found absent (duplicate_row_rate 0.0), so
    no row-level dedupe logic is applied.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table provides a cleaned, typed view of the 2013 NYC flights departure
    and arrival records landed from bronze.nyc_flights, intended as the analytics-ready base
    for on-time performance and scheduling analyses.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year is landed as DECIMAL(38,9) with a single distinct value 2013.0 and null_rate
      0.0, so it casts cleanly to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has distinct_count 6 with integral distinct_values 1.0-6.0 and null_rate
      0.0, so DECIMAL casts cleanly to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day ranges min 1.0 to max 31.0 with 31 distinct integral values and null_rate
      0.0, supporting an INTEGER cast.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time samples are integral (1.0-10.0, max 2400.0) but null_rate is 0.029388
      (4883 nulls), so it casts to INTEGER and stays nullable for cancelled flights.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: sched_dep_time samples are integral (500.0-530.0, max 2359.0) with null_rate
      0.0, so it casts to INTEGER and is required.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay samples show whole-minute deltas from -33.0 to -19.0 (max 1301.0)
      and null_rate 0.029388, so it casts to INTEGER and retains nulls.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time samples are integral (1.0-10.0, max 2400.0) with null_rate 0.0307
      (5101 nulls), so it casts to INTEGER and stays nullable.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time is integral (1.0-10.0, max 2359.0) with null_rate 0.0, so
      it casts to INTEGER and is required.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay samples are whole-minute values from -86.0 to -67.0 (max 1272.0)
      with null_rate 0.032981, so it casts to INTEGER and retains nulls.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has 16 distinct two-letter codes (9E, AA, AS, ... YV) and null_rate
      0.0, so it is kept as a required VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight samples are integral (1.0-10.0, max 8500.0) with null_rate 0.0, so
      it casts to INTEGER and is required.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum samples (D942DN, N0EGMQ, N10156, ...) are alphanumeric identifiers
      with null_rate 0.009154 (1521 nulls), so it stays a nullable VARCHAR.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: origin has exactly 3 distinct values (EWR, JFK, LGA) and null_rate 0.0, so
      it is kept as a required VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has 100 distinct airport codes (sample ABQ, ACK, ALB, ...) and null_rate
      0.0, so it is kept as a required VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time samples are integral minutes (20.0-29.0, max 695.0) with null_rate
      0.032981 (5480 nulls), so it casts to INTEGER and stays nullable.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance samples are integral miles (80.0-185.0, max 4983.0) with null_rate
      0.0, so it casts to INTEGER and is required.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has 19 distinct integral values 5.0-23.0 and null_rate 0.0, so it casts
      to INTEGER and is required.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute ranges 0.0-59.0 with 60 distinct integral values and null_rate 0.0,
      so it casts to INTEGER and is required.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour samples are ISO-8601 strings (2013-01-01T10:00:00Z ... 2013-01-01T19:00:00Z)
      with null_rate 0.0, so it casts cleanly to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, sched_dep_time)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
