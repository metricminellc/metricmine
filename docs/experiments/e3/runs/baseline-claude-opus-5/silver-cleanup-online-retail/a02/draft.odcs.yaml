# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:53:05.368312+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_online_retail_ii is the cleaned order-line table for the online retail
    transactions landed in bronze.online_retail_ii: one row per invoice line, with capture
    metadata removed, exact duplicate rows collapsed, timestamps and numerics typed, and return
    lines flagged. It feeds downstream sales, product and customer aggregates.'
  usage: 'Read one row as a single product line on a single invoice, keyed by invoice, stockcode
    and invoice_date. Filter is_return_line deliberately: quantity ranges from -1395 to 5184
    and negative lines represent returns or cancellations, so any revenue or volume measure
    must decide whether to include them. Join to customer dimensions only after filtering
    customer_id is not null, since about 30 percent of lines have no customer attached, and
    treat description as a free-text label rather than a join key.'
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188 of 45228 rows) are collapsed,
    but the profile cannot prove that invoice plus stockcode plus invoice_date is unique in
    the remaining rows; the declared grain must be measured against the warehouse before approval.
    customer_id is null on 13468 rows (null_rate 0.29778) and description on 228 rows (null_rate
    0.005041); both are retained as null and nothing is imputed. Description text keeps its
    landed leading and trailing whitespace, stockcode keeps its mixed alphanumeric form, and
    no currency or country normalisation is applied even though country has only 24 distinct
    values.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: 'silver_online_retail_ii is the cleaned order-line table for the online retail
    transactions landed in bronze.online_retail_ii: one row per invoice line, with capture
    metadata removed, exact duplicate rows collapsed, timestamps and numerics typed, and return
    lines flagged. It feeds downstream sales, product and customer aggregates.'
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Transaction identifier with null_rate 0.0 across 45228 rows and distinct_count
      2330; retained as VARCHAR because the landed type is text and sample_values such as
      '489434' and '489443' are identifiers rather than measures.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Product code with null_rate 0.0 and distinct_count 3141; sample_values mix
      digits and letters ('10002', '10002R', '10123C', '10123G'), so the samples disagree
      with any numeric cast and the column stays text.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text product label with null_count 228 and null_rate 0.005041 over 45228
      rows, so nulls are retained rather than imputed; distinct_count 3045 and sample_values
      carry leading and trailing spaces (' ANIMAL STICKERS', ' BROWN  PIRATE TREASURE CHEST
      ') which are preserved as landed.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with min -1395.0 and max 5184.0, and every sample_value is
      integral (-1395.0, -1043.0, -504.0), so the landed DECIMAL(38,9) is cast to INTEGER;
      negative values are line returns and are retained.
  - name: is_return_line
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived as quantity < 0 because min is -1395.0 and the sample_values include
      ten negative quantities (-1395.0 through -504.0), marking return or cancellation lines
      that consumers usually filter separately.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Renamed to snake_case and cast from VARCHAR to TIMESTAMP because null_rate
      is 0.0 and all ten sample_values are ISO-shaped ('2009-12-01 07:45:00' through '2009-12-01
      09:50:00'); distinct_count 2004 reflects minute-level timestamps.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate 0.0 with min 0.0 and max 1998.49, and sample_values (0.04, 0.06,
      0.18) carry at most two decimal places, so the landed DECIMAL(38,9) narrows to DECIMAL(10,2)
      without loss.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sparsely populated with null_count 13468 and null_rate 0.29778, so it stays
      nullable and nulls are retained; every sample_value is integral (12346.0, 12349.0, 18287.0
      as max, 12346.0 as min) across distinct_count 1045, which supports the DECIMAL to INTEGER
      cast.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality label with distinct_count 24 and null_rate 0.0; sample_values
      are country names ('Australia', 'Channel Islands', 'EIRE', 'Germany') kept as landed
      text.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode, invoice_date) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode, invoice_date
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode, invoice_date
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
