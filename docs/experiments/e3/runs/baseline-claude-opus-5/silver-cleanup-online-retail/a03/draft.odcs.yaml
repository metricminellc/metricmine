# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:53:59.829455+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_online_retail_ii is the cleaned line-item table for the bronze online_retail_ii
    capture (45228 rows): one row per invoice line with typed quantity, price and invoice_date,
    a stable country and stockcode, and an is_return flag for negative-quantity lines. It
    feeds downstream sales, returns and customer-level aggregates in gold.'
  usage: 'Read one row as one invoice line. quantity is a signed INTEGER: filter is_return
    = false (or sign-handle quantity) before summing gross units or multiplying quantity by
    price for revenue, since min quantity is -1395. customer_id is null on 29.778 percent
    of rows, so any customer-level join or cohort analysis must either filter those rows explicitly
    or accept reduced coverage. invoice_date is a TIMESTAMP to the minute and the profile
    sample covers December 2009 onward.'
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188 of 45228 rows) are collapsed,
    but near-duplicates that differ in any column are not detected and no clock-drift reconciliation
    is applied. description retains its original whitespace and its 228 nulls (null_rate 0.005041),
    so distinct_count 3045 may overstate the real product list. customer_id nulls (13468 rows)
    are retained, not imputed. The declared grain of invoice, stockcode and invoice_date is
    a proposal grounded only in the profile's distinct counts and has not been measured against
    the warehouse; if an invoice can repeat the same stockcode on separate lines, the grain
    must be widened before approval.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: 'silver_online_retail_ii is the cleaned line-item table for the bronze online_retail_ii
    capture (45228 rows): one row per invoice line with typed quantity, price and invoice_date,
    a stable country and stockcode, and an is_return flag for negative-quantity lines. It
    feeds downstream sales, returns and customer-level aggregates in gold.'
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Invoice identifier landed as VARCHAR with null_rate 0.0 and distinct_count
      2330 across 45228 rows; sample_values such as "489434" and "489443" look integral but
      retail invoice codes commonly carry letter prefixes, so the column is retained as text
      rather than cast.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Product code with null_rate 0.0 and distinct_count 3141; sample_values mix
      digits and letters ("10002" alongside "10002R", "10123C", "10123G"), so the samples
      disagree with any numeric cast and the column stays VARCHAR.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text product description with null_count 228 and null_rate 0.005041
      over distinct_count 3045; nulls are retained rather than imputed, and sample_values
      such as " ANIMAL STICKERS" and " BROWN  PIRATE TREASURE CHEST " show leading and trailing
      whitespace that cleanup does not resolve.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0, min -1395.0 and max 5184.0, and
      every sample_value is integral (-1395.0, -1043.0, -954.0), so the decimal is cast to
      INTEGER; negative values are preserved because they represent returns.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived from quantity, whose min is -1395.0 and whose sample_values include
      ten negative entries (-1395.0 through -504.0); the flag is true when quantity is below
      zero so consumers can separate return lines from sales lines without re-deriving the
      sign.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Landed as VARCHAR with null_rate 0.0 and distinct_count 2004; every sample_value
      is ISO-shaped to the minute ("2009-12-01 07:45:00" through "2009-12-01 09:50:00"), which
      supports a TIMESTAMP cast, and the name is renamed to snake_case.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: Unit price landed as DECIMAL(38,9) with null_rate 0.0, min 0.0 and max 1998.49,
      and all sample_values carry at most two decimal places (0.04, 0.06, 0.18), so the scale
      is narrowed to DECIMAL(10,2); zero-priced lines are retained since min is 0.0.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with min 12346.0, max 18287.0 and integral sample_values
      (12346.0, 12349.0, 12358.0), which supports an INTEGER cast; null_count 13468 and null_rate
      0.29778 mean roughly three in ten rows are anonymous transactions, so nulls are retained
      and the column is not required.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality destination label with null_rate 0.0 and distinct_count 24;
      sample_values are country names such as "Australia", "Channel Islands", "EIRE" and "Germany",
      so the column stays VARCHAR without normalisation.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode, invoice_date) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode, invoice_date
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode, invoice_date
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
