# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T17:52:09.438617+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_online_retail_ii is the cleaned, typed line-item view of the bronze online_retail_ii
    capture (45228 rows): one row per invoice line with proper INTEGER quantity, DECIMAL(10,2)
    price, TIMESTAMP invoice_date and no Airbyte capture columns. It feeds downstream sales,
    returns and customer-level aggregates.'
  usage: Read it at invoice / stockcode / invoice_date grain. Rows where is_return is true
    have negative quantity (min -1395.0) and represent returns or corrections, so filter or
    sign-aware aggregate them deliberately rather than summing quantity blindly. customer_id
    is null for about 29.8 percent of rows, so any customer-level aggregate must either exclude
    those rows explicitly or report them as an unattributed bucket. description can be null
    on a small fraction of lines and still carries source whitespace, so match on stockcode
    rather than on description text.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188, roughly 506 of 45228 rows)
    are collapsed, but near-duplicates that differ in any business field are kept and are
    not detectable from this profile. The declared grain is a hypothesis from distinct counts
    (invoice 2330, stockcode 3141, invoice_date 2004) and has not been measured against the
    warehouse; repeated stockcodes on one invoice would break it. customer_id nulls (13468
    rows) are retained and never imputed, price includes 0.0 rows that may be giveaways or
    adjustments, and description whitespace and casing are not normalised.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: 'silver_online_retail_ii is the cleaned, typed line-item view of the bronze
    online_retail_ii capture (45228 rows): one row per invoice line with proper INTEGER quantity,
    DECIMAL(10,2) price, TIMESTAMP invoice_date and no Airbyte capture columns. It feeds downstream
    sales, returns and customer-level aggregates.'
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Invoice identifier landed as VARCHAR with null_rate 0.0 and distinct_count
      2330 across 45228 rows; sample_values such as "489434" and "489443" are digit-only but
      are kept as text because retail invoice identifiers are codes, not arithmetic quantities.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Product code landed as VARCHAR with null_rate 0.0 and distinct_count 3141;
      sample_values mix pure digits ("10002", "10080") with alphanumerics ("10002R", "10123C"),
      so the samples disagree on a numeric shape and the column stays text.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text product description with null_count 228 (null_rate 0.005041) and
      distinct_count 3045, so nulls are retained rather than imputed; sample_values such as
      " 3 STRIPEY MICE FELTCRAFT" and " BROWN  PIRATE TREASURE CHEST " carry leading and trailing
      whitespace that this cleanup does not normalise.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0 and distinct_count 233, but every
      sample value is integral (-1395.0, -1043.0, -1012.0, -954.0) and min -1395.0 / max 5184.0
      fit INTEGER, so the decimal scale is dropped.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: quantity has min -1395.0 and ten negative sample_values (-1395.0 through
      -504.0) while max is 5184.0, so a boolean flag marks the negative-quantity rows that
      represent returns or corrections rather than sales.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Landed as VARCHAR with null_rate 0.0 and distinct_count 2004; all ten sample_values
      are ISO-shaped timestamps ("2009-12-01 07:45:00" through "2009-12-01 09:50:00"), supporting
      a TIMESTAMP cast, and the name is renamed to snake_case.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0, distinct_count 295, min 0.0 and
      max 1998.49; every sample value (0.0, 0.04, 0.06, 0.18) carries at most two decimal
      places, so DECIMAL(10,2) holds the full observed range without loss.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with integral sample_values (12346.0, 12349.0, 18287.0
      as max, 12346.0 as min), so an INTEGER cast is safe; null_count 13468 (null_rate 0.29778)
      means nearly a third of rows are unattributed guest or anonymous transactions and those
      nulls are retained.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality VARCHAR with distinct_count 24 and null_rate 0.0; sample_values
      are country names such as "Australia", "Channel Islands", "EIRE" and "Germany", kept
      as text labels.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode, invoice_date) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode, invoice_date
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode, invoice_date
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
