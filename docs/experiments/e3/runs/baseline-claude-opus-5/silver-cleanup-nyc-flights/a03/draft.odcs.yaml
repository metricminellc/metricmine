# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:06:30.461045+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_nyc_flights is the cleaned, typed flight-leg table built from bronze.nyc_flights
    (166158 rows): one row per scheduled departure leg out of EWR, JFK or LGA, with capture
    metadata removed, DECIMAL(38,9) measures narrowed to INTEGER, and the hourly timestamp
    parsed. It feeds downstream on-time-performance and route-volume marts.'
  usage: Read one row as one scheduled flight leg keyed by time_hour, carrier, flight, origin
    and sched_dep_time. dep_time, sched_dep_time, arr_time and sched_arr_time are HHMM clock
    integers (values up to 2400), not minutes, so do not arithmetically subtract them; use
    dep_delay and arr_delay, which are signed whole minutes and can be negative (min -33 and
    -86 respectively). Filter dep_time_missing = true out of on-time metrics deliberately,
    and expect arr_delay and air_time to be null for roughly 3.3% of rows.
  limitations: 'The profile covers only months 1 through 6 of 2013 (month distinct_values
    1.0 to 6.0, year a single value 2013.0), so this table is not a full calendar year. Operational
    outcomes are incomplete: dep_time and dep_delay are null for 2.94% of rows, arr_time for
    3.07%, and arr_delay and air_time for 3.30%; those rows are retained, not removed, and
    no cancellation reason is available in the source. tailnum is null for 0.92% of rows.
    The declared grain is inferred from column cardinalities rather than measured uniqueness
    and must be verified before approval; bronze showed duplicate_row_rate 0.0, so no dedupe
    is applied.'
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: 'silver_nyc_flights is the cleaned, typed flight-leg table built from bronze.nyc_flights
    (166158 rows): one row per scheduled departure leg out of EWR, JFK or LGA, with capture
    metadata removed, DECIMAL(38,9) measures narrowed to INTEGER, and the hourly timestamp
    parsed. It feeds downstream on-time-performance and route-volume marts.'
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_count is 1 with the only distinct value 2013.0,
      an integral DECIMAL(38,9) that casts losslessly to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_values are 1.0 through 6.0, all integral, so
      the landed DECIMAL(38,9) casts to INTEGER; note the profile shows only the first half
      of the calendar year.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count is 31, min 1.0 and max 31.0 with integral
      sample_values (1.0 through 10.0), supporting an INTEGER cast.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 4883 (null_rate 0.029388) is retained as null; min 1.0, max 2400.0
      and integral sample_values show an HHMM clock encoding, not a duration, so it casts
      to INTEGER and is left as-is.
  - name: dep_time_missing
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived as true where dep_time is null; the profile shows 4883 nulls (null_rate
      0.029388) against row_count 166158, a population consumers usually need to exclude or
      study separately.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate is 0.0 with min 500.0, max 2359.0 and integral sample_values (500.0,
      501.0, 505.0), an HHMM clock value that casts cleanly to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 4883 (null_rate 0.029388) is retained as null; min -33.0 and max
      1301.0 with integral sample_values show whole-minute values, including legitimate negatives
      for early departures.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 5101 (null_rate 0.0307) is retained as null; min 1.0, max 2400.0
      and integral sample_values indicate an HHMM clock encoding that casts to INTEGER.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with min 1.0, max 2359.0 and integral sample_values, so
      the DECIMAL(38,9) HHMM value casts to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 5480 (null_rate 0.032981) is retained as null; min -86.0 and max
      1272.0 with integral sample_values show whole-minute delays, negatives included.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 and distinct_count is 16 with a closed set of two-letter
      codes (9E, AA, AS, B6, DL, EV, ...), so it stays VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate is 0.0, distinct_count 2994, min 1.0 and max 8500.0 with integral
      sample_values, so the flight number casts from DECIMAL(38,9) to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_count 1521 (null_rate 0.009154) is retained as null; distinct_count
      3825 with alphanumeric sample_values like N0EGMQ and N102UW keeps it VARCHAR.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate is 0.0 and distinct_count is 3 with distinct_values EWR, JFK, LGA,
      a stable three-airport domain held as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 100 with three-letter sample_values
      (ABQ, ACK, ALB, ATL), kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 5480 (null_rate 0.032981) is retained as null; min 20.0, max 695.0
      and integral sample_values show whole minutes aloft, casting to INTEGER.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 with min 80.0, max 4983.0 and integral sample_values (80.0,
      94.0, 96.0, 116.0), so whole-mile distances cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_values run 5.0 through 23.0 (19 values, min
      5.0, max 23.0), all integral, so it casts to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 60, min 0.0 and max 59.0 with integral sample_values,
      a clean INTEGER cast.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and all sample_values are ISO-8601 instants on the hour
      (2013-01-01T10:00:00Z through 2013-01-01T19:00:00Z), so the VARCHAR casts to TIMESTAMP;
      distinct_count 3439 is consistent with hourly buckets.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (time_hour, carrier, flight, origin, sched_dep_time)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT time_hour, carrier, flight, origin, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY time_hour, carrier, flight, origin, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
