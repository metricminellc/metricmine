# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights is the cleaned, typed flight-leg table for the January-June
    2013 New York departures landed in bronze.nyc_flights (row_count 166158). It carries scheduled
    and actual departure and arrival times, delay and air-time measures, carrier, flight number,
    tail number, origin, destination and distance, and feeds downstream on-time-performance
    and route-level aggregates.
  usage: Read one row as one scheduled flight leg, identified by time_hour, carrier, flight,
    origin and sched_dep_time. The four clock columns (dep_time, sched_dep_time, arr_time,
    sched_arr_time) are HHMM integers ranging to 2400, not minute counts, so convert deliberately
    before arithmetic; use hour and minute or time_hour for time-based joins. Rows where dep_time_missing
    is true have no actual departure, arrival or air-time values and should be filtered out
    of on-time averages deliberately rather than treated as zero delay.
  limitations: 'The extract covers only months 1 through 6 of year 2013 (month distinct_values
    1.0-6.0), so it is not a full year. Operational outcomes are incomplete: dep_time and
    dep_delay are null for 4883 rows (2.9388 percent), arr_time for 5101 rows (3.07 percent),
    and arr_delay and air_time for 5480 rows (3.2981 percent); tailnum is null for 1521 rows
    (0.9154 percent). These nulls are retained, not imputed, and the cleanup does not distinguish
    cancellations from diversions. The declared grain is inferred from column distinctness
    only; duplicate_row_rate is 0.0 for whole rows but uniqueness of the grain key set has
    not been measured in the profile.'
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights is the cleaned, typed flight-leg table for the January-June
    2013 New York departures landed in bronze.nyc_flights (row_count 166158). It carries scheduled
    and actual departure and arrival times, delay and air-time measures, carrier, flight number,
    tail number, origin, destination and distance, and feeds downstream on-time-performance
    and route-level aggregates.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_count is 1 with the only distinct value 2013.0,
      an integral DECIMAL(38,9) that casts safely to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_count is 6 with distinct_values 1.0 through
      6.0, all integral, so DECIMAL(38,9) casts to INTEGER; the extract covers only the first
      half of 2013.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count is 31 with min 1.0 and max 31.0, and sample_values
      1.0 through 10.0 are all integral, supporting an INTEGER cast.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral samples 1.0 through 10.0 with min 1.0 and max 2400.0 support an
      INTEGER cast; null_count 4883 (null_rate 0.029388) is retained because a missing actual
      departure time is meaningful, not an error.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate is 0.0, distinct_count is 969, and sample_values 500.0 through
      530.0 are integral between min 500.0 and max 2359.0, so the DECIMAL casts cleanly to
      INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples -33.0 through -19.0 are integral across min -33.0 and max 1301.0,
      supporting INTEGER; null_count 4883 (null_rate 0.029388) matches dep_time and is retained.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral sample_values 1.0 through 10.0 with min 1.0 and max 2400.0 justify
      the INTEGER cast; null_count 5101 (null_rate 0.0307) is retained for flights with no
      recorded arrival.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and sample_values 1.0 through 10.0 are integral between
      min 1.0 and max 2359.0, so DECIMAL(38,9) casts to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples -86.0 through -67.0 are integral across min -86.0 and max 1272.0,
      supporting INTEGER; null_count 5480 (null_rate 0.032981) is the highest among the delay
      columns and is retained.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 and distinct_count is 16 with distinct_values such as 9E,
      AA, B6, DL, UA and WN, a stable two-character carrier code set kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate is 0.0, distinct_count is 2994, and sample_values 1.0 through 10.0
      are integral between min 1.0 and max 8500.0, so the flight number casts to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: sample_values such as D942DN, N0EGMQ and N102UW are mixed alphanumeric registrations
      kept as VARCHAR; null_count 1521 (null_rate 0.009154) across distinct_count 3825 is
      retained rather than imputed.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate is 0.0 and distinct_count is 3 with distinct_values EWR, JFK and
      LGA, the three New York origin airports.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 100 with sample_values ABQ, ACK, ALB,
      ATL and AUS, three-letter destination codes kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral sample_values 20.0 through 29.0 with min 20.0 and max 695.0 support
      an INTEGER cast in minutes; null_count 5480 (null_rate 0.032981) is retained and mirrors
      arr_delay.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and sample_values 80.0, 94.0, 96.0 and 116.0 are integral
      between min 80.0 and max 4983.0, so the DECIMAL casts to INTEGER miles.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and distinct_count is 19 with distinct_values 5.0 through
      23.0, all integral, so INTEGER is the right target.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count is 60 with min 0.0 and max 59.0, and sample_values
      0.0 through 9.0 are integral, supporting an INTEGER cast.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: All sample_values are ISO-shaped UTC instants on the hour such as 2013-01-01T10:00:00Z,
      null_rate is 0.0, and distinct_count is 3439, so the VARCHAR casts to TIMESTAMP.
  - name: dep_time_missing
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'Derived from dep_time, whose null_count is 4883 (null_rate 0.029388): the
      flag is true when no actual departure time landed, marking rows that are typically cancellations.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (time_hour, carrier, flight, origin, sched_dep_time)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT time_hour, carrier, flight, origin, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY time_hour, carrier, flight, origin, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
