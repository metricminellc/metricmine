# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:04:31.340484+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights is the cleaned, contract-governed record of 2013 NYC-area flight
    departures derived from bronze.nyc_flights (166158 rows). It carries one row per scheduled
    flight leg with typed date parts, scheduled and actual clock times, delays, aircraft tail
    number, route and distance, feeding downstream on-time-performance and route-level analytics.
  usage: 'Read one row as one scheduled flight leg keyed by year, month, day, carrier, flight,
    origin and sched_dep_time; time_hour gives the scheduled departure hour as a timestamp
    with time zone. dep_time, sched_dep_time, arr_time and sched_arr_time are HHMM-packed
    integers (min 1, max 2400), not minute offsets, so convert them deliberately before arithmetic.
    Delay and air_time columns are nullable for non-departing or non-arriving legs: filter
    on is_departure_recorded, or on arr_delay IS NOT NULL, when computing completion or on-time
    rates so the roughly 3 percent of such rows do not silently skew averages.'
  limitations: 'The cleanup is type and naming only: no rows are removed, nothing is imputed,
    and duplicate_row_rate was 0.0 so no dedupe was applied. Missing operational data is retained
    as nulls at the rates the profile measured: dep_time and dep_delay 0.029388, arr_time
    0.0307, arr_delay and air_time 0.032981, and tailnum 0.009154. The profile shows only
    year 2013 (distinct_count 1) and months 1 through 6, so the table covers a partial year
    as landed. carrier, origin and dest codes are not validated against a reference dimension,
    and the declared grain is a proposal measured from column statistics only and must be
    confirmed against the warehouse.'
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights is the cleaned, contract-governed record of 2013 NYC-area
    flight departures derived from bronze.nyc_flights (166158 rows). It carries one row per
    scheduled flight leg with typed date parts, scheduled and actual clock times, delays,
    aircraft tail number, route and distance, feeding downstream on-time-performance and route-level
    analytics.
  properties:
  - name: year
    logicalType: integer
    physicalType: SMALLINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with distinct_count 1 and the single distinct value 2013.0,
      an integral DECIMAL(38,9) safely cast to SMALLINT.
  - name: month
    logicalType: integer
    physicalType: SMALLINT
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate 0.0 and distinct_values 1.0 through 6.0 (min 1.0, max 6.0) are
      all integral, so the DECIMAL(38,9) landing type casts to SMALLINT.
  - name: day
    logicalType: integer
    physicalType: SMALLINT
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate 0.0, distinct_count 31, min 1.0 and max 31.0 with integral sample_values
      1.0 through 10.0 support a SMALLINT cast.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 4883 (null_rate 0.029388) marks flights with no recorded departure;
      min 1.0 and max 2400.0 with integral samples make this an HHMM clock integer cast to
      INTEGER.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: null_rate 0.0, min 500.0 and max 2359.0 with integral sample_values (500.0,
      501.0, 505.0) show an HHMM clock value castable to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 4883 (null_rate 0.029388) aligns with missing dep_time; min -33.0
      and max 1301.0 with integral negative samples cast cleanly to signed INTEGER minutes.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 5101 (null_rate 0.0307) for flights with no recorded arrival;
      min 1.0, max 2400.0 and integral samples support the INTEGER cast.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with min 1.0, max 2359.0 and integral sample_values 1.0 through
      10.0, an HHMM clock value cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 5480 (null_rate 0.032981) matches cancelled or diverted flights;
      min -86.0 and max 1272.0 are integral minute values castable to INTEGER.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate 0.0 and distinct_count 16 over a closed set of two-letter codes
      (9E, AA, AS, B6, DL, EV, F9, FL, HA, MQ, OO, UA, US, VX, WN, YV), kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate 0.0, distinct_count 2994, min 1.0 and max 8500.0 with integral
      sample_values justify casting the DECIMAL(38,9) to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_count 1521 (null_rate 0.009154) with distinct_count 3825 and alphanumeric
      samples like N0EGMQ and N102UW; retained nullable as VARCHAR.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate 0.0 and only three distinct_values EWR, JFK and LGA, the three
      NYC-area origin airports.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 100 three-letter IATA codes such as ABQ,
      ACK, ALB and ATL, kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 5480 (null_rate 0.032981) identical to arr_delay; min 20.0 and
      max 695.0 with integral samples cast to INTEGER minutes.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 203, min 80.0 and max 4983.0 with integral
      sample_values (80.0, 94.0, 96.0) support an INTEGER cast of miles.
  - name: hour
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: null_rate 0.0 with 19 distinct_values from 5.0 to 23.0, all integral hour-of-day
      values cast to SMALLINT.
  - name: minute
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: null_rate 0.0, distinct_count 60, min 0.0 and max 59.0 with integral samples
      0.0 through 9.0 cast to SMALLINT.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP WITH TIME ZONE
    required: true
    description: null_rate 0.0 with distinct_count 3439 and every sample ISO-8601 with a Z
      offset (2013-01-01T10:00:00Z through 2013-01-01T19:00:00Z), so the VARCHAR casts to
      TIMESTAMP WITH TIME ZONE.
  - name: is_departure_recorded
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: dep_time has null_count 4883 (null_rate 0.029388); the flag is true when
      dep_time is present and false for the 4883 rows with no recorded departure, letting
      consumers filter them without re-deriving the null test.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin,
      sched_dep_time) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
