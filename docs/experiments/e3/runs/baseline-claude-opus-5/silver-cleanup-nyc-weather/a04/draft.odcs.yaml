# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_weather is the cleaned hourly weather observation table for the three
    New York City airports (EWR, JFK, LGA) over the first half of 2013, derived from bronze.nyc_weather.
    It carries one row per airport per observation hour with typed numeric measures and a
    true timestamp, and it feeds flight-delay and operations analytics that join weather conditions
    to departure times.
  usage: Join on origin plus time_hour to flight data; time_hour is a UTC timestamp and year,
    month, day and hour are integer components of the same observation, so use either the
    timestamp or the parts but not both as independent keys. wind_gust, pressure, wind_dir
    and wind_speed are nullable and consumers must decide deliberately how to handle missing
    readings rather than assuming zero. Treat extreme wind_speed values (observed max 1048.36058)
    as suspect and filter them explicitly if the analysis is sensitive to outliers.
  limitations: 'Coverage is partial: month holds only the 6 distinct values 1.0 through 6.0
    and year is a single value 2013, so this is a half-year extract, not a full year. wind_gust
    is sparsely populated at a null_rate of 0.745505 and pressure at 0.114953, so aggregates
    over those measures cover a subset of hours. Unit semantics are not stated by the profile
    and the apparent wind_speed outlier at 1048.36058 was retained unaltered; the declared
    grain of origin plus time_hour is inferred from distinct_count 4341 for time_hour against
    row_count 13014 and must be measured against the warehouse before approval.'
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: silver_nyc_weather is the cleaned hourly weather observation table for the
    three New York City airports (EWR, JFK, LGA) over the first half of 2013, derived from
    bronze.nyc_weather. It carries one row per airport per observation hour with typed numeric
    measures and a true timestamp, and it feeds flight-delay and operations analytics that
    join weather conditions to departure times.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 3 and distinct_values EWR, JFK, LGA,
      so the airport code is always populated and takes one of three values.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and the single distinct value 2013.0 (min 2013.0, max 2013.0)
      is integral, so the DECIMAL(38,9) landing type casts safely to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and all 6 distinct_values 1.0 through 6.0 are integral within
      min 1.0 and max 6.0, supporting an INTEGER cast.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count is 31, and sample_values 1.0 through 10.0
      within min 1.0 and max 31.0 are all integral, supporting an INTEGER cast.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count is 24, and sample_values 0.0 through 9.0
      within min 0.0 and max 23.0 are integral hour-of-day values, supporting an INTEGER cast.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 and sample_values such as 10.94, 12.02 and 93.92 (min 10.94,
      max 93.92) carry two decimal places, so a narrowed DECIMAL(10,2) preserves every observed
      value.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 and sample_values from -9.94 up to max 73.94 are two-decimal
      values including negatives, so DECIMAL(10,2) holds the full observed range.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 with distinct_count 2178 and sample_values 12.74 through
      15.47 bounded by min 12.74 and max 100.0, all at two decimal places.
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_count 219 gives a null_rate of 0.016828, so nulls are retained; sample_values
      0.0 through 90.0 within min 0.0 and max 360.0 are compass bearings in 10-degree steps.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(12,5)
    required: false
    description: null_count 2 gives a null_rate of 0.000154 so nulls are retained; sample_values
      such as 3.45234 carry five decimals and max 1048.36058 is a likely outlier left unaltered.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(12,5)
    required: false
    description: null_count 9702 gives a null_rate of 0.745505, so this column is sparsely
      populated and retained nullable; populated sample_values run 16.11092 to max 62.14212
      at five decimals.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 with distinct_count 50 and sample_values 0.0 through 0.09
      bounded by min 0.0 and max 1.06, all at two decimal places.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: null_count 1496 gives a null_rate of 0.114953, so nulls are retained; sample_values
      983.8 through 992.1 within min 983.8 and max 1038.4 are one-decimal millibar readings.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 and the 20 distinct_values include fractional steps 0.06,
      0.12, 0.25 and 1.75 between min 0.0 and max 10.0, so a decimal type is required rather
      than an integer cast.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP WITH TIME ZONE
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 and every sample_value, for example 2013-01-01T06:00:00Z
      and 2013-01-01T15:00:00Z, is an ISO-8601 UTC instant on an exact hour, so the VARCHAR
      landing type casts to a timestamp.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
