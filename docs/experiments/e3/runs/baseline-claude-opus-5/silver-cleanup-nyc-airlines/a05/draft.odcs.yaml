# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_airlines is the cleaned carrier reference table derived from bronze.nyc_airlines:
    one row per two-letter IATA carrier code with its full airline name, intended as a lookup
    dimension for flight fact tables.'
  usage: Join on carrier to decode a flight's two-letter code into a display name; the table
    is tiny (16 rows) and intended for broadcast-style joins. Treat name as a display label
    only, since it is free-form text and may be restated by the source.
  limitations: The table carries only the two business columns present in bronze; all Airbyte
    capture columns were dropped, so no load timestamp or lineage id survives into silver.
    Uniqueness of carrier is asserted from a 16-row snapshot where distinct_count equals row_count
    and duplicate_row_rate is 0.0, so it must be re-measured if the source grows or begins
    carrying historical carrier records.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: 'silver_airlines is the cleaned carrier reference table derived from bronze.nyc_airlines:
    one row per two-letter IATA carrier code with its full airline name, intended as a lookup
    dimension for flight fact tables.'
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Two-letter IATA carrier code with null_rate 0.0 and distinct_count 16 over
      16 rows, so every value is unique and populated (distinct_values include '9E', 'AA',
      'WN', 'YV').
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full carrier name with null_rate 0.0 and distinct_count 16, one label per
      carrier (for example 'Delta Air Lines Inc.' and 'Virgin America'); kept as free text
      since values are proper names.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
