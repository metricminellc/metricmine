# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_airlines is the cleaned carrier reference table derived from bronze.nyc_airlines:
    one row per airline, holding the two-letter carrier code and its full legal name, intended
    as the lookup dimension that flight-level silver and gold tables join to for human-readable
    carrier labels.'
  usage: Join on carrier to any fact table that carries an IATA carrier code; the column is
    unique and non-null across all 16 rows, so an inner join neither fans out nor drops rows
    for carriers present here. Use name only for display, since it is a free-text label whose
    spelling follows the source ('Endeavor Air Inc.', 'US Airways Inc.') and is not a stable
    key.
  limitations: The table covers only the 16 carriers present in bronze (row_count 16); any
    flight record referencing a carrier outside this distinct_values list will not resolve
    and should be handled as an unmatched join on the consuming side. All three Airbyte metadata
    columns were dropped, so lineage back to the capture batch (extracted at '2026-09-02T23:26:17')
    is no longer available from this table. No dedupe was applied because duplicate_row_rate
    is 0.0, and no value standardization was attempted on name.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: 'silver_airlines is the cleaned carrier reference table derived from bronze.nyc_airlines:
    one row per airline, holding the two-letter carrier code and its full legal name, intended
    as the lookup dimension that flight-level silver and gold tables join to for human-readable
    carrier labels.'
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Two-letter IATA carrier code with null_rate 0.0 and distinct_count 16 across
      16 rows, so every value is unique and populated (distinct_values include '9E', 'AA',
      'WN', 'YV').
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full carrier name with null_rate 0.0 and distinct_count 16, one label per
      carrier code (for example 'Delta Air Lines Inc.', 'Virgin America'); kept as VARCHAR
      since all values are free text.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
