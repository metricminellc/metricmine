# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T17:57:27.654665+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how silver.silver_invoice_lines enters the gold unified
    event star as the invoice_lines fact category: it names the event timestamp and its grain,
    the transaction grain and the derived line identity, and the role of every mapped column.
    Its consumer is the deterministic modeling engine, which reads the contract and emits
    the gold models; no table, view, or transformation is declared here.'
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, gated by the validator and datacontract lint, and reviewed
    and edited by a human before approval. Once approved, the modeling engine uses it to generate
    the invoice_lines fact and its degenerate line_identity key; analysts query the generated
    gold models rather than this contract.
  limitations: 'The mapping names silver columns as profiled and renames or transforms nothing:
    it does not compute line revenue from quantity and unit_price, does not resolve product_description
    against stock_code where the 228 null descriptions (null_rate 0.005098) leave a gap, and
    does not infer a customer for the 13446 rows with a null customer_id (null_rate 0.300664).
    It does not filter rows: cancellation lines flagged by is_cancellation, which drive the
    negative quantity values down to -1395, remain in the fact and their exclusion is left
    to consumers. It declares no quality rules, severities, classifications, service levels,
    ownership, tags, or access policies, which belong to review.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is one invoice line: a single product, identified by stock_code, sold
    on a single invoice at a single timestamp, carrying the quantity and unit price for that
    line together with the customer and country context. Lines flagged by is_cancellation
    represent returns or cancellations and carry negative quantity values.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Identifier of the invoice the line belongs to, stored as a code (samples
      '489434', '489435') with null_rate 0.0 and 2330 distinct values across 44721 rows, so
      it labels rather than measures.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking a line as a cancellation or return, with distinct_values false
      and true and null_rate 0.0, used to segment rather than to sum.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code sold on the line, with 3141 distinct values and null_rate
      0.0 (samples '10002', '10123C'), an identifying code and therefore a dimension.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product name for the stock code (samples '12 DAISY PEGS IN WOOD
      BOX', '*USB Office Glitter Lamp'); nullable with null_rate 0.005098 because 228 rows
      carry no description text in the source.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Number of units on the line, additive across rows with min -1395 and max
      5184 where negative samples correspond to cancellation or return lines, and null_rate
      0.0.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp the invoice line was raised, spanning min 2009-12-01T07:45:00 to
      max 2009-12-23T16:58:00 with null_rate 0.0 and samples resolving to whole minutes.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit for the line in source currency, a numeric value compared
      and averaged across rows with min 0.0 and max 1998.49 and null_rate 0.0.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric identifier of the purchasing customer (samples 12346, 12349, range
      12346 to 18287) which labels rather than measures; nullable with null_rate 0.300664
      because many lines are recorded without an attributed customer account.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country associated with the invoice line, a low-cardinality label with 24
      distinct values (samples 'Australia', 'EIRE', 'France') and null_rate 0.0.
