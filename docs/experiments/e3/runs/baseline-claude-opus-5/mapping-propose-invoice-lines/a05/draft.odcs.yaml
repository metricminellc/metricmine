# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T17:58:41.532026+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how the contracted silver table silver.silver_invoice_lines
    enters the gold unified event star as the invoice_lines fact category: it names the event
    time column and its grain, the transaction grain and its derived line identity, and the
    role of every mapped column. Its consumer is the deterministic modeling engine, which
    reads the mapping contract and emits the gold models; the mapping itself creates no physical
    object.'
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, checked by the mapping validator and datacontract lint,
    and reviewed and edited by a human before approval. Once approved, the modeling engine
    uses it to generate the gold fact for invoice_lines; analysts then query the generated
    models, not this contract.
  limitations: 'The mapping declares grain, time and roles only: it adds no quality rules,
    severities, classifications, service levels, ownership or access policy, and it performs
    no filtering or transformation. It does not exclude cancellation lines even though is_cancellation
    is true for part of the table and quantity reaches min -1395, so consumers must decide
    whether to net or exclude them; it does not substitute a value for the 30.07 percent of
    rows whose customer_id is null, nor for the 228 rows missing product_description; and
    it does not compute a line amount from quantity and unit_price, since derived columns
    beyond the declared line identity are out of scope.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is a single invoice line: one product (stock_code) sold on one invoice
    (invoice_id) at a given unit_price and quantity, timestamped by invoiced_at to the minute,
    attributed where known to a customer_id and to a country, and flagged by is_cancellation
    when the line reverses an earlier sale.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Identifier of the invoice the line belongs to, stored as text with samples
      like '489434' and '489435' and 2330 distinct values over 44721 rows with null_rate 0.0,
      so it labels rather than measures.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking a line as a cancellation or return, with distinct_values of
      exactly false and true and null_rate 0.0, used to segment rather than to sum.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code of the item sold, with 3141 distinct values and samples
      such as '10002', '10002R' and '10123C' showing alphanumeric variants, never null (null_rate
      0.0).
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product label such as '12 DAISY PEGS IN WOOD BOX' with 3034 distinct
      values; nullable with null_rate 0.005098 (228 rows), typically lines whose catalogue
      text was missing at capture.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Number of units on the line, additive across rows, ranging from min -1395
      to max 5184 where negatives accompany cancellation lines, with null_rate 0.0.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp the invoice line was recorded, spanning min 2009-12-01T07:45:00
      to max 2009-12-23T16:58:00 with samples resolving to whole minutes, never null (null_rate
      0.0).
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit for the line in source currency, numeric and comparable across
      rows with min 0.0 and max 1998.49 and null_rate 0.0.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric identifier of the purchasing customer with 1045 distinct values between
      12346 and 18287; it labels rather than measures, and it is nullable with null_rate 0.300664
      (13446 rows) where the sale was not attributed to a registered customer.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country associated with the invoice, a low-cardinality label with 24 distinct
      values and samples such as 'Australia', 'EIRE' and 'Germany', never null (null_rate
      0.0).
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
