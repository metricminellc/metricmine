# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T17:57:52.599946+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how silver.silver_invoice_lines enters the gold unified
    event star as the invoice_lines fact category: it names the event time column and grain,
    the transaction grain and its derived line identity, and the role and type of every mapped
    silver column. Its consumer is the deterministic modeling engine, which reads the contract
    and emits the gold models; the mapping itself creates no object.'
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, gated by the validator and datacontract lint, and reviewed
    and edited by a human before approval; once approved the modeling engine uses it to generate
    the invoice_lines fact and its conformed context, keyed on the derived line_identity at
    minute grain on invoiced_at.
  limitations: 'The mapping names columns only: it renames nothing, filters nothing, and derives
    nothing beyond the line_identity tuple. Cancellation lines are mapped and not excluded,
    so consumers that must drop returns filter on is_cancellation (distinct_values false and
    true) or on negative quantity (min -1395) themselves. Lines without customer attribution
    remain in scope because customer_id is nullable at null_rate 0.300664, and no monetary
    line total is computed since only quantity and unit_price are profiled. No quality rules,
    classifications, service levels, ownership, or access policies are proposed; those belong
    to review.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is one invoice line event: a single product (stock_code) billed on
    a single invoice (invoice_id) at a given timestamp, carrying the quantity and unit price
    for that line together with its customer and country context and its cancellation flag.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Identifier of the invoice the line belongs to, stored as text with 2330 distinct
      values and null_rate 0.0 (samples such as '489434', '489435'), labelling rather than
      measuring so it is a dimension.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking a line as a cancellation or return, with distinct_values [false,
      true] and null_rate 0.0, used to segment lines rather than to be summed.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code of the line, 3141 distinct values with null_rate 0.0 (samples
      '10002', '10002R', '10080'), an identifying code and therefore a dimension.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product label with 3034 distinct values and null_rate 0.005098,
      so it is nullable where the source line carried no description (samples such as '11
      PC CERAMIC TEA SET POLKADOT').
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Number of units on the line, null_rate 0.0 with min -1395 and max 5184, additive
      across rows and negative for returns so it is a measure.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp the invoice line was issued, null_rate 0.0 and ranging from 2009-12-01T07:45:00
      to 2009-12-23T16:58:00, the event time of the category.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit on the line, null_rate 0.0 with min 0.0 and max 1998.49, a
      numeric amount compared and aggregated across rows so it is a measure.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric identifier of the purchasing customer with 1045 distinct values ranging
      12346 to 18287; it is nullable at null_rate 0.300664 because many lines carry no customer
      attribution, and it labels rather than measures so it is a dimension.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Country associated with the invoice line, a low-cardinality label with 24
      distinct values and null_rate 0.0 (samples 'Australia', 'EIRE', 'France').
servers:
