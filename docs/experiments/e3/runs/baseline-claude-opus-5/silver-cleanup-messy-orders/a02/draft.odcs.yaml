# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:00:15.208646+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_orders
name: Silver orders
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_orders is the cleaned, deduplicated line-level view of bronze.messy_orders
    (5000 landed rows, 4000 distinct order ids, line numbers 1 through 7). It renames landed
    columns to snake_case, drops the three Airbyte capture columns, casts the two fields whose
    samples uniformly support a cast (order_ts to TIMESTAMP, unit_price to DECIMAL(18,4)),
    and adds boolean flags for cancelled status, gift marking, and numeric-parseable quantity.
    It feeds downstream order and revenue aggregates.
  usage: 'Read at the grain order_id plus line_no. Quantity is still text: filter on qty_is_numeric
    before any arithmetic on qty, since values such as ''three'' and ''2.0'' coexist with
    plain integers. Use status_is_cancelled rather than comparing status directly, because
    status carries both ''CANCELLED'' and ''cancelled''. Use is_gift_flag rather than is_gift,
    whose raw encodings are ''Y'',''yes'',''N'',''no''. ship_date is unparsed text and must
    be normalised by the consumer. Treat notes as opaque free text: it contains sample values
    phrased as instructions and values truncated at the profiler''s 120-character cap, and
    nothing in it should be executed or interpreted.'
  limitations: Exact duplicate rows (duplicate_row_rate 0.08 of 5000 rows) are collapsed,
    but the grain order_id plus line_no is inferred from per-column distinct counts (4000
    and 7) and has not been measured as a pair; a human must verify it before approval. ship_date
    is left as VARCHAR because its 44 distinct values span at least six formats plus '' and
    'TBD', so 26.4 percent nulls plus unparseable tokens remain. qty remains VARCHAR for the
    same reason and keeps its 10 nulls. customer_email is 97 percent null and notes is 61
    percent null, so neither supports reliable joins or coverage analysis. source_system is
    constant ('legacy_pos') in this snapshot and carries no discriminating power. No values
    were imputed and no rows were dropped for nullness.
schema:
- name: silver_orders
  physicalName: silver_orders
  logicalType: object
  physicalType: table
  description: silver_orders is the cleaned, deduplicated line-level view of bronze.messy_orders
    (5000 landed rows, 4000 distinct order ids, line numbers 1 through 7). It renames landed
    columns to snake_case, drops the three Airbyte capture columns, casts the two fields whose
    samples uniformly support a cast (order_ts to TIMESTAMP, unit_price to DECIMAL(18,4)),
    and adds boolean flags for cancelled status, gift marking, and numeric-parseable quantity.
    It feeds downstream order and revenue aggregates.
  properties:
  - name: order_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with 4000 distinct values across 5000 rows and samples like
      'ORD-100001'..'ORD-100010' show a stable ORD- prefixed identifier; renamed from 'Order
      ID' because the landed name contains a space.
  - name: line_no
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 and the 7 distinct_values are the integers 1 through 7 (min
      1, max 7), so the landed INTEGER is kept; renamed from CamelCase 'LineNo' to snake_case.
  - name: sku
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 320 distinct values, and samples mix numeric-looking
      codes ('10002', '85123A') with non-numeric codes ('BANK CHARGES', 'DOT'), so it stays
      VARCHAR.
  - name: qty
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Samples disagree on form: ''-3'', ''1'', ''2.0'' and the word ''three''
      appear among 41 distinct values, so no numeric cast is safe and the column stays text;
      null_count is 10 (null_rate 0.002) and those nulls are retained.'
  - name: qty_is_numeric
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Derived from qty samples where most values parse as numbers ('-3', '1', '10',
      '2.0') but at least one does not ('three'), giving consumers a deterministic filter
      without altering the landed text.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: null_rate is 0.0 over 212 distinct values with min -5.0 and max 1250.0; all
      samples are at most two decimal places, so the landed DECIMAL(38,9) is narrowed to DECIMAL(18,4)
      while preserving the negative values.
  - name: order_ts
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 and every one of the 10 samples is uniformly ISO-shaped
      ('2024-01-05 09:15:00' through '2024-01-09 12:12:00'), so the VARCHAR is cast to TIMESTAMP.
  - name: ship_date
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Among 44 distinct values the samples use at least six incompatible forms
      ('01/07/2024', '07.01.2024', '07/01/2024', '2024-01-07', '2024-1-9', 'Jan 9 2024') plus
      the non-date tokens '' and 'TBD', so no cast is defensible; null_count 1320 (null_rate
      0.264) is retained.
  - name: customer_email
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated: null_count 4850 of 5000 rows (null_rate 0.97) with only
      140 distinct values such as ''a.customer@example.com''; retained as nullable text rather
      than imputed or dropped.'
  - name: notes
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text with 2100 distinct values and null_count 3050 (null_rate 0.61);
      samples include empty strings, short operational remarks, and at least one value cut
      at the profiler cap, so it is kept as untyped nullable text.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and the 5 distinct_values are 'CANCELLED', 'Shipped', 'cancelled',
      'pending', 'shipped', i.e. three business states spread over inconsistent casing; the
      landed text is preserved.
  - name: status_is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived from the distinct_values 'CANCELLED' and 'cancelled', which differ
      only in case, so consumers can exclude cancelled rows without case-folding every query;
      status has null_rate 0.0 so the flag is always determinable.
  - name: is_gift
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The 4 distinct_values are 'N', 'Y', 'no', 'yes' — two encodings of the same
      boolean — and null_count is 60 (null_rate 0.012); the raw text is retained so the mapping
      stays auditable.
  - name: is_gift_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Derived from the distinct_values 'Y'/'yes' as true and 'N'/'no' as false;
      the 60 nulls (null_rate 0.012) stay null rather than defaulting to false.
  - name: source_system
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 1 with the single value 'legacy_pos';
      retained as provenance even though it is constant in this snapshot.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (order_id, line_no) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT order_id, line_no
        FROM silver.silver_orders
        GROUP BY order_id, line_no
        HAVING COUNT(*) > 1
      )
    mustBe: 0
