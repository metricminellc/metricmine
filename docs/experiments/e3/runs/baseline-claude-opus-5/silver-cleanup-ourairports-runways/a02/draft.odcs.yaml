# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:25:26.145121+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_ourairports_runways is the cleaned, one-row-per-runway view of bronze.ourairports_runways
    (10760 rows), typed and renamed for analytics and for joins to the airports dimension
    via airport_ref or airport_ident. It feeds runway capability analysis (length, width,
    surface, lighting) and endpoint geometry lookups.
  usage: Read one row per id; join to airports on airport_ref or airport_ident, both of which
    have distinct_count 7591 and are non-null. Boolean lighted and closed replace the 0/1
    indicators, so filter closed = false deliberately when you want only active runways, and
    exclude length_ft_is_zero = true when length is used as a measure. Endpoint columns (le_*/he_*)
    are optional geometry and must be null-checked before use.
  limitations: Roughly 22 to 28 percent of endpoint geometry is missing (le_latitude_deg null_rate
    0.220911 through le_elevation_ft 0.276301) and displaced-threshold columns are almost
    entirely empty (le_displaced_threshold_ft 0.884201, he_displaced_threshold_ft 0.899907);
    nothing is imputed. surface remains uncontrolled text with distinct_count 239, and le_ident/he_ident
    contain placeholder values such as '.' and '-'. Identifier columns stay VARCHAR despite
    numeric-looking samples, and heading columns keep the landed DECIMAL(38,9) scale. The
    id grain rests on distinct_count 10760 equalling row_count 10760 in this snapshot and
    must be confirmed against the warehouse.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: silver_ourairports_runways is the cleaned, one-row-per-runway view of bronze.ourairports_runways
    (10760 rows), typed and renamed for analytics and for joins to the airports dimension
    via airport_ref or airport_ident. It feeds runway capability analysis (length, width,
    surface, lighting) and endpoint geometry lookups.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals dataset.row_count 10760 with null_count 0, so
      this is the natural row identifier; sample_values such as '232758' and '232770' are
      digit strings but are retained as VARCHAR because only 10 of 10760 values were sampled
      and no evidence rules out non-numeric ids.
  - name: airport_ref
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 across 10760 rows with distinct_count 7591, i.e. many runways
      per airport; sample_values like '10309' and '111' are digit strings kept as VARCHAR
      so the foreign key matches the airport table's text identifier form.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 7591, matching airport_ref exactly; sample_values
      '03N', '07FA', '19AK' are alphanumeric codes that must stay text.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but every sample_value is integral (0.0, 2.0, 20.0,
      44.0) and min 0.0 / max 16798.0 fit INTEGER; null_count 86 (null_rate 0.007993) is retained
      rather than imputed.
  - name: length_ft_is_zero
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: min is 0.0 and sample_values include 0.0, which is an implausible runway
      length; the flag marks those rows for consumers instead of dropping them, and is null
      where length_ft is null (null_count 86).
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values are integral (1.0, 10.0, 26.0) with min 1.0 and max 7000.0,
      so DECIMAL(38,9) narrows safely to INTEGER; null_count 888 (null_rate 0.082528) is retained.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: distinct_count 239 with sample_values 'ASP', 'ASPH', 'ASP/CONC', 'ASPH-CONC-G'
      shows uncontrolled free text that this cleanup does not normalise; null_count 247 (null_rate
      0.022955) is retained.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with min 0.0, max 1.0 and null_rate
      0.0, so the DECIMAL(38,9) indicator casts cleanly to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0 over 10760 rows,
      so the indicator casts to BOOLEAN; closed runways stay in the table for consumers to
      filter.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: distinct_count 199 with sample_values '-12', '.', '00', '01C' shows mixed
      and dirty designators that cannot be cast numerically; null_count 11 (null_rate 0.001022)
      is retained.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: min -62.187801 and max 82.512802 with sample_values carrying six decimal
      places fit DECIMAL(9,6), narrowing the landed DECIMAL(38,9); null_count 2377 (null_rate
      0.220911) is retained.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(10,6)
    required: false
    description: min -179.881256 and max 179.338837 with six-decimal sample_values fit DECIMAL(10,6);
      null_count 2381 (null_rate 0.221283) is retained.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Every sample_value is integral (-1246.0, -184.0, -69.0) and min -1246.0 /
      max 13202.0 fit INTEGER; null_count 2973 (null_rate 0.276301) is retained.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: sample_values mix whole and fractional degrees (0.2, 1.12, 2.1) with min
      0.0 and max 360.0, so the landed DECIMAL(38,9) scale is kept rather than guessed at;
      null_count 2457 (null_rate 0.228346) is retained.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values are integral (1.0, 2.0, 57.0) with min 1.0 and max 4250.0,
      so INTEGER is safe; the column is sparsely populated with null_count 9514 (null_rate
      0.884201) and is retained as-is.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: distinct_count 177 with sample_values '-', '.', '01L', '1', '11' shows inconsistent
      text designators that must stay VARCHAR; null_count 53 (null_rate 0.004926) is retained.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: min -62.193901 and max 82.522797 with six-decimal sample_values fit DECIMAL(9,6);
      null_count 2391 (null_rate 0.222212) is retained.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(10,6)
    required: false
    description: min -179.873184 and max 179.343002 with six-decimal sample_values fit DECIMAL(10,6);
      null_count 2391 (null_rate 0.222212) is retained.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values are integral (-1210.0, -181.0, -69.0) and min -1210.0 /
      max 13314.0 fit INTEGER; null_count 2972 (null_rate 0.276208) is retained.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: sample_values show tenth-of-a-degree precision (0.1 through 0.9) with min
      0.0 and max 362.0, so the landed DECIMAL(38,9) is kept; null_count 2444 (null_rate 0.227138)
      is retained.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values are integral (10.0, 30.0, 76.0) with min 10.0 and max 4790.0,
      so INTEGER is safe; the column is sparsely populated with null_count 9683 (null_rate
      0.899907) and is retained.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
