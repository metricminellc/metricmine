# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:28:16.992938+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_ourairports_runways is the cleaned, one-row-per-runway view of the OurAirports
    runways extract landed in bronze.ourairports_runways (10760 rows). It types identifiers
    and dimensions as numbers, turns the lighted and closed indicators into booleans, drops
    capture metadata, and feeds airport infrastructure analytics and joins to the airports
    dimension via airport_ref or airport_ident.
  usage: Read one row per runway keyed by id; join to airport records on airport_ref (integer)
    or airport_ident (text code). Filter deliberately on is_closed_runway or closed when you
    want only active runways, since closed runways remain in the table. Treat surface as uncontrolled
    free text (239 distinct values such as 'ASP', 'ASPH-CONC') and bucket it yourself before
    aggregating, and expect threshold geometry columns to be missing for many rows.
  limitations: 'Cleanup did not normalise surface codes or runway designators: surface carries
    239 distinct raw spellings and le_ident/he_ident include non-numeric entries such as ''-12'',
    ''.'' and ''-''. Threshold geometry is incomplete, with le_latitude_deg null_rate 0.220911,
    he_latitude_deg 0.222212, le_elevation_ft 0.276301 and he_elevation_ft 0.276208, and displaced
    thresholds are nearly empty at 0.884201 and 0.899907. he_heading_degt reaches 362.0, which
    exceeds a valid compass range and was retained unmodified; length_ft includes a minimum
    of 0.0 that may be a placeholder rather than a measured length. No values were imputed
    and no rows were removed, since duplicate_row_rate is 0.0.'
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: silver_ourairports_runways is the cleaned, one-row-per-runway view of the OurAirports
    runways extract landed in bronze.ourairports_runways (10760 rows). It types identifiers
    and dimensions as numbers, turns the lighted and closed indicators into booleans, drops
    capture metadata, and feeds airport infrastructure analytics and joins to the airports
    dimension via airport_ref or airport_ident.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 10760 equals row_count 10760 with null_rate 0.0, and every
      sample value ('232758', '232759', '232770') is integral text, so the VARCHAR is cast
      to INTEGER as the runway identifier.
  - name: airport_ref
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 across 10760 rows with 7591 distinct values; all samples ('10309',
      '1058', '111') are integral text, supporting a VARCHAR to INTEGER cast of this airport
      foreign key.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and 7591 distinct values matching airport_ref; samples such
      as '03N', '07FA', '19AK' are alphanumeric codes that must stay text.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.007993 (86 nulls) with min 0.0 and max 16798.0; every sample
      (0.0, 2.0, 44.0) is integral, so the DECIMAL(38,9) is cast to INTEGER and nulls are
      retained.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.082528 (888 nulls), 204 distinct values, min 1.0 and max 7000.0;
      all samples (1.0, 15.0, 26.0) are integral so an INTEGER cast is safe with nulls retained.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.022955 (247 nulls) over 239 distinct free-text codes such as
      'ASP', 'ASPH-CONC', 'ASPH 71/F/C/X/T'; values are uncontrolled so the column stays VARCHAR
      without normalisation.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_count 2 with distinct_values [0.0, 1.0], min 0.0, max 1.0 and null_rate
      0.0, so the DECIMAL flag is cast to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_count 2 with distinct_values [0.0, 1.0] and null_rate 0.0; the DECIMAL
      indicator is cast to BOOLEAN to mark closed runways.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.001022 (11 nulls) with 199 distinct values; samples include non-numeric
      entries like '-12', '.', '01C' and '01L', so the designator stays VARCHAR.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: null_rate 0.220911 (2377 nulls) with min -62.187801 and max 82.512802; fractional
      samples require a decimal type, and nulls are retained as unsurveyed thresholds.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: null_rate 0.221283 (2381 nulls) with min -179.881256 and max 179.338837;
      fractional samples keep the DECIMAL(38,9) precision and nulls are retained.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276301 (2973 nulls), min -1246.0 and max 13202.0; every sample
      (-1246.0, -184.0, -69.0) is integral so the column is cast to INTEGER with nulls retained.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: null_rate 0.228346 (2457 nulls) with min 0.0 and max 360.0; samples such
      as 0.2, 1.12 and 2.1 are fractional, so the decimal type is kept.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sparsely populated at null_rate 0.884201 (9514 nulls) but all 568 distinct
      values sampled (1.0, 23.0, 57.0) are integral between min 1.0 and max 4250.0, so it
      is cast to INTEGER and retained nullable.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.004926 (53 nulls) with 177 distinct values including non-numeric
      samples '-', '.', '01L' and '04R', so the designator stays VARCHAR.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: null_rate 0.222212 (2391 nulls) with min -62.193901 and max 82.522797; fractional
      samples require the decimal type and nulls are retained.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: null_rate 0.222212 (2391 nulls) with min -179.873184 and max 179.343002;
      fractional coordinates keep DECIMAL(38,9).
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276208 (2972 nulls), min -1210.0 and max 13314.0; all samples
      (-1210.0, -135.0, -69.0) are integral so an INTEGER cast holds with nulls retained.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: false
    description: null_rate 0.227138 (2444 nulls) with min 0.0 and max 362.0; samples 0.1 through
      0.9 are fractional, so the decimal type is kept (note max 362.0 exceeds a 360-degree
      compass range).
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sparsely populated at null_rate 0.899907 (9683 nulls); the 533 distinct values
      run from min 10.0 to max 4790.0 and all samples (10.0, 33.0, 76.0) are integral, so
      it is cast to INTEGER and retained nullable.
  - name: is_closed_runway
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived from closed, whose distinct_values are [0.0, 1.0] with null_rate
      0.0, giving consumers an explicit boolean marker for runways flagged as closed in the
      source.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
