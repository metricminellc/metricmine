# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:17:44.933436+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_nyc_planes is the cleaned aircraft reference table derived from bronze.nyc_planes:
    one row per aircraft tail number (3322 rows) carrying airframe attributes (manufacture
    year, airframe type, manufacturer, model, engine count, seat count, cruise speed, engine
    type). It feeds flight-level joins that need aircraft characteristics such as capacity
    or engine class.'
  usage: 'Join on tailnum, which is the declared grain and unique across all 3322 profiled
    rows. year, engines, seats, and speed are integers after cast, so numeric aggregation
    works directly. Treat speed as optional enrichment only: it is populated for roughly 0.7%
    of rows, so any average or filter on it must handle nulls deliberately. manufacturer values
    are as-landed and include near-duplicate vendor spellings such as ''AIRBUS'' and ''AIRBUS
    INDUSTRIE''; group with care or map them downstream.'
  limitations: 'No deduplication was applied because duplicate_row_rate is 0.0. No value normalization
    was performed: manufacturer (35 distinct) retains variant vendor spellings and model (127
    distinct) retains mixed alphanumeric codes, so neither is a controlled vocabulary. speed
    is effectively unusable for population-level statistics at null_rate 0.993076, and year
    is missing for 70 rows (null_rate 0.021072). The profile carried no distinct_values list
    for tailnum, manufacturer, model, year, or seats (each exceeds the max_distinct_values
    cap of 20), so uniqueness and value-domain claims beyond the cited distinct_count figures
    remain to be verified against the warehouse.'
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: 'silver_nyc_planes is the cleaned aircraft reference table derived from bronze.nyc_planes:
    one row per aircraft tail number (3322 rows) carrying airframe attributes (manufacture
    year, airframe type, manufacturer, model, engine count, seat count, cruise speed, engine
    type). It feeds flight-level joins that need aircraft characteristics such as capacity
    or engine class.'
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals dataset.row_count 3322 with null_rate 0.0, so
      the tail number uniquely identifies each aircraft; samples such as 'N10156' and 'N102UW'
      are fixed-format registration codes kept as text.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min 1956.0 and max 2013.0 with every sample integral (1956.0, 1959.0, 1963.0)
      justifies casting DECIMAL(38,9) to INTEGER; null_rate 0.021072 (70 nulls) is retained
      because manufacture year is genuinely unknown for some airframes.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 3 with the full distinct set 'Fixed wing
      multi engine', 'Fixed wing single engine', 'Rotorcraft' makes this a complete low-cardinality
      category.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 across 35 distinct values with samples like 'AIRBUS', 'AIRBUS
      INDUSTRIE', and 'BOEING'; the near-duplicate vendor spellings are left as landed rather
      than normalized.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with 127 distinct values whose samples mix digits and letters
      ('150', '172E', '210-5(205)'), so the column stays VARCHAR rather than being cast to
      a number.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with min 1.0, max 4.0 and
      null_rate 0.0, so every value is integral and the DECIMAL(38,9) landing type casts safely
      to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 2.0, max 450.0 and all 10 sample values integral (2.0, 4.0, 5.0 ... 12.0)
      with null_rate 0.0 supports the DECIMAL to INTEGER cast.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: 'Sparsely populated: null_rate 0.993076 (3299 of 3322 rows null), but the
      13 distinct_values are all integral (90.0, 95.0 ... 432.0) between min 90.0 and max
      432.0, so the cast is safe and the nulls are retained rather than imputed.'
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 6 and the complete distinct set '4 Cycle',
      'Reciprocating', 'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft'.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
