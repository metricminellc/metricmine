# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:17:06.416743+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_nyc_planes is the cleaned aircraft reference table for the NYC flights
    domain: one row per FAA tail number carrying airframe type, manufacturer, model, engine
    configuration, seat count, build year, and cruise speed. It feeds joins from flight-level
    fact tables that reference tailnum, and supports fleet-composition and aircraft-age analysis.'
  usage: 'Join on tailnum, the declared grain and primary key. Treat year, and especially
    speed, as optional attributes: speed is present for only about 0.7% of aircraft, so any
    aggregate over it must be filtered to non-null rows and must not be presented as fleet-wide.
    Use is_rotorcraft to exclude helicopters from fixed-wing analyses instead of matching
    on the type string. manufacturer and model are landed free text, so group on them only
    after deciding how to treat near-duplicate vendor spellings.'
  limitations: 'Cleanup is limited to dropping the three Airbyte metadata columns, casting
    integral DECIMAL(38,9) columns to INTEGER, and adding one derived flag; no deduplication
    was applied because duplicate_row_rate is 0.0. Nulls are retained everywhere: speed is
    99.3% null (3299 of 3322 rows) and year is 2.1% null (70 rows). Manufacturer naming is
    not normalized, so variants such as ''AIRBUS'' and ''AIRBUS INDUSTRIE'' remain distinct
    among the 35 landed values, and model is kept as text because samples mix digits and letters.
    The table is a static snapshot: the only extract timestamp in bronze was a single value
    and was dropped, so no load or effective-date column is available downstream.'
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: 'silver_nyc_planes is the cleaned aircraft reference table for the NYC flights
    domain: one row per FAA tail number carrying airframe type, manufacturer, model, engine
    configuration, seat count, build year, and cruise speed. It feeds joins from flight-level
    fact tables that reference tailnum, and supports fleet-composition and aircraft-age analysis.'
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals dataset.row_count 3322 with null_rate 0.0, so
      the FAA tail number uniquely identifies each aircraft row; samples such as 'N10156'
      and 'N102UW' are fixed-format registration strings kept as text.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but every sample is integral (1956.0, 1959.0, 1963.0)
      and min 1956.0 / max 2013.0 bound a calendar year, so the cast to INTEGER is safe; null_count
      70 (null_rate 0.021072) is retained rather than imputed.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 3 with distinct_values 'Fixed wing multi
      engine', 'Fixed wing single engine', 'Rotorcraft' make this a fully populated low-cardinality
      airframe category.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 across 3322 rows with distinct_count 35; samples include both
      'AIRBUS' and 'AIRBUS INDUSTRIE', so the landed free text is kept verbatim without normalization.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 127; samples like '172E' and '210-5(205)'
      mix digits and letters, so the column stays VARCHAR rather than being cast to a number.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with min 1.0 and max 4.0 and
      null_rate 0.0, so the DECIMAL(38,9) landing is losslessly cast to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with min 2.0, max 450.0 and all samples integral (2.0, 4.0,
      5.0, 6.0), supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: 'Sparsely populated: null_count 3299 of 3322 rows (null_rate 0.993076), leaving
      only 13 distinct integral values between min 90.0 and max 432.0, so the column is retained
      nullable and cast to INTEGER since every distinct value is whole.'
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 6 with distinct_values '4 Cycle', 'Reciprocating',
      'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft', a fully populated controlled
      vocabulary.
  - name: is_rotorcraft
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: The type distinct_values include 'Rotorcraft' alongside the two fixed-wing
      categories, so a boolean derived from that exact value lets consumers separate helicopters
      from fixed-wing airframes without string matching; type has null_rate 0.0 so the flag
      is always determinable.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
