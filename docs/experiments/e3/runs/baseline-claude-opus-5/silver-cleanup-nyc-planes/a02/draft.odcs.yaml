# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:15:52.197896+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_nyc_planes is the cleaned aircraft reference table for the NYC flights
    domain: one row per registered tail number, carrying airframe type, manufacturer, model,
    engine configuration, seat count, cruise speed, and manufacture year. It feeds joins from
    flight-level fact tables that key on tailnum, and supports fleet-composition and aircraft-age
    analysis.'
  usage: 'Join to flight data on tailnum, which is the declared grain and is non-null for
    all 3322 rows. Treat speed as optional context only: it is populated for 23 rows out of
    3322, so any average or filter on it must be written against the populated subset deliberately.
    Use is_rotorcraft to exclude helicopters when analysis assumes fixed-wing commercial service.
    Manufacturer strings are registry spellings and are not canonicalized, so group with care.'
  limitations: No deduplication was applied because duplicate_row_rate is 0.0, so any future
    duplicate tailnum rows would surface as a grain violation rather than being silently collapsed.
    speed is effectively unusable for aggregate analysis at a 0.993076 null rate, and year
    is missing for 70 rows (0.021072). Manufacturer variants such as 'AIRBUS' versus 'AIRBUS
    INDUSTRIE' remain unresolved, and model is kept as text because its values mix digits,
    letters, and punctuation. The dropped Airbyte metadata columns mean this table carries
    no load lineage; lineage must be recovered from the bronze layer.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: 'silver_nyc_planes is the cleaned aircraft reference table for the NYC flights
    domain: one row per registered tail number, carrying airframe type, manufacturer, model,
    engine configuration, seat count, cruise speed, and manufacture year. It feeds joins from
    flight-level fact tables that key on tailnum, and supports fleet-composition and aircraft-age
    analysis.'
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals dataset.row_count 3322 with null_rate 0.0, so
      the tail number uniquely identifies every aircraft row; samples such as 'N10156' and
      'N102UW' are fixed-format registration strings kept as text.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values are integral (1956.0, 1959.0, 1963.0 ...) with min 1956.0
      and max 2013.0, so the landed DECIMAL(38,9) casts safely to INTEGER; null_rate 0.021072
      (70 nulls) is retained because manufacture year is unknown for some airframes.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 3, with distinct_values 'Fixed wing multi
      engine', 'Fixed wing single engine', 'Rotorcraft', so the airframe category is a fully
      populated low-cardinality label.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 35; samples like 'AIRBUS' and 'AIRBUS INDUSTRIE'
      show uppercase registry spellings that are kept verbatim rather than normalized.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 127; samples mix digits and letters ('172E',
      '210-5(205)', '550') so the column stays VARCHAR despite some numeric-looking values.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with min 1.0, max 4.0 and
      null_rate 0.0, so every value is integral and the DECIMAL(38,9) casts to INTEGER without
      loss.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with min 2.0 and max 450.0 and all sample_values integral (2.0,
      4.0, 5.0 ... 12.0), so the landed DECIMAL(38,9) casts to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: 'Sparsely populated: null_count 3299 of 3322 rows (null_rate 0.993076), but
      the 13 distinct_values (90.0, 95.0 ... 432.0) are all integral so the cast to INTEGER
      is safe and the nulls are retained rather than imputed.'
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 6 with distinct_values '4 Cycle', 'Reciprocating',
      'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft', a fully populated controlled
      vocabulary.
  - name: is_rotorcraft
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: The type column's distinct_values include 'Rotorcraft' alongside the two
      fixed-wing categories, so a boolean derived from type lets consumers separate helicopters
      from fixed-wing airframes without string matching; type has null_rate 0.0 so the flag
      is always resolvable.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
