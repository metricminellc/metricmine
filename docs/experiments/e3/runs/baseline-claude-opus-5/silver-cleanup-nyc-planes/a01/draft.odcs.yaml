# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:15:17.871245+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_nyc_planes is the cleaned aircraft reference table for the NYC flights
    domain: one row per aircraft tail number, carrying airframe attributes (manufacture year,
    type, manufacturer, model, engine count, seat count, cruise speed and engine kind) for
    joining to flight-level fact tables.'
  usage: Join to flight data on tailnum, which is the declared grain and is never null. year,
    engines, seats and speed are integers after the cast, so arithmetic and range filters
    work directly. Use is_fixed_wing to separate fixed-wing aircraft from rotorcraft without
    string matching. speed is nullable for almost every row, so any aggregate over it must
    be filtered or guarded deliberately rather than assumed complete.
  limitations: speed is populated for only 23 of 3322 rows (null_rate 0.993076) and is unusable
    for fleet-wide analysis. year is missing for 70 rows (null_rate 0.021072). manufacturer
    is free text with 35 distinct values that include near-duplicates such as 'AIRBUS' and
    'AIRBUS INDUSTRIE'; no normalization was applied because the profile gives no authoritative
    mapping. model mixes numeric and alphanumeric codes ('150', '172E', '210-5(205)') and
    is therefore kept as text. The grain of one row per tailnum is inferred from distinct_count
    3322 matching row_count 3322 and must be confirmed against the warehouse before approval.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: 'silver_nyc_planes is the cleaned aircraft reference table for the NYC flights
    domain: one row per aircraft tail number, carrying airframe attributes (manufacture year,
    type, manufacturer, model, engine count, seat count, cruise speed and engine kind) for
    joining to flight-level fact tables.'
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 3322 equals dataset.row_count 3322 with null_rate 0.0, so
      the tail number uniquely identifies every row; samples such as 'N10156' and 'N102UW'
      are fixed-format registration strings kept as text.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values are integral (1956.0, 1959.0, 1963.0) and min 1956.0 /
      max 2013.0 fit a manufacture year, so DECIMAL(38,9) is narrowed to INTEGER; null_count
      70 (null_rate 0.021072) is retained rather than imputed.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 3 and distinct_values 'Fixed wing multi
      engine', 'Fixed wing single engine', 'Rotorcraft', a small stable vocabulary kept as
      text.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 35; samples such as 'AIRBUS', 'AIRBUS INDUSTRIE'
      and 'BOEING' are free-text manufacturer labels left exactly as landed.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 127; samples mix digits and letters ('150',
      '172E', '210-5(205)'), so the column stays VARCHAR rather than being cast to a number.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are exactly 1.0, 2.0, 3.0, 4.0 with min 1.0 and max 4.0 and
      null_rate 0.0, so every value is integral and the DECIMAL(38,9) is cast to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, min 2.0, max 450.0 and all sample_values integral (2.0, 4.0,
      5.0, 6.0), supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All 13 distinct_values are integral (90.0 through 432.0) so DECIMAL(38,9)
      narrows to INTEGER, but the column is sparsely populated with null_count 3299 of 3322
      rows (null_rate 0.993076) and those nulls are retained.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 6 and distinct_values '4 Cycle', 'Reciprocating',
      'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft', a closed vocabulary kept as text.
  - name: is_fixed_wing
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: The three distinct_values of type split cleanly into fixed-wing ('Fixed wing
      multi engine', 'Fixed wing single engine') and 'Rotorcraft', so a boolean flag is derived
      from a column with null_rate 0.0.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
