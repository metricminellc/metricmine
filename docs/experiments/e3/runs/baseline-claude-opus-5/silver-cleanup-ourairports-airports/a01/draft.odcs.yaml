# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:18:19.998013+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_airports
name: Silver ourairports airports
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_ourairports_airports is the cleaned, one-row-per-airport reference table
    built from bronze.ourairports_airports (9057 rows), carrying identity codes, classification,
    location, and reference links for downstream geography and route dimensions.
  usage: Join on ident, the declared grain; id and iata_code are equally unique in this snapshot
    and can serve as alternate keys. Read has_scheduled_service as a boolean derived from
    the source yes/no flag, and use latitude_deg and longitude_deg as DECIMAL(9,6) degrees.
    Consumers needing complete code coverage must handle nulls explicitly in icao_code, gps_code
    and local_code rather than assuming every airport carries each code.
  limitations: 'No deduplication was applied because duplicate_row_rate is 0.0 over 9057 rows;
    the grain on ident is asserted from distinct_count 9057 in this snapshot only and must
    be re-measured against the warehouse. Several columns are sparsely populated and were
    retained as-is: home_link (null_rate 0.749034), keywords (0.679585), local_code (0.636635),
    icao_code (0.136579), wikipedia_link (0.130838), gps_code (0.053881), municipality (0.039748)
    and elevation_ft (0.036988). Coordinates and elevation were narrowed based on only 10
    sampled values per column plus min/max, so an out-of-pattern value would fail the cast;
    keywords remains unparsed free text.'
schema:
- name: silver_ourairports_airports
  physicalName: silver_ourairports_airports
  logicalType: object
  physicalType: table
  description: silver_ourairports_airports is the cleaned, one-row-per-airport reference table
    built from bronze.ourairports_airports (9057 rows), carrying identity codes, classification,
    location, and reference links for downstream geography and route dimensions.
  properties:
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Surrogate source identifier with null_rate 0.0 and distinct_count 9057, matching
      row_count 9057 exactly; sample_values such as "10309" and "1058" are integral but only
      10 of 9057 values were observed, so the landed VARCHAR is retained.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Natural airport identifier with null_rate 0.0 and distinct_count 9057 equal
      to row_count 9057; sample_values like "03N", "07FA" and "19AK" are mixed alphanumeric
      codes, so it stays text.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality classifier with distinct_count 5 and null_rate 0.0; distinct_values
      are heliport, large_airport, medium_airport, seaplane_base and small_airport.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Free-text airport name with null_rate 0.0 and distinct_count 9006 across
      9057 rows, so a few names repeat; sample_values include "Aalborg Airport" and "A Coruña
      Airport".
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: Fully populated coordinate (null_rate 0.0, distinct_count 9047) bounded by
      min -79.777778 and max 82.517263, and every sample_value carries at most six decimal
      places, so the landed DECIMAL(38,9) is narrowed to DECIMAL(9,6).
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: Fully populated coordinate (null_rate 0.0, distinct_count 9050) bounded by
      min -179.876999 and max 179.9757, with sample_values such as -178.066492 showing at
      most six decimals, so DECIMAL(38,9) is narrowed to DECIMAL(9,6).
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Every sample_value is integral (-1266.0, -210.0, -84.0) and the range min
      -1266.0 to max 14472.0 fits INTEGER, so the landed DECIMAL(38,9) is cast; null_count
      335 (null_rate 0.036988) is retained as null.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Two-letter continent code with null_rate 0.0 and distinct_count 7; distinct_values
      are AF, AN, AS, EU, NA, OC and SA.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: ISO country code with null_rate 0.0 and distinct_count 239; sample_values
      such as "AD", "AQ" and "AR" are two-letter codes, so it stays text.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: ISO region code with null_rate 0.0 and distinct_count 2169; sample_values
      like "AD-08" and "AF-BDS" are hyphenated country-region text.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text place name with distinct_count 8049 and null_count 360 (null_rate
      0.039748); nulls are retained rather than imputed, with sample_values such as "Aalborg"
      and "Abadan".
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_count 2 with distinct_values exactly "no" and "yes" and null_rate
      0.0, so the flag is cast to BOOLEAN (yes to true, no to false) and renamed to read as
      a boolean predicate.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ICAO identifier with distinct_count 7820 and null_count 1237 (null_rate 0.136579);
      sample_values like "AGAF" and "AGGC" are four-character alphanumeric codes, and missing
      codes are retained as null.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: IATA identifier with null_rate 0.0 and distinct_count 9057 equal to row_count;
      sample_values such as "AAA" and "AAK" are three-letter codes.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: GPS identifier with distinct_count 8569 and null_count 488 (null_rate 0.053881);
      sample_values like "05AA" and "0S9" are alphanumeric, so it stays text with nulls retained.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated national identifier: null_count 5766 (null_rate 0.636635)
      over 9057 rows with distinct_count 3193; the column is retained nullable rather than
      dropped, with sample_values such as "00C" and "0AA1".'
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated URL column: null_count 6784 (null_rate 0.749034) with
      distinct_count 2272; sample_values such as "http://GillespieField.com/" are free-form
      links kept as text.'
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Reference URL with distinct_count 7870 and null_count 1185 (null_rate 0.130838);
      sample_values such as "http://en.wikipedia.org/wiki/Khasab_Airport" are kept as text
      with nulls retained.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated, comma-delimited free text: null_count 6155 (null_rate
      0.679585) with distinct_count 2883, and sample_values such as "119th Wing, Happy Hooligans"
      mix alternate codes and alias names, so no parsing is proposed.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (ident) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT ident
        FROM silver.silver_ourairports_airports
        GROUP BY ident
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
