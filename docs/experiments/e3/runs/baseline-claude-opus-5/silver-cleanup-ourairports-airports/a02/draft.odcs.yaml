# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:19:29.620982+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_airports
name: Silver ourairports airports
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_ourairports_airports is the cleaned, one-row-per-airport reference table
    built from bronze.ourairports_airports (9057 rows). It carries airport identity (id, ident,
    iata_code, icao_code, gps_code, local_code), classification (type, has_scheduled_service),
    geography (latitude_deg, longitude_deg, elevation_ft, continent, iso_country, iso_region,
    municipality) and reference links, and feeds downstream joins that attribute flights,
    routes or traffic metrics to an airport.
  usage: Join on id (the declared grain) or on ident when matching external OurAirports extracts;
    iata_code and icao_code are the usual join keys against carrier data but icao_code is
    null for 1237 rows (13.7%) so use an outer join or filter deliberately. has_scheduled_service
    is a boolean derived from the bronze 'yes'/'no' text and is the intended filter for commercial-service
    airports. latitude_deg and longitude_deg are decimal degrees suitable for distance maths;
    elevation_ft is whole feet and may be negative (min -1266).
  limitations: 'Capture metadata (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta) is
    excluded, so this table carries no load lineage or extraction timestamp. Several columns
    are sparsely populated and were retained as-is rather than cleaned or imputed: local_code
    (null_rate 0.636635), keywords (0.679585), home_link (0.749034), wikipedia_link (0.130838),
    icao_code (0.136579), gps_code (0.053881), municipality (0.039748) and elevation_ft (0.036988).
    keywords remains an unparsed free-text list, and the external URLs in home_link and wikipedia_link
    are not validated. The id and elevation_ft casts rest on the 10 sampled values per column
    plus the reported min/max, so a reviewer should confirm them against the full warehouse
    table before approval.'
schema:
- name: silver_ourairports_airports
  physicalName: silver_ourairports_airports
  logicalType: object
  physicalType: table
  description: silver_ourairports_airports is the cleaned, one-row-per-airport reference table
    built from bronze.ourairports_airports (9057 rows). It carries airport identity (id, ident,
    iata_code, icao_code, gps_code, local_code), classification (type, has_scheduled_service),
    geography (latitude_deg, longitude_deg, elevation_ft, continent, iso_country, iso_region,
    municipality) and reference links, and feeds downstream joins that attribute flights,
    routes or traffic metrics to an airport.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count 9057 equals the table row_count 9057 and null_rate is 0.0,
      so this is a complete unique key; every sample_value ('10309', '10366', '1058', '111')
      is integral text, which supports the VARCHAR to INTEGER cast.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count 9057 matches row_count 9057 with null_rate 0.0, so ident is
      a second complete unique identifier; sample_values mix letters and digits ('03N', '07FA',
      '19AK'), so it stays text.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: distinct_count is 5 with null_rate 0.0 and the full distinct_values list
      is enumerated ('heliport', 'large_airport', 'medium_airport', 'seaplane_base', 'small_airport'),
      a stable low-cardinality category.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 over 9057 rows with distinct_count 9006, so names are near-unique
      free text; sample_values such as 'A Coruña Airport' and 'Aachen-Merzbrück Airport' show
      accented characters, so VARCHAR is retained unchanged.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: true
    description: null_rate 0.0 with min -79.777778 and max 82.517263, inside the valid latitude
      range; samples carry six fractional digits, so the landed DECIMAL(38,9) precision is
      kept rather than narrowed.
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(38,9)
    required: true
    description: null_rate 0.0 with min -179.876999 and max 179.9757, inside the valid longitude
      range; fractional samples such as -178.066492 mean the landed DECIMAL(38,9) precision
      is preserved.
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_count 335 (null_rate 0.036988) so nulls are retained; every sample_value
      is integral (-1266.0, -210.0, -72.0) and min -1266.0 / max 14472.0 fit INTEGER, which
      supports narrowing from DECIMAL(38,9).
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 7 with the enumerated distinct_values 'AF',
      'AN', 'AS', 'EU', 'NA', 'OC', 'SA', a complete two-letter continent code set.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 239 and two-letter sample_values ('AD',
      'AE', 'AQ', 'AR'), consistent with ISO country codes held as text.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 2169; sample_values such as 'AD-08' and
      'AF-BDS' are hyphenated country-subdivision codes, so the column stays VARCHAR.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_count 360 (null_rate 0.039748) across 9057 rows, so the column is nullable
      and nulls are retained; distinct_count 8049 with place-name samples like 'Aachen' and
      'Abakan'.
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_count is 2 with distinct_values exactly 'no' and 'yes' and null_rate
      0.0, so every value maps cleanly to a boolean and the name is clarified to has_scheduled_service.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_count 1237 (null_rate 0.136579) so the column is nullable; distinct_count
      7820 with four-character sample_values such as 'AGAF' and 'AGGB'.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 9057 equal to row_count, so this profile
      shows a fully populated unique three-letter code ('AAA', 'AAB', 'AAK'); retained as
      text.
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_count 488 (null_rate 0.053881) so nulls are retained; distinct_count
      8569 with mixed alphanumeric sample_values like '03N' and '05AA', so VARCHAR is kept.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'sparsely populated: null_count 5766 (null_rate 0.636635) with distinct_count
      3193; the column is retained nullable rather than dropped, with alphanumeric samples
      such as ''00C'' and ''0AA1''.'
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'sparsely populated: null_count 6784 (null_rate 0.749034) with distinct_count
      2272; sample_values are URLs such as ''http://GillespieField.com/'', retained as text
      with nulls preserved.'
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_count 1185 (null_rate 0.130838) so nulls are retained; distinct_count
      7870 of URL sample_values such as 'http://en.wikipedia.org/wiki/Khasab_Airport'.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'sparsely populated: null_count 6155 (null_rate 0.679585) with distinct_count
      2883; sample_values are free-text comma-separated lists such as ''1XA2, Naval Air Station
      Chase Field, Beeville Municipal Airport'', so it stays unparsed VARCHAR.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
