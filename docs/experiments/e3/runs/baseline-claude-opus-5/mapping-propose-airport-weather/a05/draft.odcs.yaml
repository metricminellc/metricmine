# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how the contracted silver table silver.silver_airport_weather
    enters the gold unified event star as the airport_weather_observations fact category:
    it fixes the event timestamp and its hour grain, the transactional grain and its derived
    identity over (airport_code, observed_hour_utc), and the role of every mapped column.
    Its consumer is the deterministic modeling engine, which reads the contract and emits
    the gold models; downstream analysts consume those models rather than this document.'
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, checked by the validator and datacontract lint, and reviewed
    and edited by a human before approval. Once approved, the modeling engine uses it to generate
    the fact and its conformed dimensions; any change to the time column, the grain, the identity
    tuple, or a field role must go back through the same contract review.
  limitations: The mapping only names and roles existing silver columns; it declares no transformations,
    filters, unit conversions, or quality rules. It does not exclude or repair questionable
    readings, such as the wind_speed_mph maximum of 1048.36058 that sits far above the rest
    of the sampled range, nor does it impute the sparsely populated wind_gust_mph (null_rate
    0.745505), pressure_mb (null_rate 0.114953), or wind_dir_degrees (null_rate 0.016828);
    consumers must handle those nulls and outliers. The hour grain follows the samples, which
    land on whole hours, so no sub-hourly detail is available, and observed_date_local plus
    observed_hour_local are carried as source-provided labels without any timezone derivation
    from observed_hour_utc.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row is one hourly weather observation reported by one New York area airport
    station, identified by the airport and the UTC observation hour, carrying the measured
    conditions (temperature, dew point, humidity, wind, precipitation, pressure, visibility)
    together with the local calendar labels and the descriptive attributes of the reporting
    airport.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: IATA code of the reporting airport, a dimension with 3 distinct values (EWR,
      JFK, LGA) and null_rate 0.0, and part of the observation identity tuple.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp that stamps each observation, with null_rate 0.0, 4341 distinct
      values, and samples such as 2013-01-01T06:00:00 through 2013-01-01T15:00:00 that land
      exactly on the hour, which is why the grain is hour.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: false
    mappingRole: dimension
    description: Local calendar date of the observation used as a calendar dimension, with
      181 distinct values from 2013-01-01 to 2013-06-30 and null_rate 0.0.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Local hour-of-day label from 0 to 23 across 24 distinct values; it labels
      the time of day rather than measuring anything, so it is a dimension.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit, a comparable numeric measure ranging
      from 10.94 to 93.92 with null_rate 0.0.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Dew point in degrees Fahrenheit, a comparable numeric measure ranging from
      -9.94 to 73.94 with null_rate 0.0.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Relative humidity percentage, a continuous measure with 2178 distinct values
      spanning 12.74 to 100.0 and null_rate 0.0.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Wind bearing in degrees, sampled in 10-degree steps from 0 to 360 across
      37 distinct values; it labels a compass direction rather than being added across rows,
      and it is nullable with null_rate 0.016828 where the bearing was not reported.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Sustained wind speed in miles per hour, a measure ranging from 0.0 to 1048.36058;
      it is nullable with null_rate 0.000154 for two observations missing a reading, and the
      extreme maximum suggests unvalidated source outliers.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Peak wind gust in miles per hour ranging from 16.11092 to 62.14212; it is
      nullable with a high null_rate of 0.745505 because gusts are only recorded when they
      occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Precipitation accumulated in the observation hour in inches, an additive
      measure from 0.0 to 1.06 with null_rate 0.0.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Barometric pressure in millibars, a comparable measure from 983.8 to 1038.4;
      it is nullable with null_rate 0.114953 where the station reported no pressure value.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Reported visibility in miles, a comparable measure taking 20 banded distinct
      values from 0.0 to 10.0 with null_rate 0.0.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full airport name describing the reporting station, a dimension with 3 distinct
      values such as LaGuardia Airport and null_rate 0.0.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Municipality of the reporting airport, a dimension with 2 distinct values
      (New York, Newark) and null_rate 0.0.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Field elevation of the airport in feet, a station attribute with only 3 distinct
      values (13, 18, 21) that labels the airport rather than measuring the observation.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Longest runway length of the airport in feet, a station attribute with only
      3 distinct values (7002, 11000, 14511) that labels the airport rather than measuring
      the observation.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: false
    mappingRole: dimension
    description: Ingestion capture timestamp with 3 distinct values between 2026-09-02T23:26:11
      and 2026-09-02T23:26:13, kept as a load-lineage dimension rather than the event time.
