# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T18:33:09.451732+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flight_legs_mapping
name: Gold mapping, flight_legs category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how silver.silver_flights enters the gold unified event
    star as the flight_legs fact category: which column timestamps the event and at what grain,
    which combination of columns identifies one leg, and what role each silver column plays
    as time, dimension or measure. Its consumer is the deterministic modeling engine, which
    reads the contract and generates the gold models; no analyst or query reads this contract
    directly.'
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, linted, and reviewed and edited by a human before approval.
    Once approved, the modeling engine uses it to emit the gold models for flight_legs; changing
    the grain, the time column or any field role here changes the generated models, so edits
    go through the same review and gating path.
  limitations: 'The mapping only names silver columns and the identity tuple over them; it
    performs no transformation, so the HHMM clock-time integers (sched_dep_hhmm, dep_hhmm,
    arr_hhmm, sched_arr_hhmm) stay encoded as profiled and are not converted to timestamps,
    and the time grain is hour because every departure_hour_utc sample lands on an exact hour,
    so finer departure timing must come from the HHMM columns. It declares no filter: cancelled
    legs (is_cancelled true, with dep_hhmm, dep_delay_minutes, arr_delay_minutes and air_time_minutes
    null at rates 0.029388 to 0.032981) remain in the fact and their exclusion is left to
    consumers, as are the rows lacking aircraft registry detail (null_rate 0.160426 to 0.176531)
    and the rows lacking destination airport reference detail (null_rate 0.02089). It also
    carries no quality rules, classifications, ownership or service levels, which review owns.'
schema:
- name: flight_legs
  logicalType: object
  physicalType: mapping
  description: One row is one scheduled flight leg departing an origin airport on a given
    service date, identified by the combination of service date, operating carrier, flight
    number, origin, destination and scheduled departure time, and timestamped at the UTC hour
    of scheduled departure. Each row carries the operating and schedule attributes of the
    leg, the airframe and airport reference attributes joined to it, and the delay, air time,
    distance and seat-capacity quantities observed for it.
  entityGroup: flight_legs
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_leg_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - dest_airport
      - sched_dep_hhmm
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Service date of the flight leg, spanning min 2013-01-01 to max 2013-06-30
      across 181 distinct days with null_rate 0.0, used here as the calendar label of the
      leg rather than as the event timestamp.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter operating carrier code with 16 distinct values such as 9E, AA,
      DL and WN and null_rate 0.0, labelling the airline that operated the leg.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Carrier-assigned flight number ranging 1 to 8500 over 2994 distinct values
      with null_rate 0.0; it is an identifier stored as a number and is never added across
      rows, so it is a dimension.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Departure airport code limited to the three distinct values EWR, JFK and
      LGA with null_rate 0.0, identifying the New York-area origin of the leg.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure clock time encoded as HHMM between 500 and 2359 over
      969 distinct values with null_rate 0.0; the number is a time label and not additive,
      so it is a dimension.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Destination airport code over 100 distinct values sampled as ABQ, ACK, ALB,
      ATL and BNA with null_rate 0.0, identifying where the leg terminated.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Registration of the airframe flown, with 3825 distinct values sampled as
      N10156 and N102UW; it is nullable at null_rate 0.009154 because some rows, including
      cancelled flights, carry no assigned airframe.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag with the two distinct values false and true and null_rate 0.0, marking
      legs that were cancelled rather than operated.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure clock time encoded as HHMM between 1 and 2400 over 1291
      distinct values; it labels a time of day rather than measuring a quantity, and is nullable
      at null_rate 0.029388 because legs that never departed have no actual departure time.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes ranging -33 (early) to 1301, a quantity that is
      averaged and compared across legs; it is nullable at null_rate 0.029388, matching the
      rows with no actual departure time.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival clock time encoded as HHMM between 1 and 2400 over 1392 distinct
      values, a time-of-day label rather than a measure, nullable at null_rate 0.0307 for
      legs that never arrived.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival clock time encoded as HHMM between 1 and 2359 over 1134
      distinct values with null_rate 0.0; it is a published schedule label, not an additive
      quantity.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes ranging -86 to 1272, a quantity summed and averaged
      across legs; nullable at null_rate 0.032981 for legs with no recorded arrival.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Minutes airborne ranging 20 to 695, an additive quantity for utilisation
      analysis; nullable at null_rate 0.032981 because cancelled or diverted legs record no
      air time.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle distance of the leg in statute miles ranging 80 to 4983 with
      null_rate 0.0, summed across legs to give miles flown.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local scheduled departure hour taking the 19 distinct values 5 through 23
      with null_rate 0.0, a time-of-day bucket used to group legs.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local scheduled departure minute ranging 0 to 59 over 60 distinct values
      with null_rate 0.0, a clock component used for grouping rather than a measure.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the scheduled departure hour, spanning 2013-01-01T10:00:00
      to 2013-07-01T03:00:00 over 3439 distinct values with null_rate 0.0; every sample lands
      on an exact hour, so it timestamps each leg at hour resolution.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full operating carrier name with 16 distinct values such as Delta Air Lines
      Inc. and JetBlue Airways and null_rate 0.0, the descriptive counterpart of carrier_code.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Manufacturer of the airframe over 34 distinct values sampled as AIRBUS, BOEING
      and BOMBARDIER INC; nullable at null_rate 0.160426 because many legs have no matching
      aircraft registry record.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model designation over 121 distinct values sampled as 172M and 421C;
      nullable at null_rate 0.160426, the same rows that lack manufacturer detail.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the airframe was manufactured, ranging 1956 to 2013 over 46 distinct
      values; it labels the aircraft vintage rather than measuring anything, and is nullable
      at null_rate 0.176531 where registry data is missing.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Seats installed on the airframe, ranging 2 to 450 over 47 distinct values,
      a capacity quantity that is summed or averaged across legs; nullable at null_rate 0.160426
      where the aircraft registry record is missing.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Engine family of the airframe with six distinct values including Turbo-fan,
      Turbo-jet and Turbo-prop; nullable at null_rate 0.160426 for legs without registry detail.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full name of the origin airport with the three distinct values John F. Kennedy
      International Airport, LaGuardia Airport and Newark Liberty International Airport and
      null_rate 0.0.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: City of the origin airport with the two distinct values New York and Newark
      and null_rate 0.0, a geographic label for the departure point.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Field elevation of the origin airport in feet with only the three distinct
      values 13, 18 and 21 and null_rate 0.0; it is a fixed airport attribute that labels
      rather than measures the leg.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway at the origin airport in feet with the three distinct values
      7002, 11000 and 14511 and null_rate 0.0, a static airport characteristic used for grouping.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full name of the destination airport over 99 distinct values sampled as Boston
      Logan International Airport; nullable at null_rate 0.02089 where the destination code
      has no matching airport reference record.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: City of the destination airport over 95 distinct values sampled as Atlanta
      and Albuquerque; nullable at null_rate 0.02089, consistent with the unmatched destination
      reference rows.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: ISO region code of the destination over 45 distinct values sampled as US-CA
      and PR-U-A, used for state-level grouping; nullable at null_rate 0.02089 for unmatched
      destinations.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Field elevation of the destination airport in feet ranging 3 to 6606, a static
      airport attribute that labels the arrival point; nullable at null_rate 0.02089 for unmatched
      destinations.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Longest runway at the destination airport in feet ranging 5076 to 16000,
      a static airport characteristic rather than a leg quantity; nullable at null_rate 0.02089
      for unmatched destinations.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Capture timestamp of the silver load, confined to 16 distinct values between
      2026-09-02T23:25:51 and 2026-09-02T23:26:06 with null_rate 0.0; it describes the load
      batch, not the flight, so it is a dimension and not the event time.
