# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table cleans the bronze hourly weather observations captured at the three
    NYC-area airports (EWR, JFK, LGA) for downstream flight-delay and operations analyses
    that join on airport and hour.
  usage: Consumers should treat (origin, time_hour) as the row grain and join flight or airport
    datasets on those columns; wind_gust and pressure carry substantial nulls (74.6% and 11.5%
    respectively) and must be null-checked before aggregation, and wind_dir and wind_speed
    carry small null rates (1.68% and 0.015%) that should also be handled explicitly.
  limitations: Pipeline metadata columns (_airbyte_raw_id, _airbyte_extracted_at, _airbyte_meta)
    were dropped and carry no recoverable business signal; wind_gust remains 74.6% null and
    pressure 11.5% null with no imputation applied, so analyses sensitive to these fields
    must account for missingness; year is retained despite being constant at 2013 across all
    rows.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table cleans the bronze hourly weather observations captured at the three
    NYC-area airports (EWR, JFK, LGA) for downstream flight-delay and operations analyses
    that join on airport and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 13014 rows and distinct_values show exactly three
      airport codes (EWR, JFK, LGA), consistent with a station identifier.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count is 1 with min=max=2013.0 and null_rate 0.0; the single integral
      value supports a DECIMAL-to-INTEGER cast.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are the six integral values 1.0 through 6.0 with null_rate
      0.0, so DECIMAL to INTEGER is safe.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 are all integral, distinct_count is 31 matching
      calendar days, and null_rate is 0.0.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 are integral and distinct_count 24 matches
      hours of day with min 0.0 and max 23.0; null_rate is 0.0.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: sample_values such as 10.94 and 19.04 carry two decimal places, min 10.94
      and max 93.92, null_rate 0.0, so this stays a decimal measurement.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: sample_values range from -9.94 to 73.94 with two-decimal precision and null_rate
      0.0, confirming a continuous measurement.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: distinct_count 2178 with decimal sample_values like 12.74 and 15.47, min
      12.74 and max 100.0, null_rate 0.0.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values 0.0 through 90.0 are integral multiples of ten and distinct_count
      37 exactly matches degree bins from 0 to 360; null_rate is 0.016828 (219 nulls) so the
      column stays nullable.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values carry five decimal places (3.45234, 4.60312) with min 0.0 and
      max 1048.36058; null_rate is 0.000154 (2 nulls) so nulls are retained rather than imputed.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate is 0.745505 (9702 of 13014 rows null), making this a sparsely populated
      column that is retained as-is with five-decimal precision matching sample_values like
      16.11092.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values 0.0 through 0.09 step by hundredths, min 0.0 and max 1.06,
      null_rate 0.0.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: false
    description: null_rate is 0.114953 (1496 of 13014 rows null) and sample_values like 983.8
      and 992.1 carry decimal precision, so nulls are retained.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_values list exactly 20 values from 0.0 to 10.0 including fractions
      like 0.06 and 0.12, with null_rate 0.0.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are uniformly ISO-8601 timestamps (e.g. 2013-01-01T06:00:00Z)
      with null_rate 0.0 and distinct_count 4341, supporting a VARCHAR-to-TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
