# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:48:43.118755+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed hourly weather observations at the three NYC-area
    airports (EWR, JFK, LGA) for 2013, feeding downstream analyses that join flight or operational
    data to ambient weather conditions by origin and hour.
  usage: Join on origin and time_hour to attach weather conditions to other hourly or per-flight
    records; expect wind_gust to be null in most rows (74.6% null) and treat null wind_dir,
    wind_speed, and pressure values as missing station readings rather than zero.
  limitations: wind_gust is retained despite a 74.6% null rate and should not be relied on
    for complete coverage; pressure (11.5% null) and wind_dir (1.7% null) also have partial
    coverage; no exact duplicate rows were found so no rows were removed during cleanup, and
    year is a constant 2013 across the dataset.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed hourly weather observations at the three
    NYC-area airports (EWR, JFK, LGA) for 2013, feeding downstream analyses that join flight
    or operational data to ambient weather conditions by origin and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with distinct_count 3 and distinct_values EWR, JFK, LGA,
      a clean low-cardinality airport code column.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_count is 1 with the single value 2013.0 and null_rate 0.0; the integral
      value supports casting DECIMAL(38,9) to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0 through 6.0 are all integral with null_rate 0.0, supporting
      a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 are integral, min 1.0 max 31.0, null_rate
      0.0, supporting a cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 are integral, min 0.0 max 23.0, null_rate 0.0,
      supporting a cast to INTEGER for hour-of-day.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values carry two decimal places (10.94 to 19.04), min 10.94 max 93.92,
      null_rate 0.0, supporting DECIMAL(5,2) for degrees Fahrenheit.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values carry two decimal places including negatives (-9.94 to -0.94),
      min -9.94 max 73.94, null_rate 0.0, supporting DECIMAL(5,2).
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values carry two decimal places (12.74 to 15.47), min 12.74 max 100.0,
      null_rate 0.0, distinct_count 2178, supporting DECIMAL(5,2) for percent humidity.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values 0.0 through 90.0 are all integral multiples of ten across distinct_count
      37, min 0.0 max 360.0, supporting a cast to INTEGER degrees; null_rate 0.016828 (219
      nulls) retained as nullable.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(9,5)
    required: false
    description: sample_values carry five decimal places (3.45234 to 12.65858), min 0.0 max
      1048.36058; null_rate 0.000154 (2 nulls) retained as nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(9,5)
    required: false
    description: sample_values carry five decimal places (16.11092 to 26.46794), min 16.11092
      max 62.14212; null_rate 0.745505 (9702 of 13014 nulls) means the column is sparsely
      populated but is retained rather than dropped.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values 0.0 through 0.09 step by 0.01, min 0.0 max 1.06, null_rate
      0.0, supporting DECIMAL(5,2) for inches of precipitation.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: sample_values carry one decimal place (983.8 to 992.1), min 983.8 max 1038.4;
      null_rate 0.114953 (1496 nulls) retained as nullable.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_values 0.0 through 10.0 with entries like 0.06 and 0.12 need two
      decimal places, null_rate 0.0, distinct_count 20 at or under the cap so all values are
      listed.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are ISO-8601 timestamps with Z suffix (2013-01-01T06:00:00Z
      through 2013-01-01T15:00:00Z), null_rate 0.0, distinct_count 4341, supporting a cast
      from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
