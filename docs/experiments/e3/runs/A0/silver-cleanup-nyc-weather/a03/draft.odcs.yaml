# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:47:03.890938+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, and visibility) for the three NYC-area airports (EWR, JFK,
    LGA) in 2013, feeding downstream flight-delay and weather-correlation analyses.
  usage: Join on origin and time_hour to correlate weather conditions with flight events at
    the same airport and hour; consumers should expect and handle nulls in wind_dir, wind_speed,
    pressure, and especially wind_gust (nearly 75% null) rather than assuming a reading is
    always present.
  limitations: wind_gust is sparsely populated (null_rate 0.745505) and pressure is moderately
    sparse (null_rate 0.114953); these were retained as nullable rather than imputed, so aggregate
    statistics over these columns will reflect a reduced sample. All timestamps originate
    from a single source year (2013) and the dataset covers only three airports, so it cannot
    be used for broader geographic or multi-year weather analysis without additional data.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned, hourly weather observations (temperature, humidity,
    wind, pressure, precipitation, and visibility) for the three NYC-area airports (EWR, JFK,
    LGA) in 2013, feeding downstream flight-delay and weather-correlation analyses.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 with null_count 0 and only 3 distinct_values (EWR, JFK,
      LGA), confirming a complete, low-cardinality airport code column.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but distinct_values show a single integral value
      2013.0 with min=max=2013.0 and null_rate 0.0, so casting to INTEGER is safe.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values are the integral set 1.0 through 6.0 with min 1.0, max 6.0,
      and null_rate 0.0, supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 are all integral, max is 31.0 and min is 1.0
      with null_rate 0.0, consistent with a calendar day number cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 are integral, max 23.0 and min 0.0 with null_rate
      0.0, matching a 0-23 hour-of-day cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values show two-decimal precision readings between 10.94 and 93.92
      (min/max) with null_rate 0.0, so DECIMAL(5,2) narrows the oversized DECIMAL(38,9) landed
      type without losing precision.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values range from -9.94 to 73.94 (matching min/max) at two-decimal
      precision with null_rate 0.0, justifying DECIMAL(5,2).
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values like 12.74 and 13.95 fall between min 12.74 and max 100.0 at
      two-decimal precision with null_rate 0.0, justifying DECIMAL(5,2) despite high distinct_count
      2178.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: distinct_count 37 with sample_values 0.0,10.0,...,90.0 spanning min 0.0 to
      max 360.0 are all multiples of 10, so an integer compass-degree cast is safe; null_rate
      0.016828 (219 nulls) means the column stays nullable.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values carry five-decimal precision between min 0.0 and max 1048.36058,
      so DECIMAL(10,5) preserves fidelity; null_rate 0.000154 (2 nulls) keeps the column nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values show five-decimal precision between min 16.11092 and max 62.14212,
      but null_rate 0.745505 (9702 of 13014 nulls) means the column is sparsely populated
      and must remain nullable, not imputed.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: sample_values step by 0.01 from min 0.0 to max 1.06 with null_rate 0.0, justifying
      DECIMAL(5,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: sample_values show one-decimal precision between min 983.8 and max 1038.4,
      but null_rate 0.114953 (1496 nulls) requires the column to stay nullable.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: distinct_values list 20 discrete values from 0.0 to 10.0 (e.g. 0.06, 0.12,
      0.25) with null_rate 0.0, justifying DECIMAL(4,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are consistently ISO-8601 timestamps like 2013-01-01T06:00:00Z
      with distinct_count 4341 and null_rate 0.0, supporting a VARCHAR to TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
