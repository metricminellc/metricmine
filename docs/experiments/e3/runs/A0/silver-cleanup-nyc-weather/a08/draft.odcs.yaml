# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides hourly weather observations (temperature, dew point, humidity,
    wind, precipitation, pressure, visibility) for three NYC-area airports (EWR, JFK, LGA)
    in 2013, cleaned from the raw bronze capture for use in flight-delay or operations analysis
    joins keyed by station and hour.
  usage: Join on origin and time_hour to attach weather context to flight or operational events;
    consumers must handle nulls explicitly in wind_dir, wind_speed, pressure, and especially
    wind_gust (74.6% null) rather than assuming zero or average values, since nulls represent
    missing instrument readings, not absence of wind or pressure.
  limitations: wind_gust is missing for about 74.6% of rows and pressure for about 11.5%,
    so any aggregate or model relying on them must account for substantial sparsity; wind_dir
    and wind_speed have small but nonzero null rates (1.68% and 0.015% respectively); the
    dataset covers only 2013 (year has a single distinct value) and only three origin airports,
    so it cannot be used to infer weather at other stations or other years.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides hourly weather observations (temperature, dew point, humidity,
    wind, precipitation, pressure, visibility) for three NYC-area airports (EWR, JFK, LGA)
    in 2013, cleaned from the raw bronze capture for use in flight-delay or operations analysis
    joins keyed by station and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: origin has null_rate 0.0 and only 3 distinct_values (EWR, JFK, LGA), a clean
      low-cardinality station code kept as-is.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: year lands as DECIMAL(38,9) but distinct_count is 1 with min=max=2013.0,
      an integral value safely cast to INTEGER; null_rate is 0.0.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: month ranges 1.0 to 6.0 across 6 distinct integral values with null_rate
      0.0, cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: day ranges 1.0 to 31.0 with 31 distinct integral sample values and null_rate
      0.0, cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour ranges 0.0 to 23.0 with 24 distinct integral sample values and null_rate
      0.0, cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: temp has 130 distinct values ranging 10.94 to 93.92 with two-decimal samples
      (10.94, 12.02, ...) and null_rate 0.0, cast to a fixed-precision decimal.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: dewp ranges -9.94 to 73.94 across 119 distinct two-decimal values with null_rate
      0.0, cast to DECIMAL(5,2).
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: humid ranges 12.74 to 100.0 across 2178 distinct two-decimal values with
      null_rate 0.0, cast to DECIMAL(5,2).
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(5,1)
    required: false
    description: wind_dir ranges 0.0 to 360.0 in 37 distinct values at 10-degree increments
      but carries null_rate 0.016828 (219 nulls), so it is nullable and retained as-is.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: wind_speed ranges 0.0 to 1048.36058 with 5-decimal precision samples and
      a small null_rate of 0.000154 (2 nulls), retained nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: wind_gust is sparsely populated with null_rate 0.745505 (9702 nulls out of
      13014 rows); values that are present range 16.11092 to 62.14212, retained nullable rather
      than dropped.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: precip ranges 0.0 to 1.06 across 50 distinct two-decimal values with null_rate
      0.0, cast to DECIMAL(5,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: pressure ranges 983.8 to 1038.4 across 430 distinct one-decimal values but
      has null_rate 0.114953 (1496 nulls), retained nullable.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: visib has 20 distinct values ranging 0.0 to 10.0 (0.0, 0.06, 0.12, ... 10.0)
      with null_rate 0.0, cast to DECIMAL(4,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: time_hour samples are consistently ISO-8601 with Z suffix (e.g. 2013-01-01T06:00:00Z)
      across 4341 distinct values with null_rate 0.0, safely cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
