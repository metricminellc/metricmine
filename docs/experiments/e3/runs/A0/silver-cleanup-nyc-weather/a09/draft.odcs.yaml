# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:52:12.681242+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed hourly weather observations for NYC-area airports
    (EWR, JFK, LGA) to support joins against flight event tables and weather-driven delay
    analysis.
  usage: Join on origin and time_hour (the declared grain) to attach weather context to flight
    records; consumers must handle nulls explicitly in wind_dir, wind_speed, wind_gust, and
    pressure rather than assuming zero or average values, and should expect wind_gust to be
    populated only about 25% of the time.
  limitations: No deduplication logic was needed since duplicate_row_rate is 0.0, but wind_gust
    (74.6% null) and pressure (11.5% null) remain sparsely populated and were not imputed;
    precision for decimal measurement columns was narrowed from the landed DECIMAL(38,9) based
    on observed sample precision, which a reviewer should confirm against source instrument
    precision before approval.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed hourly weather observations for NYC-area
    airports (EWR, JFK, LGA) to support joins against flight event tables and weather-driven
    delay analysis.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 13014 rows and distinct_values are exactly the three
      station codes EWR, JFK, LGA, so this is a clean required dimension.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The sole distinct_value is 2013.0 with null_rate 0.0; the value is integral
      so DECIMAL(38,9) is cast down to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0 through 6.0 are all whole numbers with min 1.0, max 6.0,
      null_rate 0.0, supporting a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 are integral, min 1.0 and max 31.0 match a
      calendar day range, null_rate 0.0 supports a required INTEGER cast.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 are integral with min 0.0 and max 23.0, a 24-hour
      range, null_rate 0.0 supports a required INTEGER cast.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: sample_values such as 10.94 and 19.04 carry two decimal places, min 10.94
      and max 93.92, null_rate 0.0; DECIMAL(38,9) is narrowed to DECIMAL(6,2) matching observed
      precision.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: sample_values like -9.94 and -0.94 use two decimals, min -9.94 and max 73.94,
      null_rate 0.0; narrowed from DECIMAL(38,9) to DECIMAL(6,2).
  - name: humid
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: sample_values like 12.74 and 15.47 carry two decimals, min 12.74 and max
      100.0, null_rate 0.0; narrowed to DECIMAL(6,2) which covers the 0-100 percent range.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values 0.0 through 90.0 step by whole-number degrees, min 0.0 and
      max 360.0; null_rate 0.016828 (219 nulls) means the column is nullable and retained
      as-is, cast to INTEGER since all samples are integral degrees.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values like 3.45234 and 12.65858 carry five decimal places, min 0.0
      and max 1048.36058; null_rate 0.000154 (2 nulls) is retained rather than imputed.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values like 16.11092 and 26.46794 carry five decimal places, min 16.11092
      and max 62.14212; null_rate 0.745505 (9702 of 13014 nulls) makes this column sparsely
      populated but it is retained, not dropped, per null-handling policy.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: true
    description: sample_values 0.0 through 0.09 step by 0.01, min 0.0 and max 1.06, null_rate
      0.0; narrowed from DECIMAL(38,9) to DECIMAL(6,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: sample_values like 983.8 and 992.1 carry one decimal place, min 983.8 and
      max 1038.4; null_rate 0.114953 (1496 nulls) means the column is retained nullable rather
      than imputed.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: the 20 distinct_values (0.0 through 10.0 at two-decimal granularity) fully
      enumerate the domain with null_rate 0.0, supporting a required DECIMAL(4,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: all ten sample_values (e.g. 2013-01-01T06:00:00Z through 2013-01-01T15:00:00Z)
      are consistently ISO-8601 with a Z suffix, distinct_count 4341 and null_rate 0.0, supporting
      a VARCHAR-to-TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
