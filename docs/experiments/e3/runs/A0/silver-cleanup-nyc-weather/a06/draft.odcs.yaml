# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned hourly weather observations for NYC-area airports (origin
    stations EWR, JFK, LGA) for downstream join against flight and scheduling tables keyed
    on station and hour.
  usage: Join on origin and time_hour to attach weather conditions to flight records; consumers
    should expect nulls in wind_dir, wind_speed, pressure, and especially wind_gust (74.6%
    null) and must handle them explicitly rather than assume zero or average values.
  limitations: wind_gust is missing for about three quarters of rows and pressure is missing
    for about 11.5% of rows, so any aggregate or model relying on those fields will have reduced
    coverage; wind_dir and wind_speed have small but nonzero null rates as well. No duplicate
    rows were found in bronze (duplicate_row_rate 0.0), so no dedupe logic was applied.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned hourly weather observations for NYC-area airports
    (origin stations EWR, JFK, LGA) for downstream join against flight and scheduling tables
    keyed on station and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count is 3 with distinct_values EWR, JFK, LGA,
      a clean low-cardinality station code.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: All distinct_values are the single integral value 2013.0 with null_rate 0.0,
      so DECIMAL(38,9) safely narrows to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0 through 6.0 are all integral with null_rate 0.0, justifying
      a cast from DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 1.0 through 10.0 and min/max 1.0/31.0 are all integral with
      null_rate 0.0, supporting a DECIMAL to INTEGER cast.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sample_values 0.0 through 9.0 and min/max 0.0/23.0 are integral with null_rate
      0.0, supporting a cast to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values such as 10.94 and 93.92 carry two decimal places with null_rate
      0.0, so DECIMAL(10,2) preserves precision.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values range from -9.94 to 73.94 with two decimal places and null_rate
      0.0, so DECIMAL(10,2) is appropriate.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values from 12.74 to 100.0 show two decimal places with null_rate
      0.0, supporting DECIMAL(10,2).
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: sample_values 0.0 through 90.0 are all integral degree values, but null_rate
      is 0.016828 (219 nulls) so the column stays nullable.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values like 3.45234 and 8.05546 carry five decimal places and null_rate
      is 0.000154 (2 nulls), so the column is cast to DECIMAL(10,5) and kept nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: sample_values like 16.11092 show five decimal places, and null_rate 0.745505
      (9702 of 13014 nulls) means the column is sparsely populated but retained nullable.
  - name: precip
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: sample_values 0.0 through 0.09 show two decimal places with null_rate 0.0,
      supporting DECIMAL(10,2).
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: sample_values from 983.8 to 992.1 show up to one decimal place, but null_rate
      0.114953 (1496 nulls) means the column must stay nullable.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: distinct_values list 20 discrete fractional values from 0.0 to 10.0 with
      null_rate 0.0, supporting DECIMAL(10,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: all ten sample_values share the consistent ISO-8601 shape 2013-01-01T0X:00:00Z
      with null_rate 0.0, justifying a cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
