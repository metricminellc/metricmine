# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned hourly weather observations (temperature, dew point,
    humidity, wind, precipitation, pressure, visibility) for the three NYC-area airports (EWR,
    JFK, LGA) in 2013, intended to support downstream analyses such as joining to flight delay
    data by origin and hour.
  usage: Join on origin and time_hour (the declared grain) to associate weather with other
    hourly events; wind_gust and pressure are frequently null (74.6% and 11.5% respectively)
    and wind_dir is null in 1.7% of rows, so consumers must handle nulls explicitly rather
    than assume full coverage, and must not treat retained nulls as zero or missing-data errors.
  limitations: wind_gust is sparsely populated (null_rate 0.745505) and pressure and wind_dir
    also carry nontrivial null rates (0.114953 and 0.016828); these were retained nullable
    rather than imputed or dropped. No exact duplicate rows were found (duplicate_row_rate
    0.0) so no dedupe logic was applied beyond the grain declaration.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: This table provides cleaned hourly weather observations (temperature, dew point,
    humidity, wind, precipitation, pressure, visibility) for the three NYC-area airports (EWR,
    JFK, LGA) in 2013, intended to support downstream analyses such as joining to flight delay
    data by origin and hour.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 with only 3 distinct_values (EWR, JFK, LGA) identifies the
      weather station; kept as-is.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Single distinct_value 2013.0, min and max both 2013.0, null_rate 0.0; the
      integral sample supports casting DECIMAL(38,9) to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values 1.0-6.0 are all whole numbers, null_rate 0.0; integral samples
      support casting to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 1.0, max 31.0, distinct_count 31, sample_values are all whole numbers,
      null_rate 0.0; supports INTEGER cast.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 0.0, max 23.0, distinct_count 24, sample_values 0.0-9.0 are all whole
      numbers, null_rate 0.0; supports INTEGER cast.
  - name: temp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: Continuous temperature readings from 10.94 to 93.92 with null_rate 0.0; narrowed
      from DECIMAL(38,9) to DECIMAL(5,2) which covers the observed range and precision.
  - name: dewp
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: Dew point ranges -9.94 to 73.94 with null_rate 0.0; DECIMAL(5,2) covers the
      observed min/max with two-decimal precision seen in samples.
  - name: humid
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: Humidity ranges 12.74 to 100.0 with null_rate 0.0 across 2178 distinct values;
      DECIMAL(5,2) fits the observed range.
  - name: wind_dir
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.016828 (219 nulls) with values 0.0-360.0 across 37 distinct values;
      retained nullable rather than imputed.
  - name: wind_speed
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate 0.000154 (2 nulls), max 1048.36058 requires higher precision than
      temp/dewp; retained nullable.
  - name: wind_gust
    logicalType: number
    physicalType: DECIMAL(10,5)
    required: false
    description: null_rate 0.745505 (9702 of 13014 rows null) makes this a sparsely populated
      column; retained nullable with no imputation, max 62.14212 justifies DECIMAL(10,5).
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: Precipitation ranges 0.0 to 1.06 across 50 distinct values with null_rate
      0.0; DECIMAL(5,2) covers the observed precision.
  - name: pressure
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: false
    description: null_rate 0.114953 (1496 nulls); range 983.8-1038.4 with 430 distinct values
      supports DECIMAL(6,2), retained nullable.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: 20 distinct_values listed from 0.0 to 10.0, null_rate 0.0; DECIMAL(4,2) covers
      the enumerated range.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: sample_values are consistently ISO-8601 formatted (e.g. 2013-01-01T06:00:00Z)
      across 4341 distinct values with null_rate 0.0; supports casting VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
