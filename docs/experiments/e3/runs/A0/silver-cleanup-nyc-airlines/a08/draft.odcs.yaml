apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference dimension of airline carriers, mapping each two-letter
    carrier code to its full legal airline name, intended to feed joins from flight or booking
    fact tables that only carry the carrier code.
  usage: Join downstream fact tables to this table on carrier to resolve the human-readable
    airline name; both carrier and name are populated for every row (null_rate 0.0) so no
    null-handling logic is required by consumers.
  limitations: The table is tiny (row_count 16) and was observed with zero duplicate rows
    and zero nulls in this profile snapshot, so no deduplication or null-tolerance logic was
    built in; consumers should be aware this cleanup reflects only the columns and values
    present in this single profiling run, and any newly added carriers would need re-profiling.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference dimension of airline carriers, mapping each
    two-letter carrier code to its full legal airline name, intended to feed joins from flight
    or booking fact tables that only carry the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'null_rate is 0.0 with 0 nulls, and distinct_count of 16 equals the table''s
      row_count of 16, so carrier is a two-letter IATA code that uniquely identifies each
      row (samples: 9E, AA, AS, DL, UA, WN).'
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with 0 nulls and distinct_count is 16, matching full airline
      legal names such as 'Delta Air Lines Inc.' and 'Southwest Airlines Co.' with no truncation
      markers observed.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
