apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference dataset mapping each IATA carrier code to its full
    legal airline name, intended to feed downstream flight and performance tables that need
    to resolve or display carrier identity.
  usage: Consumers should join on the carrier column to enrich carrier-coded records with
    carrier_name; no row filtering is required since the table is fully populated (null_rate
    0.0 on both columns) and free of exact duplicates.
  limitations: The bronze source is very small (row_count 16) and carries only a code and
    a name with no other carrier attributes such as country, alliance, or active status; the
    grain assumption (carrier uniquely identifies a row) is based on this single snapshot
    where distinct_count equals row_count, and should be re-verified if the source grows.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference dataset mapping each IATA carrier code to its
    full legal airline name, intended to feed downstream flight and performance tables that
    need to resolve or display carrier identity.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: carrier has null_rate 0.0 and null_count 0, with distinct_count 16 exactly
      matching the dataset's row_count of 16; distinct values like 'AA', 'DL', 'WN' are standard
      two-character IATA carrier codes, making this a reliable identifier.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: name has null_rate 0.0 and distinct_count 16 matching row_count 16, with
      values such as 'Delta Air Lines Inc.' and 'Southwest Airlines Co.' showing full legal
      carrier names; renamed from the generic 'name' to carrier_name to disambiguate it alongside
      the carrier code.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
