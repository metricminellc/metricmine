apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference dataset mapping each airline carrier's two-character
    code to its full legal name, intended to feed joins from flight or booking fact tables
    that only carry a carrier code.
  usage: Consumers should join on carrier_code to enrich fact tables with the human-readable
    airline_name; both columns are fully populated (null_rate 0.0) and the table has one row
    per carrier_code with no duplicates to filter.
  limitations: The profile covers only 16 rows and 16 distinct carrier codes as captured at
    a single extraction snapshot, so any new carrier codes introduced after this snapshot
    will not be represented until the source is re-profiled; no data quality issues were found
    to exclude beyond the dropped Airbyte metadata columns.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference dataset mapping each airline carrier's two-character
    code to its full legal name, intended to feed joins from flight or booking fact tables
    that only carry a carrier code.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across all 16 rows and distinct_count equals row_count (16
      of 16), with samples like 'AA', 'DL', 'UA' showing a two-character IATA carrier code;
      renamed from carrier to carrier_code for clarity as the business key.
  - name: airline_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 16 matching row_count 16, and sample
      values such as 'Delta Air Lines Inc.' and 'United Air Lines Inc.' show the full legal
      airline name; renamed from name to airline_name to avoid an ambiguous generic column
      name.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_nyc_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
