# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference dataset mapping two-letter airline carrier codes
    to their full legal airline names, intended to be joined against flight-level fact tables
    that record carrier codes.
  usage: Consumers should join on the carrier column to enrich any fact table that records
    a two-letter carrier code with the full airline name; both carrier and name are required
    and fully populated so no null handling is needed by downstream consumers.
  limitations: The profile shows no duplicate rows (duplicate_row_rate 0.0) and no nulls in
    either business column, so cleanup was limited to dropping the three Airbyte capture-metadata
    columns; the dataset is static at 16 rows as profiled and does not capture historical
    renames or mergers of carriers.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference dataset mapping two-letter airline carrier
    codes to their full legal airline names, intended to be joined against flight-level fact
    tables that record carrier codes.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and distinct_count is 16, matching the row_count of 16,
      with two-letter IATA-style codes such as AA, DL, UA, WN seen in the distinct_values;
      this is the natural identifier for each carrier.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 16 with full legal airline names such
      as 'Delta Air Lines Inc.' and 'Southwest Airlines Co.' present in distinct_values, so
      this is a fully populated descriptive attribute.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
