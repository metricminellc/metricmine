# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airlines
name: Silver airlines
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small static reference set mapping each two-letter airline carrier
    code to its full legal airline name, intended to feed joins from flight or booking fact
    tables that store only the carrier code.
  usage: Join downstream fact tables to this table on carrier to resolve a human-readable
    airline_name; both columns are fully populated (null_rate 0.0) and carrier is unique across
    all 16 rows, so no null-handling or dedupe logic is needed by consumers.
  limitations: The profile shows only 16 rows representing a fixed set of US carriers as of
    the extraction snapshot (2026-09-02T23:26:17); the table is not expected to grow and any
    new carrier code appearing in fact tables will not have a matching row here until this
    reference is refreshed.
schema:
- name: silver_airlines
  physicalName: silver_airlines
  logicalType: object
  physicalType: table
  description: This table is a small static reference set mapping each two-letter airline
    carrier code to its full legal airline name, intended to feed joins from flight or booking
    fact tables that store only the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across all 16 rows and distinct_count equals 16, matching
      the row_count of 16, so carrier is a two-letter IATA code that uniquely identifies each
      airline (e.g. 9E, AA, DL).
  - name: airline_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 16 matching carrier 1:1, with values
      like 'Delta Air Lines Inc.' and 'Southwest Airlines Co.'; renamed from the generic 'name'
      to 'airline_name' for clarity in a reference table consumed alongside other entities.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
