apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table is a small reference dimension mapping airline carrier IATA codes to
    their full legal airline names, intended to feed joins against flight-event or booking
    fact tables elsewhere in the warehouse.
  usage: Consumers should join downstream fact tables to this table on the carrier code to
    resolve human-readable airline names; both columns are fully populated so no null-filtering
    is required before joining.
  limitations: The dataset is very small (16 rows) and purely static reference data with no
    temporal or versioning columns, so carrier code reassignments or airline renames over
    time cannot be tracked from this table alone; pipeline capture metadata was dropped entirely
    as it carried no business value.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: This table is a small reference dimension mapping airline carrier IATA codes
    to their full legal airline names, intended to feed joins against flight-event or booking
    fact tables elsewhere in the warehouse.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 16 rows and distinct_count is 16, with distinct_values
      showing two-letter IATA carrier codes such as AA, DL, UA, WN.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_count is 16, with distinct_values showing full
      airline legal names such as 'Delta Air Lines Inc.' and 'Southwest Airlines Co.'.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
