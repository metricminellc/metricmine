# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:39:04.649059+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds cleaned 2013 NYC-area flight records (one row per scheduled flight
    instance) for downstream analytics on departure and arrival performance, delay patterns,
    and route volumes.
  usage: Join on the declared grain (year, month, day, carrier, flight, origin, dest) when
    combining with other flight-related tables, and treat dep_time, sched_dep_time, arr_time,
    and sched_arr_time as HHMM-encoded integers (not true clock times) that may need further
    parsing by the consumer; filter or account for nulls in dep_time, dep_delay, arr_time,
    arr_delay, air_time, and tailnum before aggregating delay metrics.
  limitations: Roughly 2.9%-3.3% of rows lack dep_time, dep_delay, arr_time, arr_delay, and
    air_time (null_rate 0.029388-0.032981 on a 166158-row table), consistent with cancelled
    or unrecorded flights, and these nulls were retained rather than resolved; tailnum is
    missing in 0.9154% of rows; the HHMM-style time columns were not converted to true time
    types because their value ranges (up to 2400.0) are not valid clock values.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: This table holds cleaned 2013 NYC-area flight records (one row per scheduled
    flight instance) for downstream analytics on departure and arrival performance, delay
    patterns, and route volumes.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Single distinct value 2013.0 with null_rate 0.0 and min=max=2013.0, so an
      integer cast with NOT NULL is safe.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Distinct_count 6 with values 1.0-6.0 and null_rate 0.0, all integral, so
      cast DECIMAL(38,9) to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Distinct_count 31, min 1.0 max 31.0, null_rate 0.0, all sample values integral
      so cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) with min 1.0 max 2400.0 encoded as HHMM;
      retained nullable since dep_time is absent for cancelled flights.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 969, min 500.0 max 2359.0, HHMM-encoded schedule
      always present, cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 matching dep_time nulls, min -33.0 max 1301.0, integral
      minutes of delay, retained nullable.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.0307 (5101 nulls), min 1.0 max 2400.0 HHMM-encoded, retained
      nullable for flights lacking recorded arrival.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 1134, min 1.0 max 2359.0, always populated
      so cast to INTEGER NOT NULL.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls), min -86.0 max 1272.0, retained nullable
      since unavailable when arrival is unrecorded.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate 0.0, distinct_count 16 with a closed set of two-letter codes like
      9E, AA, DL, so kept as required VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate 0.0, distinct_count 2994, min 1.0 max 8500.0, all integral flight
      numbers, cast to INTEGER NOT NULL.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.009154 (1521 nulls), distinct_count 3825 with alphanumeric samples
      like N0EGMQ and N10156, kept nullable VARCHAR.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate 0.0, distinct_count 3 with closed set EWR, JFK, LGA, kept as required
      VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: null_rate 0.0, distinct_count 100 with airport codes like ABQ, ACK, ALB,
      kept as required VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls, matching arr_delay), min 20.0 max 695.0,
      integral minutes, retained nullable.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 203, min 80.0 max 4983.0, integral miles, cast
      to INTEGER NOT NULL.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 19 with values 5.0-23.0, integral, cast to
      INTEGER NOT NULL.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0, distinct_count 60, min 0.0 max 59.0, integral, cast to INTEGER
      NOT NULL.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate 0.0, distinct_count 3439, samples like 2013-01-01T10:00:00Z are
      consistently ISO-8601 shaped, so cast VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin,
      dest) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin, dest
        FROM silver.silver_flights
        GROUP BY year, month, day, carrier, flight, origin, dest
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
