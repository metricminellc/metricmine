apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights provides cleaned, typed flight-level records for the 2013 NYC-area
    flights dataset (departures from EWR, JFK, and LGA), feeding downstream analytics on flight
    delays, schedules, carriers, and travel patterns.
  usage: Consumers should join or filter on the declared grain (year, month, day, carrier,
    flight, origin, sched_dep_time) to obtain one record per scheduled departure, and must
    handle nulls deliberately in dep_time, dep_delay, arr_time, arr_delay, and air_time (roughly
    2.9% to 3.3% null), which represent flights without recorded actual timing (e.g. cancellations);
    hhmm-encoded time columns (dep_time, sched_dep_time, arr_time, sched_arr_time) remain
    integers, not clock/timestamp types, and require hour/minute decoding by the consumer
    if needed.
  limitations: This cleanup does not resolve the roughly 2.9%-3.3% null rates in actual departure/arrival
    times and delays, nor the 0.9% null rate in tailnum; these are retained as nulls rather
    than imputed or dropped. The hhmm-encoded time fields are not cast to TIME/TIMESTAMP because
    values up to 2400 are not valid clock times, so any time-of-day derivation is left to
    downstream consumers. No duplicate rows were found (duplicate_row_rate 0.0), so no deduplication
    logic was applied.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights provides cleaned, typed flight-level records for the 2013
    NYC-area flights dataset (departures from EWR, JFK, and LGA), feeding downstream analytics
    on flight delays, schedules, carriers, and travel patterns.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has distinct_count 1 with min=max=2013.0 and null_rate 0.0, a single-year
      integral value safely cast from DECIMAL(38,9) to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has distinct_count 6 with values 1.0 through 6.0, all integral and
      null_rate 0.0, safely cast to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day has distinct_count 31, min 1.0 max 31.0, integral samples (1.0-10.0 shown)
      and null_rate 0.0, cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time ranges 1.0 to 2400.0 (an hhmm-encoded clock value, not a true timestamp
      since 2400 is invalid as TIME) with null_rate 0.029388 (4883 nulls), likely cancelled
      flights; retained nullable and cast to INTEGER rather than TIMESTAMP.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: sched_dep_time ranges 500.0 to 2359.0, integral samples, null_rate 0.0, cast
      to INTEGER; kept as hhmm-encoded integer rather than TIME given the encoding.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay ranges -33.0 to 1301.0 with integral samples and null_rate 0.029388
      (4883 nulls), matching dep_time's missingness; cast to INTEGER and retained nullable.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time ranges 1.0 to 2400.0, hhmm-encoded, with null_rate 0.0307 (5101
      nulls) for flights without recorded arrival; cast to INTEGER, retained nullable.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time ranges 1.0 to 2359.0, integral, null_rate 0.0, cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay ranges -86.0 to 1272.0, integral samples, null_rate 0.032981 (5480
      nulls) aligned with arr_time/air_time missingness; cast to INTEGER, retained nullable.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has distinct_count 16 with a fixed set of two-letter codes (9E, AA,
      AS, ..., YV) and null_rate 0.0, kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight ranges 1.0 to 8500.0 with distinct_count 2994, integral samples, null_rate
      0.0, cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has distinct_count 3825 alphanumeric codes (e.g. D942DN, N0EGMQ)
      with null_rate 0.009154 (1521 nulls); kept as VARCHAR and retained nullable.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin has distinct_count 3 (EWR, JFK, LGA) and null_rate 0.0, kept as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has distinct_count 100 three-letter airport codes (ABQ, ACK, ALB, ...)
      and null_rate 0.0, kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time ranges 20.0 to 695.0 minutes, integral samples, null_rate 0.032981
      (5480 nulls) matching arr_delay missingness; cast to INTEGER, retained nullable.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance ranges 80.0 to 4983.0 miles with integral samples (80.0, 94.0, 96.0...)
      and null_rate 0.0, cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has distinct_count 19, values 5.0 to 23.0, integral, null_rate 0.0,
      cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute ranges 0.0 to 59.0, integral samples, null_rate 0.0, cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour samples are consistently ISO-8601 formatted (e.g. 2013-01-01T10:00:00Z)
      with distinct_count 3439 and null_rate 0.0, cast from VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin,
      sched_dep_time) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
