# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:36:28.620596+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table provides cleaned, typed flight-level records for NYC-area departures
    in 2013, feeding downstream analytics on carrier performance, delays, and routes.
  usage: Consumers should treat dep_time, arr_time, dep_delay, arr_delay, and air_time as
    nullable fields that indicate cancelled or incomplete flight records; filter or handle
    these nulls deliberately rather than assuming every flight has complete timing data. The
    declared grain (year, month, day, carrier, flight, sched_dep_time) should be used for
    joins and uniqueness checks.
  limitations: Roughly 3% of rows are missing actual departure and arrival timing data (null_rate
    0.029388 to 0.032981), consistent with cancelled or diverted flights, and these gaps were
    not imputed. tailnum is missing for 0.9% of rows (null_rate 0.009154) and was retained
    as-is. No exact duplicate rows were found (duplicate_row_rate 0.0), so no row-level dedupe
    was necessary.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This table provides cleaned, typed flight-level records for NYC-area departures
    in 2013, feeding downstream analytics on carrier performance, delays, and routes.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 and the single distinct_value 2013.0 is integral, so DECIMAL(38,9)
      safely casts to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: null_rate is 0.0 with distinct_count 6 and distinct_values 1.0-6.0, all integral,
      supporting a cast to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: null_rate is 0.0, distinct_count 31, min 1.0 max 31.0, and sample_values
      1.0-10.0 are all whole numbers, so cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) likely reflects cancelled flights with no
      departure; samples 1.0-2400.0 are integral HHMM codes, so cast to INTEGER and retain
      nulls.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: null_rate is 0.0, distinct_count 969, samples 500.0-530.0 are integral HHMM
      scheduled times, so cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.029388 (4883 nulls) matches dep_time's null pattern for flights
      that never departed; samples -33.0 to -19.0 are integral minutes, so cast to INTEGER.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.0307 (5101 nulls) likely reflects cancelled or diverted flights;
      samples 1.0-10.0 are integral HHMM codes, so cast to INTEGER.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 1134, samples 1.0-10.0 are integral, so
      cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls) aligns with flights lacking an arrival record;
      samples -86.0 to -67.0 are integral minutes, so cast to INTEGER.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: null_rate is 0.0 and distinct_count 16 with distinct_values like 9E, AA,
      DL confirms a small fixed set of two-letter carrier codes kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: null_rate is 0.0, distinct_count 2994, min 1.0 max 8500.0, samples 1.0-10.0
      are integral flight numbers, so cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.009154 (1521 nulls) indicates missing tail numbers for some flights;
      samples like D942DN and N0EGMQ confirm alphanumeric identifiers kept as VARCHAR.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 and distinct_values EWR, JFK, LGA show the three NYC origin
      airports, kept as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with distinct_count 100 and samples like ABQ, ACK, ALB showing
      three-letter airport codes, kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.032981 (5480 nulls) matches arr_delay's missing pattern for incomplete
      flights; samples 20.0-29.0 are integral minutes, so cast to INTEGER.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, min 80.0 max 4983.0, samples 80.0-185.0 are integral miles,
      so cast to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 19, distinct_values 5.0-23.0 are integral
      hour-of-day values, so cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0, distinct_count 60, min 0.0 max 59.0, samples 0.0-9.0 are
      integral minute-of-hour values, so cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 and all ten sample_values share the consistent ISO8601 shape
      2013-01-01T10:00:00Z through 2013-01-01T19:00:00Z, supporting a cast to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, sched_dep_time)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
