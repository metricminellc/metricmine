# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:35:19.011871+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights cleans the bronze nyc_flights capture of 2013 domestic flight
    departures from New York airports, casting decimal-encoded numeric fields to integers
    and standardizing the time_hour timestamp, to feed downstream flight-delay and on-time-performance
    analytics.
  usage: Consumers should join or filter on the declared grain (year, month, day, carrier,
    flight, origin) for per-flight analysis, and must deliberately handle nulls in dep_time,
    dep_delay, arr_time, arr_delay, air_time, and tailnum, which represent cancelled or unresolved
    flight legs rather than data-entry gaps.
  limitations: Cleanup could not resolve the roughly 2.9%-3.3% null rates in dep_time, dep_delay,
    arr_time, arr_delay, and air_time, nor the 0.9% null rate in tailnum; these are retained
    as nulls rather than imputed. The dataset's duplicate_row_rate of 0.0 means no deduplication
    logic was applied.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights cleans the bronze nyc_flights capture of 2013 domestic flight
    departures from New York airports, casting decimal-encoded numeric fields to integers
    and standardizing the time_hour timestamp, to feed downstream flight-delay and on-time-performance
    analytics.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has null_rate 0.0 and a single distinct value 2013.0; cast DECIMAL(38,9)
      to INTEGER since the value is integral.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has null_rate 0.0 with distinct_values 1.0 through 6.0, all integral;
      cast to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day has null_rate 0.0, min 1.0 and max 31.0 with integral sample_values 1.0-10.0;
      cast to INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time has null_rate 0.029388 (4883 nulls), plausibly cancelled flights,
      with integral sample_values 1.0-10.0 and max 2400.0 as HHMM encoding; cast to INTEGER
      and retain nulls.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time has null_rate 0.0 with min 500.0 and max 2359.0, integral
      HHMM-style samples; cast to INTEGER.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay has null_rate 0.029388 (4883 nulls) matching dep_time's missing
      pattern, with integral values from -33.0 to 1301.0; cast to INTEGER and retain nulls.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time has null_rate 0.0307 (5101 nulls), integral samples 1.0-10.0 with
      max 2400.0; cast to INTEGER and retain nulls for unresolved arrivals.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time has null_rate 0.0 with min 1.0 and max 2359.0, integral samples;
      cast to INTEGER.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay has null_rate 0.032981 (5480 nulls), consistent with cancelled
      or diverted flights, with integral values from -86.0 to 1272.0; cast to INTEGER and
      retain nulls.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has null_rate 0.0 with 16 distinct two-letter codes such as 9E, AA,
      DL, UA; keep as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight has null_rate 0.0 with integral values ranging 1.0 to 8500.0 (sample
      1.0-10.0); cast to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has null_rate 0.009154 (1521 nulls) and 3825 distinct alphanumeric
      codes such as D942DN and N0EGMQ; keep as VARCHAR and retain nulls as sparsely missing
      tail numbers.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin has null_rate 0.0 with exactly 3 distinct values EWR, JFK, LGA; keep
      as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has null_rate 0.0 with 100 distinct airport codes (sample ABQ, ACK,
      ALB...); keep as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time has null_rate 0.032981 (5480 nulls) matching arr_delay's missing
      pattern, with integral minutes from 20.0 to 695.0; cast to INTEGER and retain nulls.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance has null_rate 0.0 with integral miles from 80.0 to 4983.0; cast
      to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has null_rate 0.0 with distinct_values 5.0 through 23.0, all integral;
      cast to INTEGER.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute has null_rate 0.0 with min 0.0 and max 59.0, integral sample_values
      0.0-9.0; cast to INTEGER.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour has null_rate 0.0 with ISO8601 sample_values like 2013-01-01T10:00:00Z,
      consistently timestamp-shaped; cast VARCHAR to TIMESTAMP.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
