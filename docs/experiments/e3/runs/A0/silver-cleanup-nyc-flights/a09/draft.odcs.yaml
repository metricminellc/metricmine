# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:43:13.078324+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This silver table cleans the bronze nyc_flights capture of 2013 NYC-area flight
    departures, casting decimal-encoded numeric fields to integers, typing time_hour as a
    timestamp, and removing Airbyte capture metadata, to feed downstream flight-delay and
    on-time-performance analysis.
  usage: Consumers should treat dep_time, dep_delay, arr_time, arr_delay, and air_time as
    nullable (roughly 3% null each) and decide whether to filter those rows before computing
    delay statistics; dep_time, sched_dep_time, arr_time, and sched_arr_time remain in HHMM
    integer format rather than true time-of-day and should be combined with time_hour or year/month/day/hour/minute
    for timestamp reconstruction.
  limitations: Cleanup did not resolve tailnum nulls (null_rate 0.009154, 1521 rows) or the
    roughly 3% nulls in dep_time, dep_delay, arr_time, arr_delay, and air_time; the declared
    grain (year, month, day, carrier, flight, origin) was not verified against the warehouse
    for true row uniqueness and should be checked before approval, and the HHMM-encoded time
    integer columns were not converted to true time types since the profile gives no evidence
    to safely reconstruct timestamps from them.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: This silver table cleans the bronze nyc_flights capture of 2013 NYC-area flight
    departures, casting decimal-encoded numeric fields to integers, typing time_hour as a
    timestamp, and removing Airbyte capture metadata, to feed downstream flight-delay and
    on-time-performance analysis.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: year has distinct_count 1 with the single value 2013.0 and null_rate 0.0,
      so it is a constant integer safely cast from DECIMAL(38,9).
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: month has 6 distinct whole-number values (1.0-6.0) with null_rate 0.0, consistent
      with an integer month field.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: day ranges 1.0-31.0 across 31 distinct values with null_rate 0.0, matching
      a calendar day integer.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_time ranges 1.0-2400.0 in HHMM form with null_rate 0.029388 (4883 nulls),
      so it is retained nullable rather than imputed, likely reflecting cancelled flights.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_dep_time ranges 500.0-2359.0 with null_rate 0.0, an integer HHMM scheduled
      departure time.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: dep_delay ranges -33.0 to 1301.0 with null_rate 0.029388 (4883 nulls), matching
      dep_time's null count, retained nullable.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_time ranges 1.0-2400.0 with null_rate 0.0307 (5101 nulls), retained nullable
      for cancelled or diverted flights.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: sched_arr_time ranges 1.0-2359.0 with null_rate 0.0.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: arr_delay ranges -86.0 to 1272.0 with null_rate 0.032981 (5480 nulls), retained
      nullable.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: carrier has 16 distinct two-letter codes (9E, AA, AS, ... YV) with null_rate
      0.0.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: flight ranges 1.0-8500.0 across 2994 distinct values with null_rate 0.0.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: tailnum has 3825 distinct values with null_rate 0.009154 (1521 nulls); samples
      like 'D942DN' and 'N0EGMQ' show a tail-number format, retained nullable.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: origin has 3 distinct airport codes (EWR, JFK, LGA) with null_rate 0.0.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: dest has 100 distinct airport codes (e.g. ABQ, ACK, ALB) with null_rate 0.0.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: air_time ranges 20.0-695.0 minutes with null_rate 0.032981 (5480 nulls, matching
      arr_delay), retained nullable.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distance ranges 80.0-4983.0 with null_rate 0.0.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: hour has 19 distinct values from 5.0-23.0 with null_rate 0.0.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: minute ranges 0.0-59.0 across 60 distinct values with null_rate 0.0.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: time_hour samples are uniformly ISO-8601 formatted (e.g. '2013-01-01T10:00:00Z')
      with null_rate 0.0, supporting a strict TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
