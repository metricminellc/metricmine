# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T16:41:17.209295+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights cleans the bronze Airbyte landing of the 2013 NYC-origin flights
    dataset into one row per scheduled flight leg, with pipeline metadata removed and numeric
    fields cast to their natural integer and timestamp types, for downstream analytics on
    departure and arrival delays, routes, and carriers.
  usage: Join or group on the declared grain (year, month, day, carrier, flight, origin, dest)
    to treat each row as a distinct flight leg; dep_time, dep_delay, arr_time, arr_delay,
    and air_time are nullable (~3% null) and consumers must decide deliberately whether to
    filter these out or treat them as cancelled/diverted flights before computing delay aggregates;
    time_hour is a TIMESTAMP suitable for time-series joins.
  limitations: Cleanup dropped all three Airbyte metadata columns and performed no deduplication
    since duplicate_row_rate is 0.0; nulls in dep_time, dep_delay, arr_time, arr_delay (null_rate
    ~0.03), air_time (0.032981), and tailnum (0.009154) were retained rather than resolved,
    and the declared grain's uniqueness beyond the zero observed duplicate rate has not been
    independently verified against the full warehouse.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights cleans the bronze Airbyte landing of the 2013 NYC-origin
    flights dataset into one row per scheduled flight leg, with pipeline metadata removed
    and numeric fields cast to their natural integer and timestamp types, for downstream analytics
    on departure and arrival delays, routes, and carriers.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: distinct_count is 1 with the single value 2013.0 and null_rate 0.0, so the
      DECIMAL(38,9) landing type is safely cast to an integral year.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: distinct_values are the six whole numbers 1.0 through 6.0 with null_rate
      0.0, supporting an integer cast.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: min 1.0, max 31.0, distinct_count 31, sample_values are whole numbers, and
      null_rate is 0.0.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min 1.0 max 2400.0 with integral HHMM-style samples supports an integer cast,
      but null_count 4883 (null_rate 0.029388) likely marks cancelled flights so nulls are
      retained rather than imputed.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 500.0 max 2359.0, distinct_count 969, sample_values all integral, and
      null_rate is 0.0.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min -33.0 max 1301.0 with integral samples supports an integer cast; null_count
      4883 (null_rate 0.029388) matches dep_time's missingness pattern for likely cancellations.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min 1.0 max 2400.0, distinct_count 1392, integral samples; null_count 5101
      (null_rate 0.0307) retained as nullable since nulls likely indicate uncompleted flights.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 1.0 max 2359.0, distinct_count 1134, integral samples, and null_rate
      is 0.0.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min -86.0 max 1272.0 with integral samples; null_count 5480 (null_rate 0.032981)
      aligns with air_time's missingness, retained nullable.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: distinct_count 16 with a short enumerated set of two-letter codes (9E, AA,
      AS, ... YV) and null_rate 0.0.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: min 1.0 max 8500.0, distinct_count 2994, integral samples, and null_rate
      is 0.0.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: alphanumeric tail-number samples like D942DN and N0EGMQ confirm a string
      identifier; null_count 1521 (null_rate 0.009154) is retained nullable rather than imputed.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: distinct_count 3 with values EWR, JFK, LGA and null_rate 0.0.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: distinct_count 100 with three-letter airport-code samples like ABQ, ACK,
      ALB and null_rate 0.0.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min 20.0 max 695.0 with integral samples; null_count 5480 (null_rate 0.032981)
      matches arr_delay's missingness, retained as nullable minutes of flight time.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 80.0 max 4983.0, distinct_count 203, integral samples, and null_rate
      is 0.0.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: distinct_values run 5.0 through 23.0, null_rate is 0.0, integral scheduled-hour
      values.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: min 0.0 max 59.0, distinct_count 60, integral samples, and null_rate 0.0.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: all sample_values are ISO-8601 timestamps such as 2013-01-01T10:00:00Z, distinct_count
      3439, and null_rate is 0.0, supporting a TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin,
      dest) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin, dest
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin, dest
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
