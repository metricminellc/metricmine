# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:15:31.848504+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airport_weather
name: Silver airport weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds hourly weather observations for three NYC-area airports (EWR,
    JFK, LGA) from January through June 2013, combining atmospheric measurements (temperature,
    dewpoint, humidity, wind, precipitation, pressure, visibility) with denormalized airport
    dimension attributes (name, municipality, elevation, longest runway).
  usage: Read at the grain of one row per airport per UTC hour (airport_code, observed_hour_utc).
    Consumers must handle nulls in wind_dir_degrees, wind_speed_mph, wind_gust_mph (sparse,
    up to 74.6% null), and pressure_mb, since these were not always recorded. Airport dimension
    columns repeat per row rather than being normalized into a separate table.
  limitations: The profile could only support the declared grain through row-count arithmetic
    (3 airports × 4341 UTC hours ≈ 13014 rows) and a 0.0 duplicate_row_rate; a deterministic
    grain measurement should confirm it before enforcement. wind_gust_mph is null in 74.6%
    of rows, pressure_mb in 11.5%, wind_dir_degrees in 1.7%, and wind_speed_mph in 0.02%,
    so these columns carry no guarantee of presence. captured_at is not flagged is_airbyte_metadata
    in the profile but its narrow 3-value range of timestamps seconds apart suggests it is
    a pipeline ingestion marker rather than an observed attribute, and a reviewer should confirm
    its treatment. visibility_miles values appear rounded or capped to a fixed set of 20 values,
    which may reflect sensor reporting granularity rather than a true closed business category.
schema:
- name: silver_airport_weather
  physicalName: silver_airport_weather
  logicalType: object
  physicalType: table
  description: 'One row per distinct (airport_code, observed_hour_utc). The 2 grain columns
    are flagged primaryKey so sync generates the composite uniqueness test; that generated
    test is warn-severity by tool design at datacontract-cli 1.0.12, and the error-severity
    grain rule below is the enforcing twin (rule 5: uniqueness as a test, never a trusted
    constraint).'
  dataGranularityDescription: One row per distinct (airport_code, observed_hour_utc).
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Three-letter code identifying the NYC-area airport (EWR, JFK, or LGA) where
      the weather was observed.
    quality:
    - type: sql
      description: airport_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code IS NULL
      mustBe: 0
    - type: sql
      description: airport_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: UTC timestamp for the hourly weather observation.
    quality:
    - type: sql
      description: observed_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_utc IS NULL
      mustBe: 0
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    description: Local calendar date of the observation.
    quality:
    - type: sql
      description: observed_date_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_date_local IS NULL
      mustBe: 0
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local hour-of-day (0-23) of the observation.
    quality:
    - type: sql
      description: observed_hour_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local IS NULL
      mustBe: 0
    - type: sql
      description: observed_hour_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local < 0
      mustBe: 0
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Air temperature in degrees Fahrenheit at observation time.
    quality:
    - type: sql
      description: temp_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE temp_f IS NULL
      mustBe: 0
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Dew point temperature in degrees Fahrenheit.
    quality:
    - type: sql
      description: dewpoint_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE dewpoint_f IS NULL
      mustBe: 0
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Relative humidity percentage at observation time.
    quality:
    - type: sql
      description: humidity_pct is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE humidity_pct IS NULL
      mustBe: 0
    - type: sql
      description: humidity_pct is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE humidity_pct < 0
      mustBe: 0
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Wind direction in compass degrees (0-360).
    quality:
    - type: sql
      description: wind_dir_degrees is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_dir_degrees < 0
      mustBe: 0
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sustained wind speed in miles per hour.
    quality:
    - type: sql
      description: wind_speed_mph is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_speed_mph < 0
      mustBe: 0
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Wind gust speed in miles per hour, recorded only when a gust occurred.
    quality:
    - type: sql
      description: wind_gust_mph is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_gust_mph < 0
      mustBe: 0
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Precipitation accumulated in inches at observation time.
    quality:
    - type: sql
      description: precip_inches is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE precip_inches IS NULL
      mustBe: 0
    - type: sql
      description: precip_inches is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE precip_inches < 0
      mustBe: 0
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Barometric pressure in millibars.
    quality:
    - type: sql
      description: pressure_mb is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE pressure_mb < 0
      mustBe: 0
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Visibility distance in miles, reported at a limited set of rounded values.
    quality:
    - type: sql
      description: visibility_miles is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles IS NULL
      mustBe: 0
    - type: sql
      description: visibility_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles < 0
      mustBe: 0
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the airport.
    quality:
    - type: sql
      description: airport_name is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_name IS NULL
      mustBe: 0
    - type: sql
      description: airport_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_name NOT IN ('John F. Kennedy International Airport', 'LaGuardia Airport', 'Newark Liberty International Airport')
      mustBe: 0
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Municipality where the airport is located.
    quality:
    - type: sql
      description: airport_municipality is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_municipality IS NULL
      mustBe: 0
    - type: sql
      description: airport_municipality stays inside the accepted value set
      severity: error
      query: |
