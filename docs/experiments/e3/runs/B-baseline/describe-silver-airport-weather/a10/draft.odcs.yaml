# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:17:16.320388+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airport_weather
name: Silver airport weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds hourly surface weather observations (temperature, dewpoint, humidity,
    wind, pressure, precipitation, and visibility) for the three New York City area airports
    (EWR, JFK, LGA) from January through June 2013, joined with static airport reference attributes
    (name, municipality, elevation, longest runway).
  usage: 'Consumers should read the table at its airport_code, observed_hour_utc grain: one
    row per airport per UTC hour. Expect wind_gust_mph to be populated only about 25% of the
    time and pressure_mb and wind_dir_degrees to carry smaller but nonzero null rates; treat
    nulls in those columns as ''not recorded'' rather than zero.'
  limitations: The profile cannot fully confirm the grain beyond row-count and duplicate-row-rate
    evidence; the airport_code/observed_hour_utc pairing is the most defensible candidate
    but remains unverified until measured against the warehouse. wind_gust_mph is missing
    for roughly 75% of rows and pressure_mb for roughly 11%. The captured_at column is not
    flagged as pipeline metadata in the profile, but its three near-identical timestamps suggest
    it is an ingestion load timestamp rather than business data; it is retained as profiled
    pending reviewer confirmation.
schema:
- name: silver_airport_weather
  physicalName: silver_airport_weather
  logicalType: object
  physicalType: table
  description: 'One row per distinct (airport_code, observed_hour_utc). The 2 grain columns
    are flagged primaryKey so sync generates the composite uniqueness test; that generated
    test is warn-severity by tool design at datacontract-cli 1.0.12, and the error-severity
    grain rule below is the enforcing twin (rule 5: uniqueness as a test, never a trusted
    constraint).'
  dataGranularityDescription: One row per distinct (airport_code, observed_hour_utc).
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Three-letter IATA code identifying the NYC-area airport the weather observation
      was recorded at.
    quality:
    - type: sql
      description: airport_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code IS NULL
      mustBe: 0
    - type: sql
      description: airport_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: UTC timestamp of the hourly weather observation.
    quality:
    - type: sql
      description: observed_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_utc IS NULL
      mustBe: 0
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    description: Local calendar date of the observation, used for daily rollups.
    quality:
    - type: sql
      description: observed_date_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_date_local IS NULL
      mustBe: 0
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local hour of day (0-23) the observation corresponds to.
    quality:
    - type: sql
      description: observed_hour_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local IS NULL
      mustBe: 0
    - type: sql
      description: observed_hour_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local < 0
      mustBe: 0
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Air temperature in degrees Fahrenheit at observation time.
    quality:
    - type: sql
      description: temp_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE temp_f IS NULL
      mustBe: 0
    - type: sql
      description: temp_f is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE temp_f < 0
      mustBe: 0
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Dew point temperature in degrees Fahrenheit.
    quality:
    - type: sql
      description: dewpoint_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE dewpoint_f IS NULL
      mustBe: 0
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Relative humidity percentage at observation time.
    quality:
    - type: sql
      description: humidity_pct is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE humidity_pct IS NULL
      mustBe: 0
    - type: sql
      description: humidity_pct is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE humidity_pct < 0
      mustBe: 0
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Wind direction in compass degrees (0-360).
    quality:
    - type: sql
      description: wind_dir_degrees is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_dir_degrees < 0
      mustBe: 0
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sustained wind speed in miles per hour.
    quality:
    - type: sql
      description: wind_speed_mph is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_speed_mph < 0
      mustBe: 0
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Wind gust speed in miles per hour, recorded only when a gust occurred.
    quality:
    - type: sql
      description: wind_gust_mph is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_gust_mph < 0
      mustBe: 0
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Hourly precipitation total in inches.
    quality:
    - type: sql
      description: precip_inches is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE precip_inches IS NULL
      mustBe: 0
    - type: sql
      description: precip_inches is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE precip_inches < 0
      mustBe: 0
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Barometric pressure in millibars.
    quality:
    - type: sql
      description: pressure_mb is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE pressure_mb < 0
      mustBe: 0
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Visibility distance in miles, reported at discrete standard increments.
    quality:
    - type: sql
      description: visibility_miles is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles IS NULL
      mustBe: 0
    - type: sql
      description: visibility_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles < 0
      mustBe: 0
    - type: sql
      description: visibility_miles stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles NOT IN ('0.0', '0.06', '0.12', '0.25', '0.5', '0.75', '1.0', '1.25', '1.5', '1.75', '2.0', '2.5', '3.0', '4.0', '5.0', '6.0', '7.0', '8.0', '9.0', '10.0')
      mustBe: 0
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the airport corresponding to airport_code.
    quality:
    - type: sql
      description: airport_name is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_name IS NULL
      mustBe: 0
    - type: sql
      description: airport_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_name NOT IN ('John F. Kennedy International Airport', 'LaGuardia Airport', 'Newark Liberty International Airport')
      mustBe: 0
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Municipality where the airport is located.
    quality:
    - type: sql
      description: airport_municipality is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_municipality IS NULL
      mustBe: 0
    - type: sql
      description: airport_municipality stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_municipality NOT IN ('New York', 'Newark')
      mustBe: 0
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Airport elevation above sea level in feet.
    quality:
    - type: sql
      description: airport_elevation_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_elevation_ft IS NULL
      mustBe: 0
    - type: sql
      description: airport_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_elevation_ft < 0
      mustBe: 0
    - type: sql
      description: airport_elevation_ft stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_elevation_ft NOT IN ('13', '18', '21')
      mustBe: 0
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Length of the airport's longest runway in feet.
    quality:
    - type: sql
      description: airport_longest_runway_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft IS NULL
      mustBe: 0
    - type: sql
      description: airport_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft < 0
      mustBe: 0
    - type: sql
      description: airport_longest_runway_ft stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft NOT IN ('7002', '11000', '14511')
      mustBe: 0
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Timestamp recorded when this row was captured by the ingestion pipeline.
    quality:
    - type: sql
      description: captured_at is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE captured_at IS NULL
      mustBe: 0
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (airport_code, observed_hour_utc) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT airport_code, observed_hour_utc
        FROM silver.silver_airport_weather
        GROUP BY airport_code, observed_hour_utc
        HAVING COUNT(*) > 1
      )
    mustBe: 0
