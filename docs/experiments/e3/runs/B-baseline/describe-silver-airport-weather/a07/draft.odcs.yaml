# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airport_weather
name: Silver airport weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_airport_weather holds hourly weather observations for three NYC-area airports
    (EWR, JFK, LGA) from January through June 2013, with each row capturing one airport's
    atmospheric conditions at one UTC hour alongside static airport reference attributes.
  usage: Read the table at the grain of one row per (airport_code, observed_hour_utc); join
    observed_date_local and observed_hour_local for local-time reporting. Consumers must handle
    nulls in wind_dir_degrees, wind_speed_mph, wind_gust_mph (the sparsest field at 74.6%
    null), and pressure_mb (11.5% null), and should expect airport_name, airport_municipality,
    airport_elevation_ft, and airport_longest_runway_ft to repeat identically across all rows
    sharing an airport_code.
  limitations: The profile shows row-count arithmetic consistent with an (airport_code, observed_hour_utc)
    grain (13014 rows versus an expected 13023 from 3 airports times 4341 hours) and a 0.0
    duplicate_row_rate on whole rows, but a deterministic grain measurement has not yet confirmed
    no duplicate key pairs. wind_gust_mph, pressure_mb, wind_dir_degrees, and wind_speed_mph
    carry nontrivial null rates limiting their completeness. captured_at has only 3 distinct
    values clustered within seconds, suggesting a pipeline load timestamp rather than domain
    data; reviewers should confirm whether it belongs in the contract despite is_airbyte_metadata
    reading false for every column in this profile.
schema:
- name: silver_airport_weather
  physicalName: silver_airport_weather
  logicalType: object
  physicalType: table
  description: 'One row per distinct (airport_code, observed_hour_utc). The 2 grain columns
    are flagged primaryKey so sync generates the composite uniqueness test; that generated
    test is warn-severity by tool design at datacontract-cli 1.0.12, and the error-severity
    grain rule below is the enforcing twin (rule 5: uniqueness as a test, never a trusted
    constraint).'
  dataGranularityDescription: One row per distinct (airport_code, observed_hour_utc).
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Three-letter code identifying the NYC-area airport (EWR, JFK, or LGA) where
      the observation was taken.
    quality:
    - type: sql
      description: airport_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code IS NULL
      mustBe: 0
    - type: sql
      description: airport_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: UTC timestamp of the hourly weather observation.
    quality:
    - type: sql
      description: observed_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_utc IS NULL
      mustBe: 0
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    description: Local calendar date of the observation.
    quality:
    - type: sql
      description: observed_date_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_date_local IS NULL
      mustBe: 0
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local hour of day (0-23) of the observation.
    quality:
    - type: sql
      description: observed_hour_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local IS NULL
      mustBe: 0
    - type: sql
      description: observed_hour_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local < 0
      mustBe: 0
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Air temperature in degrees Fahrenheit at observation time.
    quality:
    - type: sql
      description: temp_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE temp_f IS NULL
      mustBe: 0
    - type: sql
      description: temp_f is never negative
