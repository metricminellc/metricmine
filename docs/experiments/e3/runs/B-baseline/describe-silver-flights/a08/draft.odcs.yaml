# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:52:44.552462+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds one row per scheduled commercial flight departing New York-area
    airports (EWR, JFK, LGA) during the profiled period, combining flight schedule and outcome
    fields with joined carrier, aircraft, and airport reference attributes.
  usage: Consumers should read the table at the grain of one row per flight_date, carrier_code,
    and flight_number combination; delay, actual-time, and aircraft/destination-detail columns
    carry nontrivial null rates and must be handled as optional, and sign-bearing delay columns
    can be legitimately negative.
  limitations: The declared grain is inferred from distinct-count arithmetic and a 0.0 duplicate_row_rate,
    not from a deterministic key constraint, and awaits warehouse-level grain measurement;
    aircraft and destination-detail columns have null rates near 16-18% and 2% respectively
    reflecting incomplete reference joins; captured_at is a pipeline-populated ingestion timestamp
    rather than flight-domain data and is retained as profiled.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number). The 3 grain
    columns are flagged primaryKey so sync generates the composite uniqueness test; that generated
    test is warn-severity by tool design at datacontract-cli 1.0.12, and the error-severity
    grain rule below is the enforcing twin (rule 5: uniqueness as a test, never a trusted
    constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Calendar date of the scheduled flight.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Two-letter IATA carrier code.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Carrier-assigned flight number.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
    - type: sql
      description: flight_number is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number < 0
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Code of the NYC-area origin airport.
    quality:
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled local departure time as HHMM.
    quality:
    - type: sql
      description: sched_dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hhmm < 0
      mustBe: 0
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Code of the destination airport.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: FAA registration tail number of the operating aircraft.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether the flight was cancelled.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual local departure time as HHMM.
    quality:
    - type: sql
      description: dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dep_hhmm < 0
      mustBe: 0
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes late (negative if early) at departure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual local arrival time as HHMM.
    quality:
    - type: sql
      description: arr_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE arr_hhmm < 0
      mustBe: 0
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled local arrival time as HHMM.
    quality:
    - type: sql
      description: sched_arr_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_arr_hhmm < 0
      mustBe: 0
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes late (negative if early) at arrival.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes the aircraft was airborne.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Great-circle distance between origin and destination airports.
    quality:
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local hour component of the scheduled departure time.
    quality:
    - type: sql
      description: sched_dep_hour_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hour_local < 0
      mustBe: 0
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local minute component of the scheduled departure time.
    quality:
    - type: sql
      description: sched_dep_minute_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local < 0
      mustBe: 0
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: UTC timestamp of the scheduled departure, truncated to the hour.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full legal name of the operating carrier.
    quality:
    - type: sql
      description: carrier_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name NOT IN ('AirTran Airways Corporation', 'Alaska Airlines Inc.', 'American Airlines Inc.', 'Delta Air Lines Inc.', 'Endeavor Air Inc.', 'Envoy Air', 'ExpressJet Airlines Inc.', 'Frontier Airlines Inc.', 'Hawaiian Airlines Inc.', 'JetBlue Airways', 'Mesa Airlines Inc.', 'SkyWest Airlines Inc.', 'Southwest Airlines Co.', 'US Airways Inc.', 'United Air Lines Inc.', 'Virgin America')
      mustBe: 0
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Manufacturer of the operating aircraft.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Manufacturer's model designation for the aircraft.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Year the aircraft was manufactured.
    quality:
    - type: sql
      description: aircraft_manufacture_year is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_manufacture_year < 0
      mustBe: 0
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Passenger seat count of the aircraft.
    quality:
    - type: sql
      description: aircraft_seat_count is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_seat_count < 0
      mustBe: 0
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Engine type fitted to the aircraft.
    quality:
    - type: sql
      description: aircraft_engine_type stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_engine_type NOT IN ('4 Cycle', 'Reciprocating', 'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft')
      mustBe: 0
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the origin airport.
    quality:
    - type: sql
      description: origin_airport_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport_name NOT IN ('John F. Kennedy International Airport', 'LaGuardia Airport', 'Newark Liberty International Airport')
      mustBe: 0
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: City the origin airport serves.
    quality:
    - type: sql
      description: origin_municipality stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_municipality NOT IN ('New York', 'Newark')
      mustBe: 0
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Elevation of the origin airport in feet.
    quality:
    - type: sql
      description: origin_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_elevation_ft < 0
      mustBe: 0
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Length of the origin airport's longest runway, in feet.
    quality:
    - type: sql
      description: origin_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft < 0
      mustBe: 0
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Full name of the destination airport.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: City the destination airport serves.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ISO region code of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Elevation of the destination airport, in feet.
    quality:
    - type: sql
      description: dest_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_elevation_ft < 0
      mustBe: 0
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Length of the destination airport's longest runway, in feet.
    quality:
    - type: sql
      description: dest_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_longest_runway_ft < 0
      mustBe: 0
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Timestamp at which this row was captured by the ingestion pipeline.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (flight_date, carrier_code, flight_number)
      combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT flight_date, carrier_code, flight_number
        FROM silver.silver_flights
        GROUP BY flight_date, carrier_code, flight_number
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
