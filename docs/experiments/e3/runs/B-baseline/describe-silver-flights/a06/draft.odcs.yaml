# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:46:17.303137+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_flights holds one row per individual flight departing from the three New
    York City airports (EWR, JFK, LGA) between 2013-01-01 and 2013-06-30, combining core flight
    schedule and outcome fields with operating-carrier, aircraft-registry, and origin/destination
    airport reference attributes.
  usage: Read the table at the grain of one row per (flight_date, carrier_code, flight_number,
    origin_airport). dep_hhmm, dep_delay_minutes, arr_hhmm, arr_delay_minutes, and air_time_minutes
    are null for roughly 3% of rows and should be checked alongside is_cancelled before computing
    delay or duration metrics. Aircraft registry fields and destination lookup fields carry
    their own distinct null patterns and should be treated as optional enrichment rather than
    guaranteed attributes.
  limitations: 'The profile cannot confirm that (flight_date, carrier_code, flight_number,
    origin_airport) is a true grain; it is the smallest evidenced candidate given a 0.0 duplicate_row_rate
    and must be confirmed by the deterministic grain measurement. Aircraft attributes are
    null for 16.04% to 17.65% of rows, reflecting incomplete tail-number-to-registry joins,
    and destination lookup fields are null for a uniform 2.089% of rows, reflecting unmatched
    destination codes. captured_at is retained though its clustered, future-dated values resemble
    a pipeline ingestion timestamp rather than flight data, despite being marked is_airbyte_metadata:
    false; this should be re-checked by the reviewer.'
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: The calendar date of the scheduled flight departure.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: The two-letter IATA code of the operating carrier.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: The carrier-assigned flight number.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: The three-letter code of the NYC-area airport the flight departed from.
    quality:
    - type: sql
      description: origin_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport IS NULL
      mustBe: 0
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled departure time in 24-hour HHMM local format.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The three-letter code of the destination airport.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The aircraft's registration tail number.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether the flight was cancelled.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual departure time in 24-hour HHMM local format.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes the flight departed late relative to schedule; negative values indicate
      an early departure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual arrival time in 24-hour HHMM local format.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled arrival time in 24-hour HHMM local format.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes the flight arrived late relative to schedule; negative values indicate
      an early arrival.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The total minutes the aircraft was airborne.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The great-circle distance between origin and destination airports in miles.
    quality:
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled local departure hour, derived from sched_dep_hhmm.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled local departure minute, derived from sched_dep_hhmm.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: The scheduled departure rounded to the UTC hour.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The full legal name of the operating carrier, joined from carrier_code.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The manufacturer of the aircraft that operated the flight, joined by tail_number.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The model designation of the aircraft, joined by tail_number.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The year the aircraft was manufactured.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The number of passenger seats on the aircraft.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The engine type category of the aircraft, e.g. turbo-fan or reciprocating.
    quality:
    - type: sql
      description: aircraft_engine_type stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_engine_type NOT IN ('4 Cycle', 'Reciprocating', 'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft')
      mustBe: 0
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The full name of the origin airport.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The city the origin airport serves.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The elevation of the origin airport in feet.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The length of the longest runway at the origin airport in feet.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The full name of the destination airport, joined from dest_airport.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The city the destination airport serves.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The ISO region code (state or territory) of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The elevation of the destination airport in feet.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The length of the longest runway at the destination airport in feet.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: The timestamp the pipeline captured this row.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (flight_date, carrier_code, flight_number,
      origin_airport) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT flight_date, carrier_code, flight_number, origin_airport
        FROM silver.silver_flights
        GROUP BY flight_date, carrier_code, flight_number, origin_airport
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
