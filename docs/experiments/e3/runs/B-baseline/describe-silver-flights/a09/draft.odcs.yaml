# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:56:12.641242+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_flights holds one row per scheduled commercial flight departing a New York-area
    airport in the first half of 2013, carrying scheduling, actual timing, delay, distance,
    and joined carrier and airport reference attributes plus a partial aircraft-registry lookup.
  usage: Read the table at the grain of flight_date, carrier_code, flight_number, and origin_airport;
    join or filter on is_cancelled before computing delay statistics, since dep_hhmm, dep_delay_minutes,
    arr_hhmm, arr_delay_minutes, and air_time_minutes are null for flights that did not depart
    or arrive as scheduled, and treat aircraft_* and dest_* lookup columns as optionally present.
  limitations: The profile cannot confirm that flight_date, carrier_code, flight_number, and
    origin_airport uniquely identify a row beyond the whole-row duplicate_row_rate of 0.0;
    aircraft_* columns are missing for roughly 16-18% of rows and dest_* lookup columns for
    about 2% of rows, reflecting incomplete reference joins rather than measurement error;
    and captured_at appears to be a pipeline-generated capture timestamp rather than flight-event
    data, retained here for reviewer confirmation.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Local calendar date the flight was scheduled to depart.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Two-letter code identifying the operating carrier.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Airline-assigned flight number.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: Code of the NYC-area origin airport.
    quality:
    - type: sql
      description: origin_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport IS NULL
      mustBe: 0
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled local departure time as an HHMM integer.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Code of the destination airport.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Registration number of the operating aircraft.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether the flight was cancelled.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual local departure time as an HHMM integer, absent if the flight never
      departed.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Departure delay in minutes; negative values are early departures.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual local arrival time as an HHMM integer.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled local arrival time as an HHMM integer.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Arrival delay in minutes; negative values are early arrivals.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Airborne time in minutes.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Great-circle distance between origin and destination, in miles.
    quality:
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local hour component of scheduled departure.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local minute component of scheduled departure.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: UTC timestamp bucketed to the hour of scheduled departure.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full legal name of the operating carrier.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Manufacturer of the operating aircraft from a tail-number lookup.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Model designation of the operating aircraft.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Year the operating aircraft was manufactured.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Seat count of the operating aircraft.
    quality:
    - type: sql
      description: aircraft_seat_count is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_seat_count < 0
      mustBe: 0
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Engine category of the operating aircraft.
    quality:
    - type: sql
      description: aircraft_engine_type stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_engine_type NOT IN ('4 Cycle', 'Reciprocating', 'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft')
      mustBe: 0
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the origin airport.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: City served by the origin airport.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Field elevation of the origin airport, in feet.
    quality:
    - type: sql
      description: origin_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_elevation_ft < 0
      mustBe: 0
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Longest runway length at the origin airport, in feet.
    quality:
    - type: sql
      description: origin_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft < 0
      mustBe: 0
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Full name of the destination airport.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: City served by the destination airport.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ISO region or state code of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Field elevation of the destination airport, in feet.
    quality:
    - type: sql
      description: dest_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_elevation_ft < 0
      mustBe: 0
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Longest runway length at the destination airport, in feet.
    quality:
    - type: sql
      description: dest_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_longest_runway_ft < 0
      mustBe: 0
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Pipeline-generated timestamp recording when this row was captured by the
      profiling run.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (flight_date, carrier_code, flight_number,
      origin_airport) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT flight_date, carrier_code, flight_number, origin_airport
        FROM silver.silver_flights
        GROUP BY flight_date, carrier_code, flight_number, origin_airport
        HAVING COUNT(*) > 1
      )
    mustBe: 0
