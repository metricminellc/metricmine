# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:48:14.247014+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds individual commercial flight records departing NYC-area airports
    (EWR, JFK, LGA) across the first half of 2013, combining schedule, actual timing, delay,
    carrier, aircraft, and airport reference attributes into one denormalized row per flight.
  usage: Read the table at the grain of one row per flight_date, carrier_code, flight_number,
    and origin_airport; join to the actual dep/arr HHMM and delay columns to compute on-time
    performance, and expect dep_hhmm, arr_hhmm, dep_delay_minutes, arr_delay_minutes, and
    air_time_minutes to be null for flights that never departed or arrived (is_cancelled true
    or otherwise unresolved).
  limitations: The profile cannot confirm the proposed grain is truly unique until a deterministic
    measurement checks it against the warehouse; roughly 16-18% of rows lack aircraft registration
    detail (manufacturer, model, year, seats, engine type) and about 2% lack destination airport
    reference detail, so joins on those fields will silently miss rows; tail_number, dep/arr
    timing, and delay columns are null for a small share of rows and that nullability is a
    profiled fact, not a data quality defect to be fixed here; captured_at appears to be a
    pipeline ingestion timestamp despite not being flagged as airbyte metadata in this profile,
    and a reviewer should confirm its intended semantics.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Calendar date of the scheduled flight operation.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Two-letter marketing carrier code.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Carrier-assigned flight number for the leg.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: Three-letter NYC-area origin airport code.
    quality:
    - type: sql
      description: origin_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport IS NULL
      mustBe: 0
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled departure time, HHMM local.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Three-letter destination airport code.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Aircraft registration operating the flight.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether the flight was cancelled.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual departure time, HHMM local.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Departure delay in minutes; negative is early.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual arrival time, HHMM local.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled arrival time, HHMM local.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Arrival delay in minutes; negative is early.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Measured airborne time in minutes.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Great-circle distance between origin and destination, miles.
    quality:
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled departure hour, local time, derived from sched_dep_hhmm.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled departure minute, local time, derived from sched_dep_hhmm.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Scheduled departure instant normalized to UTC, hour granularity.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full legal name of the operating carrier.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Manufacturer of the operating aircraft.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Model designation of the operating aircraft.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Year the operating aircraft was manufactured.
    quality:
    - type: sql
      description: aircraft_manufacture_year is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_manufacture_year < 0
      mustBe: 0
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Seating capacity of the operating aircraft.
    quality:
    - type: sql
      description: aircraft_seat_count is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_seat_count < 0
      mustBe: 0
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Engine type classification of the operating aircraft.
    quality:
    - type: sql
      description: aircraft_engine_type stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_engine_type NOT IN ('4 Cycle', 'Reciprocating', 'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft')
      mustBe: 0
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the origin airport.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: City the origin airport serves.
    quality:
    - type: sql
      description: origin_municipality stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_municipality NOT IN ('New York', 'Newark')
      mustBe: 0
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Field elevation of the origin airport in feet.
    quality:
    - type: sql
      description: origin_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_elevation_ft < 0
      mustBe: 0
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Longest runway length at the origin airport in feet.
    quality:
    - type: sql
      description: origin_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft < 0
      mustBe: 0
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Full name of the destination airport.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: City the destination airport serves.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ISO region code of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Field elevation of the destination airport in feet.
    quality:
    - type: sql
      description: dest_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_elevation_ft < 0
      mustBe: 0
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Longest runway length at the destination airport in feet.
    quality:
    - type: sql
      description: dest_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_longest_runway_ft < 0
      mustBe: 0
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Timestamp at which this row was captured by the ingestion pipeline.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (flight_date, carrier_code, flight_number,
      origin_airport) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT flight_date, carrier_code, flight_number, origin_airport
        FROM silver.silver_flights
        GROUP BY flight_date, carrier_code, flight_number, origin_airport
        HAVING COUNT(*) > 1
      )
    mustBe: 0
