# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:07:10.654570+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_planes is the cleaned aircraft reference table derived from bronze.nyc_planes,
    providing one row per tail number with manufacturer, model, type, engine configuration,
    seat count, and manufacture year for joining to flight-level fact tables.
  usage: Join on tailnum, the declared grain and unique key (3322 distinct values across 3322
    rows). Numeric attributes (year_manufactured, engines, seats, speed) are cast to INTEGER
    from decimal landings. Consumers should expect nulls in year_manufactured (about 2.1%
    of rows) and treat speed as effectively unavailable, since it is populated for fewer than
    1% of rows.
  limitations: The speed column is sparsely populated (null_rate 0.993076) and is retained
    as-is with no imputation; it should not be used for analysis without acknowledging the
    coverage gap. year_manufactured carries 70 nulls that were not resolved. Airbyte capture
    columns were dropped, so lineage back to the raw extraction record requires the bronze
    table. No deduplication was applied because the profile showed duplicate_row_rate 0.0.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: silver_nyc_planes is the cleaned aircraft reference table derived from bronze.nyc_planes,
    providing one row per tail number with manufacturer, model, type, engine configuration,
    seat count, and manufacture year for joining to flight-level fact tables.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Tail number has null_rate 0.0 and distinct_count 3322 equal to the table's
      row_count 3322, making it a unique, fully populated identifier (samples like N10156,
      N102UW).
  - name: year_manufactured
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but all samples are integral years (min 1956.0, max
      2013.0), so cast to INTEGER; renamed to year_manufactured to disambiguate from flight
      year. null_rate 0.021072 (70 nulls), so retained nullable.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality category with distinct_count 3 ('Fixed wing multi engine',
      'Fixed wing single engine', 'Rotorcraft') and null_rate 0.0.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Fully populated (null_rate 0.0) with distinct_count 35; samples such as AIRBUS,
      BOEING, BELL are plain text names, kept as VARCHAR.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Fully populated (null_rate 0.0) with distinct_count 127; samples like '172N'
      and '210-5(205)' are alphanumeric model designations, so text is the correct type.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but every distinct value (1.0, 2.0, 3.0, 4.0) is
      integral with null_rate 0.0, so cast to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but all samples are integral counts (min 2.0, max
      450.0) with null_rate 0.0, so cast to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sparsely populated with null_rate 0.993076 (3299 nulls of 3322 rows); the
      13 distinct values (min 90.0, max 432.0) are all integral, so cast to INTEGER and retain
      nulls.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality category with distinct_count 6 ('Reciprocating', 'Turbo-fan',
      etc.) and null_rate 0.0.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
