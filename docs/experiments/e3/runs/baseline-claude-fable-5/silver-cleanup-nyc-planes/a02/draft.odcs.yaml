# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:05:29.826180+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_planes
name: Silver nyc planes
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_planes is the cleaned aircraft dimension derived from bronze.nyc_planes,
    providing one row per tail number with manufacturer, model, type, engine configuration,
    seat count, and manufacture year for joining to flight-level fact tables.
  usage: Join on tailnum, the unique primary key (3322 distinct values across 3322 rows).
    Numeric attributes year, engines, seats, and speed are cast to INTEGER from their decimal
    landing types. Consumers using year must handle its roughly 2.1% null rate, and consumers
    using speed must deliberately account for its 99.3% null rate before aggregating.
  limitations: speed is almost entirely null (null_rate 0.993076) and should not be relied
    on for population-level analysis; year is missing for 70 aircraft (null_rate 0.021072)
    and no imputation was performed. The declared grain of one row per tailnum is based on
    the profiled snapshot and must be confirmed against the warehouse at review.
schema:
- name: silver_nyc_planes
  physicalName: silver_nyc_planes
  logicalType: object
  physicalType: table
  description: silver_nyc_planes is the cleaned aircraft dimension derived from bronze.nyc_planes,
    providing one row per tail number with manufacturer, model, type, engine configuration,
    seat count, and manufacture year for joining to flight-level fact tables.
  properties:
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Tail number has null_rate 0.0 and distinct_count 3322 equal to the table's
      row_count 3322, making it a unique, fully populated identifier (samples like N10156,
      N102UW).
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but all samples are integral year values (min 1956.0,
      max 2013.0), so cast to INTEGER; null_rate 0.021072 (70 nulls) means the manufacture
      year is occasionally missing, so nulls are retained.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality category with null_rate 0.0 and 3 distinct values (Fixed
      wing multi engine, Fixed wing single engine, Rotorcraft); kept as-is.
  - name: manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Fully populated (null_rate 0.0) with 35 distinct manufacturer names such
      as AIRBUS, BOEING, BELL; no cleanup needed.
  - name: model
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Fully populated (null_rate 0.0) with 127 distinct model codes; samples like
      172N and 421C are alphanumeric, so VARCHAR is the correct type.
  - name: engines
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but all 4 distinct values (1.0, 2.0, 3.0, 4.0) are
      integral counts with null_rate 0.0, so cast to INTEGER.
  - name: seats
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but every sample (2.0 through 12.0, max 450.0) is
      an integral seat count with null_rate 0.0, so cast to INTEGER.
  - name: speed
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All 13 distinct values (90.0 to 432.0) are integral so the DECIMAL(38,9)
      landing casts cleanly to INTEGER; the column is sparsely populated with null_rate 0.993076
      (3299 nulls) and nulls are retained.
  - name: engine
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality engine type with null_rate 0.0 and 6 distinct values (Turbo-fan,
      Turbo-jet, Reciprocating, etc.); kept as-is.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (tailnum) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT tailnum
        FROM silver.silver_nyc_planes
        GROUP BY tailnum
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
