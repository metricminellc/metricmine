# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T18:48:10.125693+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'Declares how silver.silver_invoice_lines enters the gold unified event star as
    the invoice_lines fact category: the time column and minute grain, the transaction grain
    with a derived line identity, and the dimension/measure role of every mapped column. It
    is consumed by the deterministic modeling engine, which emits the gold models from this
    declaration.'
  usage: The proposal is rendered into an ODCS mapping contract draft (gold_invoice_lines_mapping),
    validated against the frozen mapping-contract schema, gated by the validator and datacontract
    lint, and reviewed and edited by a human before approval; nothing in it executes directly.
  limitations: 'The mapping does not transform, filter, or derive columns beyond the declared
    line identity: cancellation lines (is_cancellation true, negative quantities down to -1395)
    and zero-priced lines (unit_price min 0.0) are mapped as-is, and their exclusion or netting
    is left to consumers. It also does not resolve the 30.0664% null customer_id rows to any
    surrogate customer, and it carries no quality rules, ownership, or access policies, which
    review owns.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is a single invoice line: a product (stock_code) invoiced at a quantity
    and unit price on a specific invoice at a specific minute, including cancellation lines
    flagged by is_cancellation with negative quantities.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice document identifier grouping lines into a single invoice; samples
      like 489434 and 489435 are numeric-looking codes stored as strings, with 2330 distinct
      invoices and null_rate 0.0.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking whether the line belongs to a cancellation, with exactly two
      distinct values (true, false) and null_rate 0.0, consistent with the negative quantities
      observed in the quantity samples.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code identifying the item sold; samples like 10002R and 10123C
      show alphanumeric codes, 3141 distinct values, null_rate 0.0.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product description such as '11 PC CERAMIC TEA SET POLKADOT'; nullable
      with null_rate 0.005098 (228 nulls), likely missing for uncatalogued or adjustment stock
      codes.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units sold on the line, additive across rows, ranging from -1395 to 5184
      with negative sample values indicating cancellation or return lines; null_rate 0.0.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice event; samples such as 2009-12-01T07:45:00 resolve
      to the minute with seconds always zero, spanning 2009-12-01 to 2009-12-23, null_rate
      0.0.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Per-unit price of the item on the line, ranging from 0.00 to 1998.49 with
      null_rate 0.0; zero-priced samples suggest giveaway or adjustment lines.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier (12346 to 18287) that labels rather than measures,
      so it maps as a dimension; nullable with null_rate 0.300664 (13446 nulls), likely guest
      or unidentified purchases.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Customer country for the invoice, with 24 distinct values such as Australia,
      EIRE, and Germany and null_rate 0.0.
