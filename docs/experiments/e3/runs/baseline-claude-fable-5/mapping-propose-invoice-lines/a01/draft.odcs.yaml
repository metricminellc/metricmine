# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T18:47:43.704233+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: Declares how silver.silver_invoice_lines enters the gold unified event star as
    the invoice_lines fact category, naming the time column, the transaction grain with its
    derived line identity, and the role of every mapped column for the deterministic modeling
    engine that emits the gold models.
  usage: This mapping is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, gated by the validator and datacontract lint, and human-reviewed
    before approval; the modeling engine consumes the approved contract to generate the gold
    fact and dimension models, and no physical object is created by the mapping itself.
  limitations: 'The mapping does not filter or transform rows: cancellation lines (is_cancellation
    true, with negative quantities down to -1395) and zero-priced lines (unit_price min 0.0)
    are mapped as-is, leaving their exclusion or handling to consumers; the 30.07% null customer_id
    rows remain in the fact without customer attribution, and product_description nulls (228
    rows) are passed through unresolved.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is one invoice line: a single product (stock_code) sold or cancelled
    in a given quantity at a unit price on a specific invoice at a specific minute, attributed
    to a country and, when known, a customer.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice document identifier grouping lines into an order, shown as numeric-looking
      strings such as 489434 with null_rate 0.0 and 2330 distinct invoices across 44721 lines.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking a line as part of a cancellation, with exactly two distinct
      values (true, false) and null_rate 0.0; consistent with the negative quantities seen
      in the profile.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code labeling the item sold, with 3141 distinct alphanumeric
      codes such as 10002R and 10123C and null_rate 0.0.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Human-readable product description such as '12 PENCILS SMALL TUBE POSY';
      nullable with null_rate 0.005098 (228 nulls), likely missing where the catalog carried
      no description for a code.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units sold on the line, an additive quantity ranging from -1395 to 5184 where
      negative values in the samples indicate cancellations or returns; null_rate 0.0.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp the invoice line was recorded, resolving to the minute in samples
      such as 2009-12-01T07:45:00, spanning 2009-12-01 to 2009-12-23 with null_rate 0.0.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit for the line, a numeric amount ranging from 0.0 to 1998.49
      that is compared and combined with quantity across rows; null_rate 0.0, with 0.0 prices
      present in the samples.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Customer identifier stored as an integer (12346 to 18287) that labels rather
      than measures; nullable with null_rate 0.300664 (13446 nulls), consistent with anonymous
      or guest purchases carrying no customer.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Customer or shipping country for the invoice, with 24 distinct values such
      as Australia, EIRE, and Germany and null_rate 0.0.
servers:
