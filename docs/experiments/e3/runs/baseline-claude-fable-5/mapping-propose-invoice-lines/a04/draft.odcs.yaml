# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T18:49:03.351680+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how silver.silver_invoice_lines enters the gold unified event
    star as the invoice_lines fact category, naming the time column, the transaction grain
    with its derived line identity, and every mapped field's role and type for the deterministic
    modeling engine that emits the gold models.
  usage: The proposal is rendered into an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, gated by the validator and datacontract lint, and reviewed
    and edited by a human before approval; the approved contract is an input to the modeling
    engine, never a physical table.
  limitations: 'The mapping maps columns and declares grain only: it does not exclude or net
    out cancellation lines (is_cancellation true, negative quantities down to -1395) or zero-priced
    lines (unit_price min 0.0), leaving that filtering to consumers; it does not resolve the
    roughly 30% of rows with null customer_id; and it proposes no quality rules, classifications,
    service levels, or derived columns beyond the declared line identity.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is one invoice line: a single product (stock_code) invoiced in a given
    quantity at a given unit price on one invoice (invoice_id) at a specific minute (invoiced_at),
    including cancellation lines flagged by is_cancellation and carrying negative quantities.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice document number grouping lines into one invoice, with 2330 distinct
      values such as 489434 and 489435 and a null_rate of 0.0.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking cancellation lines, with exactly two distinct values (false,
      true), a null_rate of 0.0, and corroborated by negative quantities in the samples.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product stock code with 3141 distinct values such as 10002 and 10123C, null_rate
      0.0; a code that labels the product on the line.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product description such as '11 PC CERAMIC TEA SET POLKADOT'; nullable
      with 228 nulls (null_rate 0.005098), likely missing when the product record lacks a
      description.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units on the line, additive across rows, ranging from -1395 to 5184 with
      negative samples corresponding to cancellation lines; null_rate 0.0.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp the invoice line was recorded, ranging 2009-12-01T07:45:00 to 2009-12-23T16:58:00
      with samples resolving to the minute; null_rate 0.0.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit on the line, ranging 0.0 to 1998.49 with null_rate 0.0; compared
      and multiplied with quantity across rows, with zero-price samples present.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier (12346 to 18287, 1045 distinct) that labels rather
      than measures; nullable with null_rate 0.300664, consistent with guest or unregistered
      purchases.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Customer country with 24 distinct values such as Australia and EIRE, null_rate
      0.0.
servers:
