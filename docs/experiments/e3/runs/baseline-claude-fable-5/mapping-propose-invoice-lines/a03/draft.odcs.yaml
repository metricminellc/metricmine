# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T18:48:36.327954+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: Gold mapping, invoice_lines category
version: 1.2.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how silver.silver_invoice_lines enters the gold unified
    event star as the invoice_lines fact category: the time column and its minute grain, the
    transaction grain with a derived line identity, and the role of every mapped silver column.
    Its sole consumer is the deterministic modeling engine, which renders the gold models
    from it.'
  usage: The proposal is rendered by deterministic code into an ODCS mapping contract draft
    (gold_invoice_lines_mapping), validated against the frozen mapping-contract schema, gated
    by the validator and datacontract lint, and reviewed and edited by a human before approval;
    nothing in this proposal executes directly.
  limitations: 'The mapping does not transform, filter, or derive columns beyond the declared
    line identity: rows with is_cancellation true and negative quantity samples (down to -1395)
    are mapped as-is, and excluding or netting them is left to consumers; the 30.07% null
    customer_id rows are retained without imputation; zero unit_price lines are not filtered;
    and no quality rules, severities, classifications, service levels, ownership, or access
    policies are proposed, as those belong to review.'
schema:
- name: invoice_lines
  logicalType: object
  physicalType: mapping
  description: 'One row is one invoice line: a single product (stock_code) sold or cancelled
    in a given quantity at a given unit_price on one invoice (invoice_id) at one minute-resolved
    timestamp (invoiced_at), attributed to an optional customer and a country.'
  entityGroup: invoice_lines
  sourceTable: silver.silver_invoice_lines
  timeColumn: invoiced_at
  timeGrain: minute
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: line_identity
      derivation: canonical-key-v2
      of:
      - invoice_id
      - stock_code
      - invoiced_at
      - quantity
      - unit_price
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Invoice document identifier grouping lines into one transaction, shown by
      sequential sample values like 489434 through 489443 with 2330 distinct invoices across
      44721 rows and null_rate 0.0.
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Flag marking whether the line belongs to a cancellation, with exactly two
      distinct values (true, false), null_rate 0.0, and consistent with negative quantity
      samples such as -1395.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Product code identifying the item sold on the line, with 3141 distinct alphanumeric
      codes such as 10002R and 10123C and null_rate 0.0.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Free-text product description such as '12 DAISY PEGS IN WOOD BOX'; nullable
      with a null_rate of 0.005098 (228 nulls), likely where a stock_code was recorded without
      catalog text.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Units sold on the line, an additive quantity ranging from -1395 to 5184 where
      negative samples represent cancellations or returns; null_rate 0.0.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: Timestamp of the invoice event; samples such as 2009-12-01T07:45:00 resolve
      to the minute with zero seconds, spanning 2009-12-01 to 2009-12-23 with null_rate 0.0.
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    mappingRole: measure
    description: Price per unit on the line, ranging from 0.00 to 1998.49 with null_rate 0.0;
      zero-price samples suggest free or adjustment lines.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Numeric customer identifier (12346 to 18287, 1045 distinct) that labels rather
      than measures; nullable with a null_rate of 0.300664, consistent with guest or unregistered
      purchases.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Customer country for the invoice, with 24 distinct values such as Australia,
      EIRE, and Germany and null_rate 0.0.
