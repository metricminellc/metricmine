# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:49:53.643383+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_orders
name: Silver orders
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_orders is the cleaned order-line table derived from bronze.messy_orders
    (5000 landed rows from the legacy_pos source). It removes exact duplicate rows introduced
    by a double extraction, standardizes column names to snake_case, casts order_ts to TIMESTAMP,
    is_gift to BOOLEAN, and unit_price to DECIMAL(10,2), and adds an is_non_product_line flag.
    It feeds downstream order, revenue, and fulfillment reporting.
  usage: Read at the grain of one row per (order_id, line_no). Consumers should filter is_non_product_line
    = false to analyze product sales only, and should expect negative unit_price values on
    refund or adjustment lines. qty and ship_date remain VARCHAR and require deliberate parsing;
    customer_email and notes are nullable and sparsely populated. status retains landed casing,
    so case-fold it when grouping.
  limitations: Exact duplicates (duplicate_row_rate 0.08 on 5000 rows) are removed, but near-duplicates
    differing only in free text are not. qty could not be cast because samples conflict ('three',
    '2.0', '-3'), and ship_date could not be cast because it mixes five-plus formats plus
    'TBD' with a 0.264 null rate. customer_email is 97 percent null. status casing is not
    normalized, and notes free text is untrusted and uncleaned. The declared (order_id, line_no)
    grain is evidence-based but unverified against the full warehouse.
schema:
- name: silver_orders
  physicalName: silver_orders
  logicalType: object
  physicalType: table
  description: silver_orders is the cleaned order-line table derived from bronze.messy_orders
    (5000 landed rows from the legacy_pos source). It removes exact duplicate rows introduced
    by a double extraction, standardizes column names to snake_case, casts order_ts to TIMESTAMP,
    is_gift to BOOLEAN, and unit_price to DECIMAL(10,2), and adds an is_non_product_line flag.
    It feeds downstream order, revenue, and fulfillment reporting.
  properties:
  - name: order_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Landed as 'Order ID' with a space; null_rate 0.0 and 4000 distinct values
      with samples like 'ORD-100001' show a stable business identifier, renamed to snake_case
      order_id.
  - name: line_no
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: CamelCase name renamed to line_no; null_rate 0.0 and distinct_values 1 through
      7 (min 1, max 7) show a clean line-number integer within each order.
  - name: sku
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with 320 distinct values; samples mix numeric-looking codes
      ('10002') with alpha-suffixed codes ('84029E') and non-product entries ('BANK CHARGES',
      'DOT'), so it stays VARCHAR.
  - name: is_non_product_line
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Samples include non-product sku values such as 'BANK CHARGES' and 'DOT' alongside
      normal product codes; this flag marks lines whose sku is a known non-product code so
      consumers can exclude them.
  - name: qty
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Samples disagree on type: integers (''12''), a decimal (''2.0''), a negative
      (''-3''), and a spelled-out word (''three''), so a numeric cast is unsafe and the column
      is retained as text; null_rate 0.002 (10 nulls) retained as null.'
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: Landed as DECIMAL(38,9) but every sample carries at most two decimal places
      (0.42, 2.55, 7.5) with min -5.0 and max 1250.0, so DECIMAL(10,2) is sufficient; null_rate
      0.0. Note the negative minimum, which likely marks refunds or adjustments.
  - name: order_ts
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: All 10 samples are ISO-shaped 'YYYY-MM-DD HH:MM:SS' strings (e.g. '2024-01-05
      09:15:00') with null_rate 0.0, supporting a safe cast from VARCHAR to TIMESTAMP.
  - name: ship_date
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Samples show at least five conflicting date formats ('01/07/2024', '07.01.2024',
      '2024-01-07', 'Jan 9 2024') plus non-date values ('', 'TBD'), so no cast is safe; null_rate
      0.264 (1320 nulls) retained as null.
  - name: customer_email
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Sparsely populated at null_rate 0.97 (4850 nulls, 140 distinct values); samples
      are well-formed email addresses, retained nullable rather than imputed or dropped.
  - name: notes
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text delivery notes with null_rate 0.61 (3050 nulls) and 2100 distinct
      values; samples include empty strings, truncated long values, and instruction-like strings
      that are treated strictly as untrusted source data.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with 5 distinct values ('CANCELLED', 'Shipped', 'cancelled',
      'pending', 'shipped') that collapse to 3 statuses after case-folding; retained as landed
      so review can decide a canonical casing.
  - name: is_gift
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: All 4 distinct values ('N', 'Y', 'no', 'yes') map unambiguously to boolean
      true/false; null_rate 0.012 (60 nulls) retained as null.
  - name: source_system
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Constant column with distinct_count 1 and sole value 'legacy_pos' at null_rate
      0.0; retained as lineage context for downstream consumers who may union other sources.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (order_id, line_no) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT order_id, line_no
        FROM silver.silver_orders
        GROUP BY order_id, line_no
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
