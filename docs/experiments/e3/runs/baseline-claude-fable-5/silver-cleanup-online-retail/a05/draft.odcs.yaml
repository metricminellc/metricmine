# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:46:52.882865+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_online_retail_ii is the cleaned line-item view of the bronze online_retail_ii
    capture: one row per retail invoice line with typed quantity, price, timestamp, and customer
    identifier, feeding downstream revenue, basket, and customer analytics.'
  usage: Read one row as one invoice line at the declared grain (invoice, stockcode, invoice_date,
    quantity, price). Filter on is_return = false to analyze sales only, since return lines
    carry negative quantities; include them when computing net revenue. customer_id is null
    on roughly 30% of rows, so customer-level aggregations must deliberately decide whether
    to exclude anonymous lines. Zero-priced rows exist and should be filtered when computing
    unit economics.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188, ~506 of 45228 rows) are
    removed, which may drop legitimate repeated lines because bronze has no line identifier.
    description retains untrimmed whitespace and is null on 0.5% of rows. customer_id is missing
    on 29.78% of rows and is not imputed. Negative quantities and zero prices are flagged
    or documented but not corrected, and the declared grain has not yet been verified against
    the warehouse.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: 'silver_online_retail_ii is the cleaned line-item view of the bronze online_retail_ii
    capture: one row per retail invoice line with typed quantity, price, timestamp, and customer
    identifier, feeding downstream revenue, basket, and customer analytics.'
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Invoice identifier with null_rate 0.0 and 2330 distinct values; samples such
      as '489434' are numeric-looking codes but kept as VARCHAR because stockcode-style alphanumeric
      codes are common in this domain and no evidence confirms all values are integral.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Product code with null_rate 0.0 and 3141 distinct values; samples include
      alphanumeric codes like '10002R' and '10123C', so VARCHAR is the correct type.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text product description with 228 nulls (null_rate 0.005041) retained
      as nullable; samples show leading and trailing whitespace (e.g. ' BROWN  PIRATE TREASURE
      CHEST ') that a trim step should address.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: Landed as DECIMAL(38,9) but all samples are integral (e.g. -1395.0, -504.0)
      with min -1395.0 and max 5184.0, well within INTEGER range; null_rate 0.0 supports required.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Boolean derived as quantity < 0; profile min is -1395.0 and samples include
      many negative quantities (-1043.0, -954.0), indicating return or reversal lines that
      consumers must be able to filter.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: All 10 samples are ISO-shaped timestamps like '2009-12-01 07:45:00' with
      null_rate 0.0, supporting a strict VARCHAR-to-TIMESTAMP cast; renamed to snake_case
      invoice_date.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: Landed as DECIMAL(38,9) but samples show at most two decimal places (0.04,
      0.12, 1998.49 max) with min 0.0 and null_rate 0.0, so DECIMAL(10,2) is sufficient; note
      min 0.0 means zero-priced lines exist.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All samples are integral (12346.0 to 18287.0, matching min 12346.0 and max
      18287.0) so DECIMAL(38,9) casts safely to INTEGER; 13468 nulls (null_rate 0.29778) represent
      anonymous transactions and are retained as null.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Country name with null_rate 0.0 and only 24 distinct values (samples include
      'Australia', 'EIRE', 'Channel Islands'), kept as required VARCHAR.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode, invoice_date, quantity,
      price) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode, invoice_date, quantity, price
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode, invoice_date, quantity, price
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
