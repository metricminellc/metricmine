# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:45:06.694931+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_online_retail_ii is the cleaned, typed, exact-deduplicated view of the
    bronze online_retail_ii retail transaction feed: one row per invoice line (invoice, stockcode,
    quantity, price) with proper TIMESTAMP, INTEGER, and DECIMAL types, Airbyte capture metadata
    removed, and an is_return flag marking negative-quantity lines. It feeds sales, product,
    and customer analytics downstream of bronze.'
  usage: Read one row as one invoice line item. Filter is_return = false for gross sales analysis,
    or include returns deliberately for net figures. customer_id is null on about 29.8% of
    rows (guest/anonymous transactions), so customer-level aggregates must either exclude
    or separately bucket those rows. price can be 0.0; exclude zero-price lines when computing
    unit economics. description may be null (0.5% of rows) and retains source whitespace inconsistencies.
  limitations: Only exact duplicate rows (duplicate_row_rate 0.011188, ~506 of 45228 rows)
    are removed; near-duplicates differing by whitespace in description are not collapsed,
    and description whitespace is not trimmed. Bronze carries no line-number column, so the
    declared grain (invoice, stockcode, quantity, price) is a best-effort identification that
    must be verified against the warehouse. Null customer_id (29.778%) and zero prices are
    retained as landed, and negative quantities are flagged rather than reversed or excluded.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: 'silver_online_retail_ii is the cleaned, typed, exact-deduplicated view of
    the bronze online_retail_ii retail transaction feed: one row per invoice line (invoice,
    stockcode, quantity, price) with proper TIMESTAMP, INTEGER, and DECIMAL types, Airbyte
    capture metadata removed, and an is_return flag marking negative-quantity lines. It feeds
    sales, product, and customer analytics downstream of bronze.'
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Invoice identifier with null_rate 0.0 and 2330 distinct values across 45228
      rows; kept as VARCHAR because invoice codes in this domain can carry non-numeric prefixes
      even though the sampled values (e.g. 489434) are numeric.
  - name: stockcode
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Product code with null_rate 0.0 and 3141 distinct values; samples such as
      10002R, 10123C, and 10123G are alphanumeric, so the column must stay VARCHAR.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Product description with 228 nulls (null_rate 0.005041) retained as nullable
      text; samples show inconsistent leading/trailing whitespace (e.g. ' BROWN  PIRATE TREASURE
      CHEST ') that a reviewer may want a downstream trim for.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Landed as DECIMAL(38,9) but every sample is integral (-1395.0 through -504.0)
      and min -1395.0 / max 5184.0 fit INTEGER; null_rate 0.0 so the column is required. Negative
      values indicate returns or cancellations and are retained.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Derived boolean true when quantity < 0; the profile shows min -1395.0 and
      all ten sampled values negative, so negative-quantity return/cancellation lines clearly
      exist and consumers need an explicit flag to exclude them from sales aggregates.
  - name: invoicedate
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Landed as VARCHAR but all samples are ISO-shaped datetimes (e.g. '2009-12-01
      07:45:00') with null_rate 0.0, supporting a strict cast to TIMESTAMP.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: Landed as DECIMAL(38,9) with null_rate 0.0; samples (0.0, 0.04, 0.06) and
      max 1998.49 show at most two decimal places, so DECIMAL(10,2) is sufficient and precise.
      Min 0.0 means zero-price lines exist and are retained.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) but all samples are integral (12346.0 through 12437.0)
      with min 12346.0 and max 18287.0, supporting INTEGER; 13468 nulls (null_rate 0.29778)
      represent anonymous/guest transactions and are retained as null.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Country name with null_rate 0.0 and 24 distinct values; samples (Australia,
      Austria, EIRE) are clean text, kept as VARCHAR.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stockcode, quantity, price) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stockcode, quantity, price
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stockcode, quantity, price
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
