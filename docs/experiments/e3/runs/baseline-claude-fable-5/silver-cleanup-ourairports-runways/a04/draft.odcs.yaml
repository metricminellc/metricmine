# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:15:10.090580+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'silver_ourairports_runways is the cleaned runway-level table from the OurAirports
    bronze landing: one row per runway id, with text-encoded numeric ids cast to integers,
    0/1 flags cast to booleans, integral measures cast to INTEGER, and Airbyte capture metadata
    removed. It feeds airport and runway analytics joined via airport_ref.'
  usage: Join to airport tables on airport_ref (integer). Treat lighted and closed as true
    booleans; filter closed = false to analyze active runways. Many geospatial and threshold
    columns are nullable (null rates between 0.22 and 0.90), so consumers must handle nulls
    explicitly rather than assume full coverage. Surface codes are raw source text and must
    be mapped by the consumer if grouped categories are needed.
  limitations: Runway-end coordinates, elevations, and headings are missing for roughly 22-28%
    of rows, and displaced-threshold columns are about 88-90% null; no imputation was performed.
    surface carries 239 unnormalized free-text spellings. he_heading_deg_true has a max of
    362.0, exceeding the 360-degree compass range, and le_ident/he_ident contain placeholder
    values like '.' and '-'; these anomalies are retained as-is for review.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: 'silver_ourairports_runways is the cleaned runway-level table from the OurAirports
    bronze landing: one row per runway id, with text-encoded numeric ids cast to integers,
    0/1 flags cast to booleans, integral measures cast to INTEGER, and Airbyte capture metadata
    removed. It feeds airport and runway analytics joined via airport_ref.'
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 and distinct_count 10760 equals row_count 10760, making it
      a unique identifier; all 10 sample_values (e.g. '232758', '232770') are integral strings,
      supporting a VARCHAR to INTEGER cast.
  - name: airport_ref
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with distinct_count 7591; all sample_values (e.g. '10309',
      '111') are integral strings, so VARCHAR is cast to INTEGER to match the airport id it
      references.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 7591; samples like '03N' and '19AK' are
      alphanumeric airport codes, so the column stays VARCHAR.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values (0.0 through 44.0) and min 0.0 / max 16798.0 are integral,
      so DECIMAL(38,9) is cast to INTEGER; null_rate 0.007993 (86 nulls) means the column
      stays nullable with nulls retained.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Samples (1.0 through 26.0) and min 1.0 / max 7000.0 are all integral, supporting
      DECIMAL(38,9) to INTEGER; null_rate 0.082528 (888 nulls) so nulls are retained.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text surface codes with distinct_count 239 and inconsistent spellings
      in samples ('ASP', 'ASPH', 'ASP/CONC'); null_rate 0.022955 (247 nulls) so the raw text
      is kept nullable without normalization.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, so DECIMAL(38,9)
      is safely cast to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: distinct_values are exactly [0.0, 1.0] with null_rate 0.0, so DECIMAL(38,9)
      is safely cast to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Runway-end designators with distinct_count 199 and non-numeric samples ('01L',
      '-12', '.'), so the column stays VARCHAR; null_rate 0.001022 (11 nulls) means nulls
      are retained.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fractional coordinate values (min -62.187801, max 82.512802) justify casting
      DECIMAL(38,9) to DOUBLE; null_rate 0.220911 (2377 nulls) so nulls are retained.
  - name: le_longitude_deg
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fractional coordinate values (min -179.881256, max 179.338837) justify casting
      DECIMAL(38,9) to DOUBLE; null_rate 0.221283 (2381 nulls) so nulls are retained.
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values (-1246.0 through -69.0) and min -1246.0 / max 13202.0 are
      integral, so DECIMAL(38,9) is cast to INTEGER; null_rate 0.276301 (2973 nulls) so nulls
      are retained.
  - name: le_heading_deg_true
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fractional sample_values (0.2, 1.12) show the heading carries decimals, so
      DECIMAL(38,9) is cast to DOUBLE; renamed to spell out 'degrees true' for clarity. null_rate
      0.228346 (2457 nulls) so nulls are retained.
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All samples (1.0 through 57.0) and min 1.0 / max 4250.0 are integral, so
      DECIMAL(38,9) is cast to INTEGER; the column is sparsely populated with null_rate 0.884201
      (9514 nulls) and nulls are retained.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Runway-end designators with distinct_count 177 and non-numeric samples ('01L',
      '-', '.'), so the column stays VARCHAR; null_rate 0.004926 (53 nulls) means nulls are
      retained.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fractional coordinate values (min -62.193901, max 82.522797) justify casting
      DECIMAL(38,9) to DOUBLE; null_rate 0.222212 (2391 nulls) so nulls are retained.
  - name: he_longitude_deg
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fractional coordinate values (min -179.873184, max 179.343002) justify casting
      DECIMAL(38,9) to DOUBLE; null_rate 0.222212 (2391 nulls) so nulls are retained.
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All sample_values (-1210.0 through -69.0) and min -1210.0 / max 13314.0 are
      integral, so DECIMAL(38,9) is cast to INTEGER; null_rate 0.276208 (2972 nulls) so nulls
      are retained.
  - name: he_heading_deg_true
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fractional samples (0.1 through 0.9) show decimals, so DECIMAL(38,9) is cast
      to DOUBLE and renamed to spell out 'degrees true'; null_rate 0.227138 (2444 nulls) so
      nulls are retained. Note max 362.0 exceeds the 360-degree compass range.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: All samples (10.0 through 76.0) and min 10.0 / max 4790.0 are integral, so
      DECIMAL(38,9) is cast to INTEGER; the column is sparsely populated with null_rate 0.899907
      (9683 nulls) and nulls are retained.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
