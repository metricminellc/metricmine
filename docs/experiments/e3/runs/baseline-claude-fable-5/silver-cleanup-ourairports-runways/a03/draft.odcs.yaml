apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_runways
name: Silver ourairports runways
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'Cleaned runway reference data from the OurAirports source: one row per runway
    (grain: id), carrying the owning airport (airport_ref, airport_ident), physical dimensions
    (length_ft, width_ft), surface and status flags (lighted, closed), and low-end/high-end
    runway-end geometry (identifiers, coordinates, elevations, headings, displaced thresholds).
    It feeds airport and runway analytics and joins to airport dimension tables on airport_ref
    or airport_ident.'
  usage: Read one row per runway id; join to airports on airport_ref (numeric id) or airport_ident
    (code). Consumers should deliberately filter closed = false for active-runway analyses
    and expect roughly 22-28% null rates on runway-end coordinates, elevations, and headings,
    and about 88-90% nulls on displaced thresholds, since most runways simply lack those attributes.
    The surface column is uncontrolled free text with 239 spellings and must be normalized
    by the consumer if grouped on.
  limitations: The cleanup does not normalize the 239 free-text surface values, does not impute
    the missing runway-end geometry (null rates 0.220911 to 0.276301 on coordinates and elevations,
    0.884201 and 0.899907 on displaced thresholds), and retains a he_heading_degt max of 362.0
    that exceeds the valid compass range. length_ft includes a min of 0.0, which may indicate
    unknown rather than zero-length runways; no row filtering was applied.
schema:
- name: silver_ourairports_runways
  physicalName: silver_ourairports_runways
  logicalType: object
  physicalType: table
  description: 'Cleaned runway reference data from the OurAirports source: one row per runway
    (grain: id), carrying the owning airport (airport_ref, airport_ident), physical dimensions
    (length_ft, width_ft), surface and status flags (lighted, closed), and low-end/high-end
    runway-end geometry (identifiers, coordinates, elevations, headings, displaced thresholds).
    It feeds airport and runway analytics and joins to airport dimension tables on airport_ref
    or airport_ident.'
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate 0.0 and distinct_count 10760 equals row_count 10760, so this is
      a unique identifier; all samples ('232758', '232759') are integral digit strings, supporting
      a VARCHAR to INTEGER cast.
  - name: airport_ref
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate 0.0 with distinct_count 7591; all samples ('10309', '10366', '1058')
      are integral digit strings pointing to a numeric airport id, supporting a cast to INTEGER.
  - name: airport_ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 7591 matching airport_ref; samples ('03N',
      '07FA', '19AK') are alphanumeric airport codes, so VARCHAR is kept.
  - name: length_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.007993 (86 nulls) so retained nullable; all samples (0.0, 2.0,
      20.0) and min 0.0 / max 16798.0 are integral, supporting a DECIMAL(38,9) to INTEGER
      cast.
  - name: width_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.082528 (888 nulls) so retained nullable; all samples (1.0, 10.0,
      15.0) and min 1.0 / max 7000.0 are integral, supporting a cast to INTEGER.
  - name: surface
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.022955 (247 nulls) with 239 distinct free-text surface codes
      ('ASP', 'ASPH-CONC', 'ASP/GVL'); the values are uncontrolled vocabulary so kept as nullable
      VARCHAR without normalization.
  - name: lighted
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: null_rate 0.0 and distinct_values are exactly [0.0, 1.0], so the DECIMAL(38,9)
      column is a 0/1 flag safely cast to BOOLEAN.
  - name: closed
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: null_rate 0.0 and distinct_values are exactly [0.0, 1.0], so the DECIMAL(38,9)
      column is a 0/1 flag safely cast to BOOLEAN.
  - name: le_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.001022 (11 nulls) with 199 distinct values; samples include non-numeric
      entries ('-12', '.', '01L'), so the runway-end identifier stays nullable VARCHAR.
  - name: le_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.220911 (2377 nulls) so retained nullable; min -62.187801 / max
      82.512802 fit a latitude in DECIMAL(9,6), tightening the landed DECIMAL(38,9).
  - name: le_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.221283 (2381 nulls) so retained nullable; min -179.881256 / max
      179.338837 fit a longitude in DECIMAL(9,6).
  - name: le_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276301 (2973 nulls) so retained nullable; all samples (-1246.0,
      -184.0) and min -1246.0 / max 13202.0 are integral, supporting a cast to INTEGER.
  - name: le_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.228346 (2457 nulls) so retained nullable; samples carry two-decimal
      precision (0.2, 1.12) with min 0.0 / max 360.0, fitting DECIMAL(5,2).
  - name: le_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sparsely populated with null_rate 0.884201 (9514 nulls) but retained; all
      samples (1.0, 2.0, 10.0) and min 1.0 / max 4250.0 are integral, supporting a cast to
      INTEGER.
  - name: he_ident
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate 0.004926 (53 nulls) with 177 distinct values; samples include non-numeric
      entries ('-', '.', '01L'), so kept as nullable VARCHAR.
  - name: he_latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.222212 (2391 nulls) so retained nullable; min -62.193901 / max
      82.522797 fit a latitude in DECIMAL(9,6).
  - name: he_longitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: null_rate 0.222212 (2391 nulls) so retained nullable; min -179.873184 / max
      179.343002 fit a longitude in DECIMAL(9,6).
  - name: he_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate 0.276208 (2972 nulls) so retained nullable; all samples (-1210.0,
      -181.0) and min -1210.0 / max 13314.0 are integral, supporting a cast to INTEGER.
  - name: he_heading_degt
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: null_rate 0.227138 (2444 nulls) so retained nullable; samples carry sub-degree
      precision (0.1, 0.2) and max is 362.0, which exceeds 360 and is kept as-landed rather
      than corrected.
  - name: he_displaced_threshold_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Sparsely populated with null_rate 0.899907 (9683 nulls) but retained; all
      samples (10.0, 30.0) and min 10.0 / max 4790.0 are integral, supporting a cast to INTEGER.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_runways
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
