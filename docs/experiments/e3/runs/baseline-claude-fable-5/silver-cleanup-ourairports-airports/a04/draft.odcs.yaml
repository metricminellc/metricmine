# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:10:21.635522+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_ourairports_airports
name: Silver ourairports airports
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_ourairports_airports is a cleaned, one-row-per-airport reference table of
    9,057 airports, heliports, and seaplane bases from the OurAirports source, carrying identifiers
    (id, ident, icao_code, iata_code, gps_code, local_code), classification (type, has_scheduled_service),
    location (latitude_deg, longitude_deg, elevation_ft, continent, iso_country, iso_region,
    municipality), and reference links. It feeds downstream dimensional models and geospatial
    joins that need a conformed airport dimension.
  usage: Join on id (the declared grain) or on ident/iata_code, both of which are also unique
    in this extract. has_scheduled_service is a BOOLEAN derived from the source's yes/no values.
    Consumers should expect nulls in elevation_ft (~3.7%), municipality (~4.0%), icao_code
    (~13.7%), gps_code (~5.4%), and especially local_code (~63.7%), keywords (~68.0%), and
    home_link (~74.9%), and must handle those nulls deliberately rather than assuming full
    population.
  limitations: No deduplication was applied because bronze shows duplicate_row_rate 0.0. Sparse
    columns (local_code 63.7% null, keywords 68.0% null, home_link 74.9% null) are retained
    as-is with no imputation. Coordinate precision was narrowed to six decimal places based
    on sampled values; keywords remains an unparsed comma-separated free-text field. The iata_code
    uniqueness observed here (9,057 distinct over 9,057 rows) should be re-verified against
    the full warehouse before being relied on as an alternate key, and the Airbyte capture
    columns were dropped, so extraction lineage must be traced in bronze.
schema:
- name: silver_ourairports_airports
  physicalName: silver_ourairports_airports
  logicalType: object
  physicalType: table
  description: silver_ourairports_airports is a cleaned, one-row-per-airport reference table
    of 9,057 airports, heliports, and seaplane bases from the OurAirports source, carrying
    identifiers (id, ident, icao_code, iata_code, gps_code, local_code), classification (type,
    has_scheduled_service), location (latitude_deg, longitude_deg, elevation_ft, continent,
    iso_country, iso_region, municipality), and reference links. It feeds downstream dimensional
    models and geospatial joins that need a conformed airport dimension.
  properties:
  - name: id
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Landed as VARCHAR with null_rate 0.0 and distinct_count 9057 equal to row_count;
      all sample_values (e.g. '10309', '10366', '111') are integral digit strings, so the
      cast to INTEGER is safe and the column uniquely identifies a row.
  - name: ident
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Alphanumeric airport identifier with null_rate 0.0 and distinct_count 9057
      equal to row_count; samples like '03N' and '07FA' are not uniformly numeric so it stays
      VARCHAR.
  - name: type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Low-cardinality category with null_rate 0.0 and distinct_count 5 (heliport,
      large_airport, medium_airport, seaplane_base, small_airport); kept as VARCHAR.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Human-readable airport name with null_rate 0.0 and distinct_count 9006; free
      text like 'A Coruña Airport' stays VARCHAR.
  - name: latitude_deg
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: true
    description: null_rate 0.0 with min -79.777778 and max 82.517263, inside the valid latitude
      range; samples show at most six decimal places so DECIMAL(9,6) replaces the oversized
      landed DECIMAL(38,9).
  - name: longitude_deg
    logicalType: number
    physicalType: DECIMAL(10,6)
    required: true
    description: null_rate 0.0 with min -179.876999 and max 179.9757, inside the valid longitude
      range; samples show at most six decimal places so DECIMAL(10,6) replaces the oversized
      landed DECIMAL(38,9).
  - name: elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: min -1266.0 and max 14472.0 with every sample integral (e.g. -1266.0, -210.0),
      so the DECIMAL(38,9) landed type casts cleanly to INTEGER; null_rate 0.036988 (335 nulls)
      so nulls are retained.
  - name: continent
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 7 covering the two-letter continent codes
      (AF, AN, AS, EU, NA, OC, SA); kept as VARCHAR.
  - name: iso_country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 239; samples (AD, AE, AF) are ISO 3166-1
      alpha-2 codes, kept as VARCHAR.
  - name: iso_region
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 with distinct_count 2169; samples (AD-08, AE-AZ) are ISO 3166-2
      region codes, kept as VARCHAR.
  - name: municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Free-text city name with distinct_count 8049 and null_rate 0.039748 (360
      nulls); nulls are retained.
  - name: has_scheduled_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: null_rate 0.0 and exactly two distinct_values ('yes', 'no'), so the column
      maps deterministically to BOOLEAN; renamed to has_scheduled_service to read as a flag.
  - name: icao_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ICAO identifier with distinct_count 7820 and null_rate 0.136579 (1237 nulls);
      nulls retained since not every airport carries an ICAO code.
  - name: iata_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate 0.0 and distinct_count 9057 equal to row_count, so every row carries
      a unique IATA code in this extract (samples AAA, AAB, AAC).
  - name: gps_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: GPS identifier with distinct_count 8569 and null_rate 0.053881 (488 nulls);
      nulls retained.
  - name: local_code
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated: null_rate 0.636635 (5766 nulls) with distinct_count
      3193; retained nullable because the value is meaningful where present.'
  - name: home_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated URL column: null_rate 0.749034 (6784 nulls) with distinct_count
      2272 and samples that are well-formed http URLs; retained nullable.'
  - name: wikipedia_link
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: URL column with distinct_count 7870 and null_rate 0.130838 (1185 nulls);
      samples are well-formed Wikipedia URLs, nulls retained.
  - name: keywords
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 'Sparsely populated free-text column: null_rate 0.679585 (6155 nulls) with
      distinct_count 2883; samples mix codes and comma-separated phrases so it stays VARCHAR
      and nulls are retained.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (id) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT id
        FROM silver.silver_ourairports_airports
        GROUP BY id
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
