# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T19:24:02.556447+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_airport_weather_observations_mapping
name: Gold mapping, airport_weather_observations category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'This mapping declares how silver.silver_airport_weather enters the gold unified
    event star as the airport_weather_observations fact category: it names the event time
    column and its hour grain, declares the transaction grain with a derived identity over
    (airport_code, observed_hour_utc), and assigns every silver column a role. Its consumer
    is the deterministic modeling engine, which renders the gold models from this contract.'
  usage: The proposal is rendered to an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, gated by the validator and datacontract lint, and reviewed
    and edited by a human before approval; only the approved contract drives model generation,
    and nothing in this proposal executes directly.
  limitations: The mapping names silver columns as-is and declares no transformations, filters,
    quality rules, or derived columns beyond the declared line identity. It does not exclude
    or correct suspect readings such as the wind_speed_mph maximum of 1048.36058 mph, does
    not impute the nulls in wind_gust_mph (null_rate 0.745505), pressure_mb (0.114953), wind_dir_degrees
    (0.016828), or wind_speed_mph (0.000154), and leaves local-time versus UTC reporting choices
    to consumers via the observed_date_local and observed_hour_local dimensions.
schema:
- name: airport_weather_observations
  logicalType: object
  physicalType: mapping
  description: One row is one hourly weather observation recorded at one of three New York
    area airports (EWR, JFK, LGA), carrying the measured conditions for that station-hour
    (temperature, dewpoint, humidity, wind, precipitation, pressure, visibility) together
    with static attributes of the observing airport.
  entityGroup: airport_weather_observations
  sourceTable: silver.silver_airport_weather
  timeColumn: observed_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: observation_identity
      derivation: canonical-key-v2
      of:
      - airport_code
      - observed_hour_utc
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: IATA code of the observing airport; the profile shows exactly three values
      (EWR, JFK, LGA) with null_rate 0.0, identifying the station for each observation.
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: UTC timestamp of the observation hour; samples such as 2013-01-01T06:00:00
      resolve to whole hours (minutes always :00) spanning 2013-01-01 to 2013-07-01 with null_rate
      0.0.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local calendar date of the observation (181 distinct dates from 2013-01-01
      to 2013-06-30, null_rate 0.0), a label alongside the UTC event time rather than the
      event time itself.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local hour of day (0 through 23, 24 distinct values, null_rate 0.0); a numeric
      label of when the observation occurred locally, not a quantity to be summed.
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Air temperature in degrees Fahrenheit, ranging from 10.94 to 93.92 in the
      profile with null_rate 0.0, compared and averaged across observations.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Dewpoint temperature in degrees Fahrenheit, ranging from -9.94 to 73.94 with
      null_rate 0.0, compared across observations as a measure.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Relative humidity percentage from 12.74 to 100.0 with null_rate 0.0, a continuous
      measurement compared across observations.
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Compass wind direction in degrees (0 to 360 in steps of 10 per the samples);
      nullable at null_rate 0.016828, likely absent when wind is calm or direction is unreported,
      and treated as a dimension because degrees label a direction rather than measure a quantity.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Wind speed in miles per hour from 0.0 to 1048.36058 (the max suggests occasional
      sensor outliers); nullable at null_rate 0.000154 for a handful of unreported readings.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Peak wind gust in miles per hour from 16.11092 to 62.14212; nullable at null_rate
      0.745505 because gusts are only reported when they occur.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Hourly precipitation in inches from 0.0 to 1.06 with null_rate 0.0, an additive
      quantity summed across hours.
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    mappingRole: measure
    description: Sea-level pressure in millibars from 983.8 to 1038.4; nullable at null_rate
      0.114953, suggesting the barometric reading is not reported every hour.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    mappingRole: measure
    description: Visibility in miles reported on a 20-value scale from 0.0 to 10.0 with null_rate
      0.0, compared across observations as a measure.
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airport name with three distinct values (e.g. John F. Kennedy International
      Airport) and null_rate 0.0, a descriptive label for the station.
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Municipality the airport serves, two distinct values (New York, Newark) with
      null_rate 0.0, a geographic label.
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Airport elevation in feet with three distinct values (13, 18, 21) matching
      the three stations and null_rate 0.0; a static attribute of the airport, not a quantity
      summed across rows.
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Length of the airport's longest runway in feet with three distinct values
      (7002, 11000, 14511) matching the three stations and null_rate 0.0; a static airport
      attribute used as a label.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Pipeline capture timestamp with three distinct values within seconds of each
      other on 2026-09-02 and null_rate 0.0, a load-batch label rather than an event time.
