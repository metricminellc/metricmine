# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:58:30.976679+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: Cleaned flight-level record of the 166,158 departures from the three NYC airports
    (EWR, JFK, LGA) in January through June 2013, typed from Airbyte-landed decimals and strings
    into native integers and timestamps. It feeds on-time performance analysis, carrier and
    route reporting, and downstream gold aggregates.
  usage: One row per scheduled departure, keyed by year, month, day, carrier, flight, origin,
    dest, and sched_dep_time. Consumers computing delay or air-time statistics must deliberately
    filter out cancelled flights using is_cancelled (or equivalently dep_time IS NOT NULL),
    since roughly 2.9% of rows carry null actuals. Note that dep_time, sched_dep_time, arr_time,
    and sched_arr_time are HHMM-encoded integers (e.g. 517 means 05:17), not minutes or TIME
    values; time_hour is the proper TIMESTAMP for joins to hourly data.
  limitations: Covers only 2013 months 1-6 and NYC origins. Cancelled or incomplete flights
    leave dep_time/dep_delay null at rate 0.029388 and arr_time at 0.0307, with arr_delay
    and air_time null at 0.032981; these nulls are retained, not imputed. tailnum is null
    for 0.9% of rows (1521), and one sample (D942DN) does not follow the N-prefixed US registration
    pattern, suggesting occasional malformed tail numbers that this cleanup does not correct.
    HHMM clock columns were not converted to TIME types because the observed max of 2400 is
    outside the valid TIME range.
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: Cleaned flight-level record of the 166,158 departures from the three NYC airports
    (EWR, JFK, LGA) in January through June 2013, typed from Airbyte-landed decimals and strings
    into native integers and timestamps. It feeds on-time performance analysis, carrier and
    route reporting, and downstream gold aggregates.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Landed as DECIMAL(38,9) with null_rate 0.0 and a single distinct value 2013.0;
      every value is integral, so a cast to INTEGER is lossless.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Landed as DECIMAL(38,9) with null_rate 0.0 and 6 distinct integral values
      1.0 through 6.0 (first half of 2013), so a cast to INTEGER is lossless.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Landed as DECIMAL(38,9) with null_rate 0.0, 31 distinct values, min 1.0 and
      max 31.0, all samples integral; a cast to INTEGER is lossless.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with integral samples (1.0 to 10.0), min 1.0, max
      2400.0 (HHMM encoding); null_rate 0.029388 (4883 nulls) corresponds to flights that
      never departed, so nulls are retained.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: dep_time has 4883 nulls (null_rate 0.029388), closely tracking arr_time's
      5101 nulls; a null actual departure marks a flight that never left, so a boolean flag
      derived from dep_time IS NULL makes cancelled flights explicitly filterable.
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 8
    description: Landed as DECIMAL(38,9) with null_rate 0.0, min 500.0, max 2359.0, and integral
      samples (500.0, 501.0, 505.0...), consistent with HHMM encoding; cast to INTEGER is
      lossless.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with integral samples (-33.0 to -19.0), min -33.0,
      max 1301.0 minutes; null_rate 0.029388 matches dep_time exactly, so nulls belong to
      cancelled flights and are retained.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with integral samples, min 1.0, max 2400.0 (HHMM
      encoding); null_rate 0.0307 (5101 nulls) covers cancelled and diverted flights, so nulls
      are retained.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0, min 1.0, max 2359.0, and all
      samples integral (HHMM encoding); cast to INTEGER is lossless.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with integral samples (-86.0 to -67.0), min -86.0,
      max 1272.0 minutes; null_rate 0.032981 (5480 nulls) matches air_time, indicating flights
      with no recorded arrival, so nulls are retained.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: VARCHAR with null_rate 0.0 and 16 distinct two-letter IATA carrier codes
      (9E, AA, AS, B6, DL...); kept as-is.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: Landed as DECIMAL(38,9) with null_rate 0.0, 2994 distinct values, min 1.0,
      max 8500.0, all samples integral; flight numbers cast losslessly to INTEGER.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: VARCHAR aircraft registration with 3825 distinct values (samples N10156,
      N102UW...); null_rate 0.009154 (1521 nulls), so nulls are retained rather than imputed.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: VARCHAR with null_rate 0.0 and exactly 3 distinct values (EWR, JFK, LGA),
      the NYC origin airports; kept as-is.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: VARCHAR with null_rate 0.0 and 100 distinct three-letter destination airport
      codes (samples ABQ, ACK, ALB, ATL...); kept as-is.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Landed as DECIMAL(38,9) with integral samples (20.0 to 29.0), min 20.0, max
      695.0 minutes; null_rate 0.032981 (5480 nulls) matches arr_delay, so nulls are retained.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0, min 80.0, max 4983.0 miles, and
      all samples integral (80.0, 94.0, 96.0...); cast to INTEGER is lossless.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0 and 19 distinct integral values
      5.0 through 23.0; cast to INTEGER is lossless.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) with null_rate 0.0, 60 distinct values, min 0.0,
      max 59.0, all samples integral; cast to INTEGER is lossless.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: VARCHAR with null_rate 0.0 and 3439 distinct values; all samples are ISO-8601
      timestamps (e.g. 2013-01-01T10:00:00Z), so the cast to TIMESTAMP is supported by every
      observed value.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, carrier, flight, origin,
      dest, sched_dep_time) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, carrier, flight, origin, dest, sched_dep_time
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, carrier, flight, origin, dest, sched_dep_time
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
