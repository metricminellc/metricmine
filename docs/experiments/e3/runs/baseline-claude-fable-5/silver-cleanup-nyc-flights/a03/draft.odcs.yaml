# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_flights is the cleaned flight-level table of all 166158 NYC departures
    (EWR, JFK, LGA) for January through June 2013, typed from the landed DECIMAL/VARCHAR bronze
    into integers and timestamps and stripped of Airbyte capture columns. It feeds on-time-performance
    analysis, carrier comparisons, and route-level aggregates.
  usage: Read one row per scheduled departure, keyed by year, month, day, sched_dep_time,
    carrier, flight, and origin. Flights that never departed carry is_cancelled true and null
    dep_time, dep_delay, arr_time, arr_delay, and air_time; consumers computing delay statistics
    must filter is_cancelled or handle nulls deliberately. Times dep_time, sched_dep_time,
    arr_time, and sched_arr_time are HHMM-encoded integers, not minutes; use time_hour (TIMESTAMP)
    for time-series joins.
  limitations: 'Nulls are retained, not resolved: about 2.9% of rows lack departure data (dep_time
    null_rate 0.029388), about 3.3% lack arrival outcomes (arr_delay and air_time null_rate
    0.032981), and 0.9% of rows have no tailnum. Arrival-side nulls for flights that departed
    (arr_time null_rate 0.0307 exceeds the departure null rate) may indicate diverted flights
    the cleanup does not distinguish. HHMM time columns are kept as integers (including 2400.0
    as a max) rather than normalized to clock types, and the declared grain has not yet been
    verified against the full warehouse.'
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: silver_nyc_flights is the cleaned flight-level table of all 166158 NYC departures
    (EWR, JFK, LGA) for January through June 2013, typed from the landed DECIMAL/VARCHAR bronze
    into integers and timestamps and stripped of Airbyte capture columns. It feeds on-time-performance
    analysis, carrier comparisons, and route-level aggregates.
  properties:
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Single distinct value 2013.0 landed as DECIMAL(38,9) with null_rate 0.0;
      every value is integral so an INTEGER cast is lossless.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: 6 distinct values 1.0 through 6.0, null_rate 0.0; all integral, so DECIMAL(38,9)
      casts safely to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: 31 distinct values with min 1.0 and max 31.0, null_rate 0.0; samples (1.0..10.0)
      are all integral day-of-month values, justifying INTEGER.
  - name: dep_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: HHMM-style values with min 1.0 and max 2400.0, all integral in samples; null_count
      4883 (null_rate 0.029388) marks flights without a recorded departure, retained as null.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'Derived true when dep_time is null: 4883 rows (null_rate 0.029388) have
      no actual departure time, the standard marker for flights that never departed; the flag
      makes that record kind explicit for consumers.'
  - name: sched_dep_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: 969 distinct integral HHMM values (min 500.0, max 2359.0) with null_rate
      0.0; INTEGER cast is lossless.
  - name: dep_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Delay in minutes with min -33.0 and max 1301.0, all samples integral; null_count
      4883 (null_rate 0.029388) matches dep_time nulls and is retained as null.
  - name: arr_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Integral HHMM values (min 1.0, max 2400.0, 1392 distinct); null_count 5101
      (null_rate 0.0307) covers flights with no recorded arrival, retained as null.
  - name: sched_arr_time
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 1134 distinct integral HHMM values (min 1.0, max 2359.0) with null_rate 0.0;
      INTEGER cast is lossless.
  - name: arr_delay
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Delay in minutes with min -86.0 and max 1272.0, all samples integral; null_count
      5480 (null_rate 0.032981) reflects flights without a measured arrival delay, retained
      as null.
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: 16 distinct two-character IATA carrier codes (9E, AA, AS, ...) with null_rate
      0.0; kept as VARCHAR.
  - name: flight
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 6
    description: 2994 distinct integral flight numbers (min 1.0, max 8500.0) with null_rate
      0.0; INTEGER cast is lossless.
  - name: tailnum
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: 3825 distinct aircraft tail numbers (samples like N10156, N102UW); null_count
      1521 (null_rate 0.009154) retained as null rather than imputed.
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 7
    description: Exactly 3 distinct origin airport codes (EWR, JFK, LGA) with null_rate 0.0;
      kept as VARCHAR.
  - name: dest
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 100 distinct three-letter destination codes (samples ABQ, ACK, ALB, ATL)
      with null_rate 0.0; kept as VARCHAR.
  - name: air_time
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: 484 distinct integral minute values (min 20.0, max 695.0); null_count 5480
      (null_rate 0.032981) matches arr_delay nulls and is retained as null.
  - name: distance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 203 distinct integral mile values (min 80.0, max 4983.0) with null_rate 0.0;
      INTEGER cast is lossless.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 19 distinct integral hour values 5.0 through 23.0 with null_rate 0.0; INTEGER
      cast is lossless.
  - name: minute
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 60 distinct integral minute values (min 0.0, max 59.0) with null_rate 0.0;
      INTEGER cast is lossless.
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: All 10 samples are ISO-8601 UTC timestamps (e.g. 2013-01-01T10:00:00Z) across
      3439 distinct values with null_rate 0.0, supporting a VARCHAR to TIMESTAMP cast.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (year, month, day, sched_dep_time, carrier,
      flight, origin) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT year, month, day, sched_dep_time, carrier, flight, origin
        FROM silver.silver_nyc_flights
        GROUP BY year, month, day, sched_dep_time, carrier, flight, origin
        HAVING COUNT(*) > 1
      )
    mustBe: 0
