# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T19:00:12.134547+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_weather is the cleaned hourly weather observation table for the three
    NYC-area airports (EWR, JFK, LGA) in the first half of 2013, derived from bronze.nyc_weather.
    It provides typed, snake_case weather readings at the station-hour grain for joining to
    flight and operations tables.
  usage: 'Read one row per (origin, time_hour), where time_hour is a proper UTC TIMESTAMP.
    Numeric readings are typed as DOUBLE and calendar parts as INTEGER. Consumers must handle
    nulls deliberately: wind_gust is null on about 74.6% of rows, pressure on about 11.5%,
    and wind_dir and wind_speed occasionally; no imputation was performed.'
  limitations: 'The cleanup retains all sparse columns rather than imputing: wind_gust (null_rate
    0.745505), pressure (0.114953), wind_dir (0.016828), and wind_speed (0.000154) carry nulls
    through to silver. The wind_speed max of 1048.36058 is a likely sensor or unit outlier
    that was not filtered. The declared (origin, time_hour) grain was inferred from distinct
    counts (3 origins x 4341 hours vs 13014 rows) and must be confirmed against the warehouse
    before approval; data covers only January through June 2013.'
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: silver_nyc_weather is the cleaned hourly weather observation table for the
    three NYC-area airports (EWR, JFK, LGA) in the first half of 2013, derived from bronze.nyc_weather.
    It provides typed, snake_case weather readings at the station-hour grain for joining to
    flight and operations tables.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Weather station airport code with null_rate 0.0 and distinct_count 3 (EWR,
      JFK, LGA); kept as-is and used as part of the grain.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Landed as DECIMAL(38,9) but the single distinct value 2013.0 (null_rate 0.0)
      is integral, so casting to INTEGER is lossless.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: All 6 distinct values (1.0 through 6.0, null_rate 0.0) are integral, so the
      DECIMAL(38,9) landing type casts cleanly to INTEGER.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 31 distinct values with min 1.0 and max 31.0 and integral samples (1.0..10.0,
      null_rate 0.0) support casting DECIMAL(38,9) to INTEGER.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 24 distinct values from 0.0 to 23.0 with integral samples and null_rate 0.0
      support casting DECIMAL(38,9) to INTEGER.
  - name: temp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Temperature with 130 distinct values, min 10.94, max 93.92, null_rate 0.0;
      samples carry two decimal places, so DOUBLE replaces the over-wide DECIMAL(38,9).
  - name: dewp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Dew point with 119 distinct values, min -9.94, max 73.94, null_rate 0.0;
      fractional samples keep it numeric as DOUBLE.
  - name: humid
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Relative humidity with 2178 distinct values, min 12.74, max 100.0, null_rate
      0.0; cast DECIMAL(38,9) to DOUBLE.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Wind direction has 37 distinct values from 0.0 to 360.0 and every sample
      is an integral multiple of 10, supporting an INTEGER cast; null_rate 0.016828 (219 nulls)
      so nulls are retained.
  - name: wind_speed
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Wind speed has fractional samples (e.g. 3.45234) and a suspicious max of
      1048.36058; null_rate 0.000154 (2 nulls) so it is nullable DOUBLE and the outlier is
      noted in limitations.
  - name: wind_gust
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: 'Sparsely populated: null_rate 0.745505 (9702 of 13014 rows null); non-null
      values range 16.11092 to 62.14212 and are retained as nullable DOUBLE.'
  - name: precip
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Precipitation with 50 distinct values, min 0.0, max 1.06, null_rate 0.0;
      fractional samples (0.01, 0.02) keep it a DOUBLE.
  - name: pressure
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sea-level pressure with 430 distinct values, min 983.8, max 1038.4; null_rate
      0.114953 (1496 nulls) so nulls are retained and the column is not required.
  - name: visib
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Visibility has exactly 20 distinct values from 0.0 to 10.0 including fractional
      values (0.06, 0.12, 0.25) with null_rate 0.0, so DOUBLE replaces DECIMAL(38,9).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: All 10 samples are ISO-8601 UTC timestamps (e.g. 2013-01-01T06:00:00Z) with
      null_rate 0.0, supporting a VARCHAR to TIMESTAMP cast; 4341 distinct hours across 3
      stations roughly matches the 13014 rows.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
