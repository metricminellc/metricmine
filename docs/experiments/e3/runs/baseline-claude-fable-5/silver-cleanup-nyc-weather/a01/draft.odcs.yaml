# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T18:59:27.324888+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_weather provides cleaned hourly weather observations for the three New
    York City area airports (EWR, JFK, LGA) during the first half of 2013, derived from the
    bronze nyc_weather landing table. It feeds flight-delay analysis and any downstream model
    joining weather conditions to operations at the origin-airport, hour grain.
  usage: 'Read one row per (origin, time_hour), where time_hour is a proper TIMESTAMP in UTC.
    Join to flight data on origin and time_hour. Consumers must handle nulls deliberately:
    wind_gust is null on roughly 75% of rows (gusts are recorded only when they occur), pressure
    is null on about 11.5% of rows, and wind_dir and wind_speed carry a small number of nulls.
    Be aware that wind_speed contains at least one extreme value (max 1048.36058) retained
    from source.'
  limitations: Coverage is limited to 2013 months 1 through 6 (year has a single value 2013.0,
    month values 1.0-6.0). Nulls in wind_gust (74.55%), pressure (11.50%), wind_dir (1.68%),
    and wind_speed (0.02%) are retained without imputation. The implausible wind_speed maximum
    of 1048.36058 was not corrected or filtered, as the cleanup does not alter measured values.
    No clock-drift or duplicate handling was applied because duplicate_row_rate is 0.0.
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: silver_nyc_weather provides cleaned hourly weather observations for the three
    New York City area airports (EWR, JFK, LGA) during the first half of 2013, derived from
    the bronze nyc_weather landing table. It feeds flight-delay analysis and any downstream
    model joining weather conditions to operations at the origin-airport, hour grain.
  properties:
  - name: origin
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Three distinct values (EWR, JFK, LGA) with null_rate 0.0 across 13014 rows;
      airport code kept as-is as part of the grain.
  - name: year
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Single distinct value 2013.0 with null_rate 0.0; landed DECIMAL(38,9) values
      are integral, so cast to INTEGER.
  - name: month
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Six distinct integral values 1.0 through 6.0 with null_rate 0.0; cast DECIMAL(38,9)
      to INTEGER since every value is a whole month number.
  - name: day
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 31 distinct values, min 1.0 max 31.0, null_rate 0.0, all samples integral;
      cast DECIMAL(38,9) to INTEGER as a day-of-month.
  - name: hour
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: 24 distinct values, min 0.0 max 23.0, null_rate 0.0, all samples integral;
      cast DECIMAL(38,9) to INTEGER as an hour-of-day.
  - name: temp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: 130 distinct values, min 10.94 max 93.92, null_rate 0.0; fractional temperature
      readings cast from DECIMAL(38,9) to DOUBLE.
  - name: dewp
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: 119 distinct values, min -9.94 max 73.94, null_rate 0.0; fractional dewpoint
      readings cast from DECIMAL(38,9) to DOUBLE.
  - name: humid
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: 2178 distinct values, min 12.74 max 100.0, null_rate 0.0; relative humidity
      cast from DECIMAL(38,9) to DOUBLE.
  - name: wind_dir
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: 37 distinct values, min 0.0 max 360.0, all samples integral multiples of
      10 (compass degrees), so cast to INTEGER; null_rate 0.016828 (219 nulls) retained as
      calm or unreported wind.
  - name: wind_speed
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: 36 distinct fractional values, min 0.0 max 1048.36058, cast from DECIMAL(38,9)
      to DOUBLE; null_rate 0.000154 (2 nulls) retained; the extreme max suggests a possible
      outlier worth a review check.
  - name: wind_gust
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: 'Sparsely populated with null_rate 0.745505 (9702 nulls): gusts are only
      recorded when they occur; 35 distinct fractional values (min 16.11092, max 62.14212)
      cast to DOUBLE, nulls retained.'
  - name: precip
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: true
    description: 50 distinct values, min 0.0 max 1.06 with two-decimal samples (0.01, 0.02,
      ...), null_rate 0.0; cast from DECIMAL(38,9) to DECIMAL(5,2).
  - name: pressure
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: 430 distinct values, min 983.8 max 1038.4, cast from DECIMAL(38,9) to DOUBLE;
      null_rate 0.114953 (1496 nulls) retained as missing station readings.
  - name: visib
    logicalType: number
    physicalType: DECIMAL(4,2)
    required: true
    description: 20 distinct values from 0.0 to 10.0 at most two decimal places (e.g. 0.06,
      0.12, 1.25), null_rate 0.0; cast from DECIMAL(38,9) to DECIMAL(4,2).
  - name: time_hour
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: 4341 distinct values, null_rate 0.0, and every sample is ISO-8601 UTC (e.g.
      2013-01-01T06:00:00Z), so the VARCHAR is cast to TIMESTAMP; part of the grain.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (origin, time_hour) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT origin, time_hour
        FROM silver.silver_nyc_weather
        GROUP BY origin, time_hour
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
