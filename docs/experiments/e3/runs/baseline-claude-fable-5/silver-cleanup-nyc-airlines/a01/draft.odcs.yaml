apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_airlines is a cleaned airline reference table mapping each two-letter
    IATA carrier code to its full airline name, sourced from the bronze nyc_airlines landing
    table. It feeds joins from flight-level tables that carry only the carrier code.
  usage: Join on carrier (the declared grain and primary key) to resolve a carrier code to
    its airline name. The table is small (16 rows) and fully populated; both columns are required,
    so consumers need no null handling.
  limitations: 'Cleanup is minimal: bronze showed 0.0 duplicate_row_rate and 0.0 null_rate
    on both business columns, so no rows were excluded or repaired. Airbyte capture columns
    were dropped, so lineage back to the extraction timestamp is not carried in silver. Coverage
    is limited to the 16 carriers present in the bronze snapshot; carriers absent from the
    source will not resolve in joins.'
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: silver_nyc_airlines is a cleaned airline reference table mapping each two-letter
    IATA carrier code to its full airline name, sourced from the bronze nyc_airlines landing
    table. It feeds joins from flight-level tables that carry only the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Two-letter IATA carrier code with null_rate 0.0 and distinct_count 16 across
      16 rows (e.g. 9E, AA, DL), making it a complete, unique identifier.
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full airline name with null_rate 0.0 and distinct_count 16 across 16 rows
      (e.g. Delta Air Lines Inc., JetBlue Airways), fully populated and unique.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
