apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_airlines is a cleaned reference table mapping each two-letter IATA carrier
    code to its full airline name, derived from bronze.nyc_airlines. It feeds joins from flight-level
    tables that carry only the carrier code and need a human-readable airline name.
  usage: Join on carrier (the declared grain and primary key) to enrich flight records with
    the airline name. Both columns are non-null and the table holds exactly one row per carrier
    code, so lookups are safe without deduplication or null guards.
  limitations: The table reflects a single capture batch (all rows extracted at 2026-09-02T23:26:17)
    covering 16 carriers; airlines not present in the source feed will not resolve in joins.
    Carrier codes are not validated against an external IATA registry, only against the landed
    data, which showed 0.0 null_rate and no duplicates.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: silver_nyc_airlines is a cleaned reference table mapping each two-letter IATA
    carrier code to its full airline name, derived from bronze.nyc_airlines. It feeds joins
    from flight-level tables that carry only the carrier code and need a human-readable airline
    name.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Two-letter IATA carrier code with null_rate 0.0 and distinct_count 16 equal
      to row_count 16, making it a natural key (samples: 9E, AA, DL, WN).'
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 'Full carrier name with null_rate 0.0 and distinct_count 16 matching row_count
      16, one name per carrier code (samples: Delta Air Lines Inc., Southwest Airlines Co.).'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
