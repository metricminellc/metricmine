# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_airlines is a cleaned carrier lookup dimension mapping the two-letter
    IATA carrier code to the full airline name, sourced from bronze.nyc_airlines. It feeds
    joins from flight-level fact tables that carry only the carrier code.
  usage: 'Join on carrier (the declared grain and primary key) to enrich flight records with
    carrier_name. All 16 rows are complete: both columns have null_rate 0.0, so no null filtering
    is needed. Treat the table as a slowly changing reference set refreshed on each pipeline
    run.'
  limitations: The table reflects a single extraction (all rows extracted at 2026-09-02T23:26:17)
    and covers only the 16 carriers present in the source; carriers absent from the source
    period will not resolve in joins. No historical name changes or carrier mergers are tracked,
    and Airbyte capture metadata was dropped, so bronze must be consulted for lineage at the
    row level.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: silver_nyc_airlines is a cleaned carrier lookup dimension mapping the two-letter
    IATA carrier code to the full airline name, sourced from bronze.nyc_airlines. It feeds
    joins from flight-level fact tables that carry only the carrier code.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Two-letter IATA carrier code with null_rate 0.0 and distinct_count 16 equal
      to the row_count of 16, making it a natural unique key (samples: 9E, AA, DL, UA, WN).'
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 'Full airline name with null_rate 0.0 and distinct_count 16 (samples: Delta
      Air Lines Inc., JetBlue Airways); renamed from the generic ''name'' to carrier_name
      for clarity in downstream joins.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
