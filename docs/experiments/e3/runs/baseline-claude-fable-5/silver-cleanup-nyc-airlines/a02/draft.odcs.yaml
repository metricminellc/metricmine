apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_nyc_airlines is a small reference (lookup) table mapping two-letter IATA
    carrier codes to full airline names for the NYC flights domain, feeding joins that enrich
    flight-level facts with human-readable carrier names.
  usage: Join on carrier (the declared grain and primary key) to resolve airline names; both
    columns are non-null and the table holds exactly one row per carrier code, so joins are
    safe without deduplication. Treat it as a static dimension refreshed with each bronze
    load.
  limitations: The cleanup only drops the three Airbyte capture columns; no values were altered.
    The table reflects a single extraction snapshot (16 rows, duplicate_row_rate 0.0) and
    covers only the 16 carriers present in the source, so codes outside this set will not
    resolve in joins.
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: silver_nyc_airlines is a small reference (lookup) table mapping two-letter
    IATA carrier codes to full airline names for the NYC flights domain, feeding joins that
    enrich flight-level facts with human-readable carrier names.
  properties:
  - name: carrier
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Two-letter IATA carrier code with null_rate 0.0 and distinct_count 16 equal
      to row_count 16, making it a natural unique key (samples: 9E, AA, DL, UA, WN).'
  - name: name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 'Full airline name with null_rate 0.0 and distinct_count 16 matching row_count
      16; one name per carrier code (samples: Delta Air Lines Inc., United Air Lines Inc.,
      Southwest Airlines Co.).'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier
        FROM silver.silver_nyc_airlines
        GROUP BY carrier
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
