# Draft proposed by gold-mapping-proposer v0.1.0 at 2026-10-23T19:19:01.224736+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: gold_flight_departures_mapping
name: Gold mapping, flight_departures category
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This mapping declares how silver.silver_flights enters the gold unified event star
    as the flight_departures fact category, naming the time column, the transaction grain
    with its derived line identity, and the role of every mapped column; its sole consumer
    is the deterministic modeling engine that emits the gold models from it.
  usage: The proposal is rendered to an ODCS mapping contract draft, validated against the
    frozen mapping-contract schema, gated by the validator and datacontract lint, and reviewed
    and edited by a human before approval; only the approved contract drives the modeling
    engine, and nothing in this mapping executes directly.
  limitations: 'The mapping maps columns as-is and declares no transformations, filters, or
    quality rules: it does not exclude cancelled flights (is_cancelled is true on some rows
    and the actual-time and delay columns are null at rates near 0.029 to 0.033), does not
    repair the roughly 16 percent of rows missing aircraft registry attributes or the 2.089
    percent missing destination enrichment, and does not interpret captured_at (a 2026 load
    timestamp) as business time; consumers decide how to treat cancelled and unenriched rows.'
schema:
- name: flight_departures
  logicalType: object
  physicalType: mapping
  description: One row is one scheduled flight departure from a New York City origin airport
    (EWR, JFK, or LGA) on a given date, carrying its schedule, actual-performance outcomes
    (delays, air time, cancellation), and denormalized carrier, aircraft, and airport attributes.
  entityGroup: flight_departures
  sourceTable: silver.silver_flights
  timeColumn: flight_date
  timeGrain: day
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - sched_dep_hhmm
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: time
    description: Scheduled date of the flight, with 181 distinct daily values spanning 2013-01-01
      to 2013-06-30 and null_rate 0.0, timestamping every departure event at day resolution.
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-character IATA airline code with 16 distinct values such as AA, DL, and
      UA and null_rate 0.0, identifying the operating carrier.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Carrier-assigned flight number ranging 1 to 8500 with null_rate 0.0; a numeric
      identifier that labels the flight rather than measuring anything, so it maps as a dimension.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport code with exactly three distinct values EWR, JFK, and LGA
      and null_rate 0.0, confirming this is a New York departures dataset.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure time encoded as a clock integer in HHMM form (samples
      500 through 530, range 500 to 2359) with null_rate 0.0; a time label, not an additive
      quantity.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Destination airport code with 100 distinct values such as ATL, AUS, and BNA
      and null_rate 0.0.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft registration such as N10156 with 3825 distinct values; nullable
      at null_rate 0.009154, plausibly because cancelled flights never had an aircraft assigned.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: Cancellation flag with distinct values true and false and null_rate 0.0,
      labelling whether the scheduled departure actually operated.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure time as an HHMM clock integer (range 1 to 2400); nullable
      at null_rate 0.029388, consistent with cancelled flights that never departed, and a
      time label rather than a measure.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes ranging -33 (early) to 1301, an additive and comparable
      quantity; nullable at null_rate 0.029388, matching the actual-departure columns for
      flights that did not depart.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival time as an HHMM clock integer (range 1 to 2400); nullable
      at null_rate 0.0307 for flights that were cancelled or diverted, and a time label rather
      than a measure.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival time as an HHMM clock integer ranging 1 to 2359 with null_rate
      0.0; a schedule label, not an additive quantity.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes ranging -86 to 1272, an additive and comparable
      quantity; nullable at null_rate 0.032981 where no arrival was recorded.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Time in the air in minutes ranging 20 to 695, an additive duration; nullable
      at null_rate 0.032981, matching arr_delay_minutes for flights without a completed arrival.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Route distance in miles ranging 80 to 4983 with null_rate 0.0; an additive
      quantity usable for totals and per-mile comparisons.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local scheduled departure hour with 19 distinct values from 5 to 23 and null_rate
      0.0; a bucketing label for time-of-day analysis.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Local scheduled departure minute with 60 distinct values from 0 to 59 and
      null_rate 0.0; a clock label, not a measure.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Scheduled departure timestamp truncated to the hour in UTC (samples like
      2013-01-01T10:00:00, 3439 distinct values, null_rate 0.0); an alternative time label
      kept as a dimension since flight_date carries the event's time role.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full airline name with 16 distinct values such as Delta Air Lines Inc. and
      JetBlue Airways, matching the 16 carrier codes, with null_rate 0.0.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft manufacturer such as BOEING or AIRBUS with 34 distinct values; nullable
      at null_rate 0.160426 where the tail number did not join to an aircraft registry record.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft model designation such as 172N or 550 with 121 distinct values;
      nullable at null_rate 0.160426, matching the other aircraft registry attributes.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Year the aircraft was built, ranging 1956 to 2013; a numeric label of the
      airframe rather than a measure, nullable at null_rate 0.176531 where registry data is
      missing.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Seat capacity of the operating aircraft ranging 2 to 450, an additive quantity
      for offered-capacity analysis; nullable at null_rate 0.160426 where the aircraft registry
      join failed.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Engine type with 6 distinct values such as Turbo-fan and Reciprocating; nullable
      at null_rate 0.160426, matching the other aircraft attributes.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Full origin airport name with exactly three distinct values matching the
      three origin codes, null_rate 0.0.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin city with two distinct values, New York and Newark, and null_rate
      0.0.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin airport elevation in feet with only three distinct values (13, 18,
      21) tracking the three origins; a static airport attribute, so it labels rather than
      measures.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Longest runway at the origin in feet with three distinct values (7002, 11000,
      14511), one per origin airport; a static attribute mapped as a dimension.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Full destination airport name with 99 distinct values; nullable at null_rate
      0.02089 where the destination code did not resolve in the airport reference.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination city with 95 distinct values such as Atlanta and Austin; nullable
      at null_rate 0.02089, matching the other destination enrichment columns.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: ISO region of the destination such as US-GA or PR-U-A with 45 distinct values;
      nullable at null_rate 0.02089 for unresolved destinations.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination airport elevation in feet ranging 3 to 6606; a static airport
      attribute that labels the destination, nullable at null_rate 0.02089.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Longest runway at the destination in feet ranging 5076 to 16000; a static
      airport attribute mapped as a dimension, nullable at null_rate 0.02089.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: dimension
    description: Load capture timestamp with 16 distinct second-level values on 2026-09-02
      and null_rate 0.0; an ingestion provenance label, not the event time.
