      mustBe: 0
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Length of the longest runway at the origin airport, in feet.
    quality:
    - type: sql
      description: origin_longest_runway_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft IS NULL
      mustBe: 0
    - type: sql
      description: origin_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft < 0
      mustBe: 0
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Full name of the destination airport.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: City in which the destination airport is located.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: ISO region code (state or territory) of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Elevation of the destination airport above sea level, in feet.
    quality:
    - type: sql
      description: dest_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_elevation_ft < 0
      mustBe: 0
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Length of the longest runway at the destination airport, in feet.
