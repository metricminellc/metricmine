# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:50:33.902922+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_flights holds one row per scheduled flight departing from the New York City
    area (EWR, JFK, LGA) over the observed window (2013-01-01 through 2013-06-30), combining
    the flight's schedule and operational outcome (actual departure/arrival times, delays,
    cancellation status) with reference attributes about the carrier, the destination airport,
    and the operating aircraft.
  usage: Read the table at the grain of one scheduled flight instance, identified by flight_date,
    carrier_code, flight_number, and origin_airport; join to carrier_name for the carrier's
    full name, to the origin_* and dest_* columns for airport descriptive detail, and to the
    aircraft_* columns for aircraft detail, and use is_cancelled together with the *_hhmm
    and *_delay_minutes columns to interpret missing operational outcome values.
  limitations: 'The profile could not confirm the grain beyond table-level evidence: duplicate_row_rate
    0.0 shows only that whole rows are distinct, not which column subset identifies a row,
    so the proposed grain (flight_date, carrier_code, flight_number, origin_airport) needs
    deterministic verification against the warehouse. The aircraft reference columns (16.0%-17.7%
    null) and the destination reference columns (2.089% null) are sparse in a way consistent
    with unmatched reference joins, but the profile cannot confirm the join logic behind the
    gaps. captured_at is not flagged as Airbyte metadata in the profile, but its narrow, future-dated
    timestamp cluster strongly suggests it is a pipeline ingestion timestamp rather than flight
    data; this inference should be re-checked by a reviewer. The missingness pattern across
    dep_hhmm, dep_delay_minutes, arr_hhmm, arr_delay_minutes, and air_time_minutes appears
    tied to cancelled or incomplete flights but the profile cannot confirm this link definitively,
    since is_cancelled has null_rate 0.0 while these operational columns have higher null
    rates, suggesting some non-cancelled flights also lack recorded outcomes.'
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: The calendar date on which the flight was scheduled to operate.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: The two-character carrier code identifying the operating airline.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: The carrier-assigned flight number for the scheduled flight.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
    - type: sql
      description: flight_number is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number < 0
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: The three-letter airport code the flight departed from.
    quality:
    - type: sql
      description: origin_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport IS NULL
      mustBe: 0
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled departure time, expressed as an HHMM integer on a 24-hour clock.
    quality:
    - type: sql
      description: sched_dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hhmm < 0
      mustBe: 0
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The three-letter airport code the flight was scheduled to land at.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The aircraft's registration (tail) number operating the flight.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: A flag indicating whether the scheduled flight was cancelled.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual departure time, expressed as an HHMM integer, recorded only for
      flights that departed.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The departure delay in minutes, positive for late departures and negative
      for early ones.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual arrival time, expressed as an HHMM integer, recorded only for
      flights that arrived.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled arrival time, expressed as an HHMM integer on a 24-hour clock.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The arrival delay in minutes, positive for late arrivals and negative for
      early ones.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The flight's recorded time in the air, in minutes, available only for completed
      flights.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The great-circle distance between the origin and destination airports, in
      miles.
    quality:
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled departure hour in local time, derived from the scheduled departure
      time.
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled departure minute-of-hour in local time, derived from the scheduled
      departure time.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: The scheduled departure time truncated to the hour and expressed in UTC.
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The full operating name of the carrier identified by carrier_code.
    quality:
    - type: sql
      description: carrier_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name NOT IN ('AirTran Airways Corporation', 'Alaska Airlines Inc.', 'American Airlines Inc.', 'Delta Air Lines Inc.', 'Endeavor Air Inc.', 'Envoy Air', 'ExpressJet Airlines Inc.', 'Frontier Airlines Inc.', 'Hawaiian Airlines Inc.', 'JetBlue Airways', 'Mesa Airlines Inc.', 'SkyWest Airlines Inc.', 'Southwest Airlines Co.', 'US Airways Inc.', 'United Air Lines Inc.', 'Virgin America')
      mustBe: 0
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The manufacturer of the aircraft that operated the flight, joined from an
      aircraft reference source.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The specific aircraft model operating the flight, joined from an aircraft
      reference source.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The year the operating aircraft was manufactured.
    quality:
    - type: sql
      description: aircraft_manufacture_year is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_manufacture_year < 0
      mustBe: 0
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The number of seats on the operating aircraft.
    quality:
    - type: sql
      description: aircraft_seat_count is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_seat_count < 0
      mustBe: 0
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The engine type of the operating aircraft.
    quality:
    - type: sql
      description: aircraft_engine_type stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_engine_type NOT IN ('4 Cycle', 'Reciprocating', 'Turbo-fan', 'Turbo-jet', 'Turbo-prop', 'Turbo-shaft')
      mustBe: 0
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The full name of the origin airport identified by origin_airport.
    quality:
    - type: sql
      description: origin_airport_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport_name NOT IN ('John F. Kennedy International Airport', 'LaGuardia Airport', 'Newark Liberty International Airport')
      mustBe: 0
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The city in which the origin airport is located.
    quality:
    - type: sql
      description: origin_municipality stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_municipality NOT IN ('New York', 'Newark')
      mustBe: 0
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The elevation of the origin airport, in feet.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The length of the longest runway at the origin airport, in feet.
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The full name of the destination airport identified by dest_airport, joined
      from an airport reference source.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The city in which the destination airport is located.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The ISO subdivision code (state or territory) of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The elevation of the destination airport, in feet.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The length of the longest runway at the destination airport, in feet.
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: A pipeline-generated timestamp recording when this row was captured or ingested,
      not a flight attribute.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (flight_date, carrier_code, flight_number,
      origin_airport) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT flight_date, carrier_code, flight_number, origin_airport
        FROM silver.silver_flights
        GROUP BY flight_date, carrier_code, flight_number, origin_airport
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
