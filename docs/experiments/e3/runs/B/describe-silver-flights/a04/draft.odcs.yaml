# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:37:40.075270+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds individual commercial flight records departing New York-area airports
    (EWR, JFK, LGA) during the first half of 2013, combining flight schedule and performance
    data (carrier, flight number, scheduled and actual departure/arrival times, delays, cancellation
    status) with reference attributes about the operating aircraft and the origin and destination
    airports.
  usage: Read the table at the grain of one row per flight_date, carrier_code, flight_number,
    and origin_airport combination, representing a single scheduled flight leg. Use the delay
    and timing fields (dep_hhmm, dep_delay_minutes, arr_hhmm, arr_delay_minutes, air_time_minutes)
    to analyze on-time performance, noting these are null for flights that did not depart
    or complete. Aircraft attribute columns and destination reference columns are null when
    the source tail number or destination airport did not match the corresponding reference
    data.
  limitations: The profile could not confirm a unique tail-number-per-flight relationship
    because tail_number carries a 0.9% null_rate (1521 nulls) and cannot serve as a grain
    key; the proposed grain (flight_date, carrier_code, flight_number, origin_airport) is
    unverified until measured against the warehouse. Aircraft attribute columns are null for
    roughly 16-18% of rows, and destination reference columns are null for about 2.1% of rows,
    both consistent with unmatched reference lookups rather than data entry omissions, but
    the profile cannot confirm the cause. captured_at appears to be a pipeline ingestion timestamp
    (16 distinct values within a 16-second window in 2026) despite not being flagged as airbyte
    metadata in the profile; reviewers should confirm whether it should be governed as metadata.
    sched_dep_hour_local and sched_dep_minute_local appear derivable from sched_dep_hhmm;
    the profile cannot confirm whether they are redundant or carry independent meaning.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: The calendar date on which the flight was scheduled to depart.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: The short airline carrier code operating the flight.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: The airline-assigned flight number for the flight.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
    - type: sql
      description: flight_number is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number < 0
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: The IATA code of the airport the flight departed from.
    quality:
    - type: sql
      description: origin_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport IS NULL
      mustBe: 0
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled departure time, encoded as an HHMM integer in local time.
    quality:
    - type: sql
      description: sched_dep_hhmm is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hhmm IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hhmm < 0
      mustBe: 0
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The IATA code of the destination airport.
    quality:
    - type: sql
      description: dest_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_airport IS NULL
      mustBe: 0
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The unique registration (tail) number of the aircraft that operated the flight.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether the flight was cancelled.
    quality:
    - type: sql
      description: is_cancelled is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE is_cancelled IS NULL
      mustBe: 0
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual departure time, encoded as an HHMM integer in local time, null
      when the flight did not depart.
    quality:
    - type: sql
      description: dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dep_hhmm < 0
      mustBe: 0
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The number of minutes the flight departed late relative to schedule; negative
      values indicate an early departure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual arrival time, encoded as an HHMM integer in local time, null when
      the flight did not complete.
    quality:
    - type: sql
      description: arr_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE arr_hhmm < 0
      mustBe: 0
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled arrival time, encoded as an HHMM integer in local time.
    quality:
    - type: sql
      description: sched_arr_hhmm is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_arr_hhmm IS NULL
      mustBe: 0
    - type: sql
      description: sched_arr_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_arr_hhmm < 0
      mustBe: 0
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The number of minutes the flight arrived late relative to schedule; negative
      values indicate an early arrival.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The duration of time the aircraft was airborne, in minutes.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The great-circle distance between origin and destination airports, in miles.
    quality:
    - type: sql
      description: distance_miles is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles IS NULL
      mustBe: 0
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The local-time hour component of the scheduled departure.
    quality:
    - type: sql
      description: sched_dep_hour_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hour_local IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_hour_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hour_local < 0
      mustBe: 0
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The local-time minute component of the scheduled departure.
    quality:
    - type: sql
      description: sched_dep_minute_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_minute_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local < 0
      mustBe: 0
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: The scheduled departure hour expressed as a UTC timestamp.
    quality:
    - type: sql
      description: departure_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE departure_hour_utc IS NULL
      mustBe: 0
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The full legal name of the operating airline carrier.
    quality:
    - type: sql
      description: carrier_name is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name IS NULL
      mustBe: 0
    - type: sql
      description: carrier_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name NOT IN ('AirTran Airways Corporation', 'Alaska Airlines Inc.', 'American Airlines Inc.', 'Delta Air Lines Inc.', 'Endeavor Air Inc.', 'Envoy Air', 'ExpressJet Airlines Inc.', 'Frontier Airlines Inc.', 'Hawaiian Airlines Inc.', 'JetBlue Airways', 'Mesa Airlines Inc.', 'SkyWest Airlines Inc.', 'Southwest Airlines Co.', 'US Airways Inc.', 'United Air Lines Inc.', 'Virgin America')
      mustBe: 0
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The manufacturer of the aircraft that operated the flight, joined from an
