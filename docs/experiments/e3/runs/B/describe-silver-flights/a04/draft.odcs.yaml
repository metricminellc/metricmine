  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The ISO region code (state or territory) of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The elevation above sea level of the destination airport, in feet.
    quality:
    - type: sql
      description: dest_elevation_ft is never negative
