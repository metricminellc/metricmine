    quality:
    - type: sql
      description: sched_dep_minute_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_minute_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local < 0
      mustBe: 0
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Scheduled departure hour expressed as a UTC timestamp.
    quality:
    - type: sql
      description: departure_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE departure_hour_utc IS NULL
      mustBe: 0
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the operating carrier, matching carrier_code.
    quality:
    - type: sql
      description: carrier_name is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name IS NULL
      mustBe: 0
    - type: sql
      description: carrier_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name NOT IN ('AirTran Airways Corporation', 'Alaska Airlines Inc.', 'American Airlines Inc.', 'Delta Air Lines Inc.', 'Endeavor Air Inc.', 'Envoy Air', 'ExpressJet Airlines Inc.', 'Frontier Airlines Inc.', 'Hawaiian Airlines Inc.', 'JetBlue Airways', 'Mesa Airlines Inc.', 'SkyWest Airlines Inc.', 'Southwest Airlines Co.', 'US Airways Inc.', 'United Air Lines Inc.', 'Virgin America')
      mustBe: 0
  - name: aircraft_manufacturer
