# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:35:47.137467+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds one row per scheduled flight departing from the three NYC-area
    airports (EWR, JFK, LGA) between 2013-01-01 and 2013-06-30, combining schedule, actual
    timing, delay, cancellation, aircraft, and origin/destination airport reference attributes
    for 166158 flights.
  usage: Read the table at the grain of one row per flight_date, carrier_code, flight_number,
    and origin_airport combination. Use the scheduled and actual time fields together with
    the delay fields to analyze on-time performance, join aircraft attributes for fleet analysis,
    and use the origin/destination reference columns for geographic context; expect nulls
    in actual-time, delay, and reference fields for cancelled flights or unmatched reference
    rows.
  limitations: The profile confirms only whole-row uniqueness (duplicate_row_rate 0.0), not
    uniqueness of the proposed grain tuple itself; this must be checked by deterministic grain
    measurement. Aircraft reference fields (manufacturer, model, year, seat_count, engine_type)
    and destination reference fields (name, municipality, iso_region, elevation, runway length)
    carry null rates from roughly 2% to 17.7%, reflecting incomplete reference joins rather
    than data quality defects in the flight records themselves. The captured_at column's values
    and semantics suggest pipeline ingestion metadata despite not being flagged is_airbyte_metadata;
    a reviewer should confirm its intended meaning. dest_delay fields' true negative bound
    (early arrivals/departures) is taken on faith from sample values and was not independently
    verified beyond the observed min/max.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
