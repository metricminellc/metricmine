    physicalType: INTEGER
    required: true
    description: The length of the longest runway at the origin airport, in feet.
    quality:
    - type: sql
      description: origin_longest_runway_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft IS NULL
      mustBe: 0
    - type: sql
      description: origin_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_longest_runway_ft < 0
      mustBe: 0
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The full name of the destination airport.
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The city in which the destination airport is located.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The ISO region code (state or territory) of the destination airport.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The elevation of the destination airport, in feet.
    quality:
    - type: sql
      description: dest_elevation_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_elevation_ft < 0
      mustBe: 0
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The length of the longest runway at the destination airport, in feet.
    quality:
    - type: sql
      description: dest_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_longest_runway_ft < 0
      mustBe: 0
  - name: captured_at
    logicalType: date
