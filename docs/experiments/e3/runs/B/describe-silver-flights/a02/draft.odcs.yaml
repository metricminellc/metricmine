# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:33:35.456475+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds one record per scheduled flight departing from the New York-area
    airports EWR, JFK, and LGA between 2013-01-01 and 2013-06-30 (row_count 166158), capturing
    scheduled and actual departure/arrival times, delays, carrier identity, aircraft identity,
    and enrichment attributes about the operating aircraft and the destination airport.
  usage: Read the table at the grain of one flight per flight_date, carrier_code, flight_number,
    and origin_airport combination. Use the sched_* and actual (dep_hhmm, arr_hhmm) time columns
    together with dep_delay_minutes and arr_delay_minutes to analyze punctuality; treat nulls
    in dep_hhmm, arr_hhmm, dep_delay_minutes, arr_delay_minutes, and air_time_minutes as flights
    that did not depart or arrive as scheduled (see is_cancelled). Join to aircraft_* columns
    via tail_number context for aircraft characteristics, and to dest_* enrichment columns
    for destination airport context, treating nulls there as unresolved reference lookups
    rather than true missing values.
  limitations: The profile cannot confirm the proposed grain beyond knowing duplicate_row_rate
    is 0.0 for whole rows; a deterministic measurement must validate flight_date, carrier_code,
    flight_number, origin_airport as uniquely identifying. Aircraft enrichment columns are
    null for roughly 16.0%-17.7% of rows and destination enrichment columns are null for about
    2.1% of rows, both likely reflecting unmatched reference lookups rather than source defects.
    The captured_at column, though flagged is_airbyte_metadata false in the profile, appears
    by its narrow 2026 timestamp range to be pipeline ingestion metadata rather than flight
    data, and is retained here per policy but should be reviewed. tail_number carries a small
    null_rate (0.009154) whose cause the profile does not explain.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: The calendar date on which the flight was scheduled to operate.
    quality:
    - type: sql
      description: flight_date is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_date IS NULL
      mustBe: 0
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: The two-letter operating carrier code for the flight.
    quality:
    - type: sql
      description: carrier_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code IS NULL
      mustBe: 0
    - type: sql
      description: carrier_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_code NOT IN ('9E', 'AA', 'AS', 'B6', 'DL', 'EV', 'F9', 'FL', 'HA', 'MQ', 'OO', 'UA', 'US', 'VX', 'WN', 'YV')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: The flight number assigned by the operating carrier.
    quality:
    - type: sql
      description: flight_number is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number IS NULL
      mustBe: 0
    - type: sql
      description: flight_number is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE flight_number < 0
      mustBe: 0
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: The three-letter code of the airport the flight departed from.
    quality:
    - type: sql
      description: origin_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport IS NULL
      mustBe: 0
    - type: sql
      description: origin_airport stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE origin_airport NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled departure time, in local hhmm (24-hour clock) format.
    quality:
    - type: sql
      description: sched_dep_hhmm is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hhmm IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hhmm < 0
      mustBe: 0
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The three-letter code of the destination airport.
    quality:
    - type: sql
      description: dest_airport is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dest_airport IS NULL
      mustBe: 0
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The aircraft tail number (registration) that operated the flight.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether the flight was cancelled.
    quality:
    - type: sql
      description: is_cancelled is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE is_cancelled IS NULL
      mustBe: 0
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual departure time, in local hhmm format.
    quality:
    - type: sql
      description: dep_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE dep_hhmm < 0
      mustBe: 0
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The departure delay in minutes; negative values indicate an early departure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual arrival time, in local hhmm format.
    quality:
    - type: sql
      description: arr_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE arr_hhmm < 0
      mustBe: 0
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The scheduled arrival time, in local hhmm format.
    quality:
    - type: sql
      description: sched_arr_hhmm is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_arr_hhmm IS NULL
      mustBe: 0
    - type: sql
      description: sched_arr_hhmm is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_arr_hhmm < 0
      mustBe: 0
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The arrival delay in minutes; negative values indicate an early arrival.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The actual time the aircraft spent airborne, in minutes.
    quality:
    - type: sql
      description: air_time_minutes is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE air_time_minutes < 0
      mustBe: 0
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The great-circle distance between origin and destination airports, in miles.
    quality:
    - type: sql
      description: distance_miles is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles IS NULL
      mustBe: 0
    - type: sql
      description: distance_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE distance_miles < 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The hour component (local time) of the scheduled departure, derived from
      sched_dep_hhmm.
    quality:
    - type: sql
      description: sched_dep_hour_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hour_local IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_hour_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_hour_local < 0
      mustBe: 0
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: The minute component (local time) of the scheduled departure, derived from
      sched_dep_hhmm.
    quality:
    - type: sql
      description: sched_dep_minute_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local IS NULL
      mustBe: 0
    - type: sql
      description: sched_dep_minute_local is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE sched_dep_minute_local < 0
      mustBe: 0
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: The scheduled departure hour expressed as a UTC timestamp.
    quality:
    - type: sql
      description: departure_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE departure_hour_utc IS NULL
      mustBe: 0
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The full legal name of the operating carrier.
    quality:
    - type: sql
      description: carrier_name is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name IS NULL
      mustBe: 0
    - type: sql
      description: carrier_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE carrier_name NOT IN ('AirTran Airways Corporation', 'Alaska Airlines Inc.', 'American Airlines Inc.', 'Delta Air Lines Inc.', 'Endeavor Air Inc.', 'Envoy Air', 'ExpressJet Airlines Inc.', 'Frontier Airlines Inc.', 'Hawaiian Airlines Inc.', 'JetBlue Airways', 'Mesa Airlines Inc.', 'SkyWest Airlines Inc.', 'Southwest Airlines Co.', 'US Airways Inc.', 'United Air Lines Inc.', 'Virgin America')
      mustBe: 0
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The manufacturer of the aircraft that operated the flight, resolved from
      the tail number.
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: The specific model of the aircraft that operated the flight.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: The year the operating aircraft was manufactured.
    quality:
    - type: sql
      description: aircraft_manufacture_year is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_flights WHERE aircraft_manufacture_year < 0
      mustBe: 0
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
