# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T20:30:33.664868+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_flights
name: Silver flights
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: This table holds one row per scheduled commercial flight leg departing from a New
    York City-area airport (EWR, JFK, LGA) in the first half of 2013, combining the flight's
    schedule and actual timing data with enrichment from a carrier reference, an aircraft
    registry, and an airport reference for the destination.
  usage: Read the table at the grain of one row per flight_date, carrier_code, flight_number,
    and origin_airport combination. Use the dep_/arr_ and delay fields to analyze on-time
    performance, noting they are absent for flights that did not operate as scheduled; join
    to carrier_name for carrier display names and to the aircraft_* and dest_* enrichment
    fields for registry and destination airport context, treating their absence as an unmatched
    lookup rather than a data error.
  limitations: The profile does not confirm that flight_date, carrier_code, flight_number,
    and origin_airport uniquely identify a row; a deterministic grain check is required. tail_number,
    the natural per-aircraft identifier, carries a small null rate and so was not used as
    a grain key. aircraft_* and dest_* enrichment fields carry meaningful null rates reflecting
    unmatched reference lookups rather than missing source data, and a reviewer should confirm
    this interpretation. The captured_at column appears to be pipeline ingestion metadata
    rather than a business attribute and is retained per the rule against dropping such columns;
    a reviewer should confirm its exact semantics.
schema:
- name: silver_flights
  physicalName: silver_flights
  logicalType: object
  physicalType: table
  description: 'One row per distinct (flight_date, carrier_code, flight_number, origin_airport).
    The 4 grain columns are flagged primaryKey so sync generates the composite uniqueness
    test; that generated test is warn-severity by tool design at datacontract-cli 1.0.12,
    and the error-severity grain rule below is the enforcing twin (rule 5: uniqueness as a
    test, never a trusted constraint).'
  dataGranularityDescription: One row per distinct (flight_date, carrier_code, flight_number,
    origin_airport).
