# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-10-23T21:02:44.506452+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_airport_weather
name: Silver airport weather
version: 1.1.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_airport_weather holds hourly weather observations for three New York-area
    airports (EWR, JFK, LGA), combining measured conditions (temperature, dewpoint, humidity,
    wind direction/speed/gust, precipitation, pressure, visibility) with static airport reference
    attributes (name, municipality, elevation, longest runway) and a pipeline capture timestamp.
  usage: Read the table at the grain of one row per airport per UTC observation hour, keyed
    by airport_code and observed_hour_utc; use observed_date_local and observed_hour_local
    to filter or group by local calendar time, and join or filter on airport_code for the
    denormalized airport attributes.
  limitations: The profile cannot confirm the declared grain against the warehouse; wind_gust_mph
    is null for about 74.6% of rows and pressure_mb for about 11.5%, limiting completeness
    of those readings; airport_elevation_ft and airport_longest_runway_ft are static per-airport
    values repeated across rows rather than per-observation measurements, which a reviewer
    should re-check; captured_at appears to be a pipeline load timestamp rather than business
    data even though the profile does not flag it as airbyte metadata, and no column in this
    profile is flagged is_airbyte_metadata true.
schema:
- name: silver_airport_weather
  physicalName: silver_airport_weather
  logicalType: object
  physicalType: table
  description: 'One row per distinct (airport_code, observed_hour_utc). The 2 grain columns
    are flagged primaryKey so sync generates the composite uniqueness test; that generated
    test is warn-severity by tool design at datacontract-cli 1.0.12, and the error-severity
    grain rule below is the enforcing twin (rule 5: uniqueness as a test, never a trusted
    constraint).'
  dataGranularityDescription: One row per distinct (airport_code, observed_hour_utc).
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Three-letter airport code identifying which of the three airports the weather
      observation belongs to (EWR, JFK, or LGA).
    quality:
    - type: sql
      description: airport_code is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code IS NULL
      mustBe: 0
    - type: sql
      description: airport_code stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_code NOT IN ('EWR', 'JFK', 'LGA')
      mustBe: 0
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Timestamp, in UTC, of the hourly weather observation.
    quality:
    - type: sql
      description: observed_hour_utc is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_utc IS NULL
      mustBe: 0
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    description: Calendar date, in local time, on which the observation occurred.
    quality:
    - type: sql
      description: observed_date_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_date_local IS NULL
      mustBe: 0
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Hour of day (0-23), in local time, at which the observation occurred.
    quality:
    - type: sql
      description: observed_hour_local is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE observed_hour_local IS NULL
      mustBe: 0
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Air temperature at observation time, in degrees Fahrenheit.
    quality:
    - type: sql
      description: temp_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE temp_f IS NULL
      mustBe: 0
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Dew point temperature at observation time, in degrees Fahrenheit.
    quality:
    - type: sql
      description: dewpoint_f is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE dewpoint_f IS NULL
      mustBe: 0
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Relative humidity at observation time, expressed as a percentage.
    quality:
    - type: sql
      description: humidity_pct is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE humidity_pct IS NULL
      mustBe: 0
    - type: sql
      description: humidity_pct is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE humidity_pct < 0
      mustBe: 0
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Wind direction at observation time, in compass degrees from 0 to 360.
    quality:
    - type: sql
      description: wind_dir_degrees is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_dir_degrees < 0
      mustBe: 0
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sustained wind speed at observation time, in miles per hour.
    quality:
    - type: sql
      description: wind_speed_mph is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_speed_mph < 0
      mustBe: 0
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Peak wind gust speed at observation time, in miles per hour, recorded only
      when a gust is reported.
    quality:
    - type: sql
      description: wind_gust_mph is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE wind_gust_mph < 0
      mustBe: 0
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Precipitation accumulated at observation time, in inches.
    quality:
    - type: sql
      description: precip_inches is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE precip_inches IS NULL
      mustBe: 0
    - type: sql
      description: precip_inches is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE precip_inches < 0
      mustBe: 0
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Barometric pressure at observation time, in millibars.
    quality:
    - type: sql
      description: pressure_mb is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE pressure_mb < 0
      mustBe: 0
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Visibility distance at observation time, in miles, capped at 10.
    quality:
    - type: sql
      description: visibility_miles is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles IS NULL
      mustBe: 0
    - type: sql
      description: visibility_miles is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE visibility_miles < 0
      mustBe: 0
  - name: airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Full name of the airport corresponding to airport_code.
    quality:
    - type: sql
      description: airport_name is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_name IS NULL
      mustBe: 0
    - type: sql
      description: airport_name stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_name NOT IN ('John F. Kennedy International Airport', 'LaGuardia Airport', 'Newark Liberty International Airport')
      mustBe: 0
  - name: airport_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Municipality in which the airport is located.
    quality:
    - type: sql
      description: airport_municipality is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_municipality IS NULL
      mustBe: 0
    - type: sql
      description: airport_municipality stays inside the accepted value set
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_municipality NOT IN ('New York', 'Newark')
      mustBe: 0
  - name: airport_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Elevation of the airport above sea level, in feet; a static attribute of
      the airport rather than a per-observation measurement.
    quality:
    - type: sql
      description: airport_elevation_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_elevation_ft IS NULL
      mustBe: 0
  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Length of the airport's longest runway, in feet; a static attribute of the
      airport rather than a per-observation measurement.
    quality:
    - type: sql
      description: airport_longest_runway_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft IS NULL
      mustBe: 0
    - type: sql
      description: airport_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft < 0
      mustBe: 0
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Timestamp recorded when this row's data was captured by the ingestion pipeline,
      not a business observation time.
    quality:
    - type: sql
      description: captured_at is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE captured_at IS NULL
      mustBe: 0
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (airport_code, observed_hour_utc) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT airport_code, observed_hour_utc
        FROM silver.silver_airport_weather
        GROUP BY airport_code, observed_hour_utc
        HAVING COUNT(*) > 1
      )
    mustBe: 0
