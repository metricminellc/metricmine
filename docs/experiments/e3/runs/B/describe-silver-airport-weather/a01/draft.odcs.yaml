  - name: airport_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Length of the airport's longest runway in feet.
    quality:
    - type: sql
      description: airport_longest_runway_ft is never null
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft IS NULL
      mustBe: 0
    - type: sql
      description: airport_longest_runway_ft is never negative
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_airport_weather WHERE airport_longest_runway_ft < 0
      mustBe: 0
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: Timestamp recorded when this row was captured by the ingestion pipeline.
    quality:
