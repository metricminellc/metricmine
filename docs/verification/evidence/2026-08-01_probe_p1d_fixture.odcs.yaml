apiVersion: v3.1.0
kind: DataContract
id: gold_invoice_lines_mapping
name: First-class key tolerance probe
version: 0.0.1
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
schema:
  - name: invoice_lines
    logicalType: object
    physicalType: mapping
    description: Object-level first-class mapping keys below.
    entityGroup: invoice_lines
    sourceTable: silver.silver_invoice_lines
    timeColumn: invoiced_at
    timeGrain: minute
    grain:
      type: transaction
      degenerateIdentifiers:
        - source: column
          name: invoice_id
    properties:
      - name: stock_code
        logicalType: string
        physicalType: VARCHAR
        required: true
        mappingRole: dimension
      - name: quantity
        logicalType: integer
        physicalType: INTEGER
        required: true
        mappingRole: measure
