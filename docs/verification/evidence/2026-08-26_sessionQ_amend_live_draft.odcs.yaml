# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-08-26T15:37:12.684636+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_invoice_lines
name: Silver invoice lines
version: 1.1.1
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: |
    The cleaned, typed, one-row-per-invoice-line view of the Online Retail II sample: the first contracted silver table and the sole silver input to the gold unified event star.
  usage: |
    Read silver.silver_invoice_lines for line-level retail sales analysis. Cancellation lines are RETAINED and flagged (is_cancellation); consumers aggregating revenue must filter or net them deliberately. Zero-price lines are retained.
  limitations: |
    Exact duplicate bronze rows (rate 0.011188 at profile v0001) are treated as capture artifacts and excluded, so identical legitimate re-scans are indistinguishable and also excluded; the residual grain is the distinct line. Rows identical in every business column except invoicedate are the same capture artifact seen across a register clock tick (one pair at v0001, invoice 492807, one minute apart); they collapse to one line and the earliest timestamp is retained. customer_id is null on 29.778% of bronze rows at v0001 (guest or unregistered checkouts); those rows are retained with customer_id null.
schema:
- name: silver_invoice_lines
  physicalName: silver_invoice_lines
  logicalType: object
  physicalType: table
  description: |
    One row per distinct invoice line surviving capture-artifact exclusion (exact duplicates and within-invoice clock-drift re-scans). Grain key: (invoice_id, stock_code, quantity, unit_price) is unique by measurement at v0001 after exclusion. The four columns are flagged primaryKey so sync generates the composite uniqueness test; the tool emits it as a singular test, never a constraint, which is rule 5 exactly. That generated test is warn-severity by tool design at 1.0.12; the model-level grain-enforcement quality rule below is the error-severity twin that actually gates.
  dataGranularityDescription: |
    One row per distinct invoice line (invoice_id, stock_code, quantity, unit_price) after capture-artifact exclusion. Transaction grain; feeds the mapping contract's grain declaration at Phase 4.
  properties:
  - name: invoice_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: |
      Invoice number, kept as text (identifiers are text; Session D rule). A leading C marks a cancellation invoice; see is_cancellation.
    examples:
    - '489434'
    - C489449
  - name: is_cancellation
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: |
      True when invoice_id carries the C cancellation prefix. Decision: cancellations are retained and flagged, not dropped, so conservation arithmetic against bronze stays auditable; exclusion is a consumer decision made at the mapping contract, not silently here.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: |
      Product code as landed, kept as text; alphanumeric suffixes and non-product adjustment codes (for example POST, M) occur.
  - name: product_description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: |
      Product description, whitespace-trimmed. Null rate 0.005041 at profile v0001; nulls retained rather than imputed.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Units on the line, cast from DECIMAL(38,9) to INTEGER. Negative values occur
      both on cancellation-invoice lines and on zero-unit-price stock-adjustment lines; consumers
      must not infer cancellation from negative quantity alone.
  - name: invoiced_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: |
      Invoice timestamp. Decision: strict cast from the VARCHAR landing ("YYYY-MM-DD HH:MM:SS"); an unparseable value fails the build loudly rather than becoming a silent null. On within-invoice clock-drift duplicates the earliest scan tick wins (min).
  - name: unit_price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: |
      Unit price in sterling, cast from DECIMAL(38,9). Observed range 0.00 to 1998.49 at v0001. Decision: zero-price lines (freebies and adjustments) are retained; negative prices are contract-invalid.
    quality:
    - type: sql
      description: Unit price is never negative.
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_invoice_lines WHERE unit_price < 0
      mustBe: 0
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: |
      Customer identifier, cast DECIMAL(38,9) to INTEGER (integral min, max, and samples, 12346 to 18287 at v0001). Decision: the 0.29778 bronze null rate is retained as null (guest or unregistered checkouts), not dropped and not imputed.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Customer country as landed (24 distinct at v0001).
  quality:
  - type: library
    metric: rowCount
    description: |
      The table is never empty; the committed sample yields tens of thousands of surviving lines.
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: |
      Grain enforcement: no duplicate (invoice_id, stock_code, quantity, unit_price) combinations. Declared at error severity because the primaryKey-flag composite test generates at hardcoded warn severity at datacontract-cli 1.0.12 and cannot redden a gate; this rule is the enforcing twin (rule 5: uniqueness as a test, never a trusted constraint).
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice_id, stock_code, quantity, unit_price
        FROM silver.silver_invoice_lines
        GROUP BY invoice_id, stock_code, quantity, unit_price
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
