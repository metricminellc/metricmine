# Draft proposed by silver-cleanup-proposer v0.1.0 at 2026-08-24T13:36:53.384276+00:00.
# Review before approval (D-24): merge is approval; drafts never auto-land.
apiVersion: v3.1.0
kind: DataContract
id: silver_online_retail_ii
name: Silver online retail ii
version: 1.0.0
status: draft
domain: retail
dataProduct: metricmine
tenant: metricmine
description:
  purpose: silver_online_retail_ii holds cleaned, deduplicated invoice line items from the
    online retail transaction system, providing a consistent grain for downstream sales, returns,
    and customer analytics.
  usage: Consumers should treat (invoice, stock_code) as the row grain after dedupe, use the
    is_return flag to separate return/cancellation lines (negative quantity) from sales before
    aggregating revenue, and must handle null customer_id (about 29.8% of rows) and null description
    (about 0.5% of rows) explicitly rather than assuming completeness.
  limitations: Exact duplicate rows (duplicate_row_rate 0.011188 of 45228 rows, roughly 506
    rows) are removed, but this cleanup does not resolve near-duplicate lines sharing invoice
    and stock_code with differing quantity or price; customer_id remains null for about 29.8%
    of rows (13468 of 45228) and description for about 0.5% of rows (228 of 45228), both retained
    as nulls rather than imputed.
schema:
- name: silver_online_retail_ii
  physicalName: silver_online_retail_ii
  logicalType: object
  physicalType: table
  description: silver_online_retail_ii holds cleaned, deduplicated invoice line items from
    the online retail transaction system, providing a consistent grain for downstream sales,
    returns, and customer analytics.
  properties:
  - name: invoice
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: null_rate is 0.0 across 45228 rows with distinct_count 2330 and sequential
      sample values like '489434'-'489443', so invoice is retained as a required identifier
      string.
  - name: stock_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Renamed to snake_case; null_rate is 0.0 with distinct_count 3141 and alphanumeric
      samples ('10002R','10123C'), so it stays a required VARCHAR product code.
  - name: description
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: null_rate is 0.005041 (228 of 45228 rows null); free-text samples like '
      3 STRIPEY MICE FELTCRAFT' confirm a descriptive string, retained nullable rather than
      imputed.
  - name: quantity
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: null_rate is 0.0 and all sample values (-1395.0, -1043.0 ... up to max 5184.0)
      are whole numbers despite the landed DECIMAL(38,9) type, so a safe cast to INTEGER is
      applied; negative values are retained as legitimate returns/cancellations.
  - name: is_return
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Sample values include negative quantities (-1395.0, -1043.0, -1012.0, -954.0,
      -770.0 ... -504.0) with min -1395.0, indicating return/cancellation lines; this derived
      flag is true when quantity < 0 so consumers can separate sales from returns without
      inspecting sign.
  - name: invoice_date
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: null_rate is 0.0 and all samples are ISO-shaped ('2009-12-01 07:45:00' through
      '2009-12-01 09:50:00'), so it is renamed to snake_case and cast from VARCHAR to TIMESTAMP.
  - name: price
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: true
    description: null_rate is 0.0 with min 0.0 and max 1998.49, and samples (0.04, 0.06, 0.08,
      0.18) carry fractional cents, so it is cast to DECIMAL(10,2) as a monetary amount.
  - name: customer_id
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: null_rate is 0.29778 (13468 of 45228 rows null), so it is sparsely populated
      and retained nullable; sampled values (12346.0, 12349.0, 12358.0 ...) are whole numbers,
      justifying a cast from DECIMAL(38,9) to INTEGER.
  - name: country
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: null_rate is 0.0 with only distinct_count 24 and samples like 'Australia',
      'Belgium', 'EIRE', so it is retained as a required low-cardinality string.
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (invoice, stock_code) combinations'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT invoice, stock_code
        FROM silver.silver_online_retail_ii
        GROUP BY invoice, stock_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: silver-cleanup-proposer
- property: proposerVersion
  value: 0.1.0
- property: promptVersion
  value: 1.0.0
- property: modelId
  value: claude-sonnet-5
- property: profileHash
  value: sha256:79f801e1d8182ee55a32a0e3323134a27fec839c5a5478edfb8f5683cf5221f0
- property: proposedAt
  value: '2026-08-24'
- property: proposerStance
  value: cleanup
- property: decisionExactDuplicates
  value: remove-exact-duplicates
- property: decisionGrain
  value: invoice-stock-code
- property: decisionDropAirbyteMetadata
  value: excluded-as-capture-artifacts
- property: decisionNullCustomerId
  value: retained-nullable
- property: decisionNullDescription
  value: retained-nullable
- property: decisionCastQuantityAndCustomerId
  value: cast-decimal-to-integer
- property: decisionCastInvoiceDate
  value: cast-varchar-to-timestamp
- property: decisionDeriveIsReturn
  value: derive-boolean-flag-on-negative-quantity
