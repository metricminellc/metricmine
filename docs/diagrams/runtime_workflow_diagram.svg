<svg xmlns="http://www.w3.org/2000/svg" width="940" height="2150" viewBox="0 0 940 2150" font-family="Avenir, 'Avenir Next', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="2150" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="52" font-size="28" font-weight="800" fill="#1F3864">MetricMine · Runtime Workflow</text>
  <text x="40" y="78" font-size="14" fill="#2E4A7A">Contract-driven medallion pipeline on a dbt plane, serving the unified event star · Rev. 4 architecture · July 11, 2026</text>

  <!-- Legend -->
  <g font-size="12" fill="#4A5568">
    <rect x="40" y="98" width="16" height="12" rx="3" fill="#EDF1F7" stroke="#2E4A7A"/><text x="62" y="108">Deterministic code (executes)</text>
    <rect x="250" y="98" width="16" height="12" rx="3" fill="#F0EAFA" stroke="#805AD5"/><text x="272" y="108">Agent (proposes only)</text>
    <rect x="430" y="98" width="16" height="12" rx="3" fill="#FFF3E3" stroke="#D97706"/><text x="452" y="108">Human approval gate</text>
    <rect x="610" y="98" width="16" height="12" rx="3" fill="#E6F4EE" stroke="#2F855A"/><text x="632" y="108">Data in DuckDB</text>
    <rect x="40" y="122" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#8A94A3"/><text x="62" y="132">Committed artifact (ODCS YAML / file)</text>
    <rect x="320" y="122" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#8A94A3" stroke-dasharray="4 3"/><text x="342" y="132">Optional · Phase 7 hosted demo</text>
  </g>
  <line x1="40" y1="150" x2="900" y2="150" stroke="#E2E8F0"/>

  <!-- Sources -->
  <g font-size="13" fill="#1F2937">
    <rect x="80" y="172" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#8A94A3"/>
    <text x="185" y="194" text-anchor="middle" font-weight="700">Sample CSV / Parquet</text>
    <text x="185" y="212" text-anchor="middle" font-size="11" fill="#4A5568">committed to the repo (D-15)</text>
    <rect x="320" y="172" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#8A94A3"/>
    <text x="420" y="194" text-anchor="middle" font-weight="700">Faker connector</text>
    <text x="420" y="212" text-anchor="middle" font-size="11" fill="#4A5568">synthetic, keyless</text>
  </g>
  <path d="M 185 224 L 262 262" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <path d="M 420 224 L 335 262" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- PyAirbyte -->
  <rect x="120" y="266" width="360" height="66" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="300" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">PyAirbyte ingest</text>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#4A5568">pip-installable, pure-Python connectors, no server</text>
  <text x="300" y="323" text-anchor="middle" font-size="11" fill="#4A5568">one-to-one raw landing, no transforms</text>
  <path d="M 300 332 L 300 358" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- bronze + duckdb note -->
  <rect x="120" y="362" width="360" height="56" rx="8" fill="#E6F4EE" stroke="#2F855A"/>
  <text x="300" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#22543D">bronze schema · DuckDB</text>
  <text x="300" y="403" text-anchor="middle" font-size="11" fill="#4A5568">raw tables, exactly as landed</text>
  <rect x="560" y="352" width="340" height="82" rx="8" fill="#F7FAFC" stroke="#CBD5E0"/>
  <text x="576" y="374" font-size="11" font-style="italic" fill="#4A5568">One working DuckDB file, three schemas: bronze /</text>
  <text x="576" y="390" font-size="11" font-style="italic" fill="#4A5568">silver / gold, at warehouse/ and gitignored (D-03).</text>
  <text x="576" y="406" font-size="11" font-style="italic" fill="#4A5568">The committed artifact is demo/demo.duckdb, made</text>
  <text x="576" y="422" font-size="11" font-style="italic" fill="#4A5568">by make export-demo: gold + context only.</text>
  <line x1="480" y1="390" x2="558" y2="390" stroke="#CBD5E0" stroke-dasharray="4 3"/>
  <path d="M 300 418 L 300 444" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- Profiler -->
  <rect x="120" y="448" width="360" height="56" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="300" y="471" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">Profiler (deterministic)</text>
  <text x="300" y="489" text-anchor="middle" font-size="11" fill="#4A5568">columns, types, null rates, cardinality, duplicate-row rate</text>
  <path d="M 480 476 L 556 476" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <g>
    <path d="M 560 452 L 884 452 L 900 468 L 900 504 L 560 504 Z" fill="#FFFFFF" stroke="#8A94A3"/>
    <path d="M 884 452 L 884 468 L 900 468" fill="none" stroke="#8A94A3"/>
    <text x="730" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Profile artifact</text>
    <text x="730" y="492" text-anchor="middle" font-size="11" fill="#4A5568">versioned, committed · the DRE observability layer</text>
  </g>
  <path d="M 730 504 L 730 540" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- Silver agent chain -->
  <rect x="580" y="544" width="300" height="66" rx="8" fill="#F0EAFA" stroke="#805AD5"/>
  <text x="730" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#44337A">Cleanup proposer agent</text>
  <text x="730" y="584" text-anchor="middle" font-size="11" fill="#4A5568">one structured API call:</text>
  <text x="730" y="598" text-anchor="middle" font-size="11" fill="#4A5568">profile in → cleanup contract out</text>
  <path d="M 730 610 L 730 636" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <rect x="580" y="640" width="300" height="52" rx="8" fill="#FFF3E3" stroke="#D97706"/>
  <text x="730" y="661" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Human approval</text>
  <text x="730" y="678" text-anchor="middle" font-size="11" fill="#4A5568">review, edit, add business context</text>
  <path d="M 730 692 L 730 718" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <g>
    <path d="M 560 722 L 884 722 L 900 738 L 900 790 L 560 790 Z" fill="#FFFFFF" stroke="#8A94A3"/>
    <path d="M 884 722 L 884 738 L 900 738" fill="none" stroke="#8A94A3"/>
    <text x="730" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Cleanup contract · ODCS v3.1.0, committed</text>
    <text x="730" y="762" text-anchor="middle" font-size="11" fill="#4A5568">renames, casts, dedupe, null rules · grain decisions</text>
    <text x="730" y="777" text-anchor="middle" font-size="11" fill="#4A5568">+ context fields: descriptions, rationale</text>
  </g>
  <path d="M 560 756 L 486 756" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <text x="180" y="712" font-size="11" font-style="italic" fill="#4A5568">runs once the cleanup</text>
  <text x="180" y="727" font-size="11" font-style="italic" fill="#4A5568">contract is approved</text>

  <!-- silver dbt model -->
  <rect x="120" y="734" width="360" height="66" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="300" y="757" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">Contracted silver dbt model</text>
  <text x="300" y="775" text-anchor="middle" font-size="11" fill="#4A5568">SQL, executed by dbt build · shape enforced at compile time,</text>
  <text x="300" y="790" text-anchor="middle" font-size="11" fill="#4A5568">content by contract-generated tests (D-04)</text>
  <path d="M 300 800 L 300 826" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <path d="M 300 448 L 300 430" fill="none" stroke="none"/>

  <!-- silver schema -->
  <rect x="120" y="830" width="360" height="56" rx="8" fill="#E6F4EE" stroke="#2F855A"/>
  <text x="300" y="853" text-anchor="middle" font-size="14" font-weight="700" fill="#22543D">silver schema · DuckDB</text>
  <text x="300" y="871" text-anchor="middle" font-size="11" fill="#4A5568">clean, typed, business-ready</text>
  <path d="M 300 886 L 300 912" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- profiler silver pass -->
  <rect x="120" y="916" width="360" height="52" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="300" y="937" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">Profiler · silver pass</text>
  <text x="300" y="955" text-anchor="middle" font-size="11" fill="#4A5568">same code, now on silver</text>
  <path d="M 480 942 L 556 942" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <g>
    <path d="M 560 918 L 884 918 L 900 934 L 900 966 L 560 966 Z" fill="#FFFFFF" stroke="#8A94A3"/>
    <path d="M 884 918 L 884 934 L 900 934" fill="none" stroke="#8A94A3"/>
    <text x="730" y="940" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Silver profile artifact</text>
    <text x="730" y="957" text-anchor="middle" font-size="11" fill="#4A5568">committed</text>
  </g>
  <path d="M 730 966 L 730 1002" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- modeling agent chain -->
  <rect x="580" y="1006" width="300" height="66" rx="8" fill="#F0EAFA" stroke="#805AD5"/>
  <text x="730" y="1029" text-anchor="middle" font-size="13" font-weight="700" fill="#44337A">Mapping proposer agent</text>
  <text x="730" y="1046" text-anchor="middle" font-size="11" fill="#4A5568">silver profile in → fact &amp; dimension</text>
  <text x="730" y="1060" text-anchor="middle" font-size="11" fill="#4A5568">mapping out: groups, grain, rationale</text>
  <path d="M 730 1072 L 730 1098" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <rect x="580" y="1102" width="300" height="52" rx="8" fill="#FFF3E3" stroke="#D97706"/>
  <text x="730" y="1123" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Human approval</text>
  <text x="730" y="1140" text-anchor="middle" font-size="11" fill="#4A5568">confirm facts, dimensions, groups, grain</text>
  <path d="M 730 1154 L 730 1180" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <g>
    <path d="M 560 1184 L 884 1184 L 900 1200 L 900 1256 L 560 1256 Z" fill="#FFFFFF" stroke="#8A94A3"/>
    <path d="M 884 1184 L 884 1200 L 900 1200" fill="none" stroke="#8A94A3"/>
    <text x="730" y="1206" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Mapping contract · ODCS v3.1.0, committed</text>
    <text x="730" y="1224" text-anchor="middle" font-size="11" fill="#4A5568">facts · dimensions · entity groups · time columns ·</text>
    <text x="730" y="1239" text-anchor="middle" font-size="11" fill="#4A5568">grain (aggregated | transaction) · engine input interface</text>
  </g>
  <path d="M 560 1220 L 486 1220" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <text x="180" y="1155" font-size="11" font-style="italic" fill="#4A5568">runs once the mapping</text>
  <text x="180" y="1170" font-size="11" font-style="italic" fill="#4A5568">contract is approved</text>

  <!-- engine -->
  <rect x="120" y="1188" width="360" height="88" rx="8" fill="#EDF1F7" stroke="#1F3864" stroke-width="2"/>
  <text x="300" y="1212" text-anchor="middle" font-size="14" font-weight="800" fill="#1F3864">MetricMine auto-modeling engine</text>
  <text x="300" y="1230" text-anchor="middle" font-size="11" fill="#4A5568">my algorithm, deterministic, rebuilt from the clean-room spec</text>
  <text x="300" y="1245" text-anchor="middle" font-size="11" fill="#4A5568">emits dbt model files per fact category, never DDL (D-07)</text>
  <text x="300" y="1260" text-anchor="middle" font-size="11" fill="#4A5568">canonical_key v2 (D-18) · writes via PR + ownership manifest (D-09)</text>
  <path d="M 300 1276 L 300 1302" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <text x="310" y="1295" font-size="10" fill="#718096">committed, reviewed gold models</text>

  <!-- dbt build -->
  <rect x="120" y="1306" width="360" height="56" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="300" y="1329" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">dbt build · gold</text>
  <text x="300" y="1347" text-anchor="middle" font-size="11" fill="#4A5568">contracts enforced at compile time · star materializes as tables (D-17)</text>
  <path d="M 300 1362 L 300 1388" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- gold star -->
  <rect x="80" y="1392" width="440" height="128" rx="8" fill="#E6F4EE" stroke="#2F855A" stroke-width="2"/>
  <text x="300" y="1416" text-anchor="middle" font-size="14" font-weight="800" fill="#22543D">gold schema · the unified event star</text>
  <text x="300" y="1436" text-anchor="middle" font-size="11" fill="#4A5568">values + columns dimensions, content-addressed (hash keys)</text>
  <text x="300" y="1452" text-anchor="middle" font-size="11" fill="#4A5568">fact_&lt;category&gt; tables at declared grain · run lineage attribute</text>
  <text x="300" y="1468" text-anchor="middle" font-size="11" fill="#4A5568">context_registry: schema_key → contract + meaning (D-19)</text>
  <text x="300" y="1484" text-anchor="middle" font-size="11" fill="#4A5568">vw_&lt;category&gt;_typed projection views (json_extract + cast)</text>
  <text x="300" y="1506" text-anchor="middle" font-size="10" fill="#718096">new sources add rows, not schema · conservation tests C1-C4 in CI</text>

  <!-- context compiler -->
  <rect x="580" y="1392" width="300" height="76" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="730" y="1415" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">Context compiler · deterministic</text>
  <text x="730" y="1433" text-anchor="middle" font-size="11" fill="#4A5568">merges all profiles + both approved contracts</text>
  <text x="730" y="1448" text-anchor="middle" font-size="11" fill="#4A5568">writes one context_registry row per schema key</text>
  <path d="M 580 1440 L 524 1440" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <path d="M 730 1256 L 730 1388" fill="none" stroke="#4A5568" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="740" y="1330" font-size="10" font-style="italic" fill="#718096">+ cleanup contract &amp; profiles</text>
  <path d="M 300 1520 L 300 1546" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>

  <!-- shared query module -->
  <rect x="120" y="1550" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <text x="300" y="1573" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">Shared query module</text>
  <text x="300" y="1591" text-anchor="middle" font-size="11" fill="#4A5568">one Python module: query · schema · context · payload accessors</text>
  <text x="300" y="1606" text-anchor="middle" font-size="11" font-style="italic" fill="#4A5568">imported by both consumers below · read-only protocol (D-11)</text>
  <path d="M 220 1616 L 220 1650" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <path d="M 480 1600 L 640 1600 L 640 1648" fill="none" stroke="#4A5568" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="652" y="1640" font-size="10" font-style="italic" fill="#718096">imports the same shared module</text>

  <!-- MCP -->
  <rect x="80" y="1654" width="300" height="78" rx="8" fill="#EDF1F7" stroke="#2E4A7A"/>
  <text x="230" y="1676" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">Local MCP server</text>
  <text x="230" y="1693" text-anchor="middle" font-size="11" fill="#4A5568">read-only tools: list_categories · get_schema ·</text>
  <text x="230" y="1707" text-anchor="middle" font-size="11" fill="#4A5568">get_context (schema key) · run_query (row-limited) ·</text>
  <text x="230" y="1721" text-anchor="middle" font-size="11" fill="#4A5568">lookup_record (by content key, the provenance tool)</text>
  <path d="M 230 1732 L 230 1758" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <rect x="80" y="1762" width="300" height="66" rx="8" fill="#F0EAFA" stroke="#805AD5"/>
  <text x="230" y="1784" text-anchor="middle" font-size="13" font-weight="700" fill="#44337A">Claude Desktop / Claude Code</text>
  <text x="230" y="1801" text-anchor="middle" font-size="11" fill="#4A5568">remote model, local hands · answers carry data +</text>
  <text x="230" y="1815" text-anchor="middle" font-size="11" fill="#4A5568">business meaning, citing exact records by key</text>
  <text x="230" y="1848" text-anchor="middle" font-size="11" font-style="italic" fill="#4A5568">only tool results travel to the model;</text>
  <text x="230" y="1862" text-anchor="middle" font-size="11" font-style="italic" fill="#4A5568">the DuckDB file never leaves the laptop</text>

  <!-- hosted demo optional -->
  <rect x="430" y="1654" width="470" height="200" rx="10" fill="#FBFDFF" stroke="#8A94A3" stroke-dasharray="6 4"/>
  <text x="450" y="1678" font-size="13" font-weight="700" fill="#1F2937">Phase 7 · optional hosted demo</text>
  <rect x="450" y="1692" width="430" height="62" rx="8" fill="#FFFFFF" stroke="#8A94A3" stroke-dasharray="4 3"/>
  <text x="665" y="1714" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Streamlit app · Community Cloud (free)</text>
  <text x="665" y="1731" text-anchor="middle" font-size="11" fill="#4A5568">table browser · suggested questions · answers with</text>
  <text x="665" y="1745" text-anchor="middle" font-size="11" fill="#4A5568">context beside them · rate-capped chat tab</text>
  <path d="M 665 1754 L 665 1778" fill="none" stroke="#4A5568" marker-end="url(#ar)"/>
  <rect x="450" y="1782" width="430" height="42" rx="8" fill="#FFFFFF" stroke="#8A94A3"/>
  <text x="665" y="1800" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Public link</text>
  <text x="665" y="1816" text-anchor="middle" font-size="11" fill="#4A5568">resume · LinkedIn · README · read-only, no uploads</text>
  <text x="665" y="1842" text-anchor="middle" font-size="10" font-style="italic" fill="#718096">reads the committed demo/demo.duckdb export; wake the app five minutes before interviews</text>

  <!-- footer band -->
  <rect x="40" y="1900" width="860" height="86" rx="8" fill="#1F3864"/>
  <text x="470" y="1930" text-anchor="middle" font-size="12" fill="#E2E8F0">make demo replays the committed contracts and the committed engine-emitted models (keyless, deterministic)</text>
  <text x="470" y="1948" text-anchor="middle" font-size="12" fill="#E2E8F0">the regenerate flag invokes the two agents live · the engine writes only via pull request — the three gates judge the output</text>
  <text x="470" y="1972" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">agents propose · code executes · you approve</text>

  <text x="470" y="2020" text-anchor="middle" font-size="11" fill="#718096">MetricMine runtime workflow · Rev. 4 architecture · companion: Gold Layer Design 001 + gold flow diagram · prepared for Justin Goff · July 11, 2026</text>
</svg>
