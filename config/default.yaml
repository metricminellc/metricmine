# MetricMine default configuration.
# Ingestion per docs/spec/ingestion.md: the committed Online Retail II sample
# (D-15) lands into the bronze schema of the working warehouse (D-03).
ingestion:
  dataset_name: online_retail_ii
  sample_csv: data/samples/online_retail_ii/online_retail_ii_2009-12.csv
  warehouse_path: warehouse/metricmine.duckdb
  schema: bronze
  # Invoice carries C-prefixed cancellation ids; pin it to string at the
  # reader so inference and records agree.
  reader_options: '{"dtype": {"Invoice": "str"}}'

# Profiling per docs/spec/profiler.md: the deterministic profiler reads the
# working warehouse read-only (D-11) and writes committed artifacts under
# profiles/<schema>.<table>/. Since the silver-pass scope amendment
# (spec §8), targets is a list: one artifact directory per table, the same
# code over each schema. The silver profile is the mapping contract's
# profileHash source and the Phase 6 mapping proposer's sole context (D-23).
profiling:
  warehouse_path: warehouse/metricmine.duckdb
  output_dir: profiles
  targets:
    - schema: bronze
      table: online_retail_ii
    - schema: silver
      table: silver_invoice_lines

# Auto-modeling engine per docs/spec/engine.md (D-29): mapping contract in,
# gold model files out; dbt builds them (D-07). The engine reads contracts
# and this config only (never the warehouse) and writes only under
# output_dir plus its ownership manifest (D-09).
engine:
  mapping_contract: contracts/gold_invoice_lines_mapping.odcs.yaml
  gold_contract: contracts/gold_unified_event_star.odcs.yaml
  silver_contract: contracts/silver_invoice_lines.odcs.yaml
  schema_path: docs/spec/engine/mapping-contract.schema.json
  output_dir: transform/models/gold
  # Materialization for every engine-emitted model (Record 008 part two,
  # D-38): `table` is the committed default and the keyless demo path;
  # `incremental` arms the emitted is_incremental() blocks (the silver
  # batch filter on captured_at and the insert-if-absent anti-joins), for
  # deployments that load continuously. An unrecognized value fails closed
  # before anything emits. Switching modes is a regeneration under D-09:
  # the diff is one config line per model.
  materialization: table
  # The typed surface per category (D-36): `table` emits the materialized
  # mart (mart_<category>_typed, lean shape, ordered by the time column),
  # `view` emits the projection view (vw_<category>_typed, the pre-D-36
  # set), `both` emits both. The default is both: the mart answers
  # analytical questions; the view stays for the keyless demo surface.
  marts: both

# Context compiler per docs/spec/engine.md §4 (D-30): governing contracts in,
# committed compiled-context artifact out (context/compiled/vNNNN.json plus
# meta sidecar, the profiles/ artifact discipline); the engine carries the
# newest artifact into the emitted context_registry model as VALUES literals.
context:
  output_dir: context/compiled

# Proposer agents per docs/spec/agent-layer.md (D-21 as amended by
# Amendment F, D-24, D-34, D-35): one structured call per run; drafts and
# records land only in the gitignored proposals/ outbox, and merge is
# approval. Each proposer runs in a governed stance (D-35): a stance is a
# config block here plus a prompt plus a validator branch, never a new
# agent. The default model and the allow-list live in
# src/metricmine/agents/models.py by decision (D-34): moving either is a
# register amendment, never a config edit.
agents:
  effort: high
  # 16384 since Session P (was 8192): both Session O silver first attempts
  # stopped on max_tokens at 8192 under effort high, each truncation burning
  # the full cap before the bounded retry spent again. D-21 requires a cap,
  # not this cap; the worst case stays bounded per call.
  max_tokens: 16384
  max_retries: 2
  outbox_dir: proposals
  silver:
    stances:
      cleanup:
        profile_dir: profiles/bronze.online_retail_ii
        prompt: src/metricmine/agents/prompts/silver_cleanup.md
        proposal_schema: docs/spec/agent-layer/silver-cleanup-proposal.schema.json
        target_contract: contracts/silver_invoice_lines.odcs.yaml
      # The describe stance (D-35) adopts an EXISTING silver table: the
      # profile directory and the target contract derive from the TABLE
      # argument at the CLI (profiles/silver.<table>/,
      # contracts/<table>.odcs.yaml), because describe consumes the target
      # table's own profile artifact.
      describe:
        prompt: src/metricmine/agents/prompts/silver_describe.md
        proposal_schema: docs/spec/agent-layer/table-contract-proposal.schema.json
      # The amend stance (D-35) evolves a COMMITTED contract: the fresh
      # profile, the committed contract (canonical bytes hashed into the
      # amendsContract stamp, D-22 Amendment I), and the operator's
      # intent are its governed inputs (D-23 Amendment H). The profile
      # directory and the target contract derive from TABLE at the CLI,
      # exactly as describe.
      amend:
        prompt: src/metricmine/agents/prompts/silver_amend.md
        proposal_schema: docs/spec/agent-layer/table-contract-proposal.schema.json
  mapping:
    stances:
      propose:
        profile_dir: profiles/silver.silver_invoice_lines
        prompt: src/metricmine/agents/prompts/gold_mapping.md
        proposal_schema: docs/spec/agent-layer/gold-mapping-proposal.schema.json
        target_contract: contracts/gold_invoice_lines_mapping.odcs.yaml
        contract_schema: docs/spec/engine/mapping-contract.schema.json
  # The golden-profile set for the live eval lane (D-25): the two committed
  # profiles by reference plus one constructed pathological case (the faker
  # path waits on issue #15). Labels name the recorded proposals under
  # tests/agents/fixtures/recorded/.
  eval:
    fixtures:
      - label: silver-cleanup-online-retail
        proposer: silver
        profile: profiles/bronze.online_retail_ii/v0001.json
      - label: mapping-propose-invoice-lines
        proposer: mapping
        profile: profiles/silver.silver_invoice_lines/v0001.json
      - label: silver-cleanup-messy-orders
        proposer: silver
        profile: tests/agents/fixtures/profiles/bronze.messy_orders/v0001.json
