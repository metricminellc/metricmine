# Mapping contract: flights category, v1.0.0 (ODCS v3.1.0).
# Engine input, never a table: physicalType: mapping is the machine
# discriminator (CLAUDE.md rule 9); gate 1 lints this file, gate 3 skips it
# by design (F-12), and the auto-modeling engine validates it against
# docs/spec/engine/mapping-contract.schema.json before emitting the gold
# star models (docs/spec/engine.md §2, D-29 as amended by Amendment U).
# Hand-authored from the unified silver table's profile v0001 plus judgment
# (Arc 6, D-41); profileHash below is that artifact's content_hash.
apiVersion: v3.1.0
kind: DataContract
id: gold_flights_mapping
name: Gold mapping, flights category
version: 1.0.0
status: active
domain: aviation
dataProduct: metricmine
tenant: metricmine
description:
  purpose: >-
    Declares how silver.silver_flights maps into the unified event star as the flights fact
    category: one fact row per scheduled departure from New York City in January through June
    2013, at hour grain on the conformed calendar (departure_hour_utc), with the carrier,
    aircraft, and airport attributes the unified silver table settled as dimensions and the
    four on-time quantities as measures. Consumed by the auto-modeling engine (D-07); no physical
    table carries this name.
  usage: >-
    Engine input only. The typed surface mart_flights_typed (D-36) is where questions about
    flights are answered: delays in minutes with negative early and null cancelled, is_cancelled
    for cancellation rates, carrier and aircraft and airport attributes as columns. Cross-category
    questions join airport_weather on origin_airport equals airport_code and the same departure
    hour (the conformed calendar, Amendment R), and never need a gold object beyond what the
    engine emits (D-41).
  limitations: >-
    Every silver limitation carries through: attributes are null where the 2026 airport reference
    or the FAA registry does not know the entity (PBI, fleet numbers), and the window is half
    of 2013. The dimension payload is wide (29 attributes) by choice, to put the whole unified
    row on the typed surface; the cost is measured in docs/scale.md.
schema:
- name: flights
  logicalType: object
  physicalType: mapping
  description: >-
    One fact category: flights departing New York City, 2013 H1. Transaction grain per the
    silver contract's five-column grain, carried as one derived degenerate identifier (flight_identity,
    canonical-key-v2 over the grain tuple). Cancelled flights flow through retained-and-flagged.
  entityGroup: flights
  sourceTable: silver.silver_flights
  timeColumn: departure_hour_utc
  timeGrain: hour
  grain:
    type: transaction
    degenerateIdentifiers:
    - source: derived
      name: flight_identity
      derivation: canonical-key-v2
      of:
      - flight_date
      - carrier_code
      - flight_number
      - origin_airport
      - sched_dep_hhmm
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    mappingRole: dimension
    description: Local date of the scheduled departure (America/New_York).
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Two-letter BTS carrier code; a conformed key.
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Flight number as published.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport IATA code (EWR, JFK, LGA); a conformed key shared with the
      airport_weather category.
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure clock time, local, HHMM integer (517 is 05:17).
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Destination airport IATA code; a conformed key; dest_* attributes are null
      for PBI.
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Aircraft registration as reported; null on 1,521 flights; a conformed key
      to silver_nyc_planes.
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    mappingRole: dimension
    description: >-
      True when the flight has no actual departure time (2.9 percent of the window); delays
      are null on these rows.
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual departure clock time, local, HHMM; null when cancelled.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Departure delay in minutes; negative is early; null when cancelled. The headline
      on-time measure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Actual arrival clock time, local at the destination, HHMM; null when cancelled
      or unreported.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled arrival clock time, local at the destination, HHMM.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Arrival delay in minutes; negative is early; null when cancelled, diverted,
      or unreported.
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: measure
    description: Minutes in the air; null wherever arr_delay_minutes is null.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: measure
    description: Great-circle route distance in statute miles.
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure hour, local (0 to 23).
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Scheduled departure minute, local.
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    mappingRole: time
    description: >-
      Scheduled departure hour as a UTC instant; the conformed calendar key at hour grain
      (joins weather at the origin on the same hour).
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Carrier name from silver_nyc_airlines (2013 names); resolves for every flight.
  - name: aircraft_manufacturer
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: >-
      Manufacturer from the FAA registry via silver_nyc_planes; null when the aircraft is
      unknown (about 16 percent of flights).
  - name: aircraft_model
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Model designation from the FAA registry; null when the aircraft is unknown.
  - name: aircraft_manufacture_year
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: >-
      Year of manufacture from the FAA registry; aircraft age in 2013 is 2013 minus this;
      null when unknown.
  - name: aircraft_seat_count
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Registry seat count; null when the aircraft is unknown.
  - name: aircraft_engine_type
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Registry engine type (Turbo-fan, Turbo-jet, and others); null when unknown.
  - name: origin_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport name from the 2026 OurAirports reference.
  - name: origin_municipality
    logicalType: string
    physicalType: VARCHAR
    required: true
    mappingRole: dimension
    description: Origin airport's served city from the 2026 reference.
  - name: origin_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Origin field elevation in feet.
  - name: origin_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: true
    mappingRole: dimension
    description: Length in feet of the origin's longest open runway with a published length
      (2026 reference).
  - name: dest_airport_name
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination airport name from the 2026 reference; null for PBI (recoded DJT).
  - name: dest_municipality
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination airport's served city; null where the reference does not know
      the code or the city.
  - name: dest_iso_region
    logicalType: string
    physicalType: VARCHAR
    required: false
    mappingRole: dimension
    description: Destination ISO 3166-2 region (US-FL); null for PBI.
  - name: dest_elevation_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Destination field elevation in feet; null where unpublished or unresolved.
  - name: dest_longest_runway_ft
    logicalType: integer
    physicalType: INTEGER
    required: false
    mappingRole: dimension
    description: Length in feet of the destination's longest open runway; null where unresolved
      or unpublished.
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: gold
customProperties:
- property: proposedBy
  value: human
- property: profileHash
  value: sha256:2d19b75b44c2aa680549789ba634ee35b281fe90233870346553b2b1fc571e8b
- property: proposedAt
  value: '2026-09-02'
- property: decisionGrainForm
  value: derived-flight-identity-over-declared-silver-grain-tuple
- property: decisionCancellations
  value: flow-through-retained-and-flagged
- property: decisionTimeGrain
  value: hour, on the conformed calendar shared with airport_weather
- property: provenanceNote
  value: >-
    Authored from profiles/silver.silver_flights/v0001.json (the profileHash artifact) against
    silver contract silver_flights v1.0.0; roles and grain decided at the Arc 6 prep. The
    gold mapping proposer's live draft over the same profile is eval-lane evidence, never
    this file.
