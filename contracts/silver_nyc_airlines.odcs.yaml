# Contract: silver_nyc_airlines v1.0.0 (ODCS v3.1.0), the Arc 6 aviation family (D-41).
# Hand-authored from the bronze profile it cites (rule 16: proposedBy human,
# profileHash present, no stance keys); the cleanup proposer's live drafts over
# the same profile are recorded as eval-lane evidence, never as this file.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_airlines
name: Silver nyc airlines
version: 1.0.0
status: active
domain: aviation
dataProduct: metricmine
tenant: metricmine
description:
  purpose: 'The carrier code lookup: one row per two-letter BTS carrier code that flew from
    New York City in 2013 with its full name. The reference table that gives silver_flights
    its carrier_name.'
  usage: Join carrier_code from silver_nyc_flights (or silver_flights) to read the carrier
    name; sixteen rows, one per code, complete for every flight in the window.
  limitations: 'Names are as BTS published them in 2013 (Endeavor Air, ExpressJet, US Airways,
    AirTran, Virgin America); several carriers have merged or renamed since. Vintage: 2013,
    as packaged by tidyverse/nycflights13 at commit df98ef21 (CC0); the reference tables from
    OurAirports are a 2026 snapshot, so an airport code can have changed between the flight
    and the reference (Palm Beach International flew as PBI in 2013 and is coded DJT in the
    2026 reference).'
schema:
- name: silver_nyc_airlines
  physicalName: silver_nyc_airlines
  logicalType: object
  physicalType: table
  description: 'The carrier code lookup: one row per two-letter BTS carrier code that flew
    from New York City in 2013 with its full name. The reference table that gives silver_flights
    its carrier_name.'
  dataGranularityDescription: One row per (carrier_code); the grain is unique by measurement
    at profile v0001 and enforced by the error-severity grain rule.
  properties:
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Two-letter BTS carrier code. A conformed key across the family.
    quality:
    - type: sql
      description: 'Conformed key carrier_code: every value matches ^[A-Z0-9]{2,3}$ (the K1
        normalization rule, D-41).'
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_airlines WHERE NOT regexp_matches(carrier_code, '^[A-Z0-9]{2,3}$')
      mustBe: 0
  - name: carrier_name
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Carrier name as published by BTS for 2013 (for example, 'JetBlue Airways'
      for B6).
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: 'Capture timestamp carried forward from the bronze landing (_airbyte_extracted_at):
      when this row''s capture entered the pipeline. The incremental watermark the gold layer
      builds on (D-38). Required from the first version: the model populates it on every row
      from its first build (F-49). Audit metadata, never a business value.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty; the committed extract lands every row.
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (carrier_code) combinations. Declared at
      error severity because the primaryKey-flag composite test generates at warn severity
      at datacontract-cli 1.0.12 (rule 5: uniqueness as a test, never a trusted constraint).'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT carrier_code
        FROM silver.silver_nyc_airlines
        GROUP BY carrier_code
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: human
- property: profileHash
  value: sha256:563ce524575653bb56c6486fca096627efd990b3d17b0b48912886100b1cda22
- property: proposedAt
  value: '2026-09-02'
- property: sourceLineage
  value: bronze.nyc_airlines (data/samples/nyc_airlines/README.md)
- property: vintage
  value: 2013 carrier names; tidyverse/nycflights13 at commit df98ef21
- property: conformedKeys
  value: carrier_code=carrier_code
- property: decisionRowsDropped
  value: none
