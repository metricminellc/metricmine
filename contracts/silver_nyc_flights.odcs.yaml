# Contract: silver_nyc_flights v1.0.0 (ODCS v3.1.0), the Arc 6 aviation family (D-41).
# Hand-authored from the bronze profile it cites (rule 16: proposedBy human,
# profileHash present, no stance keys); the cleanup proposer's live drafts over
# the same profile are recorded as eval-lane evidence, never as this file.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_flights
name: Silver nyc flights
version: 1.0.0
status: active
domain: aviation
dataProduct: metricmine
tenant: metricmine
description:
  purpose: One row per scheduled departure from the three New York City airports (EWR, JFK,
    LGA) in January through June 2013, typed and named for analysis, cancelled flights retained
    and flagged. The event table of the aviation family and the sole flight input to silver_flights,
    the unified table the gold star maps.
  usage: Read silver.silver_nyc_flights for flight-level on-time analysis. Delays are minutes
    and negative means early; a cancelled flight has no actual times and no delays (is_cancelled
    true), so averages over delay columns exclude cancellations by construction of the null
    and cancellation rates must be counted from the flag. Arrival delay and air time are also
    null on 597 flights that departed but have no arrival record (diverted or unreported),
    so arrival averages exclude those too. Clock times are local to the airport in HHMM form
    (517 is 05:17); departure_hour_utc is the scheduled departure hour as a UTC instant and
    is the key that joins to weather at the origin airport. Join carrier_code to silver_nyc_airlines
    for names, tail_number to silver_nyc_planes for aircraft, origin_airport and dest_airport
    to silver_ourairports_airports for airport attributes.
  limitations: 'No rows are dropped: 166,158 bronze rows become 166,158 silver rows (measured
    at profile v0001). Tail numbers are missing on 1,521 flights and American Airlines and
    Envoy Air reported fleet numbers rather than registrations in 2013, so about 16 percent
    of flights resolve no aircraft in silver_nyc_planes. The window is half a year; seasonal
    conclusions need the full year the publisher ships. Vintage: 2013, as packaged by tidyverse/nycflights13
    at commit df98ef21 (CC0); the reference tables from OurAirports are a 2026 snapshot, so
    an airport code can have changed between the flight and the reference (Palm Beach International
    flew as PBI in 2013 and is coded DJT in the 2026 reference).'
schema:
- name: silver_nyc_flights
  physicalName: silver_nyc_flights
  logicalType: object
  physicalType: table
  description: One row per scheduled departure from the three New York City airports (EWR,
    JFK, LGA) in January through June 2013, typed and named for analysis, cancelled flights
    retained and flagged. The event table of the aviation family and the sole flight input
    to silver_flights, the unified table the gold star maps.
  dataGranularityDescription: One row per (flight_date, carrier_code, flight_number, origin_airport,
    sched_dep_hhmm); the grain is unique by measurement at profile v0001 and enforced by the
    error-severity grain rule.
  properties:
  - name: flight_date
    logicalType: date
    physicalType: DATE
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Local date of the scheduled departure, built from the published year, month,
      and day columns (America/New_York calendar date).
  - name: carrier_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Two-letter BTS carrier code (16 distinct in the window); resolves to a name
      in silver_nyc_airlines. A conformed key across the family.
    quality:
    - type: sql
      description: 'Conformed key carrier_code: every value matches ^[A-Z0-9]{2,3}$ (the K1
        normalization rule, D-41).'
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_flights WHERE NOT regexp_matches(carrier_code, '^[A-Z0-9]{2,3}$')
      mustBe: 0
  - name: flight_number
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: Flight number as published; unique only together with the date, carrier,
      origin, and scheduled time.
  - name: origin_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 4
    description: 'Origin airport IATA code: EWR, JFK, or LGA in this data. A conformed key;
      joins to silver_ourairports_airports.iata_code and to silver_nyc_weather.airport_code.'
    quality:
    - type: sql
      description: 'Conformed key airport_iata: every value matches ^[A-Z]{3}$ (the K1 normalization
        rule, D-41).'
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_flights WHERE NOT regexp_matches(origin_airport, '^[A-Z]{3}$')
      mustBe: 0
  - name: sched_dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    primaryKey: true
    primaryKeyPosition: 5
    description: Scheduled departure clock time, local, as the published HHMM integer (517
      is 05:17); part of the grain because a flight number can depart twice a day.
  - name: dest_airport
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Destination airport IATA code (100 distinct in the window). A conformed key;
      joins to silver_ourairports_airports.iata_code, where 99 of the 100 codes resolve (PBI
      does not; see the contract limitations).
    quality:
    - type: sql
      description: 'Conformed key airport_iata: every value matches ^[A-Z]{3}$ (the K1 normalization
        rule, D-41).'
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_flights WHERE NOT regexp_matches(dest_airport, '^[A-Z]{3}$')
      mustBe: 0
  - name: tail_number
    logicalType: string
    physicalType: VARCHAR
    required: false
    description: Aircraft registration as reported (FAA N-numbers, plus a handful of foreign
      registrations); null on 1,521 flights. A conformed key; joins to silver_nyc_planes.tail_number,
      which knows about 84 percent of flights' aircraft.
    quality:
    - type: sql
      description: 'Conformed key tail_number: every value matches ^[A-Z0-9]{2,6}$ (the K1
        normalization rule, D-41).'
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_flights WHERE tail_number IS NOT NULL AND NOT regexp_matches(tail_number, '^[A-Z0-9]{2,6}$')
      mustBe: 0
  - name: is_cancelled
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'True when the flight has no actual departure time (4,883 flights in the
      window, 2.9 percent). Decision: cancellations are retained and flagged, not dropped,
      so the schedule stays complete and cancellation rates can be measured; delay columns
      are null on these rows.'
  - name: dep_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual departure clock time, local, HHMM integer; null when cancelled.
  - name: dep_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Departure delay in minutes (actual minus scheduled); negative means the flight
      left early; null when cancelled. The headline on-time measure.
  - name: arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Actual arrival clock time, local at the destination, HHMM integer; null when
      cancelled or unreported.
  - name: sched_arr_hhmm
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled arrival clock time, local at the destination, HHMM integer.
  - name: arr_delay_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Arrival delay in minutes; negative means early; null when cancelled, diverted,
      or unreported (5,480 flights in the window, 597 more than the cancellations).
  - name: air_time_minutes
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Minutes in the air, wheels up to wheels down; null wherever arr_delay_minutes
      is null.
  - name: distance_miles
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Great-circle route distance in statute miles as published by BTS; constant
      per origin and destination pair.
    quality:
    - type: sql
      description: Distance is positive on every flight.
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_flights WHERE distance_miles <= 0
      mustBe: 0
  - name: sched_dep_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled departure hour, local (0 to 23), the published hour column; equals
      departure_hour_utc rendered in America/New_York on every row (a contract rule checks
      it).
    quality:
    - type: sql
      description: The local scheduled hour agrees with departure_hour_utc rendered in America/New_York
        on every row (the time zone consistency rule).
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_flights WHERE sched_dep_hour_local != extract(hour from (departure_hour_utc at time zone 'UTC' at time zone 'America/New_York'))
      mustBe: 0
  - name: sched_dep_minute_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Scheduled departure minute, local (0 to 59).
  - name: departure_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: 'Scheduled departure hour as a UTC instant (the published time_hour, ISO
      with a Z suffix, parsed). The conformed calendar key at hour grain: it joins to silver_nyc_weather.observed_hour_utc
      at the same origin, and the gold star''s timeframe group shares one row per hour across
      the flights and airport_weather categories.'
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: 'Capture timestamp carried forward from the bronze landing (_airbyte_extracted_at):
      when this row''s capture entered the pipeline. The incremental watermark the gold layer
      builds on (D-38). Required from the first version: the model populates it on every row
      from its first build (F-49). Audit metadata, never a business value.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty; the committed extract lands every row.
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (flight_date, carrier_code, flight_number,
      origin_airport, sched_dep_hhmm) combinations. Declared at error severity because the
      primaryKey-flag composite test generates at warn severity at datacontract-cli 1.0.12
      (rule 5: uniqueness as a test, never a trusted constraint).'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT flight_date, carrier_code, flight_number, origin_airport, sched_dep_hhmm
        FROM silver.silver_nyc_flights
        GROUP BY flight_date, carrier_code, flight_number, origin_airport, sched_dep_hhmm
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: human
- property: profileHash
  value: sha256:49b479ac0612017571579cc02b0b7e592474551a14d3adff6e06c01139bdadce
- property: proposedAt
  value: '2026-09-02'
- property: sourceLineage
  value: bronze.nyc_flights (data/samples/nyc_flights/README.md)
- property: vintage
  value: 2013 (January to June); tidyverse/nycflights13 at commit df98ef21, packaged 2023
- property: conformedKeys
  value: carrier_code=carrier_code, origin_airport=airport_iata, dest_airport=airport_iata,
    tail_number=tail_number
- property: decisionCancellations
  value: retained-and-flagged
- property: decisionRowsDropped
  value: none
- property: decisionClockTimes
  value: kept as published local HHMM integers; the UTC hour is the join key
