# Contract: gold unified event star v1.6.0 (ODCS v3.1.0): the extended star.
# Pattern-derived: authored from docs/spec/gold-unified-event-star.md (the
# committed gold spec) and the four-element event-packet pattern it carries
# forward (docs/spec/current-state/data-capture-baseline.md §3.4), not from
# any profile artifact; profileHash is deliberately ABSENT with rationale
# (rule 16; docs/spec/engine.md §9). One contract covers all star tables as
# schema objects, versioned as one unit; because the physical shape is
# source-invariant, payload evolution surfaces as new schema keys (data),
# never as contract amendments (governance). context_registry joined at
# v1.2.0, exactly as the F-13-verified amendment-first pattern planned.
# v1.1.0 (F-19): gold references inside quality-rule SQL use dbt
# {{ ref('<model>') }} so the sync-generated singular tests carry real
# dependency edges and schedule after their models on a fresh warehouse;
# C1's silver reference stays schema-qualified per the F-08 louder-red
# design (the edge via the fact suffices; fact depends on silver).
# Every object here is an ENGINE-EMITTED dbt model (D-07, D-09): this
# contract precedes its models by design; gate 3 skips unmatched objects
# per-object at exit 0 (F-13) until the regeneration that lands them.
# v1.2.0: context_registry joins the star (the compiler sitting's
# amendment this file always promised). Rows are SQL VALUES literals
# carried from the committed compiled-context artifact (D-30); C3 is
# declared here and starts RUNNING when the registry model lands in the
# regeneration PR (F-13: skip is no coverage, not passing coverage).
# v1.3.0 (V1-06): C5, the field-level reconciliation, joins the
# conservation set as an error-severity rule on the fact: every silver
# row reconciles field by field through the typed surface, the Session
# J runbook validation promoted to a standing test. Comment and
# description em dashes leave at this bump per the Arc 3 sweep
# deferral; no schema object and no property changes.
# v1.4.0 (Record 008 part two, D-38 and D-39): incremental readiness.
# captured_at, the capture watermark carried from silver, joins the
# three silver-derived objects as an optional property (F-28: enters
# optional; the declared follow-up tightens it to required once the
# incremental path is proven populated). The twelve expensive rules
# (content-key uniqueness on the two silver-derived dims, grain
# enforcement, the five C2 anti-joins, C4 on the three captured_at
# objects, and C5) gain the mm_batch_floor guard: inert in CI and at
# table materialization, batch-scoping the checks when an incremental
# deployment passes the var; make audit-gold is the unscoped
# full-table run. With the var unset every rule's semantics are
# unchanged from v1.3.0: nothing narrows (D-08).
# v1.5.0 (Record 011, D-41 and Amendment R): the conformed calendar and
# the F-28 follow-up. The timeframe group's payload is {grain,
# period_start} under one manifest for the whole star, so equal periods
# at equal grain are one row whichever category minted them; the
# regeneration that carries it follows (F-13). captured_at tightens to
# required on the three silver-derived objects: the incremental path
# proved it populated on every row (Arc 5b). conformedKeyRules declares
# the conformed keys and their normalization rules for the silver
# contracts the arc lands (the K1 gate holds them to it, D-41). No
# object joins at this bump; the categories arrive at 1.6.0 with the
# regeneration that builds them.
# v1.6.0 (Record 011, D-41): the multi-source proof lands its two categories.
# airport_weather and flights join the star, each with the three contracted
# objects rendered from its mapping contract by scripts/render_star_objects.py
# and reviewed (the pattern gate holds them to the render), C3 unions their
# columns dimensions, and conformedKeyRules gains tail_number. The shared
# groups and the registry are one set for all three categories (F-42).
# Severity discipline (D-28): every gating rule declares severity: error;
# primaryKey flags generate warn-severity advisory twins at 1.0.12 (F-08),
# and each carries its error-severity enforcing twin below. Payload and
# manifest columns are canonical JSON TEXT in VARCHAR (the engine hashes
# the text form; registry precedent, docs/spec/engine.md §4), with
# json_valid gating per C4, verified over VARCHAR at the pinned engine
# (F-15).
apiVersion: v3.1.0
kind: DataContract
id: gold_unified_event_star
name: Gold unified event star
version: 1.6.0
status: active
domain: multi-source
dataProduct: metricmine
tenant: metricmine

description:
  purpose: >
    The source-invariant, self-describing, content-addressed star schema:
    values/columns dimension pairs for the source, run, and timeframe
    groups and for the three fact categories (invoice_lines,
    airport_weather, flights), the three fact tables, and the context
    registry (D-19): the address of meaning, one row per schema key. Every source lands in the same physical shape: within a
    category new sources add rows, not schema, and the shared groups
    and the registry are one set for every category (D-41; F-42). The
    timeframe group is the conformed calendar (Amendment R): one
    manifest for the whole star, so equal periods at equal grain are
    one row whichever category minted them.
  usage: >
    Built only by dbt from engine-emitted models (D-07, D-09); consumers
    read through the shared query module over the read-only protocol, with
    the MCP server primary (Phase 5). Every *_values row carries the
    four-element pattern: value payload, manifest reference (schema key),
    record key, schema key. Cancellation lines flow through
    retained-and-flagged per the mapping contract; exclusion is a consumer
    decision. Cross-category questions are answered on the typed surfaces
    through the joins crossCategoryJoins declares, each on conformed keys
    and the conformed calendar with its measured completeness and its
    floor; the registry carries them into every participating category's
    expert context. invoice_lines shares no conformed key with the
    aviation categories and its window (December 2009, minute grain)
    never meets theirs (2013, hour grain): the calendar aligns them in
    shape, not in time.
  limitations: >
    Typed projections are uncontracted views by design (D-17):
    vw_invoice_lines_typed is emitted and manifest-listed but never a
    schema object here. Payloads are canonical JSON text; consumers
    needing typed columns use the projection. compiled_context is
    addressed content, never a hashed payload, so it keeps its case.

schema:
  - name: dim_source_values
    physicalName: dim_source_values
    logicalType: object
    physicalType: table
    description: >
      Source-system group, values side: one row per distinct source
      payload, deduplicated by content key. Constant per build per source.
      Engine-emitted (D-09); hashed payload carries deterministic content
      only (rule 13).
    properties:
      - name: source_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: >
          Record key: canonical_key v2 over the source payload (D-18);
          64-char lowercase SHA-256 hex.
      - name: source_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Schema key of the source manifest; resolves in
          dim_source_columns.
      - name: source_values
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Source value payload: canonical JSON text (compact, sorted,
          lowercase); json_valid-gated (C4, F-15).
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Content-key uniqueness: the error-severity twin of the
          primaryKey flag (its generated test is warn-hardcoded, F-08).
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT source_hash_id FROM {{ ref('dim_source_values') }}
            GROUP BY source_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0
      - type: sql
        description: "C4: every source payload parses as valid JSON."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('dim_source_values') }}
          WHERE NOT json_valid(source_values)
        mustBe: 0

  - name: dim_source_columns
    physicalName: dim_source_columns
    logicalType: object
    physicalType: table
    description: >
      Source-system group, columns side: one row per distinct source
      manifest (field set), keyed by schema key. Engine-emitted (D-09).
    properties:
      - name: source_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: >
          Schema key: canonical_key v2 over the manifest in declared order
          (D-18).
      - name: source_columns
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Source manifest: compact JSON array of field names in declared
          order.
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Schema-key uniqueness: the error-severity twin of the primaryKey
          flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT source_col_hash_id FROM {{ ref('dim_source_columns') }}
            GROUP BY source_col_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0

  - name: dim_run_values
    physicalName: dim_run_values
    logicalType: object
    physicalType: table
    description: >
      Lineage group, values side: mapping contract name and version plus
      engine version as deterministic content (D-17): lineage as data,
      never a build timestamp. run_hash_id is referenced by the fact as a
      NON-key attribute, so a contract version bump never mints duplicate
      facts. Engine-emitted (D-09).
    properties:
      - name: run_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Record key over the run payload (D-18)."
      - name: run_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Schema key of the run manifest; resolves in dim_run_columns.
      - name: run_values
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Run payload: canonical JSON text; deterministic content only
          (rule 13): mapping contract name + version, engine version.
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Content-key uniqueness: the error-severity twin of the
          primaryKey flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT run_hash_id FROM {{ ref('dim_run_values') }}
            GROUP BY run_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0
      - type: sql
        description: "C4: every run payload parses as valid JSON."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('dim_run_values') }}
          WHERE NOT json_valid(run_values)
        mustBe: 0

  - name: dim_run_columns
    physicalName: dim_run_columns
    logicalType: object
    physicalType: table
    description: >
      Lineage group, columns side: one row per distinct run manifest,
      keyed by schema key. Engine-emitted (D-09).
    properties:
      - name: run_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Schema key over the run manifest in declared order (D-18)."
      - name: run_columns
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: "Run manifest: compact JSON array in declared order."
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Schema-key uniqueness: the error-severity twin of the primaryKey
          flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT run_col_hash_id FROM {{ ref('dim_run_columns') }}
            GROUP BY run_col_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0

  - name: dim_timeframe_values
    physicalType: table
    physicalName: dim_timeframe_values
    logicalType: object
    description: >
      Time group, values side: one row per distinct timeframe payload;
      the conformed calendar (D-17 Amendment R): the declared grain plus
      each category's declared time column truncated to that grain,
      rendered canonically, so equal periods at equal grain are one row
      whichever category minted them. Engine-emitted (D-09).
    properties:
      - name: timeframe_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Record key over the timeframe payload (D-18)."
      - name: timeframe_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Schema key of the timeframe manifest; resolves in
          dim_timeframe_columns.
      - name: timeframe_values
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: "Timeframe payload: canonical JSON text (C4-gated)."
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
      - name: captured_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: >
          Capture watermark carried from silver (D-38): first-seen
          (minimum) capture timestamp over the silver rows behind this
          timeframe payload. Outside every hashed payload (rule 13).
          Required since 1.5.0: the incremental path proved it populated on
          every row (Arc 5b, D-38), the F-28 follow-up the 1.4.0
          declaration promised.
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Content-key uniqueness: the error-severity twin of the
          primaryKey flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT timeframe_hash_id FROM {{ ref('dim_timeframe_values') }}
            {% if var('mm_batch_floor', none) is not none %} WHERE captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
            GROUP BY timeframe_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0
      - type: sql
        description: "C4: every timeframe payload parses as valid JSON."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('dim_timeframe_values') }}
          WHERE NOT json_valid(timeframe_values)
          {% if var('mm_batch_floor', none) is not none %} AND captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0

  - name: dim_timeframe_columns
    physicalName: dim_timeframe_columns
    logicalType: object
    physicalType: table
    description: >
      Time group, columns side: one row per distinct timeframe manifest,
      keyed by schema key. Engine-emitted (D-09).
    properties:
      - name: timeframe_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: >
          Schema key over the timeframe manifest in declared order (D-18).
      - name: timeframe_columns
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: "Timeframe manifest: compact JSON array in declared order."
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Schema-key uniqueness: the error-severity twin of the primaryKey
          flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT timeframe_col_hash_id FROM {{ ref('dim_timeframe_columns') }}
            GROUP BY timeframe_col_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0

  - name: dim_invoice_lines_values
    physicalName: dim_invoice_lines_values
    logicalType: object
    physicalType: table
    description: >
      invoice_lines category group, values side: the dimension-attribute
      payload per the mapping contract (dimension-role fields plus the
      derived line_identity degenerate identifier), deduplicated by
      content key, line-unique at transaction grain because line_identity
      carries the declared silver grain tuple as one canonical_key v2
      digest. Generic column names (dim_*) keep the physical shape
      source-invariant; the category lives in the table name.
      Engine-emitted (D-09).
    properties:
      - name: dim_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Record key over the dimension payload (D-18)."
      - name: dim_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Schema key of the dimension manifest; resolves in
          dim_invoice_lines_columns. The signature test announces itself
          here: a new mapping dimension mints a NEW schema key (D-17).
      - name: dim_values
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: "Dimension payload: canonical JSON text (C4-gated)."
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
      - name: captured_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: >
          Capture watermark carried from silver (D-38): first-seen
          (minimum) capture timestamp over the silver rows behind this
          payload. Outside every hashed payload (rule 13).
          Required since 1.5.0: the incremental path proved it populated on
          every row (Arc 5b, D-38), the F-28 follow-up the 1.4.0
          declaration promised.
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Content-key uniqueness: the error-severity twin of the
          primaryKey flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT dim_hash_id FROM {{ ref('dim_invoice_lines_values') }}
            {% if var('mm_batch_floor', none) is not none %} WHERE captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
            GROUP BY dim_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0
      - type: sql
        description: "C4: every dimension payload parses as valid JSON."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('dim_invoice_lines_values') }}
          WHERE NOT json_valid(dim_values)
          {% if var('mm_batch_floor', none) is not none %} AND captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0

  - name: dim_invoice_lines_columns
    physicalName: dim_invoice_lines_columns
    logicalType: object
    physicalType: table
    description: >
      invoice_lines category group, columns side: one row per distinct
      category manifest: the dimension-payload field set and the
      measure-payload field set both live here, keyed by schema key. The
      signature test's public announcement is a new row in this table plus
      a registry row (D-17).
    properties:
      - name: dim_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: >
          Schema key over a category manifest in declared order (D-18).
      - name: dim_columns
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: "Category manifest: compact JSON array in declared order."
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The dimension is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Schema-key uniqueness: the error-severity twin of the primaryKey
          flag.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT dim_col_hash_id FROM {{ ref('dim_invoice_lines_columns') }}
            GROUP BY dim_col_hash_id HAVING COUNT(*) > 1
          )
        mustBe: 0

  - name: fact_invoice_lines_values
    physicalName: fact_invoice_lines_values
    logicalType: object
    physicalType: table
    description: >
      The invoice_lines fact: measure payload (quantity, unit_price per
      mapping v1.0.0), manifest reference, and group-key references. One
      row per declared transaction grain: one row per silver invoice line
      (44,721 at silver v1.1.0 over the committed sample; the C1
      conservation arithmetic). Composite primary key (fact, source,
      timeframe, dim) hashes; run_hash_id is deliberately NON-key so a
      contract version bump never mints duplicate facts (D-17).
      Engine-emitted (D-09).
    dataGranularityDescription: >
      Transaction grain per the mapping contract: one row per silver
      invoice line, made line-unique by the derived line_identity carried
      in the dimension payload.
    properties:
      - name: fact_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Record key over the measure payload (D-18)."
      - name: source_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "Group key: resolves in gold.dim_source_values (C2)."
      - name: timeframe_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "Group key: resolves in gold.dim_timeframe_values (C2)."
      - name: dim_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: "Group key: resolves in gold.dim_invoice_lines_values (C2)."
      - name: run_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Non-key lineage reference: resolves in gold.dim_run_values (C2)
          but never participates in the fact grain (D-17).
      - name: fact_col_hash_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Schema key of the measure manifest: resolves in
          gold.dim_invoice_lines_columns (C2).
      - name: fact_values
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: "Measure payload: canonical JSON text (C4-gated)."
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
      - name: captured_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: >
          Capture watermark carried from silver (D-38): the contributing
          silver row's capture timestamp, per fact row. Outside every
          hashed payload (rule 13).
          Required since 1.5.0: the incremental path proved it populated on
          every row (Arc 5b, D-38), the F-28 follow-up the 1.4.0
          declaration promised.
    quality:
      - type: library
        metric: rowCount
        description: The fact is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          C1 conservation: silver rows in scope equal fact rows at
          transaction grain (44,721 + 0 excluded = 44,721 at v1.1.0 over
          the committed sample). Schema-qualified silver reference by
          design: a missing referenced table catalog-errors loudly rather
          than skipping (F-08).
        severity: error
        query: |
          SELECT (SELECT COUNT(*) FROM silver.silver_invoice_lines)
               - (SELECT COUNT(*) FROM {{ ref('fact_invoice_lines_values') }})
        mustBe: 0
      - type: sql
        description: >
          C5 field-level reconciliation: every silver row joins the typed
          surface on the derived line identity and every mapped field
          matches its served value (text fields lowercased per D-18;
          invoiced_at at the declared minute grain; null-safe compare).
          The Session J runbook validation, ten matching counts of
          44,721 over the committed sample, promoted to a standing test
          (V1-06). Zero rows may disagree.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT *, sha256(lower(to_json(struct_pack(
              invoice_id := cast(invoice_id as varchar),
              quantity := cast(quantity as varchar),
              stock_code := cast(stock_code as varchar),
              unit_price := cast(unit_price as varchar)
            )))) AS line_identity
            FROM silver.silver_invoice_lines
            {% if var('mm_batch_floor', none) is not none %} WHERE captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
          ) s
          LEFT JOIN {{ ref('vw_invoice_lines_typed') }} v USING (line_identity)
          WHERE v.invoice_id IS DISTINCT FROM lower(s.invoice_id)
             OR v.is_cancellation IS DISTINCT FROM s.is_cancellation
             OR v.stock_code IS DISTINCT FROM lower(s.stock_code)
             OR v.product_description IS DISTINCT FROM lower(s.product_description)
             OR v.customer_id IS DISTINCT FROM s.customer_id
             OR v.country IS DISTINCT FROM lower(s.country)
             OR v.invoiced_at IS DISTINCT FROM date_trunc('minute', s.invoiced_at)
             OR v.quantity IS DISTINCT FROM s.quantity
             OR v.unit_price IS DISTINCT FROM s.unit_price
        mustBe: 0
      - type: sql
        description: "C2: every source_hash_id resolves in dim_source_values."
