            SELECT *, sha256(lower(to_json(struct_pack(
              carrier_code := cast(carrier_code as varchar),
              flight_date := cast(flight_date as varchar),
              flight_number := cast(flight_number as varchar),
              origin_airport := cast(origin_airport as varchar),
              sched_dep_hhmm := cast(sched_dep_hhmm as varchar)
            )))) AS flight_identity
            FROM silver.silver_flights
            {% if var('mm_batch_floor', none) is not none %} WHERE captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
          ) s
          LEFT JOIN {{ ref('vw_flights_typed') }} v USING (flight_identity)
          WHERE v.flight_date IS DISTINCT FROM s.flight_date
             OR v.carrier_code IS DISTINCT FROM lower(s.carrier_code)
             OR v.flight_number IS DISTINCT FROM s.flight_number
             OR v.origin_airport IS DISTINCT FROM lower(s.origin_airport)
             OR v.sched_dep_hhmm IS DISTINCT FROM s.sched_dep_hhmm
             OR v.dest_airport IS DISTINCT FROM lower(s.dest_airport)
             OR v.tail_number IS DISTINCT FROM lower(s.tail_number)
             OR v.is_cancelled IS DISTINCT FROM s.is_cancelled
             OR v.dep_hhmm IS DISTINCT FROM s.dep_hhmm
             OR v.arr_hhmm IS DISTINCT FROM s.arr_hhmm
             OR v.sched_arr_hhmm IS DISTINCT FROM s.sched_arr_hhmm
             OR v.sched_dep_hour_local IS DISTINCT FROM s.sched_dep_hour_local
             OR v.sched_dep_minute_local IS DISTINCT FROM s.sched_dep_minute_local
             OR v.carrier_name IS DISTINCT FROM lower(s.carrier_name)
             OR v.aircraft_manufacturer IS DISTINCT FROM lower(s.aircraft_manufacturer)
             OR v.aircraft_model IS DISTINCT FROM lower(s.aircraft_model)
             OR v.aircraft_manufacture_year IS DISTINCT FROM s.aircraft_manufacture_year
             OR v.aircraft_seat_count IS DISTINCT FROM s.aircraft_seat_count
             OR v.aircraft_engine_type IS DISTINCT FROM lower(s.aircraft_engine_type)
             OR v.origin_airport_name IS DISTINCT FROM lower(s.origin_airport_name)
             OR v.origin_municipality IS DISTINCT FROM lower(s.origin_municipality)
             OR v.origin_elevation_ft IS DISTINCT FROM s.origin_elevation_ft
             OR v.origin_longest_runway_ft IS DISTINCT FROM s.origin_longest_runway_ft
             OR v.dest_airport_name IS DISTINCT FROM lower(s.dest_airport_name)
             OR v.dest_municipality IS DISTINCT FROM lower(s.dest_municipality)
             OR v.dest_iso_region IS DISTINCT FROM lower(s.dest_iso_region)
             OR v.dest_elevation_ft IS DISTINCT FROM s.dest_elevation_ft
             OR v.dest_longest_runway_ft IS DISTINCT FROM s.dest_longest_runway_ft
             OR v.departure_hour_utc IS DISTINCT FROM date_trunc('hour', s.departure_hour_utc)
             OR v.dep_delay_minutes IS DISTINCT FROM s.dep_delay_minutes
             OR v.arr_delay_minutes IS DISTINCT FROM s.arr_delay_minutes
             OR v.air_time_minutes IS DISTINCT FROM s.air_time_minutes
             OR v.distance_miles IS DISTINCT FROM s.distance_miles
        mustBe: 0
      - type: sql
        description: "C2: every source_hash_id resolves in dim_source_values."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('fact_flights_values') }} f
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ ref('dim_source_values') }} d
            WHERE d.source_hash_id = f.source_hash_id
          )
          {% if var('mm_batch_floor', none) is not none %} AND f.captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0
      - type: sql
        description: "C2: every timeframe_hash_id resolves in dim_timeframe_values."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('fact_flights_values') }} f
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ ref('dim_timeframe_values') }} d
            WHERE d.timeframe_hash_id = f.timeframe_hash_id
          )
          {% if var('mm_batch_floor', none) is not none %} AND f.captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0
      - type: sql
        description: "C2: every dim_hash_id resolves in dim_flights_values."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('fact_flights_values') }} f
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ ref('dim_flights_values') }} d
            WHERE d.dim_hash_id = f.dim_hash_id
          )
          {% if var('mm_batch_floor', none) is not none %} AND f.captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0
      - type: sql
        description: >
          C2: every run_hash_id (non-key) resolves in dim_run_values.
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('fact_flights_values') }} f
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ ref('dim_run_values') }} d
            WHERE d.run_hash_id = f.run_hash_id
          )
          {% if var('mm_batch_floor', none) is not none %} AND f.captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0
      - type: sql
        description: >
          C2: every fact_col_hash_id (measure manifest) resolves in
          dim_flights_columns.
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('fact_flights_values') }} f
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ ref('dim_flights_columns') }} d
            WHERE d.dim_col_hash_id = f.fact_col_hash_id
          )
          {% if var('mm_batch_floor', none) is not none %} AND f.captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0
      - type: sql
        description: >
          Grain enforcement: zero duplicate (fact, source, timeframe, dim)
          key tuples, the error-severity twin of the composite primaryKey
          flag, whose generated test is warn-hardcoded (F-08).
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT fact_hash_id, source_hash_id, timeframe_hash_id, dim_hash_id
            FROM {{ ref('fact_flights_values') }}
            {% if var('mm_batch_floor', none) is not none %} WHERE captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
            GROUP BY fact_hash_id, source_hash_id, timeframe_hash_id, dim_hash_id
            HAVING COUNT(*) > 1
          )
        mustBe: 0
      - type: sql
        description: "C4: every measure payload parses as valid JSON."
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('fact_flights_values') }}
          WHERE NOT json_valid(fact_values)
          {% if var('mm_batch_floor', none) is not none %} AND captured_at >= TIMESTAMP '{{ var("mm_batch_floor") }}' {% endif %}
        mustBe: 0

  - name: context_registry
    physicalName: context_registry
    logicalType: object
    physicalType: table
    description: >
      The context registry (D-19): one row per schema key present in the
      star, binding the address of meaning to its governing contract and
      the compiled context gathered at approval time. Rows are SQL VALUES
      literals carried from the committed compiled-context artifact at
      emission time (D-30): every warehouse write stays inside dbt build,
      and no build-time file read ever occurs. Engine-emitted (D-09).
    properties:
      - name: schema_key
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: >
          Schema key: canonical_key v2 over the governed manifest in
          declared order (D-18); 64-char lowercase SHA-256 hex.
      - name: entity_group
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Entity group the key belongs to: source, run, timeframe, or the
          category's declared entityGroup.
      - name: contract_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Governing contract id: the mapping contract whose approval
          created this schema key.
      - name: contract_version
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Governing contract version at compile time.
      - name: compiled_context
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: >
          Compiled context gathered at approval time: canonical compact
          JSON text harvested from the governing contracts by the context
          compiler (D-30). Addressed content, never a hashed payload, so
          it is NOT lowercased; json_valid-gated below.
      - name: loaded_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Audit stamp; outside every hashed payload (rule 13).
    quality:
      - type: library
        metric: rowCount
        description: The registry is never empty once the star builds.
        severity: error
        mustBeGreaterThan: 0
      - type: sql
        description: >
          Schema-key uniqueness: the error-severity twin of the primaryKey
          flag (its generated test is warn-hardcoded, F-08).
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT schema_key FROM {{ ref('context_registry') }}
            GROUP BY schema_key HAVING COUNT(*) > 1
          )
        mustBe: 0
      - type: sql
        description: >
          C3 registry coverage: every schema key present in gold exists in
          context_registry. ref()-edged per F-19 so the generated test
          schedules after every columns dimension and the registry on a
          fresh warehouse.
        severity: error
        query: |
          SELECT COUNT(*) FROM (
            SELECT dim_col_hash_id AS schema_key FROM {{ ref('dim_invoice_lines_columns') }}
            UNION
            SELECT dim_col_hash_id FROM {{ ref('dim_airport_weather_columns') }}
            UNION
            SELECT dim_col_hash_id FROM {{ ref('dim_flights_columns') }}
            UNION
            SELECT source_col_hash_id FROM {{ ref('dim_source_columns') }}
            UNION
            SELECT run_col_hash_id FROM {{ ref('dim_run_columns') }}
            UNION
            SELECT timeframe_col_hash_id FROM {{ ref('dim_timeframe_columns') }}
          ) gold_keys
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ ref('context_registry') }} r
            WHERE r.schema_key = gold_keys.schema_key
          )
        mustBe: 0
      - type: sql
        description: >
          Registry JSON validity (the C4 discipline applied to compiled
          context): every compiled_context parses as valid JSON.
        severity: error
        query: |
          SELECT COUNT(*) FROM {{ ref('context_registry') }}
          WHERE NOT json_valid(compiled_context)
        mustBe: 0

servers:
  - server: local
    type: duckdb
    database: warehouse/metricmine.duckdb
    schema: gold

customProperties:
  - property: proposedBy
    value: human
  - property: proposedAt
    value: "2026-08-09"
  - property: conformedKeyRules
    value: "airport_iata=VARCHAR:^[A-Z]{3}$; carrier_code=VARCHAR:^[A-Z0-9]{2,3}$; tail_number=VARCHAR:^[A-Z0-9]{2,6}$"
  - property: crossCategoryJoins
    value:
      - name: flights_to_origin_weather
        left: flights
        right: airport_weather
        join_condition: "flights.origin_airport = airport_weather.airport_code AND flights.departure_hour_utc = airport_weather.observed_hour_utc"
        example_sql: >-
          SELECT flights.carrier_code, avg(flights.dep_delay_minutes) AS avg_dep_delay_minutes
          FROM gold.mart_flights_typed AS flights
          JOIN gold.mart_airport_weather_typed AS airport_weather
          ON flights.origin_airport = airport_weather.airport_code
          AND flights.departure_hour_utc = airport_weather.observed_hour_utc
          WHERE airport_weather.precip_inches > 0
          GROUP BY flights.carrier_code ORDER BY avg_dep_delay_minutes DESC
        conformed_keys:
          - airport_iata
        calendar_grain: hour
        measured_completeness: 0.9994
        floor: 0.99
        note: >-
          Every flight's weather at its origin airport in its departure hour,
          both sides on the conformed calendar (UTC hours) and the conformed
          airport code. Measured 0.9994 over the typed surfaces at the Arc 6
          build: 97 of 166,158 flights fall in the six airport-hours the
          nycflights13 weather feed has no observation for. The floor is
          declared below the measurement so a weather refresh that adds
          coverage passes and one that loses it fails (the M2 discipline,
          D-41). Destination weather is out of reach by construction: the
          weather feed covers the three New York City airports only.
  - property: provenanceNote
    value: >-
      pattern-derived; authored from docs/spec/gold-unified-event-star.md,
      not from a profile artifact; no profileHash exists
