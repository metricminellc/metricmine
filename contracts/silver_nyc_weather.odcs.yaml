# Contract: silver_nyc_weather v1.0.0 (ODCS v3.1.0), the Arc 6 aviation family (D-41).
# Hand-authored from the bronze profile it cites (rule 16: proposedBy human,
# profileHash present, no stance keys); the cleanup proposer's live drafts over
# the same profile are recorded as eval-lane evidence, never as this file.
apiVersion: v3.1.0
kind: DataContract
id: silver_nyc_weather
name: Silver nyc weather
version: 1.0.0
status: active
domain: aviation
dataProduct: metricmine
tenant: metricmine
description:
  purpose: One row per airport per hour of hourly ASOS weather observations at EWR, JFK, and
    LGA for January through June 2013, typed with units in the column names. The weather input
    to silver_airport_weather, the unified table the gold star maps.
  usage: Read silver.silver_nyc_weather for conditions at a New York airport in a given hour.
    observed_hour_utc is the observation hour as a UTC instant and joins to silver_nyc_flights.departure_hour_utc
    at the same airport (airport_code equals origin_airport); the local date and hour columns
    are for reading, never for joining. Temperatures are Fahrenheit, wind in mph, precipitation
    in inches for the hour, pressure in millibars, visibility in miles.
  limitations: '13,014 rows for the 13,026 airport-hours between the first observation (01:00
    local on January 1) and the last (23:00 local on June 30): 12 airport-hours have no observation,
    so a flight can find no weather row (97 of 166,158 flights in the window). Wind gust is
    reported only when a gust occurred (null on 75 percent of rows), pressure is missing on
    about 12 percent, wind direction on 2 percent (calm or missing). The publisher converted
    wind speeds from knots to mph and kept the hourly maximum of the records before the minute-51
    precipitation reset. Vintage: 2013, as packaged by tidyverse/nycflights13 at commit df98ef21
    (CC0); the reference tables from OurAirports are a 2026 snapshot, so an airport code can
    have changed between the flight and the reference (Palm Beach International flew as PBI
    in 2013 and is coded DJT in the 2026 reference).'
schema:
- name: silver_nyc_weather
  physicalName: silver_nyc_weather
  logicalType: object
  physicalType: table
  description: One row per airport per hour of hourly ASOS weather observations at EWR, JFK,
    and LGA for January through June 2013, typed with units in the column names. The weather
    input to silver_airport_weather, the unified table the gold star maps.
  dataGranularityDescription: One row per (airport_code, observed_hour_utc); the grain is
    unique by measurement at profile v0001 and enforced by the error-severity grain rule.
  properties:
  - name: airport_code
    logicalType: string
    physicalType: VARCHAR
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'IATA code of the observing airport (EWR, JFK, LGA). A conformed key: the
      same code silver_nyc_flights carries as origin_airport and silver_ourairports_airports
      as iata_code.'
    quality:
    - type: sql
      description: 'Conformed key airport_iata: every value matches ^[A-Z]{3}$ (the K1 normalization
        rule, D-41).'
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_weather WHERE NOT regexp_matches(airport_code, '^[A-Z]{3}$')
      mustBe: 0
  - name: observed_hour_utc
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Observation hour as a UTC instant (the published time_hour parsed). The conformed
      calendar key at hour grain, shared with the flights category in the gold star.
  - name: observed_date_local
    logicalType: date
    physicalType: DATE
    required: true
    description: Local (America/New_York) calendar date of the observation, from the published
      year, month, and day.
  - name: observed_hour_local
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Local hour of the observation (0 to 23); equals observed_hour_utc rendered
      in America/New_York (a contract rule checks it).
    quality:
    - type: sql
      description: The local hour agrees with observed_hour_utc rendered in America/New_York
        on every row (the time zone consistency rule).
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_weather WHERE observed_hour_local != extract(hour from (observed_hour_utc at time zone 'UTC' at time zone 'America/New_York'))
      mustBe: 0
  - name: temp_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Air temperature in degrees Fahrenheit.
  - name: dewpoint_f
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Dew point in degrees Fahrenheit.
  - name: humidity_pct
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Relative humidity in percent (0 to 100).
    quality:
    - type: sql
      description: Relative humidity stays within 0 and 100 percent.
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_weather WHERE humidity_pct < 0 or humidity_pct > 100
      mustBe: 0
  - name: wind_dir_degrees
    logicalType: integer
    physicalType: INTEGER
    required: false
    description: Wind direction in degrees clockwise from north (0 to 360); null when calm
      or not reported.
  - name: wind_speed_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sustained wind speed in mph (the publisher converted knots at 1.15078); null
      on 2 rows in the window.
  - name: wind_gust_mph
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Wind gust speed in mph; null when no gust was reported that hour (about three
      quarters of rows), not zero.
  - name: precip_inches
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Precipitation in inches accumulated in the hour (the hourly maximum before
      the minute-51 reset); zero on dry hours.
    quality:
    - type: sql
      description: Precipitation is never negative.
      severity: error
      query: |
        SELECT COUNT(*) FROM silver.silver_nyc_weather WHERE precip_inches < 0
      mustBe: 0
  - name: pressure_mb
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sea-level pressure in millibars; null on about 12 percent of rows.
  - name: visibility_miles
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Visibility in statute miles (10 is the reporting maximum).
  - name: captured_at
    logicalType: date
    physicalType: TIMESTAMP
    required: true
    description: 'Capture timestamp carried forward from the bronze landing (_airbyte_extracted_at):
      when this row''s capture entered the pipeline. The incremental watermark the gold layer
      builds on (D-38). Required from the first version: the model populates it on every row
      from its first build (F-49). Audit metadata, never a business value.'
  quality:
  - type: library
    metric: rowCount
    description: The table is never empty; the committed extract lands every row.
    severity: error
    mustBeGreaterThan: 0
  - type: sql
    description: 'Grain enforcement: no duplicate (airport_code, observed_hour_utc) combinations.
      Declared at error severity because the primaryKey-flag composite test generates at warn
      severity at datacontract-cli 1.0.12 (rule 5: uniqueness as a test, never a trusted constraint).'
    severity: error
    query: |
      SELECT COUNT(*) FROM (
        SELECT airport_code, observed_hour_utc
        FROM silver.silver_nyc_weather
        GROUP BY airport_code, observed_hour_utc
        HAVING COUNT(*) > 1
      )
    mustBe: 0
servers:
- server: local
  type: duckdb
  database: warehouse/metricmine.duckdb
  schema: silver
customProperties:
- property: proposedBy
  value: human
- property: profileHash
  value: sha256:1dee708bb140addbdb172a3727f79d85a2d7a611bd9c191d56d3e433a8c5777b
- property: proposedAt
  value: '2026-09-02'
- property: sourceLineage
  value: bronze.nyc_weather (data/samples/nyc_weather/README.md)
- property: vintage
  value: 2013 (January to June); tidyverse/nycflights13 at commit df98ef21, packaged 2023
- property: conformedKeys
  value: airport_code=airport_iata
- property: decisionRowsDropped
  value: none
- property: decisionUnits
  value: Fahrenheit, mph, inches, millibars, miles, as published; units in column names
