name: Claude Code

# The SDLC-layer authoring loop (D-10): @claude in an issue or a pull
# request comment runs Claude Code on a GitHub-hosted runner. Claude commits
# to a branch and links a pre-filled pull request page; a person opens,
# reviews, and merges the pull request, so branch protection and the
# contract gates judge the change like any other. This workflow is separate
# from contract-gate, which stays keyless and is the gate of record. The
# credential is a repository secret; nothing here prints it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # The spend bound for one run: the turn cap below and this wall clock.
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The project toolchain, so Claude can run the lint and unit lane
      # before it pushes. Same pin as contract-gate.
      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install project (uv sync)
        run: uv sync

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # A pinned model, a turn cap, and only the project's own read-only
          # verification commands beyond the action's built-in git plumbing.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 50
            --allowedTools "Bash(uv run ruff check *),Bash(uv run pytest *),Bash(grep *)"
