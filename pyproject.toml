[project]
name = "metricmine"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "airbyte>=0.53,<0.54",
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.10,<1.11",
