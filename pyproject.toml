[project]
name = "metricmine"
version = "0.1.0"
description = "Contract-driven medallion pipeline reference implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "airbyte>=0.53,<0.54",
    "anthropic>=1.0,<1.1",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb==1.4.3",
    "mcp>=1.28,<2",
    "pyyaml>=6.0.3",
]

# The task entry point (D-42): `uv run mm <target>` runs the demo path on
# every platform; the Makefile's targets delegate to it. uv sync installs
# the script into the project venv (.venv/bin/mm; .venv\Scripts\mm.exe on
# Windows), so `uv run mm` needs no PATH change.
[project.scripts]
mm = "metricmine.tasks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Staged prep folders (prep-<letter>/) are session-scoped, untracked, and
# removed at Close; the exclude keeps a manual `uv run ruff check .` clean
# while one is staged (Session O deviation 22).
extend-exclude = ["prep-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: needs the locally built warehouse (make ingest); deselected in CI",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "openpyxl>=3.1.5",
    "pip>=26.1.2",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
