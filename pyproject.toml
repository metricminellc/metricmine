[project]
name = "metricmine"
version = "0.1.0"
description = "Contract-driven medallion pipeline reference implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "airbyte>=0.53,<0.54",
    "anthropic>=1.0,<1.1",
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.10,<1.11",
    "duckdb==1.4.3",
    "mcp>=1.28,<2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Staged prep folders (prep-<letter>/) are session-scoped, untracked, and
# removed at Close; the exclude keeps a manual `uv run ruff check .` clean
# while one is staged (Session O deviation 22).
extend-exclude = ["prep-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: needs the locally built warehouse (make ingest); deselected in CI",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "openpyxl>=3.1.5",
    "pip>=26.1.2",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
