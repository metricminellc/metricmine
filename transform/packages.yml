# Vendored, never fetched (rule 1 ethos; the hermetic path of D-27). dbt
# v2 resolves packages.yml on every parse and build, not only on deps, so
# a network that cannot reach hub.getdbt.com could not parse this
# project. vendor/dbt_utils is dbt-labs/dbt_utils 1.3.3 at ef562bac
# (Apache-2.0; its LICENSE is beside it): the files dbt reads,
# dbt_project.yml and macros/, unmodified apart from line endings
# (one upstream file carried CRLF; the repository holds every text
# file to LF). package-lock.yml is
# committed in v2's form; dbt_packages/ is not (dbt deps links the
# vendored copy into it).
packages:
  - local: vendor/dbt_utils
